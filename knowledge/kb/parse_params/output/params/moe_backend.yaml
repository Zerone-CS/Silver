    layers.
- file: vllm_ascend/tests/ut/worker/test_mtp_pcp_speculator_v2.py:378
  context: Ascend v2 MTP speculator propagates spec_config.moe_backend into the draft model's kernel_config.
related_parameters:
- name: --linear-backend
  relation: Sibling KernelConfig field selecting linear-layer kernels; together they define the full compute backend stack.
- name: --quantization
  relation: Quantized MoE backends (deep_gemm, modelslim INT8/W8A8) require a matching quantization scheme; backend and quant
    method must be compatible.
- name: --speculative-config / --spec-method
  relation: SpeculativeConfig.moe_backend lets the draft model override the target's --moe-backend; relevant for MTP/EAGLE
    drafters.
- name: --enable-expert-parallel
  relation: Some backends (e.g. flashinfer_moe_ep_mega_deep_gemm) require expert parallel; EP changes which MoE kernels are
    valid.
- name: --enable-eplb
  relation: EPLB env override reads moe_backend (gpu_worker.py:1529); backend choice can affect EPLB behavior.
constraints:
- flashinfer_moe_ep_mega_deep_gemm is only supported for DeepSeek-V4 models and requires expert parallel; using it with other
  architectures raises a ValueError.
- deep_gemm and deep_gemm_mega_moe require FP8 block-quantized checkpoints; they cannot be used with unquantized or non-FP8-block
  models.
- flashinfer_cutedsl is FP4-only and flashinfer_b12x / b12x are restricted to SM12x hardware (RTX Pro 6000 / DGX Spark), which
  do not exist on Ascend NPU.
- The value is normalized to lowercase with hyphens replaced by underscores, so 'deep-gemm' and 'deep_gemm' are equivalent.
- When SpeculativeConfig.moe_backend is None, the draft model inherits the target model's --moe-backend; if the drafter is
  unquantized and the inherited backend is quantized, model loading fails.
tuning_advice:
  summary: Leave --moe-backend at 'auto' on Ascend so vllm-ascend selects the Ascend-native fused-MoE kernel matching the
    model's quantization; only override for speculative drafters or when benchmarking a specific Ascend MoE kernel.
  suggested_values:
  - scenario: Default MoE model deployment on Ascend NPU (DeepSeek/Qwen-MoE, quantized or not)
    value: auto
    reason: Lets vllm-ascend pick the Ascend-native fused-MoE kernel and matching quant method; avoids selecting GPU-only
      backends that do not exist on Da Vinci.
  - scenario: Speculative decoding with quantized target and unquantized draft model
    value: auto
    reason: Set SpeculativeConfig.moe_backend (via --speculative-config) to 'auto' so the drafter does not inherit the target's
      quantized backend and fail to load.
  - scenario: Benchmarking a specific Ascend fused-MoE kernel
    value: auto
    reason: Start from 'auto' as the baseline, then compare against explicitly named Ascend kernels if exposed; upstream GPU
      names are not valid Ascend kernels.
  caveats:
  - Do not set GPU-specific backends (cutlass, flashinfer_*, deep_gemm) on Ascend; they are not implemented for the Da Vinci
    architecture.
  - Ensure the chosen backend is compatible with the model's quantization scheme; mismatches can cause load failures or silent
    fallback to slower paths.
  - For MTP/EAGLE drafters, configure SpeculativeConfig.moe_backend separately when the drafter's quantization differs from
    the target.
  quick_guide: Keep --moe-backend auto on Ascend; override only the speculative draft's moe_backend when its quantization
    differs from the target.
