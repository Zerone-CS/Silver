name: --moe-backend
type: cli
category: model
scope: both
source_file:
- vllm/config/kernel.py:248
- vllm/engine/arg_utils.py:1675
- vllm/engine/arg_utils.py:1677
- vllm/config/speculative.py:407
- vllm/v1/spec_decode/llm_base_proposer.py:1280
- vllm/v1/worker/gpu/spec_decode/eagle/utils.py:79
- vllm/v1/worker/gpu_worker.py:1529
- vllm_ascend/tests/ut/worker/test_mtp_pcp_speculator_v2.py:378
- vllm_ascend/tests/ut/_310p/quantization/test_modelslim_config_310.py:97
value_type: str
default: auto
valid_choices:
- auto
- triton
- batched_triton
- deep_gemm
- deep_gemm_mega_moe
- cutlass
- flashinfer_trtllm
- flashinfer_cutlass
- flashinfer_cutedsl
- flashinfer_b12x
- b12x
- flashinfer_moe_ep_mega_deep_gemm
cli_example: --moe-backend auto
deprecated: false
performance_impact: high
performance_scope:
- latency
- throughput
- memory
impact_detail: '--moe-backend selects the kernel implementation used for MoE expert computation

  (FusedMoE forward). It is defined in vllm/config/kernel.py as KernelConfig.moe_backend

  (default "auto") and exposed via the CLI in vllm/engine/arg_utils.py:1675-1677, where the

  value is normalized with `s.lower().replace("-", "_")`. The choice of backend directly

  determines which fused-MoE kernel runs per layer per token, so it affects decode/prefill

  latency, overall throughput, and (for quantized backends) memory footprint of expert

  weights and intermediate buffers.


  On Ascend NPU, the upstream backend names (triton, cutlass, deep_gemm, flashinfer_*)

  are GPU-specific and are NOT the kernels that execute on the Da Vinci architecture.

  vllm-ascend provides its own Ascend-native fused-MoE implementations (e.g. the

  AscendUnquantizedFusedMoEMethod / AscendFusedMoE paths referenced in

  vllm_ascend/_310p/quantization/modelslim_config.py and the quantization configs). The

  moe_backend value is read by the Ascend quantization/config layer to decide which

  quantized MoE method to instantiate (see test_modelslim_config_310.py:97 where

  moe_config.moe_backend = "auto" drives get_quant_method for a RoutedExperts layer).

  Thus on Ascend the practical effect of --moe-backend is to steer selection among

  Ascend fused-MoE kernels and their quantization schemes, which is a first-order

  performance decision for MoE models (DeepSeek, Qwen-MoE, etc.).


  Additionally, --moe-backend interacts with speculative decoding: SpeculativeConfig.moe_backend

  (vllm/config/speculative.py:407) lets the draft model use a different MoE backend than the

  target. In vllm/v1/spec_decode/llm_base_proposer.py:1280 and

  vllm/v1/worker/gpu/spec_decode/eagle/utils.py:79, when spec_cfg.moe_backend is set the

  draft VllmConfig''s kernel_config.moe_backend is replaced, so the drafter can run an

  unquantized MoE kernel while the generator runs a quantized one. On Ascend the v2 MTP

  speculator path (test_mtp_pcp_speculator_v2.py:378) exercises the same override, meaning

  the draft model''s MoE backend is independently configurable and affects draft-model

  latency and memory.

  '
