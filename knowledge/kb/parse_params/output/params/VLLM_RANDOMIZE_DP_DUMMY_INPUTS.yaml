related_parameters:
- name: --data-parallel-size
  relation: The env var has no effect unless data_parallel_size > 1; it is gated on dp_size > 1.
- name: VLLM_DP_SIZE
  relation: Sets the data parallel world size that gates whether randomization is applied.
- name: --enable-expert-parallel
  relation: Randomizing dummy inputs is most relevant for MoE models with expert parallelism, to balance expert selection
    during profiling.
constraints:
- The env var only takes effect when data parallel size is greater than 1; with a single DP rank it is ignored.
- The value is enabled only when the environment variable is exactly the string '1'; any other value (including 'true') is
  treated as disabled.
tuning_advice:
  summary: Enable only for multi-DP MoE deployments to get representative expert selection during profiling; leave disabled
    otherwise.
  suggested_values:
  - scenario: MoE model with data-parallel-size > 1 and expert parallelism
    value: '1'
    reason: Randomizing dummy inputs spreads expert selection across all experts during profile_run and DP dummy runs, yielding
      a more representative memory profile and avoiding degenerate expert-load imbalance.
  - scenario: Dense model or single DP rank deployment
    value: '0'
    reason: The env var is gated on dp_size > 1 and provides no benefit for dense models; leaving it disabled avoids unnecessary
      profiling overhead.
  caveats:
  - Set the value to the literal string '1'; values like 'true' are silently treated as disabled.
  - This does not affect steady-state throughput, only the profiling/dummy-run phase.
  quick_guide: Set VLLM_RANDOMIZE_DP_DUMMY_INPUTS=1 for multi-DP MoE runs; otherwise leave unset.
analysis_date: '2026-10-27'
