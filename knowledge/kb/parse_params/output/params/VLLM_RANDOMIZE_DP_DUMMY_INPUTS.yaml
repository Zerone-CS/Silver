name: VLLM_RANDOMIZE_DP_DUMMY_INPUTS
type: env
category: parallelism
scope: vllm
source_file:
- vllm/envs.py:1447
- vllm/envs.py:181
- vllm/v1/worker/gpu_model_runner.py:5778
value_type: bool
default: false
valid_choices: 'boolean: ''0'' (disabled) or ''1'' (enabled); any other value is treated as disabled'
cli_example: null
deprecated: false
performance_impact: low
performance_scope:
- throughput
- memory
impact_detail: 'This env var only takes effect when data_parallel_size > 1 (see gpu_model_runner.py:5784-5787,

  where randomize_inputs = randomize_inputs or (envs.VLLM_RANDOMIZE_DP_DUMMY_INPUTS and dp_size > 1)).

  When enabled, the maybe_randomize_inputs context manager replaces input_ids with random token ids

  (torch.randint_like over the vocab range) during dummy runs — specifically during profile_run and

  DP rank dummy runs. The purpose is to spread expert selection across all experts in MoE models so

  that the memory profiling / dummy run exercises a representative expert distribution rather than a

  degenerate one. On Ascend NPU this affects the memory profiling phase (which determines the KV cache

  size / available memory) and the DP dummy-run warmup. It does not change steady-state inference

  throughput directly; its effect is indirect — a more representative dummy run can yield a more

  accurate memory profile and avoid under/over-estimating KV cache blocks, and can avoid pathological

  expert-load imbalance during warmup. The randomization itself adds a small one-time cost

  (torch.randint_like) during profiling only. No vllm-ascend override of this env var was found in the

  provided context; the behavior is inherited from upstream vLLM''s v1 gpu_model_runner path.

  '
usage_locations:
