related_parameters:
- name: CPU_AFFINITY_CONF
  relation: Frequently paired in docs; CPU_AFFINITY_CONF=1 binds CPU cores to reduce cross-NUMA access, complementing async
    task queue dispatch
- name: HCCL_OP_EXPANSION_MODE
  relation: Commonly set together (AIV) in performance test envs to improve collective communication bandwidth
- name: PYTORCH_NPU_ALLOC_CONF
  relation: Often set to expandable_segments:True alongside TASK_QUEUE_ENABLE to mitigate memory fragmentation, especially
    relevant when using value 2 which raises memory peak
constraints:
- TASK_QUEUE_ENABLE is a CANN runtime environment variable and must be set before the process starts (export before launching
  vLLM); changing it at runtime has no effect.
- Value 2 increases memory peak and may degrade performance if device memory is tight, per the optimization_and_tuning doc.
tuning_advice:
  summary: Enable TASK_QUEUE_ENABLE=1 for async NPU operator dispatch to reduce host launch bubbles; use 2 only when memory
    headroom allows.
  suggested_values:
  - scenario: General performance / throughput-oriented serving on Ascend NPU (v1 and v2 worker paths)
    value: 1
    reason: Enables asynchronous NPU task queue dispatch, reducing host-side launch overhead and improving device utilization;
      used as the standard baseline in vllm-ascend performance and acceptance e2e tests.
  - scenario: Memory-constrained deployments or when OOM is observed
    value: 0
    reason: Disabling the task queue avoids the extra memory peak associated with queue optimization; use when device memory
      is tight.
  - scenario: Operator-delivery-queue optimization with ample memory headroom
    value: 2
    reason: Per optimization_and_tuning.md, value 2 optimizes the operator delivery queue but increases memory peak; only
      use when memory is not a constraint.
  caveats:
  - Value 2 may degrade performance if memory is tight due to increased peak memory.
  - Pair with CPU_AFFINITY_CONF=1 and HCCL_OP_EXPANSION_MODE=AIV for best multi-card performance, as shown in vllm-ascend
    docs and e2e tests.
  - Set the variable before process launch; it is read by the CANN runtime at initialization.
  quick_guide: export TASK_QUEUE_ENABLE=1 for async operator dispatch; use 2 only with memory headroom.
