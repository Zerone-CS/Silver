impact_detail: "TASK_QUEUE_ENABLE is a CANN/Ascend runtime environment variable (not defined in vLLM or\nvllm-ascend Python\
  \ source — it is consumed by the Ascend runtime / torch_npu task queue\nsubsystem). It controls whether NPU operators are\
  \ dispatched asynchronously through the\ndevice task queue instead of synchronously on the host stream.\n- Value 1: \"enables\
  \ the NPU task queue so operators are dispatched asynchronously, decoupling\"\n  host-side launch from device-side execution.\
  \ This reduces host launch bubbles and improves\n  device utilization, directly lowering per-step latency and raising throughput\
  \ for\n  decode-heavy workloads. The vllm-ascend docs (Dots3-Note.md) describe it as \"Enables the\n  NPU task queue to\
  \ dispatch operators asynchronously\".\n- Value 2: \"the optimization_and_tuning.md doc describes it as \\\"Optimize operator\
  \ delivery\"\n  queue. This will affect the memory peak value, and may degrade if the memory is tight.\"\n  So value 2 further\
  \ optimizes the delivery queue but increases peak memory usage.\nThe vllm-ascend e2e performance test (test_qwen3_performance.py)\
  \ and all model_runner_v2\nspeculative-decoding acceptance tests set TASK_QUEUE_ENABLE=1 as part of their standard\nperformance/acceptance\
  \ environment, confirming it is a recommended performance setting on\nAscend NPU. It is not read or overridden by vllm-ascend\
  \ Python code; it is a pure CANN\nruntime knob.\n"
