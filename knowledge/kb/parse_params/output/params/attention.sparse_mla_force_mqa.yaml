name: attention.sparse_mla_force_mqa
type: nested
category: model
scope: vllm
source_file:
- vllm/model_executor/layers/attention/mla_attention.py:1210
- vllm/model_executor/layers/attention/sparse_mla_attention.py:136
- vllm/models/hy_v4/nvidia/attention.py:650
- benchmarks/attention_benchmarks/mla_runner.py:252
value_type: bool
default: false
valid_choices:
- true
- false
cli_example: null
deprecated: false
performance_impact: low
performance_scope:
- latency
- throughput
impact_detail: "This parameter is defined only in upstream vLLM (attention_config.sparse_mla_force_mqa);\nno definition or\
  \ usage exists in vllm-ascend, so it has no direct effect on Ascend NPU\nruntime unless the Ascend MLA path consumes the\
  \ same attention_config field.\nIn upstream vLLM it gates whether pure-prefill batches may use a dense/masked MHA prefill\n\
  path instead of the sparse MQA path:\n- \"mla_attention.py:1210 — `_use_dense_mha_prefill` returns False when\"\n  sparse_mla_force_mqa\
  \ is True, forcing all requests (including prefill) onto the\n  sparse MQA forward path.\n- \"sparse_mla_attention.py:136\
  \ — `_use_dense_mha_prefill` also returns False when\"\n  sparse_mla_force_mqa is True, disabling the dense-MHA prefill\
  \ shortcut for short\n  prefills (prefill_max_seq_len <= topk_tokens).\n- \"hy_v4/nvidia/attention.py:650 — the HYV4 sink\
  \ backend sets this flag to True to keep\"\n  every token on the sink-capable sparse MQA path (dense MLA prefill backends\
  \ cannot\n  apply attn_sink).\nThe performance effect is a prefill-path selection tradeoff: \"forcing MQA avoids the\"\n\
  dense-MHA prefill kernel (which can be faster for short prefills) but is required for\ncorrectness when attention sinks\
  \ are used. On Ascend, since vllm-ascend does not\nreference this field, the impact is limited to whichever upstream MLA\
  \ prefill dispatch\nthe Ascend backend inherits; it does not alter HCCL/CANN behavior or memory allocation\ndirectly.\n"
usage_locations:
- file: vllm/model_executor/layers/attention/mla_attention.py:1210
  context: MLAAttention._use_dense_mha_prefill returns False when sparse_mla_force_mqa is True, forcing sparse MQA for prefill.
- file: vllm/model_executor/layers/attention/sparse_mla_attention.py:136
  context: _use_dense_mha_prefill disables dense-MHA prefill shortcut when sparse_mla_force_mqa is set.
- file: vllm/models/hy_v4/nvidia/attention.py:650
  context: HYV4 sink backend forces sparse MQA for prefill to keep attn_sink applied on all tokens.
- file: benchmarks/attention_benchmarks/mla_runner.py:252
  context: Benchmark harness sets sparse_mla_force_mqa on the attention config.
related_parameters:
- name: attention_config.mla_prefill_backend
  relation: Selects the prefill backend; sparse_mla_force_mqa overrides its use by disabling dense-MHA prefill.
- name: attention_config.hisparse_config
  relation: When hisparse_config is set, dense-MHA prefill is already disabled regardless of this flag.
- name: attention_config.index_topk
  relation: Dense-MHA prefill shortcut only applies when prefill_max_seq_len <= topk_tokens; forcing MQA bypasses this.
constraints:
- Setting sparse_mla_force_mqa to True disables the dense/masked MHA prefill path for all requests, including short prefills.
- When attention sinks (attn_sink) are used, this flag must be True or the sink is silently dropped on prefill, corrupting
  output.
tuning_advice:
  summary: Leave at default (False) unless using attention sinks; only force MQA when correctness requires it, accepting a
    possible prefill slowdown.
  suggested_values:
  - scenario: Standard sparse MLA inference without attention sinks on Ascend
    value: false
    reason: Allows the dense-MHA prefill shortcut for short prefills, which can be faster than the sparse MQA path.
  - scenario: Models using attention sinks (e.g. HYV4 learnable sink)
    value: true
    reason: Dense MLA prefill backends cannot apply attn_sink; forcing MQA keeps the sink applied on all tokens and preserves
      correctness.
  caveats:
  - This parameter is upstream-only; verify the Ascend MLA backend actually reads attention_config.sparse_mla_force_mqa before
    relying on it.
  - Forcing MQA for prefill may reduce prefill throughput for short sequences where dense-MHA would be faster.
  quick_guide: Keep False by default; set True only when attention sinks require the sparse MQA path for prefill.
analysis_date: '2026-10-27'
