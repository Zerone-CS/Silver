name: kernel.enable_jit_warmup
type: nested
category: compilation
scope: vllm
source_file:
- vllm/model_executor/warmup/kernel_warmup.py:170
- vllm/v1/attention/backends/flash_attn.py:664
- vllm/v1/attention/backends/mla/prefill/flash_attn.py:376
- vllm/v1/attention/ops/dcp.py:1478
- vllm/model_executor/layers/attention/mla_attention.py:639
- vllm/model_executor/layers/attention/mla_attention.py:719
- vllm/model_executor/layers/sparse_attn_indexer.py:896
- vllm/models/deepseek_v4/amd/mtp.py:130
- vllm/models/deepseek_v4/attention.py:371
value_type: bool
default: true
valid_choices: true or false
cli_example: null
deprecated: false
performance_impact: low
performance_scope:
- latency
impact_detail: 'This is a vLLM-upstream kernel_config field (vllm.config.kernel_config.enable_jit_warmup).

  It is NOT defined or referenced anywhere in vllm-ascend source; all usage sites found are

  in vllm upstream (v1 attention backends, MLA attention, sparse indexer, DeepSeek V4 model

  code, and the central kernel_warmup() driver). When True, kernel_warmup() in

  vllm/model_executor/warmup/kernel_warmup.py:170-188 invokes worker.model_runner.jit_warmup_registry.warmup(),

  which triggers JIT compilation of registered Triton/CuteDSL kernels (e.g. FA4 dense attention,

  FA4 MLA prefill, DCP correct-attn-cp-out, compressed slot mapping, pack/unpack seq, MTP RMSNorm,

  SWA indices) BEFORE the first real request. This moves one-time JIT compile cost from the

  first inference step into the startup/warmup phase, reducing first-token latency (TTFT) spikes

  and avoiding per-request recompilation stalls. It does not change steady-state throughput or

  memory footprint. On Ascend NPU, these specific kernels (FA4, CuteDSL, DeepGEMM-based sparse

  indexer, Triton pack/unpack) are CUDA/GPU-specific and are not exercised by the Ascend attention

  backends, so the flag has essentially no runtime effect on Ascend hardware — it only affects

  the GPU reference path. The warmup is wrapped in try/except that re-raises on failure, so a

  broken JIT warmup will abort startup rather than silently degrade.

  '
usage_locations:
- file: vllm/model_executor/warmup/kernel_warmup.py:170
  context: 'Central driver: reads enable_jit_warmup and calls jit_warmup_registry.warmup() during kernel warmup, logging elapsed
