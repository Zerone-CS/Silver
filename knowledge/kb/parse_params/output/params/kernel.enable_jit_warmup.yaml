related_parameters:
- name: compilation_config.cudagraph_mode
  relation: Both are startup-time compilation/warmup knobs; kernel_warmup runs before cudagraph capture sizes are processed.
- name: kernel_config.sparse_indexer_topk_backend
  relation: Sibling field in kernel_config; selects the topk backend whose kernels may be JIT-warmed.
constraints:
- If JIT kernel warmup raises an exception, kernel_warmup re-raises it and aborts server startup rather than continuing.
- The flag only triggers warmup for kernels that have been registered via register_warmup(); unregistered kernels are unaffected.
tuning_advice:
  summary: Leave at default on Ascend; it only warms GPU-specific JIT kernels and has no measurable Ascend runtime effect.
  suggested_values:
  - scenario: Ascend NPU deployment (v1 or v2 worker)
    value: false
    reason: The warmed kernels are CUDA/GPU-specific and unused by vllm-ascend backends, so disabling avoids wasted startup
      work with no latency penalty.
  - scenario: GPU reference path using FA4 / sparse MLA / DeepSeek V4 kernels
    value: true
    reason: Pre-compiles registered kernels during warmup to avoid first-request TTFT spikes and recompilation stalls.
  caveats:
  - Do not expect throughput or memory changes on Ascend from this flag; it only shifts one-time compile cost.
  - A failing JIT warmup aborts startup, so keep it disabled on Ascend where the kernels are not applicable.
  quick_guide: On Ascend this flag is effectively a no-op; keep default or disable to skip irrelevant GPU JIT warmup.
analysis_date: '2026-10-27'
