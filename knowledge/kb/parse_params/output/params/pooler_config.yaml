- vllm/config/vllm.py:2636
- vllm/v1/engine/core.py:135
- vllm/v1/engine/core.py:387
value_type: dict
default: null
valid_choices: PoolerConfig object (fields such as pooling_type, normalize, softmax, step_tag_id, returned_token_ids, etc.)
  or null
cli_example: '--pooler-config ''{"pooling_type": "mean", "normalize": true}'''
deprecated: false
performance_impact: low
performance_scope:
- latency
- throughput
impact_detail: "--pooler-config is a ModelConfig field (vllm/config/model.py:387) that controls output\npooling behavior for\
  \ pooling/embedding models (runner_type == \"pooling\"). It is passed\nthrough EngineArgs into ModelConfig (vllm/engine/arg_utils.py:1874)\
  \ and is only consumed\nwhen the model runs in pooling mode.\n\nOn the runtime path, the parameter has two observable effects:\n\
  1. Compilation/graph mode interaction (vllm/config/vllm.py:1730): when\n   compilation_config.cudagraph_mode has full cudagraphs\
  \ AND model_config.pooler_config\n   is not None, vLLM logs a warning and forces cudagraph_mode to PIECEWISE. This is a\n\
  \   correctness guard for pooling models (full cudagraphs are unsupported for pooling),\n   and it changes the graph capture\
  \ strategy — which on Ascend maps to ACL graph capture\n   behavior. This is the only place where pooler_config influences\
  \ a performance-relevant\n   code path (graph mode selection), and it is a downgrade, not a tuning knob.\n2. Logging only\
  \ (vllm/v1/engine/core.py:387, _log_pooler_config): pooler_config is read\n   to log supported pooling tasks once; no runtime\
  \ compute effect.\n\nThe actual pooling math (mean/cls/last-token pooling, normalization, softmax) is\nperformed inside\
  \ the model's pooler implementation, not driven by this config object\nat the engine level. The config selects which pooling\
  \ variant is applied, which can\nmarginally change the post-forward reduction cost, but this is negligible relative to\n\
  the transformer forward pass.\n\nvllm-ascend: \"no override of pooler_config was found in the provided context. The only\"\
  \nAscend-side references are in unit tests (tests/ut/core/test_recompute_scheduler_short_request_first.py:74\nsets model_config.pooler_config\
  \ = MagicMock(); tests/ut/model_loader/rfork/test_identity_validation.py:150,189\npass pooler_config through a SimpleNamespace).\
  \ These are test scaffolding, not runtime\nbehavior. No Ascend-specific env var, config patch, or monkey-patch alters pooler_config\n\
  semantics. Therefore the upstream behavior (including the cudagraph downgrade guard)\napplies unchanged on Ascend.\n"
