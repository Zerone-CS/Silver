related_parameters:
- name: --runner
  relation: pooler_config only takes effect when runner is 'pooling' (runner_type == 'pooling'); ignored for generation models
- name: compilation_config.cudagraph_mode
  relation: If full cudagraphs are requested while pooler_config is set, cudagraph_mode is forcibly downgraded to PIECEWISE
- name: --task
  relation: Pooling tasks (embed, classify, score) determine whether pooling path and pooler_config are used
constraints:
- pooler_config only affects models running in pooling mode (runner_type == 'pooling'); it has no effect on generation models.
- Pooling models do not support full cudagraphs; if cudagraph_mode requests full cudagraphs while pooler_config is set, vLLM
  overrides cudagraph_mode to PIECEWISE.
- pooler_config is excluded from the config hash (listed in ignored_factors), so changing it does not invalidate compiled-artifact
  caching keys.
tuning_advice:
  summary: Leave --pooler-config at default (null) unless you run a pooling/embedding model and need to override pooling_type,
    normalize, or softmax; it is not a throughput knob.
  suggested_values:
  - scenario: Standard embedding/classification model with model-provided pooling defaults
    value: unset
    reason: The model's own pooler configuration is inferred automatically; leaving it null avoids overriding correct defaults
      and keeps the cudagraph guard behavior predictable.
  - scenario: Embedding model requiring L2-normalized mean pooling (e.g. sentence embeddings)
    value: '{"pooling_type": "mean", "normalize": true}'
    reason: Explicitly selects mean pooling with normalization when the model config does not specify it; matches common embedding
      serving requirements.
  - scenario: Classification model needing softmax over class logits
    value: '{"pooling_type": "cls", "softmax": true}'
    reason: Enables softmax on CLS-token logits for classification tasks where probabilities are required.
  caveats:
  - Do not set --pooler-config on generation models; it is ignored and only adds confusion.
  - If you rely on full cudagraphs for pooling workloads, be aware vLLM will downgrade to PIECEWISE when pooler_config is
    present — plan performance expectations accordingly on Ascend.
  - Pooling math cost is negligible; focus tuning effort on --max-model-len, --max-num-seqs, and graph mode instead.
  quick_guide: Only set --pooler-config for pooling/embedding models when you must override pooling_type/normalize/softmax;
    otherwise leave it null.
analysis_date: '2026-10-27'
