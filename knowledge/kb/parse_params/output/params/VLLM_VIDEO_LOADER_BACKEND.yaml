cli_example: null
deprecated: false
performance_impact: low
performance_scope:
- latency
- memory
impact_detail: 'This env var selects the frame-sampling algorithm used by the video media loader

  (vllm/multimodal/media/video.py:113-117). It is read in VideoMediaIO.__init__ as a

  fallback when no per-request `video_backend` kwarg is supplied, and the chosen backend

  is resolved through VIDEO_LOADER_REGISTRY.load(). It is also consulted in

  vllm/config/multimodal.py:514 (use_gpu_video_backend) and

  vllm/multimodal/gpu_ipc_memory.py:208 to decide whether the video loader/codec requires

  GPU memory, which affects the mm_ipc_gpu_memory reservation accounting.

  On Ascend NPU this parameter does NOT touch the NPU compute path: "video decoding and"

  frame sampling run on CPU (OpenCV) in the API server / preprocessing stage, before

  tensors are moved to the NPU. Therefore it does not change NPU kernel throughput or

  HCCL behavior. Its only performance relevance is indirect: the sampling algorithm

  changes how many frames are decoded and how much CPU time / host memory the

  preprocessing step consumes, which can shift end-to-end request latency for

  video-input workloads and, for GPU-requiring backends, the reserved IPC memory budget.

  No vllm-ascend override of this env var was found in the provided context.

  '
usage_locations:
- file: vllm/envs.py:1049
  context: Definition of the env var with default 'opencv'
- file: vllm/envs.py:87
  context: 'Typed declaration VLLM_VIDEO_LOADER_BACKEND: str = ''opencv'''
