related_parameters:
- name: --media-io-kwargs
  relation: Per-request 'video_backend' kwarg overrides this env var (video.py:113-114)
- name: mm_ipc_gpu_memory_gb
  relation: GPU-requiring video backends increase the reserved IPC memory budget
- name: VLLM_MEDIA_CONNECTOR
  relation: Sibling media IO env var controlling how media is fetched
constraints:
- If a non-existing backend name is used, an AssertionError is thrown (per envs.py comment).
- The backend must be registered in VIDEO_LOADER_REGISTRY (built-in 'opencv'/'opencv_dynamic' or a custom registered loader)
  before it can be loaded.
- A per-request 'video_backend' in --media-io-kwargs takes precedence over this env var.
tuning_advice:
  summary: On Ascend NPU keep the default CPU OpenCV backend; only switch to 'opencv_dynamic' when duration-aware sampling
    is needed for long videos, accepting extra CPU preprocessing cost.
  suggested_values:
  - scenario: Default video-input workloads on Ascend NPU
    value: opencv
    reason: Uniform sampling with CPU OpenCV is the default, avoids GPU-requiring codecs that are unavailable on Ascend, and
      keeps preprocessing cost predictable.
  - scenario: Long videos needing duration-aware frame sampling
    value: opencv_dynamic
    reason: Duration-aware dynamic sampling adapts frame selection to video length, improving sampling quality at the cost
      of more CPU decode work.
  caveats:
  - Do not select GPU/NVDEC-based backends on Ascend; they are CUDA-only and will fail or be irrelevant.
  - 'Prefer per-request --media-io-kwargs ''{"video": {"video_backend": ...}}'' over changing the global env var when only
    some requests need a different backend.'
  quick_guide: Leave VLLM_VIDEO_LOADER_BACKEND at 'opencv' on Ascend; use 'opencv_dynamic' only for long-video sampling needs.
analysis_date: '2026-10-27'
