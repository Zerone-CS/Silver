name: additional_config.eplb_config.expert_heat_collection_interval
type: nested
category: scheduling
scope: vllm-ascend
source_file:
- vllm_ascend/ascend_config.py:290
- vllm_ascend/ascend_config.py:316
- vllm_ascend/eplb/eplb_updator.py:55
- vllm_ascend/ops/fused_moe/routed_experts.py:559
value_type: int
default: 600
valid_choices: integer >= 0 (validator rejects negative values; docstring says must be greater than 0)
cli_example: null
deprecated: false
performance_impact: medium
performance_scope:
- throughput
- memory
impact_detail: "This is a vllm-ascend-only parameter (defined in vllm_ascend/ascend_config.py EplbConfig,\nnested under additional_config[\"\
  eplb_config\"]). It controls how many forward iterations\nare used to collect expert heat/load statistics for dynamic EPLB\
  \ on Ascend NPU.\n\nTwo distinct code paths consume it:\n\n1. eplb_updator.py:55 (init_eplb): the value is stored as\n \
  \  self.expert_heat_collection_interval. If envs.VLLM_ALLOW_EXPERT_LOAD_COLLECTING is\n   false (or unavailable), self.num_expert_load_gather\
  \ is set to this interval and\n   self.periodic_load_gather is set to False (lines 60-66). This means the EPLB updator\n\
  \   gathers expert load only every N iterations instead of periodically — a larger value\n   reduces the frequency of load-gather/communication\
  \ work (less HCCL all-gather overhead\n   and CPU work in the EPLB worker) but delays rebalancing decisions, so hot experts\
  \ stay\n   overloaded longer, hurting MoE throughput balance.\n\n2. routed_experts.py:559-564 (AscendFusedMoE.__init__):\
  \ when use_multistage_eplb_load()\n   returns true (dynamic_eplb enabled AND eplb_policy_type == 3, i.e. FlashLB), the\n\
  \   interval becomes self.num_iter and self.moe_load is allocated as a tensor of shape\n   (num_iter, local_num_experts)\
  \ on the NPU. So for FlashLB this parameter directly\n   determines the size of the per-layer NPU load-history buffer: \"\
  larger interval =\"\n   more NPU memory per MoE layer (num_iter × local_num_experts × int32) and a longer\n   time-series\
  \ window for the FlashLB policy. For non-FlashLB policies (including the\n   default SwiftBalanceEplb, policy 2) the multi-stage\
  \ path is NOT taken, so no extra\n   window dimension is allocated — the comment at lines 551-555 explicitly warns that\n\
  \   using the interval alone for other policies would produce an unexpected\n   [layer, rank, interval, expert] shape after\
  \ all-gather.\n\nNet effect: \"it trades EPLB responsiveness (load-balance quality → MoE throughput) against\"\nthe frequency\
  \ of load-collection communication/CPU work and, for FlashLB, NPU memory for\nthe load-history buffer. It has no effect\
  \ when dynamic EPLB is disabled.\n"
usage_locations:
- file: vllm_ascend/ascend_config.py:290
  context: Field definition with default 600 in EplbConfig dataclass.
- file: vllm_ascend/ascend_config.py:316
  context: Validator loop checks it is an int and >= 0.
- file: vllm_ascend/eplb/eplb_updator.py:55
  context: Stored as expert_heat_collection_interval; used to set num_expert_load_gather and disable periodic_load_gather
    when VLLM_ALLOW_EXPERT_LOAD_COLLECTING is off.
- file: vllm_ascend/ops/fused_moe/routed_experts.py:559
  context: Passed to use_multistage_eplb_load(); when true, sets num_iter and allocates moe_load tensor of shape (num_iter,
    local_num_experts) on NPU.
related_parameters:
- name: additional_config.eplb_config.dynamic_eplb
  relation: Must be enabled (and DYNAMIC_EPLB or EXPERT_MAP_RECORD env var set) for this interval to have any effect.
- name: additional_config.eplb_config.eplb_policy_type
  relation: Only policy 3 (FlashLB) uses this interval as the multi-stage load window size (num_iter); other policies ignore
    it for buffer sizing.
- name: additional_config.eplb_config.algorithm_execution_interval
  relation: Companion interval controlling how often the EPLB worker runs its CPU rebalancing task; tuned together with this
    parameter.
- name: additional_config.eplb_config.eplb_heat_collection_stage
  relation: Selects which batch phase (all/prefill/decode) contributes to heat collection.
- name: env DYNAMIC_EPLB
  relation: Must be set to true (or EXPERT_MAP_RECORD=true) when dynamic_eplb is enabled, otherwise config validation asserts.
constraints:
- expert_heat_collection_interval must be an integer; non-int values raise TypeError.
- expert_heat_collection_interval must be >= 0; negative values raise ValueError (docs state it must be greater than 0).
- The parameter only takes effect when dynamic EPLB is enabled (dynamic_eplb=true and DYNAMIC_EPLB or EXPERT_MAP_RECORD env
  var set to true).
- This parameter is MRv1 only; MRv2 EPLB is configured through upstream --eplb-config (window_size/step_interval).
tuning_advice:
  summary: Tune expert_heat_collection_interval to balance EPLB rebalancing responsiveness against load-collection overhead
    and (for FlashLB) NPU load-history buffer memory.
  suggested_values:
  - scenario: Default / general MoE serving with SwiftBalanceEplb (policy 2), dynamic EPLB enabled
    value: 600
    reason: Default value; reasonable balance between rebalancing responsiveness and load-collection overhead for typical
      workloads.
  - scenario: Highly skewed / bursty expert routing where hot experts change quickly
    value: 200
    reason: Shorter collection window lets EPLB react faster to load imbalance, improving MoE throughput at the cost of more
      frequent load-gather communication.
  - scenario: Stable routing distribution, memory-constrained NPU with FlashLB (policy 3)
    value: 1000
    reason: Larger interval reduces load-gather frequency and, for FlashLB, still bounds the (num_iter, local_num_experts)
      buffer; use only if routing is stable so delayed rebalancing does not hurt throughput.
  caveats:
  - Only effective with dynamic_eplb=true and DYNAMIC_EPLB=true (or EXPERT_MAP_RECORD=true).
  - 'For FlashLB, watch NPU memory: buffer size scales linearly with this interval times local_num_experts per MoE layer.'
  - Tune together with algorithm_execution_interval; the docs recommend SwiftBalanceEplb (policy 2) as the current recommended
    policy.
  quick_guide: Keep 600 by default; lower (~200) for fast-changing hot experts, raise (~1000) for stable routing or to save
    NPU memory with FlashLB.
analysis_date: '2026-10-27'
