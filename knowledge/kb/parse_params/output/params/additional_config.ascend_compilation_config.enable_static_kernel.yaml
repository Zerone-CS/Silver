related_parameters:
- name: additional_config.ascend_compilation_config.enable_npugraph_ex
  relation: 'Hard dependency: static kernel requires npugraph_ex to be enabled (asserted).'
- name: additional_config.ascend_compilation_config.enable_super_kernel
  relation: Super kernel requires static kernel; when enable_super_kernel is omitted it inherits enable_static_kernel's value.
- name: compilation_config.cudagraph_mode
  relation: Static kernel is force-disabled when cudagraph_mode is NONE or piecewise; only effective with full cudagraphs.
- name: compilation_config.cudagraph_capture_sizes
  relation: Decode cudagraph batch sizes define the sym_range used to specialize static kernels.
constraints:
- enable_static_kernel requires enable_npugraph_ex to be enabled; otherwise an assertion fails.
- enable_static_kernel is automatically disabled if the current hardware profile does not support NPUGRAPH_EX.
- enable_static_kernel is force-disabled when cudagraph_mode is NONE or requires piecewise compilation.
- If enable_super_kernel is not explicitly set, it inherits the value of enable_static_kernel.
tuning_advice:
  summary: Enable only for latency-sensitive decode workloads with stable batch shapes and full cudagraphs, where the one-time
    compile cost is amortized.
  suggested_values:
  - scenario: Stable-shape, latency-sensitive decode serving with FULL_DECODE_ONLY cudagraphs
    value: true
    reason: Static-shape kernels specialized to the decode cudagraph batch sizes reduce per-step decode overhead and can lower
      latency.
  - scenario: Variable batch sizes or piecewise/NONE cudagraph modes
    value: false
    reason: Static kernels are shape-specialized; with changing shapes or non-full cudagraphs the flag is disabled or yields
      no benefit while paying compile cost.
  - scenario: Default / general-purpose deployment
    value: false
    reason: Default is false; enable only after confirming stable shapes and that npugraph_ex is supported on the hardware.
  caveats:
  - Must keep enable_npugraph_ex true; otherwise the config validator asserts.
  - Pair with compilation_config cudagraph_mode FULL_DECODE_ONLY (or full cudagraphs) so the flag is not force-disabled.
  - Expect extra startup compile time and a shutdown cleanup step for the static kernel package.
  quick_guide: Set enable_static_kernel true only with npugraph_ex and full decode cudagraphs on stable batch shapes; otherwise
    leave false.
analysis_date: '2026-10-27'
