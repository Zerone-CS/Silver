name: additional_config.ascend_compilation_config.enable_static_kernel
type: nested
category: compilation
scope: vllm-ascend
source_file:
- vllm_ascend/ascend_config.py:125
- vllm_ascend/ascend_config.py:147
- vllm_ascend/platform.py:1308
- vllm_ascend/platform.py:1332
- vllm_ascend/compilation/compiler_interface.py:88
- vllm_ascend/compilation/compiler_interface.py:122
- vllm_ascend/worker/worker.py:197
- vllm_ascend/ops/fused_moe/routed_experts.py:434
value_type: bool
default: false
valid_choices: true or false
cli_example: null
deprecated: false
performance_impact: medium
performance_scope:
- latency
- throughput
impact_detail: 'enable_static_kernel turns on npugraph_ex''s static-shape kernel compilation path.

  In vllm_ascend/compilation/compiler_interface.py:122-134, when enabled it sets

  options["static_kernel_compile"]=True and computes

  options["_vllm_aclnn_static_kernel_sym_range"] from the decode cudagraph batch sizes

  (_compute_decode_cudagraph_batch_sizes), so the compiler emits kernels specialized to

  the fixed decode batch shapes. This removes dynamic-shape overhead inside the captured

  ACL graph and can lower per-step decode latency / raise decode throughput. It also

  triggers super_kernel_optimize when enable_super_kernel is set (compiler_interface.py:130-134).

  Enabling it also forces LOCAL_WORLD_SIZE to be computed and exported

  (compiler_interface.py:88-108) so npugraph_ex can build per-node Gloo groups for

  coordinating static-kernel compilation and .run package installation, and it installs

  SIGTERM/SIGINT handlers in the worker to uninstall the static kernel package on shutdown

  (worker.py:197-212). The flag is also read in AscendRoutedExperts

  (routed_experts.py:434) to select the static-kernel-aware MoE execution path.

  Because static kernels are shape-specialized, the benefit only materializes when the

  decode batch shapes are stable and match the captured cudagraph sizes; otherwise the

  one-time compilation cost is paid without payoff. The platform layer force-disables it

  whenever cudagraph_mode is NONE or piecewise (platform.py:1308, 1332), so it only has

  effect with full cudagraphs.

  '
usage_locations:
