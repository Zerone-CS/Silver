impact_detail: 'num_redundant_experts controls how many extra physical expert slots are allocated

  beyond the model''s logical experts for Expert Parallel Load Balancing (EPLB). On

  Ascend it is consumed in two distinct paths:


  MRv1 (legacy, additional_config.eplb_config): vllm_ascend/ascend_config.py defines

  the field (default 0) and validates it as a non-negative int. It is only honored

  when dynamic_eplb is true (or an expert_map_path is given): in

  vllm_ascend/eplb/core/eplb_utils.py:84 `n_redundant = eplb_config.num_redundant_experts

  if eplb_enable else 0`, and generate_global_placement(n_experts, ep_size, n_redundant,

  ...) builds the physical expert placement. When an expert_map_path is loaded, the

  redundant count is instead derived from the recorded map (physical_count - n_experts),

  overriding the configured value. In vllm_ascend/patch/platform/patch_fused_moe.py:140

  the Ascend value is propagated into the upstream FusedMoE factory so redundant

  expert weight slots are actually allocated at model construction; a conflict with

  the upstream vLLM value raises ValueError. Model files (deepseek_v4, deepseek_v41,

  glm5next, minimax_m3) compute n_physical_experts = n_logical_experts +

  n_redundant_experts and n_local_physical_experts = n_physical_experts // ep_size,

  so this parameter directly determines per-rank expert weight memory and the

  physical expert table size used by the MoE dispatch.


  MRv2 (upstream --eplb-config): the same field is read from the upstream

  EPLBConfig; vllm-ascend''s additional_config table documents that MRv2 must set it

  via upstream --eplb-config. In vllm_ascend/worker/v2/spec_decode/pcp_utils.py:151

  the draft model''s EPLB is disabled and num_redundant_experts forced to 0 when the

  draft runs replicated PCP=1 (TP=1, DP=1), so the value only affects the target model

  in that configuration.


  Performance mechanism: "more redundant experts let the EPLB policy replicate hot"

  experts onto multiple ranks, reducing all-to-all imbalance and tail latency in

  expert-parallel MoE decode, at the cost of proportionally more expert weight memory

  per rank and larger dispatch/combine tables. Setting it to 0 disables the balancing

  benefit entirely (static placement). It also gates the mc2 hierarchy communication

  limit: "ascend_config.py:997 counts logical + redundant experts and rejects >512."

  '
