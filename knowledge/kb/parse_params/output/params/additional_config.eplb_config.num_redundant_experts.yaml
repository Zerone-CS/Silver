- name: additional_config.eplb_config.eplb_policy_type
  relation: Determines the balancing policy that decides how redundant experts are placed.
- name: --enable-eplb
  relation: Upstream requires EPLB enabled when num_redundant_experts != 0; vllm-ascend patch_fused_moe forces enable_eplb=True
    when dynamic_eplb or expert_map_path is set.
- name: --enable-expert-parallel
  relation: EPLB requires expert parallelism; EP size must be > 1 and total physical experts must divide evenly across EP
    ranks.
- name: additional_config.mc2_comm_alg
  relation: With 'hierarchy', logical + redundant experts must not exceed 512.
- name: --eplb-config.num_redundant_experts
  relation: MRv2 uses the upstream EPLBConfig field instead of additional_config; the two schemas must not be mixed.
constraints:
- num_redundant_experts must be a non-negative integer; negative values raise ValueError.
- The total number of physical experts (logical + redundant) must be divisible by the expert-parallel size, since n_local_physical_experts
  = n_physical_experts // ep_size.
- When mc2_comm_alg is 'hierarchy', logical experts plus redundant experts must not exceed 512.
- Upstream vLLM raises an error if num_redundant_experts is non-zero while EPLB is not enabled.
- If both the upstream vLLM value and the Ascend additional_config value are set and differ, a ValueError is raised for conflicting
  redundant expert counts.
- MRv1 additional_config.eplb_config.num_redundant_experts only takes effect when dynamic_eplb is true or expert_map_path
  is set; otherwise it is ignored (forced to 0).
- MRv2 must configure num_redundant_experts through upstream --eplb-config, not through additional_config.eplb_config.
- When dynamic_eplb is enabled, the DYNAMIC_EPLB or EXPERT_MAP_RECORD environment variable must be set to true.
tuning_advice:
  summary: Set num_redundant_experts to a modest fraction of logical experts (e.g. 10-25%) when EPLB is enabled to balance
    hot experts across EP ranks, while keeping total physical experts divisible by EP size and within memory budget.
  suggested_values:
  - scenario: MRv1 dynamic EPLB on a large MoE (e.g. DeepSeek) with EP size 16 and skewed expert traffic
    value: 16
    reason: Adds one redundant expert per EP rank worth of capacity, letting SwiftBalanceEplb replicate hot experts and reduce
      all-to-all imbalance; matches the documented example value.
  - scenario: MRv2 upstream --eplb-config with Qwen3-30B-A3B, TP=16, EP enabled
    value: 16
    reason: Documented MRv2 example uses --eplb-config.num_redundant_experts 16 with window_size/step_interval 50 for balanced
      expert load.
  - scenario: Memory-constrained deployment or when KV cache is the bottleneck
    value: 0
    reason: Disables redundant expert allocation, minimizing per-rank expert weight memory at the cost of load balancing.
  - scenario: mc2_comm_alg == 'hierarchy' with many logical experts
    value: 0
    reason: Total experts must stay <= 512; if logical experts are already near the limit, redundant experts must be kept
      small or zero.
  caveats:
  - Ensure (logical_experts + num_redundant_experts) is divisible by ep_size, otherwise per-rank expert partitioning is uneven.
  - 'Watch NPU HBM usage: each redundant expert adds full expert weight memory per rank, potentially shrinking KV cache.'
  - MRv1 requires DYNAMIC_EPLB=true (or EXPERT_MAP_RECORD=true) and dynamic_eplb=true for this value to take effect.
  - MRv2 must set this via upstream --eplb-config, not additional_config.eplb_config.
  quick_guide: Enable EPLB and set num_redundant_experts to ~10-25% of logical experts (divisible by EP size) for balanced
    MoE throughput; use 0 if memory-bound.
