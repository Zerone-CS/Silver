name: --async-scheduling
type: cli
category: scheduling
scope: both
source_file:
- vllm/config/scheduler.py:190
- vllm/config/scheduler.py:214
- vllm/engine/arg_utils.py:1644
- vllm/engine/arg_utils.py:2448
- vllm/config/vllm.py:593
- vllm/config/vllm.py:1400
- vllm_ascend/platform.py:1062
- vllm_ascend/platform.py:1071
- vllm_ascend/platform.py:1132
- vllm_ascend/patch/platform/patch_pp_mtp.py:106
- vllm_ascend/patch/platform/patch_pp_mtp.py:173
- vllm_ascend/worker/model_runner_v1.py:494
- vllm_ascend/worker/model_runner_v1.py:902
- vllm_ascend/worker/dcp_utils.py:92
- vllm_ascend/worker/v2/spec_decode/autoregressive/speculator.py:143
value_type: bool
default: null
valid_choices: 'true / false (tri-state: None means auto/not explicitly set)'
cli_example: --async-scheduling
deprecated: false
performance_impact: high
performance_scope:
- latency
- throughput
- memory
impact_detail: 'Async scheduling decouples the scheduler from the model forward pass so the next

  batch can be prepared while the current one executes, removing bubbles in NPU

  utilization. In upstream vLLM, SchedulerConfig.get_scheduler_cls() returns

  AsyncScheduler when async_scheduling is truthy (vllm/config/scheduler.py:214), and

  VllmConfig.max_concurrent_batches returns 2 (V1 runner, pp_size<=1) or pp_size+1

  (V2 runner) when async scheduling is on (vllm/config/vllm.py:593), which directly

  increases max_in_flight_tokens and therefore KV-cache reservation requirements.

  On Ascend, vllm-ascend reads scheduler_config.async_scheduling in several places:

  (1) platform.py:1062 — when ShortRequestFirst is enabled, async scheduling swaps

  scheduler_cls to ShortRequestFirstAsyncScheduler; (2) platform.py:1071 — CPP

  (profiling_chunk) with async scheduling requires the v2 model runner, otherwise

  startup raises; (3) platform.py:1132 — the recompute scheduler class is chosen

  based on async_scheduling; (4) patch_pp_mtp.py:106/173 — the PP+MTP runtime patch

  only applies when async scheduling is OFF, and temporarily forces

  async_scheduling=False during _make_cached_request_data for PP IPC; (5) the V1

  model runner allocates an extra pinned int64 valid_sampled_token_count_cpu buffer

  when async scheduling + spec tokens are active (model_runner_v1.py:494) and applies

  PP sampled tokens from scheduler output only under async scheduling

  (model_runner_v1.py:902); (6) DCPManager stores use_async_scheduling to keep

  async rebuild buffers (dcp_utils.py:92/515). Net effect on Ascend: higher NPU

  utilization and lower inter-token latency, at the cost of extra host-side buffers

  and larger in-flight KV footprint.

  '
