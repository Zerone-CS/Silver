related_parameters:
- name: --speculative-config / --spec-tokens
  relation: Upstream only supports async scheduling with eagle-family spec decode; on Ascend, async + spec tokens triggers
    extra pinned buffers and PP sampled-token handling
- name: --scheduler-cls
  relation: A custom scheduler_cls overrides the AsyncScheduler selection; if it subclasses Scheduler instead of AsyncScheduler,
    async scheduling is effectively disabled (degraded performance warning)
- name: VLLM_USE_V2_MODEL_RUNNER
  relation: CPP (profiling_chunk) + async scheduling requires the v2 model runner; V1 PP path lacks async cadence guarantees
- name: additional_config.scheduler_config.short_request_first_config
  relation: When enabled with async scheduling, scheduler_cls is swapped to ShortRequestFirstAsyncScheduler
- name: additional_config.scheduler_config.profiling_chunk_config
  relation: CPP + async scheduling requires v2 model runner, else startup error
- name: additional_config.scheduler_config.recompute_scheduler_enable
  relation: Recompute scheduler class selection depends on async_scheduling (PD decode nodes only)
- name: --pipeline-parallel-size
  relation: PP+MTP runtime patch only applies when async scheduling is off; async scheduling changes max_concurrent_batches
    to pp_size+1 on V2
- name: --max-num-batched-tokens
  relation: max_in_flight_tokens = max_concurrent_batches * max_num_batched_tokens, so async scheduling multiplies KV reservation
constraints:
- Async scheduling is only compatible with eagle-family speculative decoding methods upstream; other spec methods raise a
  ValueError at config validation.
- Enabling profiling_chunk_config (CPP) together with --async-scheduling requires the v2 model runner (VLLM_USE_V2_MODEL_RUNNER=1);
  on the v1 model runner startup fails with a configuration error.
- Async scheduling is not compatible with ROCm DeepEP high-throughput DBO (upstream check; not applicable to Ascend NPU but
  enforced in shared config validation).
- If a custom --scheduler-cls is provided that subclasses Scheduler instead of AsyncScheduler, async scheduling is effectively
  disabled and performance degrades.
- The vllm-ascend PP+MTP runtime patch (patch_pp_mtp.py) only takes effect when async scheduling is disabled; with async scheduling
  on, the patch is bypassed.
tuning_advice:
  summary: Enable --async-scheduling for production Ascend serving to overlap scheduling with NPU execution and improve throughput/latency;
    disable only when using PP+MTP runtime patch, v1 CPP, or when KV memory is tight.
  suggested_values:
  - scenario: Standard single-node or PD-mixed Ascend serving (text/audio/image), v1 or v2 model runner
    value: true
    reason: Async scheduling removes NPU idle gaps between steps; vllm-ascend docs list it as a common parameter for Dots3-Note
      and GLM5.2/5.3-Flash deployments.
  - scenario: PD-disaggregated deployment (both P and D nodes), e.g. GLM5.3-Flash with MooncakeConnectorV1
    value: true
    reason: Docs explicitly state both prefill and decode roles run with --async-scheduling; recompute scheduler class selection
      on decode nodes depends on it.
  - scenario: PP + MTP speculative decoding relying on vllm-ascend patch_pp_mtp runtime patch
    value: false
    reason: The PP+MTP post_step patch only short-circuits when async scheduling is off; enabling async scheduling bypasses
      the patch and changes scheduling behavior.
  - scenario: CPP (profiling_chunk / dynamic chunk pipeline parallel) on v1 model runner
    value: false
    reason: CPP + async scheduling raises a startup error on v1; either disable async scheduling or set VLLM_USE_V2_MODEL_RUNNER=1.
  - scenario: KV-cache-constrained deployment with large --max-num-batched-tokens
    value: false
    reason: Async scheduling doubles (V1) or adds one (V2) concurrent batches, multiplying in-flight KV tokens; disabling
      reduces memory pressure at the cost of throughput.
  caveats:
  - 'Monitor NPU memory after enabling: max_in_flight_tokens scales with max_concurrent_batches, so reduce --max-num-batched-tokens
    or --max-num-seqs if OOM occurs.'
  - If you supply a custom --scheduler-cls, ensure it subclasses AsyncScheduler, otherwise async scheduling is silently disabled.
  - On Ascend, async scheduling with spec tokens adds a pinned host buffer per request; account for host memory in large max_num_reqs
    deployments.
  - CPP + async scheduling requires VLLM_USE_V2_MODEL_RUNNER=1; verify the runner version before enabling both.
  quick_guide: Keep --async-scheduling on for throughput/latency; turn it off for PP+MTP patch path, v1 CPP, or when KV memory
    is tight.
analysis_date: '2026-10-27'
