name: --nnodes
type: cli
category: parallelism
scope: both
source_file:
- vllm/config/parallel.py:290
- vllm/engine/arg_utils.py:1063
- vllm/engine/arg_utils.py:2173
- vllm_ascend/patch/platform/patch_multiproc_executor.py:143
- vllm_ascend/platform.py:1099
- vllm_ascend/worker/worker.py:393
value_type: int
default: 1
valid_choices: integer >= 1
cli_example: --nnodes 2
deprecated: false
performance_impact: medium
performance_scope:
- throughput
- latency
impact_detail: "--nnodes controls multi-node distributed inference when the mp (multiprocessing)\nexecutor is used. It does\
  \ not change per-token compute, but it fundamentally\nchanges the distributed topology and thus throughput/latency scaling.\n\
  \nUpstream (vllm/config/parallel.py:290, vllm/engine/arg_utils.py:2173-2219):\n- \"When nnodes > 1, data_parallel_backend\
  \ must be \\\"mp\\\" (else ValueError).\"\n- \"world_size = data_parallel_size * pipeline_parallel_size * tensor_parallel_size\"\
  \n  * prefill_context_parallel_size must be evenly divisible by nnodes.\n- \"local_world_size = world_size // nnodes; data_parallel_rank\
  \ and\"\n  data_parallel_size_local are inferred from node_rank and local_world_size.\n- \"nnodes > 1 sets nnodes_within_dp\
  \ > 1, which switches the multiproc executor\"\n  into cross-node MessageQueue mode (vllm/v1/executor/multiproc_executor.py:610):\n\
  \  instead of a local shared-memory MessageQueue, workers create remote MQ\n  broadcasters via get_inner_dp_world_group().create_mq_broadcaster().\
  \ This adds\n  network round-trips for SchedulerOutput broadcast and model-output collection,\n  increasing per-step latency\
  \ but enabling scaling beyond a single node's NPU count.\n\nvllm-ascend overrides / interactions:\n- \"vllm_ascend/patch/platform/patch_multiproc_executor.py:143\
  \ asserts\"\n  world_size % nnodes_within_dp == 0 — same divisibility requirement enforced\n  on the Ascend patched executor.\n\
  - \"vllm_ascend/worker/worker.py:393 and :473 (and _310p/worker_310p.py:194) gate\"\n  the DP local_rank device-shift and\
  \ the local_world_size <= visible_device_count\n  assert on nnodes_within_dp == 1. When nnodes > 1, the per-process NPU\
  \ binding\n  shift is skipped, so device assignment relies on the distributed launcher /\n  HCCL environment rather than\
  \ the local DP rank shift. This affects how NPUs\n  are bound per process across nodes.\n- \"vllm_ascend/platform.py:1099\
  \ rejects DyntraLB when nnodes_within_dp > 1\"\n  (DyntraLB only supports single-node decoder instances), so multi-node\n\
  \  deployment disables that load-balancing optimization.\n- \"Docs (pipeline_parallel.md, GLM5.2.md) show --nnodes used\
  \ with PP over\"\n  multiple nodes using the mp executor and HCCL env vars, no Ray required.\n"
usage_locations:
- file: vllm/config/parallel.py:290
  context: 'Field definition nnodes: int = Field(default=1, ge=1)'
- file: vllm/engine/arg_utils.py:2173
  context: 'Validation: nnodes > 1 requires data_parallel_backend == mp; divisibility and node_rank checks; infers data_parallel_rank/size_local'
- file: vllm/v1/executor/multiproc_executor.py:610
  context: nnodes_within_dp > 1 switches to cross-node remote MessageQueue broadcasters
- file: vllm_ascend/patch/platform/patch_multiproc_executor.py:143
  context: Ascend patched executor asserts world_size divisible by nnodes_within_dp
- file: vllm_ascend/worker/worker.py:393
  context: DP local_rank device shift skipped when nnodes_within_dp != 1
- file: vllm_ascend/platform.py:1099
  context: DyntraLB rejected when nnodes_within_dp > 1
related_parameters:
- name: --node-rank
  relation: Must be in [0, nnodes-1]; identifies this node's zero-based index
- name: --data-parallel-backend
  relation: Must be 'mp' when nnodes > 1
- name: --distributed-executor-backend
  relation: nnodes applies to the mp executor path; ray uses placement groups instead
- name: --master-addr
  relation: Must point to the head node address for cross-node mp communication
- name: --master-port
  relation: Must be identical across all nodes
- name: --data-parallel-size
  relation: world_size (dp*tp*pp*pcp) must be divisible by nnodes
- name: --tensor-parallel-size
  relation: Part of world_size that must be divisible by nnodes
- name: --pipeline-parallel-size
  relation: Part of world_size that must be divisible by nnodes; commonly used for multi-node PP
constraints:
- --nnodes must be >= 1.
- When --nnodes > 1, --data-parallel-backend must be 'mp' (Ray backend is rejected).
- The total world size (data_parallel_size × pipeline_parallel_size × tensor_parallel_size × prefill_context_parallel_size)
  must be evenly divisible by --nnodes.
- --node-rank must be between 0 and --nnodes - 1.
- All nodes must use identical model, TP, PP, --nnodes, --master-addr, and --master-port values, with a unique --node-rank
  per node.
- DyntraLB cannot be used when nnodes_within_dp > 1 (multi-node decoder instances are rejected).
tuning_advice:
  summary: Set --nnodes to the number of physical nodes only when scaling beyond one node's NPU count with the mp executor;
    keep it at 1 for single-node deployments.
  suggested_values:
  - scenario: Single-node deployment (all NPUs on one host)
    value: 1
    reason: Avoids cross-node MessageQueue overhead and keeps the DP local_rank device-shift and DyntraLB available.
  - scenario: Multi-node pipeline-parallel prefill (e.g. PP2 over two nodes)
    value: 2
    reason: Docs show PP split across two nodes with --nnodes 2, --node-rank 0/1, mp executor, and HCCL env vars; world_size
      must be divisible by 2.
  - scenario: Multi-node data-parallel with mp backend
    value: <number of physical nodes>
    reason: nnodes must evenly divide dp*tp*pp*pcp world size; set --data-parallel-backend mp and matching --master-addr/--master-port.
  caveats:
  - Ensure world_size is divisible by nnodes before launch to avoid the executor assert.
  - Set identical --master-addr/--master-port and unique --node-rank on every node.
  - Expect higher per-step latency from cross-node MQ; prefer single-node when NPU count suffices.
  - DyntraLB is unavailable in multi-node mode.
  quick_guide: Use --nnodes 1 unless you must span multiple hosts; for multi-node use mp backend, matching master addr/port,
    unique node-rank, and world_size divisible by nnodes.
analysis_date: '2026-10-27'
