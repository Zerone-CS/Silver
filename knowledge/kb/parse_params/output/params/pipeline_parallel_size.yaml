related_parameters:
- name: --tensor-parallel-size
  relation: Product pp × tp × pcp × dp determines total world size; must fit available NPUs
- name: --data-parallel-size
  relation: world_size = dp × pp × tp × pcp; nnodes must evenly divide this (arg_utils.py:2183)
- name: --prefill-context-parallel-size
  relation: PCP multiplies world size alongside PP; both factor into world_size_within_dp
- name: --nnodes
  relation: nnodes must evenly divide total world size (pp × tp × pcp × dp)
- name: profiling_chunk_config.enabled
  relation: Dynamic Chunked Pipeline Parallel (CPP) requires pp > 1; mutually exclusive with enable_balance_scheduling
- name: --enable-return-routed-experts
  relation: Incompatible with PP > 1 (vllm/config/vllm.py:1283)
- name: --speculative-config
  relation: Local drafters (Eagle/MTP/DSpark) load on last PP stage and are validated as pp=1
- name: --enable-expert-parallel
  relation: Mega-MoE EP group size is world_size_across_dp // pp_size; large pp shrinks EP group
constraints:
- pipeline_parallel_size must be >= 1.
- The model must implement the SupportsPP interface to run with --pipeline-parallel-size > 1, otherwise a NotImplementedError
  is raised.
- The product of pipeline_parallel_size, tensor_parallel_size, prefill_context_parallel_size and data_parallel_size must fit
  the available NPU count and be evenly divisible by --nnodes.
- Enabling profiling_chunk_config (Dynamic Chunked Pipeline Parallel) requires --pipeline-parallel-size greater than 1.
- profiling_chunk_config and enable_balance_scheduling cannot be enabled at the same time.
- Ascend Engram (DeepSeek V4.1) requires --pipeline-parallel-size 1 (with TP=1/2/4/8 and DCP=1).
- --enable-return-routed-experts is incompatible with pipeline parallelism (PP > 1).
- mm_tensor_ipc='torch_shm' is not supported when pipeline_parallel_size > 1.
- Local speculative drafters (Eagle/MTP/DSpark) are loaded on the last PP stage and are validated as if pipeline_parallel_size=1.
tuning_advice:
  summary: Use PP to fit models that TP alone cannot hold in NPU memory, and pair it with CPP for prefill-heavy workloads;
    keep pp=1 for latency-sensitive decode or when mega-MoE/Engram are needed.
  suggested_values:
  - scenario: Model does not fit on available NPUs with TP alone (weight memory bound)
    value: 2
    reason: Each PP stage holds only its layer range, roughly halving per-NPU weight memory; start with pp=2 and increase
      only if still OOM.
  - scenario: Prefill-heavy / long-context serving on Ascend with Dynamic Chunked Pipeline Parallel
    value: 2
    reason: CPP requires pp>1 and mitigates PP bubbles by dynamically sizing prefill chunks; tune --max-num-batched-tokens
      to 2-4x the fixed chunk size.
  - scenario: Latency-sensitive decode or single-node deployment where model fits with TP
    value: 1
    reason: Avoids pipeline bubbles and inter-stage HCCL transfer latency; pure TP gives lower per-token latency.
  - scenario: MoE model relying on the mega-MoE fused operator
    value: 1
    reason: Large pp shrinks the EP group (world_size_across_dp // pp_size) and can disable mega-MoE; keep pp=1 to preserve
      the fast path.
  - scenario: Ascend Engram (DeepSeek V4.1) deployment
    value: 1
    reason: Ascend Engram requires pipeline_parallel_size == 1.
  caveats:
  - Without CPP, PP bubbles can dominate and reduce throughput versus pure TP; enable profiling_chunk_config when using PP
    for prefill.
  - PP multiplies concurrent batches and in-flight tokens, increasing KV-cache pressure — verify gpu_memory_utilization and
    max_num_batched_tokens.
  - Speculative decoding drafters load on the last PP stage only; do not expect draft model to be partitioned across stages.
  - For PD disaggregation, set PP only on the P node; the D node should run with pp=1.
  quick_guide: Set --pipeline-parallel-size > 1 only when TP cannot fit the model or when using CPP for prefill; otherwise
    keep it at 1.
analysis_date: '2026-10-27'
