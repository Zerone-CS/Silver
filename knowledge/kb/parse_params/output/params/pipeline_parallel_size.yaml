deprecated: false
performance_impact: high
performance_scope:
- latency
- throughput
- memory
impact_detail: "Pipeline parallelism splits the model's transformer layers into consecutive stages, each\nexecuted by one\
  \ TP group (vllm/config/parallel.py:122, doc pipeline_parallel.md:6). On Ascend\nthis has several concrete runtime effects:\n\
  \n1. Memory: each PP stage holds only its own layer range, so per-NPU weight memory drops roughly\n   by a factor of pp_size.\
  \ This is the primary reason to use PP on Ascend when a model does not\n   fit with TP alone (e.g. large MoE/dense models\
  \ on 64GB NPUs).\n\n2. Throughput/latency: PP introduces pipeline bubbles. vllm/config/vllm.py:592 shows that\n   `max_concurrent_batches`\
  \ returns `pp_size` (or `pp_size + 1` with async scheduling on the v2\n   runner) — PP requires pp_size concurrent micro-batches\
  \ to fill the pipeline, which multiplies\n   the in-flight token budget (`max_in_flight_tokens = max_concurrent_batches\
  \ *\n   max_num_batched_tokens`, vllm/config/vllm.py:602). This increases KV-cache pressure and\n   scheduling overhead,\
  \ and adds inter-stage activation transfer latency over HCCL.\n\n3. Ascend-specific interactions:\n   - \"vllm_ascend/ascend_config.py:730:\
  \ enabling `profiling_chunk_config` (Dynamic Chunked\"\n     Pipeline Parallel, CPP) requires pp > 1; CPP is the Ascend\
  \ feature that mitigates PP bubbles\n     by dynamically sizing prefill chunks. Without CPP, PP on Ascend suffers larger\
  \ bubbles.\n   - \"vllm_ascend/ascend_config.py:1140: the mega-MoE fused operator computes its EP group size as\"\n    \
  \ `world_size_across_dp // pipeline_parallel_size`; a large pp_size shrinks the effective EP\n     group and can disable\
  \ the mega-MoE fast path (requires ep_world_size >= 2 and num_experts\n     divisible by it).\n   - \"vllm_ascend/platform.py:430:\
  \ `_validate_indexer_pp_config` validates per-stage layer ranges\"\n     for models with indexer_types/use_index_cache (DSA-style\
  \ sparse attention) when pp > 1.\n   - \"vllm_ascend/platform.py:1618: Ascend Engram (DeepSeek V4.1) requires pp == 1.\"\
  \n   - \"vllm_ascend/patch/platform/patch_pp_mtp.py:320: local speculative drafters (Eagle/MTP/DSpark)\"\n     are loaded\
  \ on the last PP stage only and are validated as if pp=1; the v2 worker\n     (pp_transport.py:91, speculator.py:154) similarly\
  \ forces draft pipeline_parallel_size=1.\n   - \"vllm_ascend/patch/platform/patch_multiproc_executor.py:150: pp_size participates\
  \ in the\"\n     multiprocess executor's rank/world-size layout (tp, pp, pcp), affecting how workers are\n     spawned and\
  \ how HCCL groups are formed.\nOverall PP trades per-NPU memory for pipeline bubbles and extra communication; on Ascend\
  \ it is\nmost beneficial combined with CPP for prefill-heavy workloads or when TP alone cannot fit the model.\n"
