related_parameters:
- name: VLLM_ENGINE_READY_TIMEOUT_S
  relation: Companion timeout for engine-core startup readiness (default 600s); distinct phase from per-iteration timeout.
- name: VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS
  relation: Related execution timeout for model execution; both govern how long the engine waits before declaring a hang.
- name: VLLM_WORKER_SHUTDOWN_TIMEOUT_SECONDS
  relation: Timeout for worker shutdown; part of the same family of engine lifecycle timeouts.
constraints:
- The value must be a positive integer number of seconds; it is parsed with int() so non-integer strings raise an error.
- If a single engine iteration exceeds this value, the engine may raise a timeout error or deadlock rather than continue.
tuning_advice:
  summary: Keep the default for steady-state serving; raise it for cold-start, large-prefill, or slow-HCCL scenarios to avoid
    spurious timeouts on Ascend.
  suggested_values:
  - scenario: Standard steady-state serving with warm caches
    value: 60
    reason: Default is adequate once CANN graphs and HCCL are warmed up; keeps hang detection responsive.
  - scenario: Cold start / first-iteration CANN compilation or large model warmup on Ascend
    value: 300
    reason: First-use JIT/compilation and HCCL warmup can exceed 60s; upstream tests raise to 300s for analogous slow-first-use
      cases.
  - scenario: Very large models, long-context prefill, or slow multi-node HCCL collectives
    value: 600
    reason: Upstream realtime test uses 600s to avoid silent deadlock when a single iteration is very slow.
  caveats:
  - This is a watchdog threshold, not a throughput knob; do not expect speedup from raising it.
  - Overly large values slow detection of real hangs and delay failover.
  - Applies to both v1 and v2 worker paths since it is consumed by upstream engine-core iteration logic, not Ascend-specific
    dispatch.
  quick_guide: Leave at 60s normally; bump to 300-600s if you see iteration timeouts during cold start or heavy prefill on
    Ascend.
analysis_date: '2026-10-27'
