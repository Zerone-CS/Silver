name: VLLM_ENGINE_ITERATION_TIMEOUT_S
type: env
category: scheduling
scope: vllm
source_file:
- vllm/envs.py:793
- vllm/envs.py:26
- vllm/envs.py:2303
value_type: int
default: 60
valid_choices: positive integer (seconds); no explicit upper bound
cli_example: null
deprecated: false
performance_impact: low
performance_scope:
- latency
impact_detail: 'VLLM_ENGINE_ITERATION_TIMEOUT_S is read in vllm/envs.py as an int (default 60s) and

  represents the per-iteration timeout the engine core uses when waiting on a step of

  the model execution loop. It is a watchdog/deadlock-detection threshold, not a knob

  that changes the compute path. On Ascend NPU it does not alter kernel selection,

  memory allocation, or HCCL communication behavior. Its only runtime effect is

  indirect: "if a single engine iteration (e.g. a large prefill, first-use CANN"

  compilation/JIT, or a slow HCCL collective) exceeds this timeout, the engine can

  raise a timeout error or deadlock, which stalls or aborts serving and thus hurts

  effective latency/throughput. The upstream tests (test_video.py, test_vision.py,

  test_realtime_validation.py) raise it to 300-600s specifically because first-use

  JIT compilation can exceed the 60s default and cause a silent deadlock. On Ascend,

  CANN graph compilation and ACL/HCCL warmup can similarly be slow on first iteration,

  so the same reasoning applies. No vllm-ascend override of this env var was found in

  the provided context; it is consumed by upstream engine-core logic.

  '
usage_locations:
- file: vllm/envs.py:793
  context: Defines the env var accessor, parsing int with default 60.
- file: vllm/envs.py:26
  context: 'Type stub declaration VLLM_ENGINE_ITERATION_TIMEOUT_S: int = 60.'
- file: vllm/envs.py:2303
  context: Listed among env vars excluded from compiled-artifact cache key factors.
- file: tests/entrypoints/multimodal/openai/chat_completion/test_video.py:48
  context: ROCm tests raise to 300s to tolerate slow video processing / network delays.
- file: tests/entrypoints/speech_to_text/realtime/test_realtime_validation.py:20
