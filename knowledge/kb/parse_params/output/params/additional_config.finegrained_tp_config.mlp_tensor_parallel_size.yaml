name: additional_config.finegrained_tp_config.mlp_tensor_parallel_size
type: nested
category: parallelism
scope: vllm-ascend
source_file:
- vllm_ascend/ascend_config.py:1340
- vllm_ascend/ascend_config.py:1362
- vllm_ascend/ascend_config.py:824
- vllm_ascend/distributed/parallel_state.py:201
- vllm_ascend/utils.py:994
value_type: int
default: 0
valid_choices: non-negative integer; 0 or 1 disables fine-grained MLP TP; values > 1 enable it and must divide data_parallel_size
cli_example: null
deprecated: false
performance_impact: high
performance_scope:
- latency
- throughput
- memory
impact_detail: 'This is a vllm-ascend-only parameter (defined in FinegrainedTPConfig, vllm_ascend/ascend_config.py:1340).

  It sets a custom tensor-parallel size for the MLP (down_proj) module, independent of the global

  tensor_parallel_size. When > 1, vllm_ascend creates a dedicated MLP-TP process group

  (parallel_state.py:201-212, group name "mlptp", cached as _MLP_TP) and the MLP''s row-parallel

  linear (AscendRowParallelLinear for down_proj) uses this group for its all-reduce instead of the

  default TP group (see tests/ut/ops/test_linear.py:187-195 asserting custom_op.comm_group == _MLP_TP).

  mlp_tp_enable() (utils.py:994) gates this path. The mechanism: in a PD-disaggregated decode (D) node

  with data_parallel_size > 1, the MLP weights are sharded across the DP dimension rather than the

  TP dimension, so each DP rank computes a slice of the MLP and the all-reduce is done over the

  smaller MLP-TP group. This reduces per-rank MLP compute and weight memory footprint while keeping

  the collective within a DP group, improving decode latency/throughput and lowering per-NPU memory.

  It is only active in graph mode (cudagraph) and requires recompute_scheduler_enable=true so that

  decode-node steps stay decode-shaped and cross-DP HCCL collectives stay aligned.

  '
usage_locations:
