name: --mm-ipc-gpu-memory-gb
type: cli
category: memory
scope: vllm
source_file:
- vllm/engine/arg_utils.py:1462
- vllm/engine/arg_utils.py:626
- vllm/config/model.py:416
- vllm/config/multimodal.py:244
- vllm/multimodal/gpu_ipc_memory.py:128
- vllm/renderers/base.py:148
value_type: float
default: 0
valid_choices: Any float >= 0 (Field(default=0, ge=0)); 0 disables frontend GPU multimodal memory gating
cli_example: --mm-ipc-gpu-memory-gb 2.0
deprecated: false
performance_impact: low
performance_scope:
- memory
- latency
impact_detail: 'This parameter is defined entirely in upstream vLLM (vllm/config/multimodal.py:244,

  Field(default=0, ge=0)) and is not referenced anywhere in vllm-ascend source. It controls

  a frontend (API-server process) byte-counting semaphore (MultiModalGPUMemoryPool) that gates

  GPU-side multimodal decoding such as hardware video decoding. In vllm/renderers/base.py:148,

  maybe_init_mm_gpu_ipc_pool() is called with mm_config.mm_ipc_gpu_memory_gb and

  config.parallel_config._api_process_count; when the budget is 0 the pool is set to None and

  gating is disabled (gpu_ipc_memory.py:137-139). When > 0, the total budget is divided equally

  across API processes (total_bytes = int(gb * GiB_bytes) // api_process_count) and decode paths

  must acquire bytes from the blocking semaphore before allocating on device, releasing after

  free. The docstring states the budget is "carved out of the engine''s KV-cache memory so the

  headroom physically exists" — i.e. it reduces available KV cache (memory impact) and, because

  acquire() blocks, concurrent frontend GPU decodes serialize rather than oversubscribe the

  device (latency impact under concurrency). On Ascend NPU, the frontend GPU-side decode path

  (hardware video decoding on device) is not a typical vllm-ascend deployment pattern; the

  parameter has no Ascend-specific override and its effect is limited to the frontend process,

  not the NPU engine''s model execution. Hence low impact for Ascend runtime.

  '
