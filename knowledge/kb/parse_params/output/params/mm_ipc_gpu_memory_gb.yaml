constraints:
- The value must be greater than or equal to 0 (Field(default=0, ge=0)); negative values are rejected.
- Setting the value to 0 disables frontend GPU multimodal memory gating entirely.
- When multiple API-server processes share one engine, the user-provided budget is divided equally among them, so each process
  gets only a fraction of the total.
tuning_advice:
  summary: Leave at 0 unless you run GPU-side multimodal decoding in the frontend; if enabled, size it to the peak concurrent
    decode working set and account for the KV-cache reduction.
  suggested_values:
  - scenario: Default / text-only or CPU-side multimodal processing (typical Ascend deployment)
    value: 0
    reason: Gating disabled; no KV-cache carve-out and no frontend GPU memory contention.
  - scenario: Frontend hardware video decoding with a few concurrent requests
    value: 2.0
    reason: Provides headroom for a small number of concurrent device-side decode buffers while limiting KV-cache loss.
  - scenario: High-concurrency frontend GPU decode workload
    value: 4.0
    reason: Larger budget avoids excessive serialization on the blocking semaphore, at the cost of reduced KV cache.
  caveats:
  - Increasing this value directly reduces KV-cache capacity; monitor KV-cache usage and throughput after changing it.
  - With multiple API processes the effective per-process budget is the configured value divided by the process count.
  - On Ascend NPU, frontend GPU-side video decoding is uncommon; verify the decode path actually runs on device before setting
    a non-zero value.
  quick_guide: Keep 0 unless doing frontend GPU multimodal decode; then set to peak concurrent decode bytes, remembering it
    shrinks KV cache.
