name: compilation.traced_files
type: nested
category: compilation
scope: vllm
source_file:
- vllm/compilation/decorators.py:276
- vllm/compilation/decorators.py:615
- vllm/compilation/backends.py:1036
- vllm/compilation/backends.py:1057
- vllm/compilation/caching.py:387
value_type: unknown
default: <computed>
valid_choices: set of file path strings collected at runtime during Dynamo tracing
cli_example: null
deprecated: false
performance_impact: low
performance_scope:
- latency
impact_detail: 'compilation.traced_files is an internal, runtime-populated set of source file paths

  collected during torch.compile / Dynamo tracing. It is NOT a user-facing tunable.

  In vllm/compilation/decorators.py:615 the top-level forward function''s file is added,

  and a monkey-patched InliningInstructionTranslator.inline_call_ (line 625) adds every

  inlined function''s file. In decorators.py:276 _verify_source_unchanged adds files from

  inlined_sources. In backends.py:1036 the sorted set is read to build a code_hash

  (SHA-256 over file paths + file contents) that feeds the compilation cache key; the set

  is then cleared at backends.py:1057 after consumption. The only runtime cost is reading

  each traced file from disk once per compilation to compute the hash — a one-time,

  compile-time cost, not a per-token or per-step cost. It does not affect steady-state

  inference latency, throughput, or NPU memory. On Ascend, vllm-ascend does not define or

  override this parameter; it flows through the same upstream VllmBackend path. Its only

  indirect effect is cache correctness: "if a traced file changes, the code_hash changes and"

  the torch_compile_cache is invalidated, forcing recompilation (a latency hit at startup,

  not at inference).

  '
usage_locations:
- file: vllm/compilation/decorators.py:615
  context: Adds the top-level forward function's source file to traced_files during Dynamo tracing.
- file: vllm/compilation/decorators.py:625
  context: Patched inline_call_ adds every inlined function's file to traced_files.
- file: vllm/compilation/decorators.py:276
  context: _verify_source_unchanged adds inlined source files to traced_files.
- file: vllm/compilation/backends.py:1036
  context: Reads sorted traced_files to build code_hash for the compilation cache key.
- file: vllm/compilation/backends.py:1057
  context: Clears traced_files after consumption.
- file: vllm/compilation/caching.py:387
  context: finalize_loading relies on traced_files being populated for cache dir computation.
related_parameters:
- name: compilation.cache_dir
  relation: traced_files feeds the code_hash used to derive the default cache_dir when cache_dir is not set.
- name: compilation.level
  relation: Tracing (and thus traced_files population) only occurs when compilation is enabled.
- name: enforce_eager
  relation: When enforce_eager is true, no compilation/tracing occurs and traced_files stays empty.
constraints:
- traced_files is populated automatically during Dynamo tracing; it is not intended to be set manually by users.
- Files listed as '<string>' (dynamically generated via exec) are skipped and cannot be hashed.
- Files that cannot be read (OSError/UnicodeDecodeError) are skipped with a warning and excluded from the code hash.
- The set is cleared after the backend consumes it, so it must be repopulated on each compilation.
tuning_advice:
  summary: Do not tune this internal set; control compilation cost via compilation.level, cache_dir, and enforce_eager instead.
  suggested_values:
  - scenario: Default operation — leave traced_files to be auto-populated
    value: <computed>
    reason: The set is filled automatically during Dynamo tracing and consumed to build the compilation cache key; manual
      intervention is unnecessary and unsupported.
  - scenario: Want to avoid recompilation latency from source changes
    value: <computed>
    reason: Keep model/plugin source files stable and set a persistent compilation.cache_dir so the code_hash-based cache
      is reused across runs.
  caveats:
  - Manually editing traced_files does not improve inference performance; it only affects cache-key computation.
  - On Ascend, ensure the torch_compile_cache directory (under VLLM_CACHE_ROOT) is writable and persistent to benefit from
    caching.
  quick_guide: Internal auto-managed set — ignore it; tune compilation.level and compilation.cache_dir instead.
analysis_date: '2026-10-27'
