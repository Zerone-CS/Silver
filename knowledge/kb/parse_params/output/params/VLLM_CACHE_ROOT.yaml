name: VLLM_CACHE_ROOT
type: env
category: compilation
scope: vllm
source_file:
- vllm/envs.py:695
- vllm/envs.py:34
- vllm/compilation/backends.py:1068
- vllm/compilation/decorators.py:530
- vllm/compilation/caching.py:482
- vllm/v1/worker/startup_plan.py:11
- vllm/distributed/device_communicators/all_reduce_utils.py:370
value_type: str
default: ~/.cache/vllm (or $XDG_CACHE_HOME/vllm if XDG_CACHE_HOME is set)
valid_choices: any writable filesystem path
cli_example: null
deprecated: false
performance_impact: medium
performance_scope:
- latency
impact_detail: "VLLM_CACHE_ROOT is the root directory for vLLM's regenerable derived state. It does not\naffect per-token\
  \ compute, but it directly controls whether expensive compilation artifacts\ncan be reused across engine boots, which dominates\
  \ cold-start latency.\n\nKey consumers (all upstream vllm, no vllm-ascend override found):\n- \"vllm/compilation/backends.py:1068\
  \ — when compilation_config.cache_dir is not set, the\"\n  torch.compile cache directory is built as\n  os.path.join(envs.VLLM_CACHE_ROOT,\
  \ \"torch_compile_cache\", hash_key). If this path is\n  writable and persistent, subsequent boots with the same env/config/code/compiler\
  \ hash\n  reuse the compiled graph and skip recompilation; if it is on a fresh/ephemeral path,\n  every boot pays full torch.compile\
  \ cost.\n- \"vllm/compilation/decorators.py:530 — AOT compile artifacts are stored under\"\n  VLLM_CACHE_ROOT/torch_compile_cache/torch_aot_compile/{hash}\
  \ when VLLM_USE_AOT_COMPILE\n  is enabled, again enabling cross-boot reuse.\n- \"vllm/compilation/caching.py:482 — a dummy_cache\
  \ dir under VLLM_CACHE_ROOT is created\"\n  for standalone-compile artifact loading.\n- \"vllm/v1/worker/startup_plan.py:11,80\
  \ — when VLLM_ENABLE_STARTUP_PLAN=1, the memory\"\n  profiling result (the --kv-cache-memory value) is persisted under\n\
  \  {VLLM_CACHE_ROOT}/startup_plan/ keyed by a fingerprint, letting later boots skip the\n  memory-profiling measurement\
  \ and CUDA-graph memory estimation pass.\n- \"vllm/distributed/device_communicators/all_reduce_utils.py:370 — the GPU P2P\
  \ access\"\n  cache file is written under VLLM_CACHE_ROOT; on Ascend this path is largely irrelevant\n  since HCCL handles\
  \ inter-device communication, but the directory is still created.\n\nOn Ascend NPU, the torch.compile cache is the main\
  \ lever: vllm-ascend relies on\ntorch.compile / graph compilation for many models, so pointing VLLM_CACHE_ROOT at a\npersistent,\
  \ fast local filesystem (e.g. a node-local SSD rather than a network mount or\na container tmpfs that is wiped on restart)\
  \ reduces cold-start latency substantially.\nIt has no effect on steady-state throughput or NPU memory usage.\n"
usage_locations:
- file: vllm/envs.py:695
  context: Defines VLLM_CACHE_ROOT, defaulting to get_default_cache_root()/vllm, user-expanded.
- file: vllm/compilation/backends.py:1068
  context: Builds torch_compile_cache/<hash> path under VLLM_CACHE_ROOT for compiled graph reuse.
- file: vllm/compilation/decorators.py:530
  context: Stores AOT compile artifacts under VLLM_CACHE_ROOT/torch_compile_cache/torch_aot_compile/{hash}.
- file: vllm/compilation/caching.py:482
  context: Creates dummy_cache dir under VLLM_CACHE_ROOT for standalone compile artifact loading.
- file: vllm/v1/worker/startup_plan.py:80
  context: Persists startup memory-profiling plan under VLLM_CACHE_ROOT/startup_plan/ when VLLM_ENABLE_STARTUP_PLAN=1.
- file: vllm/distributed/device_communicators/all_reduce_utils.py:370
  context: Writes GPU P2P access cache JSON under VLLM_CACHE_ROOT (not meaningful on Ascend/HCCL).
- file: vllm/benchmarks/startup.py:119
  context: Cold-startup benchmark overrides VLLM_CACHE_ROOT to a temp dir to force recompilation.
related_parameters:
- name: VLLM_CONFIG_ROOT
  relation: Sibling env var for config files; VLLM_CACHE_ROOT is for regenerable cache state.
- name: VLLM_ENABLE_STARTUP_PLAN
  relation: When enabled, persists memory-profiling plan under VLLM_CACHE_ROOT/startup_plan/.
- name: VLLM_USE_AOT_COMPILE
  relation: When enabled, AOT compile artifacts are cached under VLLM_CACHE_ROOT.
- name: VLLM_DISABLE_COMPILE_CACHE
  relation: Disables reuse of the torch.compile cache stored under VLLM_CACHE_ROOT.
- name: compilation_config.cache_dir
  relation: If explicitly set, overrides the VLLM_CACHE_ROOT-derived torch_compile_cache path.
- name: XDG_CACHE_HOME
  relation: Determines the default cache root when VLLM_CACHE_ROOT is unset.
constraints:
- The path must be writable by the vLLM process; otherwise cache directory creation (os.makedirs) fails and compilation caching
  cannot proceed.
- If compilation_config.cache_dir is explicitly set, it takes precedence and VLLM_CACHE_ROOT is not used for the torch.compile
  cache.
- The startup-plan reuse only applies when VLLM_ENABLE_STARTUP_PLAN=1 and the fingerprint matches and the device has at least
  as much free memory as when the plan was recorded.
tuning_advice:
  summary: Point VLLM_CACHE_ROOT at a persistent, fast node-local filesystem so torch.compile and startup-plan artifacts survive
    restarts and cut cold-start latency on Ascend NPU.
  suggested_values:
  - scenario: Production serving with repeated restarts on the same node
    value: /var/cache/vllm
    reason: A persistent local path lets the torch_compile_cache and startup_plan artifacts be reused across boots, skipping
      recompilation and memory profiling.
  - scenario: Containerized deployment
    value: /mnt/local-ssd/vllm-cache
    reason: Mount a host-backed local SSD volume here instead of container tmpfs so the cache survives container recreation.
  - scenario: Benchmarking cold-start latency
    value: <temporary empty directory>
    reason: vllm/benchmarks/startup.py sets VLLM_CACHE_ROOT to a fresh temp dir to force full recompilation and measure true
      cold start.
  caveats:
  - Placing VLLM_CACHE_ROOT on a slow network filesystem can make compilation cache reads/writes slower than recompiling locally.
  - A stale or corrupted cache directory can cause compile-cache errors; clear it when upgrading vLLM/vllm-ascend or CANN
    versions.
  - The GPU P2P access cache written under this root is not meaningful on Ascend since inter-device communication uses HCCL.
  - VLLM_CACHE_ROOT does not affect steady-state throughput or NPU memory usage; its benefit is cold-start latency only.
  quick_guide: Set VLLM_CACHE_ROOT to a persistent local SSD path to reuse torch.compile artifacts across restarts.
analysis_date: '2026-10-27'
