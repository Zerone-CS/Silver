related_parameters:
- name: RANK
  relation: Global rank; LOCAL_RANK is the per-node device index, RANK is the global process index
- name: WORLD_SIZE
  relation: LOCAL_RANK must be < local world size; WORLD_SIZE defines total ranks
- name: CUDA_VISIBLE_DEVICES
  relation: Both are worker-specific env vars excluded from Ray propagation; on Ascend the analog is ASCEND_RT_VISIBLE_DEVICES
- name: VLLM_DISTRIBUTED_USE_SPLIT_GROUP
  relation: When enabled, LOCAL_RANK is read early to compute device_id for split-group init
- name: ASCEND_RT_VISIBLE_DEVICES
  relation: Ascend device visibility; LOCAL_RANK indexes into the visible device list
constraints:
- LOCAL_RANK must be a non-negative integer; it is parsed with int() and a non-numeric value raises ValueError at startup.
- LOCAL_RANK must be less than the number of visible NPU devices on the node, otherwise device binding fails.
- When using the env:// distributed init method, LOCAL_RANK must be set (along with RANK, MASTER_ADDR, MASTER_PORT) or the
  process group initialization cannot determine the device.
- LOCAL_RANK is worker-specific and is not propagated from the driver to Ray workers; each Ray worker must set its own LOCAL_RANK.
tuning_advice:
  summary: Do not tune LOCAL_RANK manually — let torchrun/launcher assign it per process so each rank binds to a distinct
    NPU.
  suggested_values:
  - scenario: Single-node multi-NPU launched via torchrun
    value: <assigned by torchrun per process>
    reason: torchrun sets LOCAL_RANK to the per-node process index, ensuring each rank binds to a distinct NPU and HCCL initializes
      correctly.
  - scenario: Manual multi-process launch (offline examples)
    value: 0..local_world_size-1
    reason: vllm-ascend examples set os.environ['LOCAL_RANK'] to the per-node rank before init_process_group with npu:hccl;
      each process must get a unique value.
  - scenario: Ray distributed executor
    value: <set per worker after device discovery>
    reason: LOCAL_RANK is in WORKER_SPECIFIC_ENV_VARS and is not copied from the driver; each Ray worker must set its own
      value.
  caveats:
  - Never hardcode LOCAL_RANK=0 for all ranks in a multi-NPU run — this causes device contention and HCCL init failures.
  - Verify LOCAL_RANK stays within the range of ASCEND_RT_VISIBLE_DEVICES on each node.
  - For AscendStore KV transfer, confirm LOCAL_RANK is consistent with the actual device binding to avoid KV block mis-addressing.
  quick_guide: Let torchrun/launcher set LOCAL_RANK automatically; ensure it is unique per process and within visible NPU
    count.
