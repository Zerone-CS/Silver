impact_detail: "LOCAL_RANK is the per-process local device index within a node. It is read via\nenvs.LOCAL_RANK (vllm/envs.py:789,\
  \ default \"0\") and is used to bind the process to a\nphysical NPU device and to compute the device id for the distributed\
  \ process group.\n\nUpstream vLLM usage:\n- \"vllm/distributed/parallel_state.py:1903 — when local_rank == -1 (not passed\
  \ explicitly),\"\n  local_rank falls back to envs.LOCAL_RANK if distributed_init_method == \"env://\", else to\n  rank.\
  \ This local_rank is then used to build the world group (init_world_group) and to\n  determine device_id for the process\
  \ group. A wrong value here binds the process to the\n  wrong device, causing either a crash or (worse) two ranks sharing\
  \ one device — which\n  serializes execution and destroys throughput.\n- \"vllm/distributed/parallel_state.py:1859 — with\
  \ VLLM_DISTRIBUTED_USE_SPLIT_GROUP, local_rank\"\n  is needed early to compute device_id for eager init of the split group.\n\
  - \"vllm/v1/executor/uniproc_executor.py:191 — in torchrun-compatible launchers, LOCAL_RANK\"\n  is a required env var for\
  \ the env:// init method.\n- \"vllm/v1/executor/ray_utils.py:37 — LOCAL_RANK is in WORKER_SPECIFIC_ENV_VARS, so it is NOT\"\
  \n  copied from driver to Ray workers; each worker sets its own after device discovery.\n- \"vllm/v1/worker/gpu_worker.py:381\
  \ — local_rank is adjusted by DP_LOCAL_RANK * TP_PP_WORLD_SIZE\"\n  + TP_LOCAL_RANK for the mp backend, then used to select\
  \ the device.\n\nvllm-ascend usage:\n- \"vllm_ascend/distributed/kv_transfer/kv_pool/ascend_store/pool_worker.py:175 — the\
  \ AscendStore\"\n  KV connector reads envs.LOCAL_RANK into self.local_rank during _init_parallelism_info. This\n  value\
  \ participates in KV-transfer key/rank addressing (combined with tp_rank, pp_rank,\n  pcp_rank, dcp_rank to form kvpp_rank).\
  \ An incorrect LOCAL_RANK here mis-addresses KV cache\n  blocks across ranks, which can cause incorrect KV reuse or extra\
  \ cross-rank traffic — a\n  correctness and performance hazard for disaggregated prefill/decode on Ascend.\n- \"Ascend examples\
  \ (examples/offline_external_launcher.py:152, examples/offline_weight_load.py:156)\"\n  set os.environ[\"LOCAL_RANK\"] before\
  \ torch.distributed.init_process_group with backend\n  \"cpu:gloo,npu:hccl\", confirming LOCAL_RANK drives NPU device binding\
  \ for HCCL init.\n\nNet effect: \"LOCAL_RANK itself does not tune any kernel or scheduling knob. Its performance\"\nrelevance\
  \ is indirect — it determines device affinity and HCCL rank-to-device mapping. Correct\nvalues are required for the expected\
  \ throughput; wrong values cause device contention\n(multiple ranks on one NPU) or HCCL init failures. Hence impact is low\
  \ (indirect, correctness-\ngated) rather than a tunable performance lever.\n"
