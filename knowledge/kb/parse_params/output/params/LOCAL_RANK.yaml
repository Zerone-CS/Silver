- vllm/v1/worker/gpu_worker.py:381
- vllm_ascend/distributed/kv_transfer/kv_pool/ascend_store/pool_worker.py:175
value_type: int
default: 0
valid_choices: non-negative integer in range [0, local_world_size-1]; typically set by torchrun/launcher
