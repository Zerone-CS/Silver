impact_detail: 'This flag is defined upstream in vllm/config/multimodal.py (MultiModalConfig.language_model_only)

  and plumbed through EngineArgs -> VllmConfig -> ModelConfig. Its runtime effect is implemented in

  MultiModalConfig.get_limit_per_prompt() (vllm/config/multimodal.py:483): when language_model_only

  is True, the method returns 0 for every modality regardless of --limit-mm-per-prompt. A per-modality

  limit of 0 causes the multimodal registry/budget to skip loading the vision/audio encoder modules

  and skip multimodal memory profiling, so the encoder weights never occupy NPU HBM and the encoder

  forward pass is never executed. On Ascend this is a large memory win: the vllm-ascend Dots3-Note

  doc quantifies the image form as ~48.8 GB per worker vs 36.26 GB for text-only (+12.5 GB of encoder

  weights), and the audio form as +1.62 GB. Freeing that HBM lets the KV cache grow (the doc''s

  text-only profile uses --gpu-memory-utilization 0.92 with 32768 context and MTP3 enabled, whereas

  the image form must cap KV with --kv-cache-memory-bytes and cannot use MTP). It also removes the

  encoder prefill latency from the critical path, so TTFT for text prompts drops. Additionally,

  vllm/config/model.py:477 folds language_model_only into the model config hash because for models

  like Qwen3-VL the MM code path changes the language-model computation graph; on Ascend this means

  the flag changes which graph is compiled/captured (ACL graph / torch.compile), so it must be fixed

  at startup and cannot be toggled per request. vllm/config/vllm.py:1314 raises if it is combined with

  cudagraph_mm_encoder=True, and vllm/lora/model_manager.py:233 disables tower-connector LoRA when it

  is set. vllm-ascend does not override the flag itself; it consumes it through the upstream config

  and exercises it in e2e tests (test_vlm.py, test_minimax_m3.py, test_qwen3_6_27b_fia.py).

  '
