related_parameters:
- name: --limit-mm-per-prompt
  relation: 'Overridden: when --language-model-only is set, all per-modality limits are forced to 0 regardless of this value.'
- name: --gpu-memory-utilization
  relation: Freeing encoder HBM allows a higher KV cache budget; the Dots3-Note doc pairs text-only with 0.92.
- name: --kv-cache-memory-bytes
  relation: Alternative KV cap used by the image/audio forms; text-only can rely on gpu-memory-utilization instead.
- name: compilation_config.cudagraph_mm_encoder
  relation: 'Mutually exclusive: setting both raises ValueError.'
- name: --enable-tower-connector-lora
  relation: Silently disabled (with warning) when --language-model-only is set.
- name: --speculative-config
  relation: Dots3-Note doc enables MTP3 for text-only/audio but not for the image form, so text-only frees memory for speculation.
- name: --skip-mm-profiling
  relation: Related MM memory-profiling control; language_model_only already removes MM profiling work.
constraints:
- --language-model-only cannot be combined with compilation_config.cudagraph_mm_encoder=True; vLLM raises a ValueError because
  the multimodal encoder is never run.
- The modality form (text-only vs image vs audio) cannot be switched dynamically within the same process; the service must
  be restarted when switching, per the vllm-ascend Dots3-Note doc.
- When --language-model-only is set, any --limit-mm-per-prompt values are ignored and treated as 0 for every modality.
- Enabling --language-model-only disables tower-connector LoRA (enable_tower_connector_lora) with a warning.
tuning_advice:
  summary: Enable --language-model-only whenever you only serve text on a multimodal checkpoint; it drops encoder weights
    from HBM and lets you raise KV cache / enable MTP.
  suggested_values:
  - scenario: Text-only serving of a multimodal checkpoint (e.g. Dots3-Note, Qwen3-VL) on Ascend
    value: true
    reason: Skips loading vision/audio encoders, freeing ~12.5 GB per worker for Dots3-Note and allowing --gpu-memory-utilization
      0.92 with 32768 context plus MTP3.
  - scenario: Serving image or audio inputs
    value: false
    reason: Encoders must be loaded; instead use --limit-mm-per-prompt to enable only the required modality and cap KV with
      --kv-cache-memory-bytes.
  - scenario: Basic pipeline validation on a new Ascend deployment
    value: true
    reason: Dots3-Note doc recommends starting text-only first to validate the basic pipeline before switching to image/audio
      forms.
  caveats:
  - Do not combine with compilation_config.cudagraph_mm_encoder=True; it raises ValueError.
  - The modality form is fixed per process; restart the service to switch between text-only and image/audio.
  - Tower-connector LoRA is silently disabled when this flag is set.
  - Changing the flag invalidates the model config hash and forces graph recompilation.
  quick_guide: Set --language-model-only for text-only workloads on multimodal checkpoints to reclaim encoder HBM and enable
    larger KV cache or MTP.
