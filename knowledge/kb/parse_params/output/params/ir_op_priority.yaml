name: --ir-op-priority
type: cli
category: compilation
scope: both
source_file:
- vllm/engine/arg_utils.py:1670
- vllm/engine/arg_utils.py:468
- vllm/engine/arg_utils.py:827
- vllm/config/kernel.py:230
- vllm/config/kernel.py:367
- vllm/config/vllm.py:161
- vllm/config/vllm.py:234
- vllm/v1/worker/worker_base.py:98
- vllm/platforms/cuda.py:742
- vllm/kernels/oink_ops.py:8
- tests/ut/worker/test_worker_v1.py:55
value_type: dict
default: <computed>
valid_choices: IrOpPriorityConfig mapping op-name -> ordered list of backend names (e.g. 'native', 'vllm_c', 'oink', 'aiter');
  platform defaults appended during VllmConfig.__post_init__
cli_example: '--ir-op-priority ''{"rms_norm": ["native"]}'''
deprecated: false
performance_impact: low
performance_scope:
- latency
- throughput
impact_detail: '--ir-op-priority populates KernelConfig.ir_op_priority (an IrOpPriorityConfig),

  which selects which implementation backend is dispatched for each vLLM IR op

  (e.g. rms_norm, fused_add_rms_norm, quant_fp8) during the forward pass.

  In upstream vLLM the actual default is computed per-platform by

  Platform.get_default_ir_op_priority() (vllm/platforms/cuda.py:742): when using

  Inductor codegen the default is ["native"], otherwise ["vllm_c", "native"],

  and "oink" is prepended for rms_norm when VLLM_USE_OINK_OPS is set. These

  defaults are appended during VllmConfig.__post_init__ and then frozen per

  worker via vllm_config.kernel_config.ir_op_priority.set_default() in

  vllm/v1/worker/worker_base.py:98 (comment: "IR op priority and torch-wrap

  state are constant for the worker''s lifetime").

  The value also feeds compilation decisions: "enable_norm_fusion()"

  (vllm/config/vllm.py:161) returns True if ir_op_priority.rms_norm[0] != "native",

  and enable_norm_pad_fusion() (vllm/config/vllm.py:234) checks

  fused_add_rms_norm[0] == "aiter". It is part of KernelConfig.compute_hash()

  (vllm/config/kernel.py:367-372), so changing it invalidates the compilation

  cache and forces recompilation/warmup.

  On Ascend: "the CUDA-specific backends (\"vllm_c\", \"oink\", \"aiter\") are not"

  available; vllm-ascend does not define its own get_default_ir_op_priority

  override in the provided context, and the only Ascend reference is a unit-test

  mock (tests/ut/worker/test_worker_v1.py:55) that stubs

  kernel_config.ir_op_priority.set_default. Consequently on NPU the effective

  behavior is the generic "native" path, and the parameter has little to no

  measurable runtime effect on Ascend — it mainly influences whether

  norm-fusion compilation passes are enabled and whether the compile cache is

  invalidated. Hence low impact.

  '
