related_parameters:
- name: --compilation-config / compilation_config.backend
  relation: Upstream default priority depends on whether Inductor codegen is used (backend == 'inductor' and mode != NONE).
- name: --compilation-config / compilation_config.mode
  relation: CompilationMode.NONE disables Inductor, changing the default op priority to ['vllm_c', 'native'].
- name: VLLM_USE_OINK_OPS
  relation: Env var that prepends 'oink' to the rms_norm priority list upstream (CUDA-only).
- name: --kernel-config
  relation: Parent config object; ir_op_priority is a field of KernelConfig.
- name: compilation_config.ir_enable_torch_wrap
  relation: Set alongside ir_op_priority.set_default() in worker init; both are fixed for worker lifetime.
constraints:
- The value must be a mapping from IR op name to an ordered list of backend names; a dict passed on the CLI is converted to
  IrOpPriorityConfig.
- The priority is frozen at worker initialization via set_default() and cannot be changed after the worker starts.
- Backends such as 'vllm_c', 'oink', and 'aiter' are CUDA-specific and are not available on Ascend NPU.
- Changing this value changes KernelConfig.compute_hash() and therefore invalidates the compilation cache, forcing recompilation.
tuning_advice:
  summary: Leave --ir-op-priority at its platform default on Ascend; only touch it if you are deliberately enabling/disabling
    a specific IR op backend for compilation experiments.
  suggested_values:
  - scenario: Default Ascend NPU deployment (v1 or v2 worker)
    value: <unset> (use platform default)
    reason: CUDA-specific backends are unavailable on NPU; the generic 'native' path is used and the parameter has negligible
      runtime effect.
  - scenario: Experimenting with norm-fusion compilation passes on NPU
    value: '{"rms_norm": ["native"]}'
    reason: Keeping rms_norm[0] == 'native' avoids enabling the CUDA-oriented norm-fusion pass; change only after benchmarking.
  caveats:
  - Do not set 'vllm_c', 'oink', or 'aiter' on Ascend — these backends are CUDA-only and will not resolve.
  - Any change invalidates the compile cache and increases warmup time; benchmark end-to-end before adopting.
  quick_guide: On Ascend, leave --ir-op-priority unset; it mainly affects compilation passes and cache keys, not NPU runtime
    throughput.
analysis_date: '2026-10-27'
