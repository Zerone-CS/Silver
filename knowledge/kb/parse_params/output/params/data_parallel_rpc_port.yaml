related_parameters:
- name: --data-parallel-address
  relation: The RPC port is combined with the DP master address to form the handshake endpoint; both must be consistent across
    nodes
- name: --data-parallel-size
  relation: DP must be enabled (data_parallel_size > 1) for this port to be used; with a single DP rank the local IPC transport
    is used instead
- name: --data-parallel-backend
  relation: Affects how the DP address is derived (ray vs mp) but the RPC port is used in both cases for the handshake socket
- name: --headless
  relation: In headless mode the port is used directly to build the TCP handshake URI for non-master nodes
constraints:
- The value must be an integer between 1 and 65535 (Field(ge=1, le=65535) in ParallelConfig).
- All nodes in a multi-node data-parallel deployment must use the same --data-parallel-rpc-port value.
- The port is only used when there are remote data parallel engines; with purely local DP the local IPC transport is used
  instead.
tuning_advice:
  summary: Pick a fixed, firewall-open port identical on all DP nodes; leave at default 29550 unless it conflicts with another
    service.
  suggested_values:
  - scenario: Single DP cluster with no port conflicts (default)
    value: 29550
    reason: Upstream default; works out of the box and is validated by tests (test_data_parallel_rpc_port_has_fixed_default).
  - scenario: Multiple DP clusters or other services occupying 29550 on the same host
    value: 62300
    reason: Example value used in upstream multi_instance_data_parallel.py; choose any free port in [1, 65535] and set it
      identically on all nodes.
  - scenario: Multi-node DP deployment (e.g. DeepSeek-R1/V3.1 across 2 nodes)
    value: 29550
    reason: Docs require the same RPC port on all nodes; keep it consistent with --data-parallel-address and ensure the port
      is open between nodes.
  caveats:
  - Verify the chosen port is not already bound and is allowed through any firewall between DP nodes before launching.
  - Changing this value does not improve throughput; only adjust it to resolve port conflicts.
  quick_guide: Set the same free TCP port (default 29550) on every DP node; it only affects DP handshake/startup, not runtime
    throughput.
analysis_date: '2026-10-27'
