name: --data-parallel-rpc-port
type: cli
category: communication
scope: both
source_file:
- vllm/engine/arg_utils.py:1157
- vllm/engine/arg_utils.py:501
- vllm/engine/arg_utils.py:2332
- vllm/config/parallel.py:143
- vllm/v1/engine/utils.py:1205
- vllm/entrypoints/cli/serve.py:233
value_type: int
default: 29550
valid_choices: integer in range [1, 65535]
cli_example: --data-parallel-rpc-port 29550
deprecated: false
performance_impact: low
performance_scope:
- latency
impact_detail: 'This parameter sets the fixed TCP port used for the ZeroMQ ROUTER handshake socket

  between the data-parallel front-end and the DP engine processes. In vLLM v1

  (vllm/v1/engine/utils.py:1205) the value is passed to get_engine_client_zmq_addr()

  to build the handshake address; in headless mode (vllm/entrypoints/cli/serve.py:233)

  it is combined with data_parallel_master_ip into a TCP URI for CoreEngineProcManager.

  The port itself does not affect steady-state token throughput or NPU compute — it is

  only used during engine startup/handshake and for the DP coordination channel. Its

  performance relevance is therefore limited to startup latency and to whether the DP

  cluster can establish its control plane at all. If the port is already occupied or

  blocked by a firewall, DP ranks fail to handshake and the whole deployment stalls or

  errors out, which manifests as a startup failure rather than a throughput regression.

  Note that data_parallel_rpc_port is explicitly listed in the ignored_factors set of

  the DP config hash (vllm/config/parallel.py:841), meaning it does not participate in

  DP worker configuration validation — changing it does not alter collective

  communication semantics. No vllm-ascend-specific override of this parameter was found

  in the provided context; the vllm-ascend docs (DeepSeek-R1.md, DeepSeek-V3.1.md) only

  restate the upstream requirement that the port must be identical across all nodes.

  '
usage_locations:
