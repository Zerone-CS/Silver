name: VLLM_KIMI_K3_GEMM_RS
type: env
category: communication
scope: vllm
source_file:
- vllm/envs.py:1604
- vllm/envs.py:214
- vllm/models/kimi_k3/nvidia/model.py:163
value_type: bool
default: false
valid_choices: 0 or 1 (parsed via bool(int(...)))
cli_example: null
deprecated: false
performance_impact: low
performance_scope:
- latency
- throughput
impact_detail: 'This flag is defined only in upstream vLLM (vllm/envs.py:1604) and gates the

  SM100 BF16 GEMM-RS fused kernel for Kimi-K3 sequence-parallel row-parallel

  projections. It is consumed in vllm/models/kimi_k3/nvidia/model.py:163 inside

  maybe_init_gemm_rs_ar(), where it is selected only when use_sequence_parallel

  is true (otherwise VLLM_KIMI_K3_GEMM_AR is used). Even when enabled, the

  function performs a hard platform gate: "it returns False with a warning if"

  ubatching is enabled, the model dtype is not BF16, the device is not CUDA,

  the device is not SM100-family, TP size is not in 2-16, or TP size does not

  divide 128. On Ascend NPU, current_platform.is_cuda() is False and the device

  is not SM100-family, so the kernel is never initialized and the flag has no

  runtime effect. No reference to VLLM_KIMI_K3_GEMM_RS exists in vllm-ascend,

  and there is no Ascend override or monkey-patch. The mechanism it would

  otherwise affect (fusing GEMM with reduce-scatter to cut one collective per

  layer) is CUDA/NVLink-specific and has no Ascend equivalent in the provided

  context.

  '
usage_locations:
- file: vllm/envs.py:1604
  context: Environment variable definition with default 0 (disabled).
- file: vllm/envs.py:214
  context: Type annotation in the environment variable dataclass (bool = False).
- file: vllm/models/kimi_k3/nvidia/model.py:163
  context: Selects GEMM-RS vs GEMM-AR kernel based on use_sequence_parallel; gated by CUDA/SM100/BF16/TP checks.
related_parameters:
- name: VLLM_KIMI_K3_GEMM_AR
  relation: Mutually exclusive sibling flag; GEMM-AR is used when sequence parallel is off, GEMM-RS when on.
- name: VLLM_KIMI_K3_SHARD_SP_SHARED_EXPERT
  relation: Both relate to Kimi-K3 sequence-parallel MoE/MLP sharding strategy.
constraints:
- The GEMM-RS kernel is only initialized when the device is CUDA and SM100-family, so it is never active on Ascend NPU.
- The model dtype must be BF16 for the kernel to be enabled.
- Tensor parallel size must be greater than 1 and at most 16, and must divide 128.
- The kernel is disabled when ubatching is enabled.
- All TP ranks must belong to one NVLink domain for the kernel to be valid.
tuning_advice:
  summary: Leave at default (0) on Ascend NPU; it has no effect because the kernel requires CUDA SM100 hardware.
  suggested_values:
  - scenario: Any Ascend NPU deployment (v1 or v2 worker)
    value: 0
    reason: The GEMM-RS kernel is gated on CUDA/SM100 and is never initialized on Ascend, so enabling it changes nothing.
  caveats:
  - Do not expect any latency or throughput gain from this flag on Ascend; the relevant collective fusion is NVLink-specific.
  quick_guide: Ignore this flag on Ascend — it is a CUDA-only Kimi-K3 optimization with no NPU effect.
analysis_date: '2026-10-27'
