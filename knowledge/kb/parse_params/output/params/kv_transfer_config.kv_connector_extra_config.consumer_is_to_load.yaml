cli_example: null
deprecated: false
performance_impact: medium
performance_scope:
- latency
- throughput
impact_detail: 'This is a nested field inside kv_transfer_config.kv_connector_extra_config consumed by the

  AscendStoreConnector (KV Cache Pool / Ascend Store) path in vllm-ascend. Per the docs, it

  controls whether the Decode node loads KV Cache from the KV Pool. When enabled, the Decode

  worker issues pool lookups/loads for cached prefixes instead of recomputing them, which can

  reduce prefill-equivalent computation and lower time-to-first-token for repeated prefixes.

  When disabled (default false), the Decode node does not load from the pool, so no pool-load

  latency is incurred and no pool memory is contributed by the Decode side. The parameter

  therefore trades pool-load latency and pool memory footprint against avoided recomputation.

  In the documented GLM5.3-Flash PD-disaggregated topology, Decode receives KV through the

  P->D connector (MooncakeConnectorV2) and keeps consumer_is_to_load/consumer_is_to_put

  disabled, contributing no pool memory; enabling it on Decode would only be meaningful when

  the pool layout matches the Decode TP layout (docs note TP8 pool entries are not loaded

  directly into TP1 Decode engines).

  '
