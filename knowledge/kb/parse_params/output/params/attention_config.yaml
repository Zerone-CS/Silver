name: --attention-config
type: cli
category: model
scope: both
source_file:
- vllm/engine/arg_utils.py:1726
- vllm/engine/arg_utils.py:702
- vllm/engine/arg_utils.py:801
- vllm/engine/arg_utils.py:2493
