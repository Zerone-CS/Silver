- vllm_ascend/worker/v2/attn_utils.py:199
- vllm_ascend/attention/indexer.py:198
- vllm_ascend/models/deepseek_v4/indexer.py:110
value_type: dict
default: '{}'
valid_choices: JSON object of AttentionConfig fields (e.g. backend, flash_attn_version, flash_attn_max_num_splits_for_cuda_graph,
  indexer_kv_dtype); on Ascend the practically relevant field is indexer_kv_dtype in {auto, fp8, int8, mxfp4}
cli_example: '--attention-config ''{"indexer_kv_dtype": "int8"}'''
deprecated: false
performance_impact: high
performance_scope:
- throughput
- memory
- latency
impact_detail: "--attention-config is a JSON-serialized AttentionConfig (parsed in EngineArgs.__post_init__ at\nvllm/engine/arg_utils.py:801).\
  \ On Ascend, the field that actually changes runtime behavior is\nattention_config.indexer_kv_dtype, which selects the dtype\
  \ of the sparse-attention indexer K cache\n(Lightning Indexer / SFA / DeepSeek-V4 indexer). It is read in several hot paths:\n\
  - \"vllm_ascend/ascend_config.py:921-924 derives enable_sparse_li_c8 (indexer_kv_dtype in {fp8,int8})\"\n  and enable_sparse_li_c4\
  \ (indexer_kv_dtype == mxfp4), and raises if both are set. These flags gate\n  the C8/C4 compressed indexer cache path and\
  \ the c8_reshape_optim prefill optimization\n  (ascend_config.py:933).\n- \"vllm_ascend/platform.py:511 asserts the hardware\
  \ supports FP8_ATTENTION when indexer_kv_dtype is\"\n  fp8, so the choice is hardware-gated.\n- \"v1 worker (vllm_ascend/worker/model_runner_v1.py:467-481)\
  \ and v2 worker\"\n  (vllm_ascend/worker/v2/attn_utils.py:199-209) both branch on indexer_kv_dtype to pick the indexer\n\
  \  K cache dtype (float8_e4m3fn -> fp32 scales, int8 -> fp16 scales) and to build the KV cache spec.\n- \"vllm_ascend/attention/indexer.py:195-209\
  \ selects the C8/C4 indexer kernel path per layer.\"\n- \"vllm_ascend/models/deepseek_v4/indexer.py:110 resolves \\\"auto\\\
  \" to the platform default (fp8 on\"\n  A5/compressed-cache-capable hardware, int8 otherwise) and rejects unsupported combinations.\n\
  Mechanism: \"quantizing the indexer K cache to int8/fp8 (C8) or mxfp4 (C4) shrinks indexer cache\"\nmemory footprint and\
  \ enables the fused quantized lightning-indexer kernels\n(npu_fused_quant_lightning_indexer_manage), which reduces memory\
  \ bandwidth and improves sparse\nattention throughput. The upstream fields (backend, flash_attn_version,\nflash_attn_max_num_splits_for_cuda_graph)\
  \ are CUDA/FlashAttention-specific and have no effect on\nAscend NPU attention backends.\n"
