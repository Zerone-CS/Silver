related_parameters:
- name: --kv-cache-dtype
  relation: Controls main KV cache dtype (C8 for SFA); indexer_kv_dtype controls the separate indexer cache dtype. Both feed
    the sparse C8 path.
- name: --attention-backend
  relation: Mutually exclusive with attention_config.backend (upstream raises ValueError if both set).
- name: --speculative-config
  relation: num_speculative_tokens affects Q_max and topk_buffer_size requirements for the fused sparse indexer path.
- name: --additional-config
  relation: AscendConfig strips derived fields (enable_sparse_li_c4 etc.) that are selected by attention_config.indexer_kv_dtype.
constraints:
- attention_config.backend and --attention-backend are mutually exclusive; setting both raises a ValueError.
- enable_sparse_li_c8 (indexer_kv_dtype in fp8/int8) and enable_sparse_li_c4 (indexer_kv_dtype == mxfp4) are mutually exclusive
  and raise a ValueError if both are enabled.
- When indexer_kv_dtype is fp8, the hardware must support FP8_ATTENTION or an assertion fails during platform config validation.
- For DeepSeek-V4 indexer, indexer_kv_dtype must resolve to the platform default (fp8 on compressed-cache-capable hardware,
  int8 otherwise); other values raise a ValueError.
- The C8 LIM kernel is int8-only; indexer_kv_dtype fp8 is not a valid LIM C8 serving path.
tuning_advice:
  summary: On Ascend, use --attention-config to set indexer_kv_dtype (int8/fp8/mxfp4) for sparse-indexer models to shrink
    indexer cache and enable fused quantized lightning-indexer kernels; leave other fields at defaults.
  suggested_values:
  - scenario: Sparse-indexer model (DeepSeek-V3.2/V4, GLM) on hardware without FP8 attention support, using fused Copy-SFA
      / LIM C8
    value: '{"indexer_kv_dtype": "int8"}'
    reason: The C8 LIM kernel is int8-only; int8 enables npu_fused_quant_lightning_indexer_manage and the C8 indexer cache
      path.
  - scenario: Sparse-indexer model on A5/950PR hardware with FP8 attention support
    value: '{"indexer_kv_dtype": "fp8"}'
    reason: fp8 is the platform default on compressed-cache-capable hardware and enables the FP8 indexer cache path with per-token
      FP32 scales.
  - scenario: Ultra-low-bit (W4A4C8) DeepSeek-V4 deployment
    value: '{"indexer_kv_dtype": "mxfp4"}'
    reason: Selects the C4 indexer cache path (enable_sparse_li_c4) for MXFP4 microscaling.
  - scenario: Default / unsure of hardware capability
    value: '{}'
    reason: auto resolution picks fp8 or int8 based on hardware profile, avoiding validation errors.
  caveats:
  - Do not set both indexer_kv_dtype fp8 and mxfp4; they are mutually exclusive and raise an error.
  - Do not combine --attention-backend with attention_config.backend.
  - Upstream FlashAttention fields in this config are ignored on Ascend.
  quick_guide: 'Set --attention-config ''{"indexer_kv_dtype": "int8"}'' (or fp8 on FP8-capable hardware) for sparse-indexer
    models to enable compressed indexer cache and fused kernels.'
analysis_date: '2026-10-27'
