name: --ec-manager-config
type: cli
category: memory
scope: both
source_file:
- vllm/engine/arg_utils.py:1720
- vllm/engine/arg_utils.py:718
- vllm/engine/arg_utils.py:809
- vllm/config/vllm.py:425
- vllm/v1/core/sched/scheduler.py:250
- vllm_ascend/ec_manager/score_ec_manager.py:112
- vllm_ascend/utils.py:1020
value_type: dict
default: '{}'
valid_choices: JSON object matching EncoderCacheManagerConfig fields (encoder_cache_manager_cls, manager_config)
cli_example: '--ec-manager-config ''{"encoder_cache_manager_cls": "vllm_ascend.ec_manager.score_ec_manager.ScoreEncoderCacheManager",
  "manager_config": {"cpu_cache_slots": 100000}}'''
deprecated: false
performance_impact: medium
performance_scope:
- memory
- latency
- throughput
impact_detail: 'This parameter configures the encoder cache manager used by the vLLM V1 scheduler

  for multimodal models. In upstream vLLM, `vllm_config.ec_manager_config.get_encoder_cache_manager_obj()`

  (vllm/v1/core/sched/scheduler.py:250) selects the manager class; if None, the default

  `EncoderCacheManager` (or `EncoderDecoderCacheManager`) is used with `cache_size=encoder_cache_size`

  derived from `MultiModalBudget`. The manager caches vision/encoder embeddings keyed by mm_hash,

  avoiding recomputation of expensive encoder passes for repeated multimodal inputs.


  vllm-ascend provides an Ascend-specific implementation: `ScoreEncoderCacheManager`

  (vllm_ascend/ec_manager/score_ec_manager.py). It reads `vllm_config.ec_manager_config.manager_config`

  (line 112) to build a `ScoreEncoderCacheConfig`, which adds a two-tier cache: a CPU cache

  (`cpu_cache_slots`, default 100000) plus the NPU cache sized by `cache_size`. Newly generated

  embeddings land in CPU cache; frequently-accessed, high-score entries are promoted to NPU cache;

  low-score entries are evicted from NPU using a clock-based aging mechanism. This directly affects

  NPU memory usage (how many encoder embeddings stay resident on device), encoder recompute latency

  (cache hits avoid re-running the vision encoder), and throughput for multimodal workloads with

  repeated images. `vllm_ascend/utils.py:1020` uses `is_score_encoder_cache_manager` to branch

  behavior based on whether this manager is selected. For text-only models the parameter has no effect.

  '
usage_locations:
