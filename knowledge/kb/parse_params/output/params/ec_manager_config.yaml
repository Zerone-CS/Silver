related_parameters:
- name: --ec-transfer-config
  relation: Companion config for distributed EC (encoder cache) transfer; both relate to encoder cache lifecycle
- name: --limit-mm-per-prompt
  relation: Determines number of multimodal items per request, which drives encoder cache pressure
- name: --mm-processor-kwargs
  relation: Affects multimodal preprocessing that feeds the encoder cache
- name: --max-num-batched-tokens
  relation: Indirectly affects encoder compute budget and thus encoder_cache_size passed to the manager
constraints:
- The value must be a JSON object parseable into EncoderCacheManagerConfig; invalid JSON or unknown fields cause a validation
  error at engine startup.
- encoder_cache_manager_cls, if set, must resolve to a class implementing create_manager(cache_size, vllm_config); otherwise
  manager creation fails.
- The score-based manager only applies to multimodal models; for text-only models the encoder cache is not created and the
  config has no effect.
- manager_config fields (e.g. cpu_cache_slots) must match the fields of the selected manager's config dataclass (ScoreEncoderCacheConfig
  for the Ascend score manager).
tuning_advice:
  summary: Use the Ascend ScoreEncoderCacheManager for multimodal workloads with repeated images to keep hot encoder embeddings
    on NPU and offload cold ones to CPU; leave default for text-only or low-reuse workloads.
  suggested_values:
  - scenario: Multimodal serving with repeated images (e.g. VQA, document QA) on Ascend NPU
    value: '{"encoder_cache_manager_cls": "vllm_ascend.ec_manager.score_ec_manager.ScoreEncoderCacheManager", "manager_config":
      {"cpu_cache_slots": 100000}}'
    reason: Enables two-tier NPU+CPU encoder cache with score-based promotion/eviction, reducing vision encoder recomputation
      and NPU memory pressure.
  - scenario: Host memory constrained environment
    value: '{"encoder_cache_manager_cls": "vllm_ascend.ec_manager.score_ec_manager.ScoreEncoderCacheManager", "manager_config":
      {"cpu_cache_slots": 20000}}'
    reason: Lower cpu_cache_slots reduces host RAM footprint while retaining NPU-side hot-entry caching.
  - scenario: Text-only model or no multimodal reuse
    value: '{}'
    reason: Default EncoderCacheManager is sufficient; score-based policy adds overhead without cache-hit benefit.
  caveats:
  - Applies to v1-ascend worker path; verify the score manager class path matches the installed vllm-ascend version.
  - Monitor NPU HBM and host RAM together — the CPU tier trades host memory for reduced encoder recompute.
  - The NPU cache size is governed by the multimodal encoder cache budget, not by cpu_cache_slots; tune both for best results.
  quick_guide: For repeated-image multimodal serving on Ascend, set encoder_cache_manager_cls to the ScoreEncoderCacheManager
    and size cpu_cache_slots to your host RAM budget.
analysis_date: '2026-10-27'
