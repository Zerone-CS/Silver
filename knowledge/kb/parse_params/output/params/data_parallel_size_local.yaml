name: --data-parallel-size-local
type: cli
category: parallelism
scope: both
source_file:
- vllm/engine/arg_utils.py:1145
- vllm/engine/arg_utils.py:499
- vllm/engine/arg_utils.py:2215
- vllm/config/parallel.py:132
- vllm/config/parallel.py:509
