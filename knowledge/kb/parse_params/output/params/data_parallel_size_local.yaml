- vllm_ascend/distributed/kv_transfer/kv_p2p/mooncake_connector.py:2139
value_type: int
default: 1
valid_choices: integer >= 0; 0 is a sentinel meaning DP was specified externally; must be <= --data-parallel-size
cli_example: --data-parallel-size-local 2
deprecated: false
performance_impact: high
performance_scope:
- throughput
- memory
- latency
impact_detail: '--data-parallel-size-local (-dpl) controls how many data-parallel (DP) replicas run on the

  current node. It is the per-node decomposition of the global --data-parallel-size and directly

  determines how many independent model replicas (each with its own KV cache and scheduler) are

  spawned on this physical machine.


  Upstream (vllm/engine/arg_utils.py:2215-2308): when --nnodes > 1 and data_parallel_size_local

  is None, it is inferred as max(local_world_size // world_size_within_dp, 1). When set explicitly

  it drives the DP launch topology: "data_parallel_size_local == data_parallel_size disables hybrid"

  LB (single-node full internal LB); data_parallel_size_local == 1 with hybrid LB auto-switches to

  external LB; data_parallel_size_local combined with --data-parallel-start-rank infers hybrid LB

  mode. In vllm/v1/engine/core_client.py:692 and input_processor.py:301, dp_local_size determines

  num_ranks (local_engines_only) and the valid range of data_parallel_rank, i.e. how many engine

  cores the client manages locally. In vllm/v1/engine/utils.py:449 it sets local_engine_count for

  Ray actor placement. So this parameter governs the number of local engine processes, which

  multiplies per-node memory footprint (each replica holds a full model shard + KV cache) and

  scales aggregate throughput roughly linearly with the number of DP replicas.


  Ascend-specific (vllm_ascend/worker/worker.py:470 and _310p/worker_310p.py:191): when

  data_parallel_size > 1, data_parallel_size_local > 0, backend is not ray/external_launcher,

  data_parallel_backend != "ray" and nnodes_within_dp == 1, vllm-ascend asserts

  local_world_size <= torch.npu.device_count(). local_world_size = tp * pp * pcp, so the product

  data_parallel_size_local * local_world_size must fit within the visible NPU count on the node.

  This is the key Ascend guard: "over-subscribing DP replicas beyond available NPUs raises an"

  assertion at worker init.


  Ascend compilation (vllm_ascend/compilation/compiler_interface.py:95-108): when

  enable_static_kernel is on, vllm-ascend computes LOCAL_WORLD_SIZE =

  local_world_size * data_parallel_size_local to give npugraph_ex the physical node topology for

  per-node Gloo groups coordinating static-kernel compilation and .run package installation. A

  wrong value here mis-sizes the Gloo group and can break static-kernel compilation.


  Ascend KV transfer (mooncake base_worker.py:98, mooncake_connector.py:2139,

  mooncake_hybrid_connector.py:1667): dp_size = data_parallel_size_local is used to compute

  max_device_id = tp_size * dp_size * pcp_size * pp_size and the side-channel/handshake port

  ranges. Incorrect values cause port collisions or out-of-range device ids in P/D disaggregation.

  '
