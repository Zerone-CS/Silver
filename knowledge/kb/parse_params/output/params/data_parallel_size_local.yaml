related_parameters:
- name: --data-parallel-size
  relation: Global DP size; data_parallel_size_local must be <= data_parallel_size and typically equals data_parallel_size
    / nnodes
- name: --data-parallel-start-rank
  relation: When set together with data_parallel_size_local, infers hybrid LB mode; offsets local ranks in global rank space
- name: --data-parallel-rank
  relation: External LB mode requires data_parallel_size_local == 1
- name: --data-parallel-hybrid-lb
  relation: Requires data_parallel_size_local to be set; auto-disabled when local == global or local == 1
- name: --data-parallel-external-lb
  relation: Requires data_parallel_size_local == 1
- name: --nnodes
  relation: When > 1, data_parallel_size_local is inferred from local_world_size if unset
- name: --tensor-parallel-size
  relation: local_world_size = tp * pp * pcp; product with data_parallel_size_local must fit visible NPUs
- name: --data-parallel-backend
  relation: ray backend changes inference (span strategy defaults local to 1); mp backend uses NPU-count assertion
constraints:
- --data-parallel-size-local must be less than or equal to --data-parallel-size.
- When using external load balancing (--data-parallel-external-lb or --data-parallel-rank), --data-parallel-size-local must
  be 1 or omitted.
- --data-parallel-hybrid-lb requires --data-parallel-size-local to be set.
- On Ascend single-node MP deployments, data_parallel_size_local × (tp × pp × pcp) must not exceed the number of visible NPUs
  on the node, otherwise worker init raises an assertion.
- When --nnodes > 1, --data-parallel-backend must be mp (ray is rejected for multi-node).
- A value of 0 is a sentinel meaning DP was specified externally and is not a valid replica count for normal launches.
tuning_advice:
  summary: Set data_parallel_size_local to the number of DP replicas you want on this node, ensuring data_parallel_size_local
    × tp × pp × pcp fits the node's visible NPU count; on Ascend prefer more DP replicas with smaller TP for higher throughput.
  suggested_values:
  - scenario: Single-node DeepSeek-R1/V3.1 deployment on 8 NPUs
    value: 4
    reason: vllm-ascend docs recommend dp4 tp4 over dp2 tp8 for single-node; 4 DP replicas × tp4 = 16 exceeds 8 NPUs, so use
      dp2 tp4 (2×4=8) or dp4 tp2 depending on NPU count; the doc's dp4 tp4 assumes 16 NPUs.
  - scenario: Two-node deployment, 2 DP ranks per node
    value: 2
    reason: 'Docs example: --data-parallel-size 4 with --data-parallel-size-local 2 per node, paired with --data-parallel-start-rank
      0/2 and --headless on non-master nodes.'
  - scenario: External LB / one-pod-per-rank wide-EP
    value: 1
    reason: External LB requires data_parallel_size_local == 1; each pod runs a single DP rank.
  - scenario: Single-node full internal LB (all DP ranks local)
    value: <equal to --data-parallel-size>
    reason: When all DP replicas are on one node, set data_parallel_size_local == data_parallel_size to disable hybrid LB
      and use full internal LB.
  caveats:
  - Always verify data_parallel_size_local × tp × pp × pcp <= visible NPU count on Ascend, or worker init asserts.
  - Account for per-replica KV cache memory when increasing DP replicas; lower gpu_memory_utilization if HBM is tight.
  - If enable_static_kernel is enabled, confirm LOCAL_WORLD_SIZE derived from this value matches the physical node topology.
  quick_guide: Set --data-parallel-size-local to the DP replicas on this node such that replicas × tp × pp × pcp fits the
    node's NPUs; use 1 for external LB.
