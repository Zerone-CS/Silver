name: --skip-mm-profiling
type: cli
category: memory
scope: both
source_file:
- vllm/config/multimodal.py:208
- vllm/engine/arg_utils.py:1424
- vllm/engine/arg_utils.py:621
- vllm/engine/arg_utils.py:1860
- vllm/config/model.py:412
- vllm/config/model.py:465
- vllm/v1/worker/gpu_model_runner.py:6468
- vllm/v1/worker/gpu/model_runner.py:941
value_type: bool
default: false
valid_choices: true or false (BooleanOptionalAction-style flag)
cli_example: --skip-mm-profiling
deprecated: false
performance_impact: medium
performance_scope:
- memory
- latency
impact_detail: "This flag controls whether the engine performs a multimodal encoder + encoder-cache\nmemory profiling pass\
  \ during initialization. In upstream vLLM v1\n(vllm/v1/worker/gpu_model_runner.py:6468), when skip_mm_profiling is True\
  \ the runner\nlogs \"Skipping memory profiling for multimodal encoder and encoder cache.\" and skips\nthe MultiModalBudget-based\
  \ encoder profiling (get_encoder_budget / profile_encoder_cache).\nIn the newer v1 model_runner.py:941 path, the encoder\
  \ profiling block is guarded by\n`if mm_config is not None and not mm_config.skip_mm_profiling`, so setting the flag\nbypasses\
  \ `encoder_runner.profile_encoder_cache(dummy_mm_inputs, mm_budget)` entirely.\nEffect on Ascend NPU:\n- Latency: \"skipping\
  \ the encoder profiling run removes a full dummy forward pass through\"\n  the multimodal encoder (ViT) plus encoder-cache\
  \ allocation, which shortens engine\n  startup / warmup time. This is a one-time startup cost, not steady-state latency.\n\
  - Memory: \"the profiling pass is what determines the peak activation memory reserved for\"\n  the multimodal encoder and\
  \ the encoder embedding cache. When skipped, the KV-cache\n  sizing (via --gpu-memory-utilization or --kv-cache-memory-bytes)\
  \ no longer accounts\n  for encoder activation peaks, so the user must manually reserve headroom. On Ascend,\n  where the\
  \ FusedMC2 / encoder peak can be large (docs cite ~3.64 GiB per card for the\n  image form), skipping profiling without\
  \ compensating with an explicit\n  --kv-cache-memory-bytes can cause OOM during graph capture or first real multimodal\n\
  \  request.\nThe parameter does not change steady-state throughput directly; it trades startup\ntime for manual memory-budget\
  \ responsibility. vllm-ascend does not appear to override\nthe flag itself; it is consumed through the standard MultiModalConfig\
  \ path, but the\nAscend docs explicitly recommend enabling it for the image deployment form.\n"
