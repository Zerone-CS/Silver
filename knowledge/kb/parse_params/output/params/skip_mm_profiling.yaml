related_parameters:
- name: --limit-mm-per-prompt
  relation: Determines the encoder budget that would be profiled; when all modality limits are 0 (embedding-only), encoder
    profiling is skipped regardless.
- name: --gpu-memory-utilization
  relation: When profiling is skipped, this no longer accounts for encoder activation peaks; must be lowered or replaced by
    explicit KV sizing.
- name: --kv-cache-memory-bytes
  relation: Explicit KV sizing is the recommended compensation when --skip-mm-profiling is enabled, to reserve headroom for
    encoder peaks.
- name: --max-num-batched-tokens
  relation: Smaller batched tokens chunk large-image prefill and reduce encoder peak, complementing skipped profiling.
- name: --language-model-only
  relation: If set, no multimodal encoder is loaded, making --skip-mm-profiling moot.
- name: --mm-encoder-tp-mode
  relation: Affects how encoder memory is distributed across ranks, influencing the peak that profiling would otherwise measure.
constraints:
- Only meaningful for multimodal models; for text-only models there is no encoder to profile and the flag has no effect.
- When enabled, the engine will not automatically reserve memory for multimodal encoder activations or the encoder embedding
  cache, so the user is responsible for sizing memory to avoid OOM.
- If all modality limits in --limit-mm-per-prompt are 0 (embedding-only mode), encoder profiling is skipped anyway regardless
  of this flag.
tuning_advice:
  summary: Enable --skip-mm-profiling for multimodal (especially image) deployments on Ascend to cut startup time, but always
    pair it with explicit --kv-cache-memory-bytes and a conservative --max-num-batched-tokens to reserve encoder peak headroom.
  suggested_values:
  - scenario: Image multimodal deployment on Ascend (validated stable config)
    value: true
    reason: Docs recommend enabling it with --kv-cache-memory-bytes 2816M and --max-num-batched-tokens 1024; automatic profiling
      can over-allocate KV and cause worker exit during graph capture.
  - scenario: Audio multimodal deployment on Ascend
    value: false
    reason: Docs use explicit --kv-cache-memory-bytes 4G for audio and do not mark --skip-mm-profiling as enabled; keep default
      to retain automatic encoder profiling safety.
  - scenario: Text-only deployment
    value: false
    reason: No multimodal encoder exists, so the flag has no effect; leave default.
  - scenario: Fast iteration / debugging where startup time matters and memory is ample
    value: true
    reason: Skips the encoder dummy forward pass, reducing engine initialization time when memory headroom is not a concern.
  caveats:
  - Always verify no OOM during graph capture and first real multimodal request after enabling; monitor NPU memory with npu-smi.
  - Combine with --max-num-batched-tokens to chunk large-image prefill and reduce encoder peak.
  - If you must keep automatic profiling, consider VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS=0 as an alternative, though docs
    note it is unvalidated for single-modality deployments.
  quick_guide: For Ascend image multimodal serving, set --skip-mm-profiling and pin --kv-cache-memory-bytes explicitly; otherwise
    leave it off.
