related_parameters:
- name: --decode-context-parallel-size (-dcp)
  relation: Must be > 1 for q-replicate to take effect; DCP shards KV cache and triggers the query all-gather this flag removes
- name: --prefill-context-parallel-size (-pcp)
  relation: Must be <= 1; qrep_enabled is false when PCP is enabled
- name: --dcp-comm-backend
  relation: Related DCP communication setting; q-replicate removes the query all-gather collective from the DCP decode path
- name: VLLM_DCP_Q_REPLICATE
  relation: Env var that predates the config field and overrides it if explicitly set
constraints:
- The flag only takes effect when --decode-context-parallel-size is greater than 1.
- The flag has no effect when --prefill-context-parallel-size is greater than 1 (PCP enabled).
- If the VLLM_DCP_Q_REPLICATE environment variable is explicitly set, it overrides the --dcp-q-replicate CLI value.
- Only applies to MLA models (e.g. DeepSeek-V2/V3 style) that have a query projection to replicate.
tuning_advice:
  summary: Enable --dcp-q-replicate for MLA models with DCP > 1 and PCP disabled to skip the per-step query all-gather, especially
    when decode latency is collective-bound.
  suggested_values:
  - scenario: MLA model (DeepSeek-V2/V3) with DCP > 1, PCP disabled, latency-sensitive decode
    value: true
    reason: Removes the per-step query all-gather collective, reducing decode latency; on Ascend the HCCL collective overhead
      makes this more valuable.
  - scenario: MLA model with DCP > 1 but large batch / compute-bound decode where redundant projection cost dominates
    value: false
    reason: Redundant query projection compute on every rank may outweigh the collective savings; benchmark both.
  - scenario: Non-DCP deployment or PCP enabled
    value: false
    reason: The flag is a no-op when DCP <= 1 or PCP > 1, so leave it unset/false.
  caveats:
  - Benchmark decode latency with and without the flag; the benefit depends on collective vs compute balance.
  - Account for the extra NPU HBM used by the replicated query projection weights.
  - Ensure VLLM_DCP_Q_REPLICATE is not set, as it overrides the CLI flag.
  quick_guide: Set --dcp-q-replicate true for MLA models with DCP>1 and PCP off to skip the decode query all-gather; benchmark
    to confirm the collective savings beat the redundant projection cost.
analysis_date: '2026-10-27'
