name: --dcp-q-replicate
type: cli
category: parallelism
scope: both
source_file:
- vllm/config/parallel.py:376
- vllm/config/parallel.py:575
- vllm/engine/arg_utils.py:493
- vllm/engine/arg_utils.py:1107
- vllm/model_executor/layers/attention/mla_attention.py:437
- vllm/model_executor/layers/mla.py:116
- vllm/model_executor/models/deepseek_v2.py:1067
- vllm_ascend/tests/ut/ops/test_mla_weight_processing.py:32
value_type: bool
default: null
valid_choices: true / false (None means unset; model may fill via set_dcp_defaults)
cli_example: --dcp-q-replicate
deprecated: false
performance_impact: medium
performance_scope:
- latency
- throughput
impact_detail: "This flag controls whether the MLA query projection is replicated across each DCP\n(decode context parallel)\
  \ group so that decode can skip the per-step query all-gather.\n\nUpstream flow (vllm):\n- \"In deepseek_v2.py:1063-1076,\
  \ `qrep_requested` is resolved from the env var\"\n  VLLM_DCP_Q_REPLICATE if explicitly set, otherwise from\n  `vllm_config.parallel_config.dcp_q_replicate`.\
  \ `qrep_enabled` is only true when\n  qrep_requested AND decode_context_parallel_size > 1 AND\n  prefill_context_parallel_size\
  \ <= 1. When enabled, the q projection layer class\n  becomes `DCPGroupColumnParallelLinear` instead of `ColumnParallelLinear`.\n\
  - \"In mla.py:113-116, `self.dcp_q_replicate` is derived from the q_proj layer's\"\n  `qrep_active` attribute, and passed\
  \ into MLAAttention (mla_attention.py:437,460).\n- \"MLAAttention stores `self.dcp_q_replicate` and `self.W_UK_T_dcp_qrep`\
  \ (mla_attention.py:460-461),\"\n  which is the replicated weight used to materialize the full group-local head set\n  locally\
  \ at load time.\n\nPerformance mechanism: \"With DCP the KV cache is sharded across the group, so the\"\nstandard MLA decode\
  \ path must all-gather the query every decode step. Replicating\nthe (small) query projection at load time lets each rank\
  \ compute the full group-local\nhead set locally and skip that collective. This removes a per-step collective\n(latency\
  \ win, especially at small batch / low decode step time) at the cost of\nredundant projection compute on every rank in the\
  \ group and extra weight memory\nfor the replicated projection.\n\nAscend relevance: \"vllm-ascend's AscendMLAAttention\
  \ (vllm_ascend/ops/mla.py) wraps the\"\nupstream MLAAttention and the test at tests/ut/ops/test_mla_weight_processing.py:32\n\
  sets `inner.dcp_q_replicate = False`, confirming the Ascend MLA path reads this\nattribute. On Ascend, skipping the query\
  \ all-gather removes an HCCL collective per\ndecode step, which is typically more expensive than on GPU due to HCCL launch\n\
  overhead, so the latency benefit can be more pronounced. However, the redundant\nprojection compute runs on the NPU and\
  \ the replicated weight consumes NPU HBM.\nThe flag only takes effect when DCP > 1 and PCP <= 1; otherwise it is a no-op.\n"
