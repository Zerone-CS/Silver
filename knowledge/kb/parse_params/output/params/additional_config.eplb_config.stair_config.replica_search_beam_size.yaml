- vllm_ascend/ascend_config.py:258
value_type: int
default: 64
valid_choices: Integer between 1 and 128 inclusive
cli_example: null
deprecated: false
performance_impact: medium
performance_scope:
- throughput
- latency
impact_detail: 'This parameter controls the beam width of the FlashTree-style replica search inside the

  MRv2 STAIR EPLB policy (vllm-ascend only; no upstream vLLM equivalent). Per the StairConfig

  docstring, replica_search_beam_size is the "Maximum unique replica-count candidates kept

  after each search stage" of the replica search. It bounds the search frontier: at each of

  replica_search_num_stages stages, up to replica_search_beam_size candidate replica-count

  assignments survive to the next stage. A larger beam explores more of the replica-count

  space, yielding a better expert placement (more balanced rank load, fewer hot-rank

  bottlenecks) which improves MoE decode/prefill throughput and tail latency on Ascend NPU.

  However, the search cost grows roughly linearly with beam size per stage, so a larger beam

  increases the CPU-side EPLB rebalancing/planning time (which runs on host, not NPU) and can

  delay rebalancing decisions. The parameter does not directly touch NPU memory or HCCL

  communication; its effect is indirect via the quality of the expert-to-rank placement that

  the EPLB policy commits. It is validated in StairConfig._validate (must be 1..128) and

  booleans are rejected by the field validator.

  '
