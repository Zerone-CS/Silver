  relation: Number of search stages; total search work scales with num_stages × beam_size
- name: additional_config.eplb_config.stair_config.replica_search_radius
  relation: Radius of greedy extra-replica budget explored per stage; combined with beam size defines search breadth
- name: additional_config.eplb_config.stair_config.placement_search_backtrack_limit
