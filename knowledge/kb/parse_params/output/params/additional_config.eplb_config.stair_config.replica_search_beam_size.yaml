- name: additional_config.eplb_config.stair_config.relative_balance_threshold
  relation: Rebalance trigger; better placement from larger beam interacts with when rebalancing fires
constraints:
- replica_search_beam_size must be an integer between 1 and 128 inclusive, otherwise StairConfig validation raises a ValueError.
- Boolean values are rejected for all STAIR numeric fields, including replica_search_beam_size.
tuning_advice:
  summary: Keep the default beam of 64 for most MoE deployments; increase toward 96-128 only when rank imbalance is the throughput
    bottleneck and rebalance latency is acceptable, decrease to 16-32 if EPLB planning overhead is too high.
  suggested_values:
  - scenario: Default / balanced MoE serving on Ascend NPU
    value: 64
    reason: Default value provides a good tradeoff between replica-search quality and host-side planning cost.
  - scenario: Large-scale MoE with pronounced rank imbalance and infrequent rebalancing
    value: 128
    reason: Widest allowed beam explores more replica-count candidates, improving rank balance and MoE throughput when rebalance
      latency is not critical.
  - scenario: Latency-sensitive serving where EPLB planning overhead must stay low
    value: 16
    reason: Smaller beam reduces per-stage search cost, keeping rebalancing fast at the cost of slightly less optimal placement.
  caveats:
  - Do not raise beam size and replica_search_num_stages together without measuring rebalance latency.
  - Values above 128 are rejected by validation; values below 1 are rejected.
  quick_guide: Leave at 64; raise toward 128 for better balance, lower toward 16 if EPLB planning is too slow.
