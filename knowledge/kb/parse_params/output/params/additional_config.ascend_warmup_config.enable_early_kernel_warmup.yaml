constraints:
- The warmup thread is joined at the end of load_model before memory profiling, so it must complete (or hit the 600s join
  timeout) before KV cache allocation proceeds.
- The flag only takes effect when the Ascend config is initialized; if get_ascend_config() raises RuntimeError the warmup
  is silently skipped.
tuning_advice:
  summary: Enable on cold-start deployments to hide Triton warmup kernel compilation behind weight loading and reduce time-to-first-token
    startup latency.
  suggested_values:
  - scenario: Cold start / fresh Triton cache, startup latency matters (serverless, autoscaling)
    value: true
    reason: Overlaps rejection sampler / penalty / RMS norm Triton JIT compile with safetensors load, so the regular kernel_warmup
      hits the Triton cache and startup is faster.
  - scenario: Warm Triton cache or startup latency not a concern
    value: false
    reason: Default; no benefit when kernels are already cached, and avoids spawning an extra thread.
  caveats:
  - Applies to the vllm-ascend worker path (NPUModelRunner.load_model); it is an Ascend-only config with no upstream vLLM
    equivalent.
  - The join before memory profiling means a slow compile can delay startup up to the 600s timeout if weight loading finishes
    first.
  quick_guide: 'Set enable_early_kernel_warmup: true under ascend_warmup_config to overlap Triton warmup compile with weight
    loading on cold starts.'
