- vllm_ascend/model_executor/warmup/early_kernel_warmup.py:9
value_type: bool
default: false
valid_choices: true or false
cli_example: null
deprecated: false
performance_impact: medium
performance_scope:
- latency
impact_detail: 'This flag controls whether vllm-ascend starts a background thread at the

  beginning of NPUModelRunner.load_model that JIT-compiles the Triton warmup

  kernels (rejection sampler, penalty, RMS norm) while safetensors weights are

  still being loaded. The thread is joined at the end of load_model, before

  memory profiling and KV cache allocation, so it never affects the KV cache

  budget. The mechanism is pure startup-latency overlap: the Triton compile

  (host-side JIT work) is hidden behind the weight I/O critical path, so the

  subsequent regular kernel_warmup hits the Triton cache instead of paying the

  compile cost serially. It does not change steady-state throughput or memory

  usage. The _enabled() helper reads

  get_ascend_config().ascend_warmup_config.enable_early_kernel_warmup and

  returns False on RuntimeError (config not yet initialized). The join has a

  600s timeout (_JOIN_TIMEOUT_S). Imports needed by the thread are performed on

  the main thread first to avoid concurrent sys.modules mutation.

  '
usage_locations:
