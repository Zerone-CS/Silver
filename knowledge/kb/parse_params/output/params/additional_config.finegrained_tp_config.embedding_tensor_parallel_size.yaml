name: additional_config.finegrained_tp_config.embedding_tensor_parallel_size
type: nested
category: parallelism
scope: vllm-ascend
source_file:
- vllm_ascend/ascend_config.py:1339
- vllm_ascend/ascend_config.py:1421
- vllm_ascend/distributed/parallel_state.py:200
- vllm_ascend/utils.py:986
- vllm_ascend/ops/vocab_parallel_embedding.py:116
value_type: int
default: 0
valid_choices: Non-negative integer; 0 disables fine-grained embedding TP. When > 0 it must divide data_parallel_size and
  the model must be a MoE model.
cli_example: null
deprecated: false
performance_impact: medium
performance_scope:
- throughput
- memory
impact_detail: 'This is a vllm-ascend-only parameter (defined in FinegrainedTPConfig, vllm_ascend/ascend_config.py:1339).

  It sets a custom tensor-parallel size for the token embedding layer, independent of the global

  tensor_parallel_size. When > 0, embedding_tp_enable() (vllm_ascend/utils.py:986) returns True and

  init_ascend_model_parallel creates a dedicated "emtp" process group of that size

  (vllm_ascend/distributed/parallel_state.py:200-210, _EMBED_TP). The embedding weight is then sharded

  across this group instead of the default TP group, as routed by the VocabParallelPlan logic in

  vllm_ascend/ops/vocab_parallel_embedding.py. This changes how the embedding lookup is partitioned:

  a larger embedding TP spreads the (often very large) vocab embedding table across more ranks,

  reducing per-rank embedding memory and the per-rank gather/reduce work, at the cost of an extra

  collective over the emtp group. Because the embedding is memory-heavy for large-vocab models, this

  can meaningfully reduce per-rank HBM pressure and improve throughput in DP-heavy MoE deployments.

  It also affects weight-loading identity resolution (rfork/identity.py:278) since content becomes

  sharded across DP.

  '
usage_locations:
- file: vllm_ascend/ascend_config.py:1339
  context: Field definition in FinegrainedTPConfig pydantic dataclass, default 0.
