related_parameters:
- name: additional_config.finegrained_tp_config.lmhead_tensor_parallel_size
  relation: Sibling fine-grained TP field; both shard vocab-parallel layers and share the same MoE/DP-divisibility constraints.
- name: additional_config.finegrained_tp_config.oproj_tensor_parallel_size
  relation: Sibling field; oproj/mlp have stricter preconditions (TP==1, graph mode, PD decode node) that embedding does not.
- name: additional_config.finegrained_tp_config.mlp_tensor_parallel_size
  relation: Sibling field with the same stricter preconditions as oproj.
- name: data_parallel_size
  relation: embedding_tensor_parallel_size must divide data_parallel_size when > 0.
- name: tensor_parallel_size
  relation: Embedding TP is independent of global TP; unlike oproj/mlp it is not restricted to TP==1.
- name: prefill_context_parallel_size
  relation: Mutually exclusive with PCP embedding weight sharding (enable_pcp_embedding_lmhead_weight_sharding).
constraints:
- embedding_tensor_parallel_size must be non-negative; negative values raise ValueError.
- The fine-grained TP sizes can only be enabled for MoE models; setting this > 0 on a dense model raises AssertionError.
- When embedding_tensor_parallel_size > 0, it must evenly divide data_parallel_size, otherwise an AssertionError is raised.
- PCP embedding weight sharding cannot be combined with finegrained_tp_config.embedding_tensor_parallel_size; enabling both
  raises ValueError.
tuning_advice:
  summary: Enable a dedicated embedding TP size on large-vocab MoE models to shard the embedding table across DP ranks and
    cut per-rank HBM, ensuring it divides data_parallel_size.
  suggested_values:
  - scenario: Large-vocab MoE model with DP > 1 and embedding table dominating per-rank memory
    value: 2
    reason: Shards the embedding across 2 DP ranks, halving per-rank embedding memory; must divide data_parallel_size.
  - scenario: DP-heavy MoE deployment where embedding memory is the bottleneck
    value: <a divisor of data_parallel_size>
    reason: Any value > 0 that divides data_parallel_size is valid; larger values spread the embedding table further across
      ranks.
  - scenario: Default / dense model / no embedding memory pressure
    value: 0
    reason: 0 disables fine-grained embedding TP; required for dense models and avoids extra emtp collectives.
  caveats:
  - Only valid for MoE models; dense models raise AssertionError.
  - The value must divide data_parallel_size or initialization fails.
  - Cannot be combined with PCP embedding weight sharding (prefill_context_parallel_size > 1 with PCP sharding enabled).
  - Introduces an extra emtp process group and collective over that group, adding communication overhead.
  - Unlike oproj/mlp, embedding TP is not restricted to tensor_parallel_size == 1 or graph mode, but still requires DP divisibility.
  quick_guide: Set to a divisor of data_parallel_size (e.g. 2) on large-vocab MoE models to shard the embedding table; leave
    0 otherwise.
analysis_date: '2026-10-27'
