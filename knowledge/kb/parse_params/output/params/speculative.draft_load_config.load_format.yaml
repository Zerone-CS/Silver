related_parameters:
- name: speculative_config.draft_load_config
  relation: Parent LoadConfig object; load_format is one field of it.
- name: speculative_config.method
  relation: Determines which proposer (eagle/eagle3/mtp/dspark) consumes the draft model and thus this load config.
- name: speculative_config.model
  relation: The draft model whose weights are loaded using this format.
- name: load_format
  relation: Top-level target-model load format; independent of the draft model's load format.
constraints:
- The value must be a load format supported by the installed vLLM loader; unsupported formats raise an error at draft-model
  load time.
- When set to 'dummy', no real weights are loaded, so the draft model produces meaningless outputs and must only be used for
  benchmarking or tests.
- The draft model is loaded on the last pipeline stage only (asserted in load_model), so this format applies only to that
  rank's draft weights.
tuning_advice:
  summary: Leave at 'auto' for production; use 'dummy' only for startup-time benchmarking or tests where draft weights are
    irrelevant.
  suggested_values:
  - scenario: Production deployment with a real EAGLE/MTP/dspark draft model
    value: auto
    reason: Automatically selects safetensors when available and falls back to pytorch bin, giving the fastest reliable draft-model
      load without manual format selection.
  - scenario: Startup-time or throughput benchmarking where draft weights are not needed
    value: dummy
    reason: Skips draft weight loading entirely, as done in Ascend e2e tests (test_kimi_k3.py), reducing engine startup time;
      not valid for real inference.
  - scenario: Draft model shipped only as safetensors and you want to avoid fallback probing
    value: safetensors
    reason: Explicitly uses the faster safetensors parser, avoiding the auto-detection fallback path.
  caveats:
  - Does not affect per-token latency or throughput after load; only startup time and transient memory.
  - Do not use 'dummy' in production — the drafter will emit invalid speculative tokens.
  quick_guide: Keep 'auto' for real runs; use 'dummy' only for fast-startup tests/benchmarks.
analysis_date: '2026-10-27'
