impact_detail: 'This is the load_format field of the LoadConfig used specifically for the

  speculative draft model (draft_load_config), distinct from the top-level

  load_format used for the target model. In vllm-ascend v1, the value is read

  in LLMBaseProposer._get_model() (vllm_ascend/spec_decode/llm_base_proposer.py:356-368):

  draft_load_config = self.speculative_config.draft_load_config is passed directly

  into get_model(..., load_config=self.speculative_config.draft_load_config) under

  the "eagle_head" model tag. The load_format therefore only affects how the draft

  model weights are materialized at engine startup (weight file parsing, host->NPU

  copy, possible dequantization), not the steady-state decode loop. It has no

  effect on per-token latency or throughput once the model is loaded. Its only

  runtime-relevant effects are (a) startup/load time (safetensors is generally

  faster to parse than pytorch .bin, and "dummy" skips weight loading entirely,

  which is why the Ascend e2e tests use load_format: "\"dummy\" for both dspark and"

  mtp drafters in tests/e2e/pull_request/four_card/test_kimi_k3.py:354 and :496),

  and (b) transient host/device memory during loading. vllm-ascend does not

  override or reinterpret this field; it is forwarded verbatim to the upstream

  get_model() loader. Because the draft model is typically small (EAGLE/MTP head),

  the absolute impact is minor.

  '
usage_locations:
- file: vllm_ascend/spec_decode/llm_base_proposer.py:356
