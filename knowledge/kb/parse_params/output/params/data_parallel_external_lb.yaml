related_parameters:
- name: --data-parallel-size
  relation: Must be > 1 for external LB to be valid; raises otherwise.
- name: --data-parallel-rank
  relation: Setting it implicitly enables external LB; external LB requires a rank.
- name: --data-parallel-size-local
  relation: Must be 1 (or omitted) in external LB mode.
- name: --data-parallel-hybrid-lb
  relation: Mutually exclusive; cannot be enabled together with external LB.
- name: --data-parallel-multi-port-external-lb
  relation: Related external-LB variant that launches one API server per local DP rank.
- name: --nnodes / --node-rank
  relation: Used to infer data_parallel_rank for external LB across nodes.
- name: --enable-expert-parallel
  relation: External LB is intended for wide-EP MoE deployments.
- name: --enable-fault-tolerance
  relation: Fault tolerance requires external LB mode (external LB or data-parallel-rank).
constraints:
- --data-parallel-external-lb and --data-parallel-hybrid-lb cannot be enabled together.
- External LB can only be set when --data-parallel-size is greater than 1.
- External LB is only supported for MoE models; non-MoE models with DP > 1 raise an error.
- External LB requires a data-parallel rank; set --data-parallel-rank or use --nnodes with --node-rank so it can be inferred.
- In external LB mode --data-parallel-size-local must be 1 or omitted.
- Fault tolerance (--enable-fault-tolerance) requires external LB mode (external LB or --data-parallel-rank).
tuning_advice:
  summary: Enable external LB only for large MoE wide-EP deployments where an external balancer routes to one pod per DP rank;
    otherwise use internal/hybrid LB.
  suggested_values:
  - scenario: Wide-EP MoE deployment across many nodes with a Kubernetes/gateway external balancer
    value: true
    reason: One-pod-per-rank topology scales DP horizontally without a single internal coordinator bottleneck; requires --data-parallel-size
      > 1, a rank, and --data-parallel-size-local 1.
  - scenario: Single-node or small DP MoE deployment
    value: false
    reason: Internal/hybrid LB can use per-rank queue stats for better routing and lower tail latency.
  - scenario: Non-MoE model deployment
    value: false
    reason: External LB is rejected for non-MoE models; launch independent vLLM instances instead.
  caveats:
  - Ensure the external balancer has health checks and even routing; vLLM will not rebalance across ranks internally.
  - Keep --data-parallel-size-local at 1 and provide --data-parallel-rank (or --nnodes/--node-rank) to satisfy validation.
  - On Ascend, verify HCCL connectivity across all DP ranks before relying on external routing, since each rank is an independent
    frontend.
  quick_guide: Use --data-parallel-external-lb only for multi-node MoE wide-EP with an external balancer; keep it off for
    single-node or non-MoE setups.
analysis_date: '2026-10-27'
