name: --data-parallel-external-lb
type: cli
category: parallelism
scope: vllm
source_file:
- vllm/engine/arg_utils.py:1176
- vllm/engine/arg_utils.py:503
- vllm/config/parallel.py:151
- vllm/config/parallel.py:515
- vllm/config/vllm.py:796
- vllm/v1/engine/core.py:1074
- vllm/v1/engine/core_client.py:152
- vllm/v1/engine/utils.py:1268
value_type: bool
default: false
valid_choices: true or false (store_true style boolean flag)
cli_example: --data-parallel-external-lb
deprecated: false
performance_impact: medium
performance_scope:
- throughput
- latency
impact_detail: 'This flag selects the "external" DP load-balancing mode for MoE deployments.

  In vllm/v1/engine/core_client.py:152, when data_parallel_size > 1 and

  data_parallel_external_lb is True, the engine client is constructed as a

  DPAsyncMPClient (one client per DP rank) instead of a DPLBAsyncMPClient

  (a single client that balances requests across all DP ranks). This means

  request routing/balancing is delegated to an external load balancer (e.g.

  a Kubernetes Service or gateway) rather than vLLM''s internal coordinator.

  In vllm/v1/engine/core.py:1074, internal_dp_balancing is disabled when

  external LB is set, so publish_dp_lb_stats becomes False and per-rank queue

  stats are not published to the coordinator for balancing decisions.

  In vllm/config/vllm.py:796, needs_dp_coordinator still returns True for MoE

  models with DP > 1 even in external LB mode (wave coordination still runs in

  the coordinator), so the DP coordinator process is not eliminated.

  In vllm/v1/engine/utils.py:1268, remote_should_be_headless is True when

  neither hybrid nor external LB is set; with external LB the remote ranks are

  not headless, meaning each rank runs its own API server/frontend.

  Net effect on Ascend NPU: "throughput and tail latency depend on the quality"

  of the external balancer''s routing decisions (it cannot see per-rank queue

  depth the way internal LB does), but it enables a "one-pod-per-rank" wide-EP

  topology that scales DP across many nodes without a single internal

  coordinator bottleneck. Memory footprint per process is roughly unchanged;

  the main tradeoff is routing efficiency vs. horizontal scalability.

  '
