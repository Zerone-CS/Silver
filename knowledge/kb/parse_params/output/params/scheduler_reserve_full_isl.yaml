related_parameters:
- name: --enable-chunked-prefill
  relation: Only meaningful with chunked prefill; without chunking the full prompt is scheduled in one step anyway
- name: --max-num-batched-tokens
  relation: Chunk size for prefill; interacts with how much of the prompt is scheduled per step
- name: --watermark
  relation: Both control KV cache admission headroom to avoid preemption/thrashing
- name: --gpu-memory-utilization
  relation: Determines total KV cache blocks available, affecting whether full ISL fits
- name: --max-model-len
  relation: Upper bound on input sequence length that must fit when this flag is True
constraints:
- This flag only has an effect when chunked prefill is enabled; with chunked prefill disabled the full prompt is scheduled
  in a single step regardless.
- When True, a request whose full input sequence length cannot fit in the available KV cache blocks will not be admitted,
  so max-model-len must be compatible with the KV cache capacity.
tuning_advice:
  summary: Keep the default True for stable throughput under chunked prefill; only disable when KV cache is abundant and you
    need maximum admission aggressiveness.
  suggested_values:
  - scenario: Default production serving with chunked prefill and moderate KV cache pressure
    value: true
    reason: Prevents over-admission and KV cache thrashing, avoiding expensive prefill recompute on the NPU and stabilizing
      throughput.
  - scenario: Long-prompt workloads where prompts approach max-model-len and KV cache is tight
    value: true
    reason: Ensures only requests whose full prompt fits are admitted, avoiding mid-prefill preemption and recompute.
  - scenario: Short-prompt, high-concurrency workloads with abundant KV cache headroom
    value: false
    reason: Allows more aggressive admission/batching to raise instantaneous occupancy when preemption risk is low.
  caveats:
  - Disabling this flag with tight KV cache can trigger preemption storms and repeated prefill recompute, degrading steady-state
    throughput on Ascend NPU.
  - Combine with --watermark to add KV cache headroom when running near memory limits.
  - Applies uniformly across vllm-ascend v1 scheduler variants; no Ascend-specific override of the default exists.
  quick_guide: Leave --scheduler-reserve-full-isl at its default True unless KV cache is abundant and you need more aggressive
    admission.
