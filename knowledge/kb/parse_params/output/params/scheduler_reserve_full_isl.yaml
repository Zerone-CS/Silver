name: --scheduler-reserve-full-isl
type: cli
category: scheduling
scope: both
source_file:
- vllm/config/scheduler.py:172
- vllm/engine/arg_utils.py:650
- vllm/engine/arg_utils.py:1631
- vllm/v1/core/sched/scheduler.py:331
- vllm/v1/core/sched/scheduler.py:1168
- vllm_ascend/patch/platform/patch_balance_schedule.py:623
- vllm_ascend/core/dyntra_lb_scheduler.py:214
- vllm_ascend/core/dyntra_lb_scheduler.py:937
- vllm_ascend/core/recompute_scheduler.py:749
- vllm_ascend/core/scheduler_profiling_chunk.py:953
value_type: bool
default: true
valid_choices:
- true
- false
cli_example: --scheduler-reserve-full-isl
deprecated: false
performance_impact: medium
performance_scope:
- throughput
- latency
- memory
impact_detail: 'This flag is defined upstream in vllm/config/scheduler.py:172 (default True) and

  plumbed through arg_utils.py into SchedulerConfig. The v1 scheduler reads it into

  self.scheduler_reserve_full_isl (vllm/v1/core/sched/scheduler.py:331) and passes it

  as full_sequence_must_fit to kv_cache_manager.allocate_slots() at scheduler.py:1168.

  When True, the KV cache manager must reserve enough blocks for the ENTIRE input

  sequence length (prompt) before a request is admitted, not just the first chunk

  scheduled this step. When False, only the current chunk''s blocks are checked, so a

  long prompt can be admitted even if the full prompt won''t fit, relying on later

  chunks to allocate more blocks.


  vllm-ascend does NOT override the default; it consumes the same SchedulerConfig

  field. The Ascend-specific schedulers all forward it identically:

  - "vllm_ascend/patch/platform/patch_balance_schedule.py:623 (BalanceScheduler)"

  - "vllm_ascend/core/dyntra_lb_scheduler.py:214 (async KV load admission) and :937"

  - "vllm_ascend/core/recompute_scheduler.py:749 (RecomputeScheduler)"

  - "vllm_ascend/core/scheduler_profiling_chunk.py:953"

  Each passes full_sequence_must_fit=self.scheduler_reserve_full_isl into

  allocate_slots(). So the behavior is uniform across Ascend scheduler variants.


  Performance mechanism: "With chunked prefill enabled (common on Ascend to bound"

  per-step compute and keep NPU utilization high), setting this True prevents

  over-admission — the scheduler won''t start a request whose full prompt cannot fit

  in KV cache, avoiding mid-prefill preemption and KV cache thrashing (repeated

  eviction/recompute of blocks). This trades a bit of admission aggressiveness

  (some requests wait longer) for stable throughput and fewer wasted prefill

  recomputations. Setting it False can improve short-term admission/batching

  (higher instantaneous occupancy) but risks preemption storms and recompute under

  memory pressure, hurting steady-state throughput and tail latency. On Ascend NPU,

  where prefill compute is expensive and recompute wastes NPU cycles, the True

  default generally yields better sustained throughput.

  '
