related_parameters:
- name: VLLM_P2P_SIDE_CHANNEL_PORT
  relation: Companion port; combined with this host to form the ZMQ control socket identity (host:port), offset by data_parallel_index
- name: VLLM_NIXL_SIDE_CHANNEL_HOST
  relation: Analogous side-channel host for the NIXL connector; P2P manager mirrors its behavior (no auto-detection)
- name: VLLM_EC_SIDE_CHANNEL_HOST
  relation: Analogous side-channel host for the EC connector's ZMQ channel
constraints:
- The value is used verbatim as both the bind address and the dial-back identity; there is no auto-detection, so it must be
  an address that is actually assigned to the node.
- For cross-host P2P, VLLM_P2P_SIDE_CHANNEL_HOST must be set to the node's routable IP; the default 'localhost' binds loopback
  only and remote peers cannot reach the socket.
- An explicit `host` passed via the secondary_tiers kv_connector_extra_config takes precedence over this environment variable.
tuning_advice:
  summary: Set to the node's routable IP for any cross-host P2P KV-offload deployment; leave default only for single-host/loopback
    setups.
  suggested_values:
  - scenario: Single-host P2P KV-offload (all replicas on one node)
    value: localhost
    reason: Default loopback binding is sufficient and avoids exposing the control socket externally.
  - scenario: Multi-host / cross-host P2P KV-offload
    value: <node_routable_IP>
    reason: Remote peers must be able to dial back the ZMQ control socket; the default localhost is unreachable across hosts,
      which disables cross-host KV reuse.
  caveats:
  - Ensure the chosen IP is reachable from all peer nodes (firewall/security group must allow the control port range base+dp_index).
  - Prefer setting host explicitly in kv_connector_extra_config secondary_tiers if you need per-tier control, since explicit
    config overrides this env var.
  - No Ascend-specific override exists; the same guidance applies on NPU deployments as on GPU.
  quick_guide: 'Cross-host P2P: export VLLM_P2P_SIDE_CHANNEL_HOST=<node IP>; single-host: leave default localhost.'
analysis_date: '2026-10-27'
