name: VLLM_P2P_SIDE_CHANNEL_HOST
type: env
category: kv_cache
scope: vllm
source_file:
- vllm/envs.py:1661
- vllm/envs.py:228
- vllm/v1/kv_offload/tiering/p2p/manager.py:239
- vllm/v1/kv_offload/tiering/p2p/manager.py:290
value_type: str
default: localhost
valid_choices: Any resolvable hostname or IP address string; must be an address reachable by remote peers for cross-host P2P
cli_example: null
deprecated: false
performance_impact: low
performance_scope:
- latency
- throughput
impact_detail: 'This env var only controls the bind/dial-back address of the ZMQ control socket used by the

  P2P KV-offload secondary tier (vllm/v1/kv_offload/tiering/p2p/manager.py). In

  P2PSecondaryTierManager.__init__, when the `host` kwarg is None it falls back to

  envs.VLLM_P2P_SIDE_CHANNEL_HOST (line 290), and the value is used verbatim to build

  `self._local_id = f"{host}:{port}"` (line 307), which is both the ZMQ bind address and the

  identity peers dial back. It does not affect the actual KV data path (NIXL/RDMA transfer

  backends, num_threads, or block hashing) — only the control-plane handshake reachability.

  Consequently it has no direct effect on token throughput or NPU memory. Its only performance

  relevance is indirect: "if left at the default `localhost` in a cross-host P2P deployment,"

  remote peers cannot reach the control socket, so the P2P KV-offload tier fails to establish

  connections and KV reuse across hosts silently does not happen — which removes the latency/

  throughput benefit of KV offloading (prefill recompute instead of remote KV fetch). There is

  no vllm-ascend override of this variable in the provided context; it is an upstream-only

  parameter and is not referenced in vllm-ascend source.

  '
usage_locations:
