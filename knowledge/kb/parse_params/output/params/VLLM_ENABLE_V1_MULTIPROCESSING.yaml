related_parameters:
- name: distributed_executor_backend
  relation: When set to 'external_launcher', this env var is forcibly set to 0
- name: VLLM_WORKER_MULTIPROC_METHOD
  relation: Related multiprocessing spawn method for worker processes
- name: seed
  relation: When multiprocessing is disabled, the global random seed may affect the launching process
constraints:
- When using the external_launcher distributed executor backend, VLLM_ENABLE_V1_MULTIPROCESSING is forcibly set to 0 and cannot
  be enabled.
- ExecutorWithExternalLauncher asserts VLLM_ENABLE_V1_MULTIPROCESSING must be 0; setting it to 1 with that executor raises
  an assertion error.
- The value is parsed as bool(int(...)), so only '0' or '1' are valid; other strings raise a ValueError.
tuning_advice:
  summary: Leave at default (1) for normal serving; only disable for determinism-sensitive offline runs or external-launcher/torchrun
    setups.
  suggested_values:
  - scenario: Standard online serving / OpenAI-compatible server on Ascend NPU
    value: 1
    reason: Default multiprocessing isolates the engine core from the frontend process and is the well-tested path; IPC overhead
      is negligible relative to NPU compute.
  - scenario: Offline batch inference with torchrun-compatible external launcher
    value: 0
    reason: Required by ExecutorWithExternalLauncher for deterministic execution; upstream forces it to 0 automatically for
      external_launcher backend.
  - scenario: Debugging or profiling where you want the engine in-process
    value: 0
    reason: Removes the IPC hop and simplifies stack traces, at the cost of coupling engine to the caller process.
  caveats:
  - Do not set to 1 when using distributed_executor_backend=external_launcher; it will be overridden to 0 and an assertion
    will fail if forced.
  - Disabling multiprocessing may alter the launching process's random state; set an explicit seed if reproducibility matters.
  quick_guide: Keep VLLM_ENABLE_V1_MULTIPROCESSING=1 unless you need determinism/external-launcher or in-process debugging.
analysis_date: '2026-10-27'
