value_type: int
default: 1
valid_choices: Positive integer (>= 1)
cli_example: null
deprecated: false
performance_impact: medium
performance_scope:
- throughput
- memory
impact_detail: 'prefill_pp_size is a nested field under kv_transfer_config.kv_connector_extra_config

  used by the Ascend KV cache pool / AscendStore connector path (documented in

  kv_cache_pool_ascend_store.md). It declares the pipeline-parallel (PP) size of the

  Prefill node so that the KV store connector can correctly map and partition KV cache

  layers across PP stages when the Prefill node writes KV blocks into the pool

  (consumer_is_to_put). It works together with prefill_pp_layer_partition: if the layer

  partition is not given explicitly, layers are evenly divided by prefill_pp_size.

  The value itself does not change compute kernels; it affects how KV cache is laid out

  and transferred between Prefill and Decode nodes. A wrong value causes incorrect layer

  partitioning of the KV blocks, which can lead to failed loads, recomputation, or

  incorrect KV reuse — indirectly hurting throughput and effective KV cache utilization.

  No direct definition was found in the vllm or vllm-ascend source context provided; the

  behavior is documented only in the vllm-ascend KV cache pool feature guide.

  '
