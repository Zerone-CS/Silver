related_parameters:
- name: additional_config.ascend_warmup_config.enable_early_kernel_warmup
  relation: Sibling warmup flag; both run on background threads during weight loading and are joined before memory profiling.
constraints:
- The warmup thread is joined at the end of load_model before memory profiling, so it must complete within the join timeout
  of 600 seconds (_NZ_JOIN_TIMEOUT_S).
- The flag only takes effect when the Ascend config is initialized; if get_ascend_config() raises RuntimeError, _nz_enabled()
  returns False and warmup is skipped.
tuning_advice:
  summary: Enable to hide the one-time ~15-19 s NZ format-cast lazy init behind weight loading and reduce startup latency.
  suggested_values:
  - scenario: Any model that casts weights to NZ format, prioritizing fast cold-start / startup latency
    value: true
    reason: Overlaps the ~15-19 s first npu_format_cast init with weight I/O, cutting startup time without affecting KV cache
      budget or steady-state performance.
  - scenario: Debugging startup issues or when startup latency is not a concern
    value: false
    reason: Default; avoids the background warmup thread and its join at end of load_model.
  caveats:
  - Only reduces startup latency; no effect on tokens/sec throughput or memory usage.
  - Warmup thread is joined before memory profiling with a 600 s timeout; ensure it completes to avoid delaying load.
  quick_guide: 'Set enable_early_nz_warmup: true under ascend_warmup_config to shave ~15-19 s off startup by overlapping NZ
    format-cast init with weight loading.'
analysis_date: '2026-10-27'
