name: --enforce-eager
type: cli
category: compilation
scope: both
source_file:
- vllm/config/model.py:242
- vllm/engine/arg_utils.py:584
- vllm/engine/arg_utils.py:908
- vllm/config/vllm.py:1546
- vllm/config/vllm.py:1779
- vllm_ascend/platform.py:1167
- vllm_ascend/platform.py:1200
- vllm_ascend/worker/model_runner_v1.py:822
- vllm_ascend/worker/model_runner_v1.py:2389
- vllm_ascend/worker/v2/model_runner.py:189
- vllm_ascend/ascend_config.py:93
- vllm_ascend/ascend_config.py:946
- vllm_ascend/patch/platform/patch_minimax_m2_config.py:116
value_type: bool
default: false
valid_choices: true or false (boolean flag; pass --enforce-eager to enable)
cli_example: --enforce-eager
deprecated: false
performance_impact: high
performance_scope:
- latency
- throughput
- memory
impact_detail: '--enforce-eager is the master switch that disables both torch.compile (CompilationMode.NONE)

  and graph capture (CUDAGraphMode.NONE) on Ascend. Upstream vllm/config/vllm.py:1546-1552

  sets compilation_config.mode = NONE and cudagraph_mode = NONE when enforce_eager is True,

  and vllm/config/vllm.py:1779-1784 additionally zeroes max_cudagraph_capture_size and

  cudagraph_capture_sizes. On Ascend this is re-derived in vllm_ascend/platform.py:1167

  (_update_compilation_modes): when enforce_eager is truthy it logs "Compilation disabled,

  using eager mode by default", forces compilation_config.mode = CompilationMode.NONE and

  sets splitting_ops = [] (platform.py:1210-1214). The Ascend model runners then gate ACL

  graph usage on this flag: "v1 worker _use_aclgraph() returns False when"

  model_config.enforce_eager (model_runner_v1.py:815-823), and the v2 worker sets

  self.use_aclgraph = ... and not self.model_config.enforce_eager (v2/model_runner.py:183-190).

  The v1 runner also passes force_eager=self.model_config.enforce_eager into

  _determine_batch_execution_and_padding (model_runner_v1.py:2389), so the batch dispatcher

  never selects a captured graph. Consequence: every forward pass runs op-by-op in eager

  PyTorch, losing ACL graph replay (kernel-launch overhead amortization) and any

  torch.compile fusion — this typically costs a large fraction of decode throughput and

  raises per-token latency, while slightly reducing host memory used for graph capture.

  enforce_eager also feeds Ascend feature gating: "enable_sp_by_pass requires"

  not enforce_eager (ascend_config.py:944-948), KVPP validation requires eager or PIECEWISE

  (ascend_config.py:93-97), and the MiniMax-M2 patch only sets HCCL_OP_EXPANSION_MODE=AIV

  when not enforce_eager (patch_minimax_m2_config.py:113-121). With xlite_graph_config

  enabled, platform.py:1200-1203 may force enforce_eager=True when full_mode is set or no

  cudagraph mode remains, and propagates it to speculative_config.enforce_eager.

  '
