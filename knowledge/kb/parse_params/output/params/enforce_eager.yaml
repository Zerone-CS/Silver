- file: vllm_ascend/worker/model_runner_v1.py:822
  context: v1 _use_aclgraph() returns False when enforce_eager, disabling ACL graph replay
- file: vllm_ascend/worker/model_runner_v1.py:2389
  context: v1 passes force_eager into _determine_batch_execution_and_padding
- file: vllm_ascend/worker/v2/model_runner.py:189
  context: v2 sets self.use_aclgraph = ... and not enforce_eager
- file: vllm_ascend/ascend_config.py:93
  context: 'KVPP validation: requires eager or PIECEWISE cudagraph mode'
- file: vllm_ascend/ascend_config.py:946
  context: enable_sp_by_pass requires not enforce_eager
- file: vllm_ascend/patch/platform/patch_minimax_m2_config.py:116
