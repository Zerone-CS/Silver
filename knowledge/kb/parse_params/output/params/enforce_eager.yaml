related_parameters:
- name: --compilation-config (-cc) / cudagraph_mode
  relation: enforce_eager forces cudagraph_mode to NONE; setting -cc.cudagraph_mode=none is equivalent
- name: --compilation-config (-cc) / mode
  relation: enforce_eager forces CompilationMode.NONE, disabling torch.compile
- name: max_cudagraph_capture_size / cudagraph_capture_sizes
  relation: Zeroed when enforce_eager is set
- name: additional_config.xlite_graph_config.full_mode
  relation: When enabled, platform.py may force enforce_eager=True and disable ACLGraph capture
- name: additional_config.enable_sp_by_pass
  relation: Only enabled when enforce_eager is False
- name: speculative_config.enforce_eager
  relation: Inherits target model enforce_eager; disables draft-model cudagraphs
- name: KVPP (kv_pooling / KVPP feature)
  relation: Requires eager mode or PIECEWISE cudagraph mode
constraints:
- When KVPP is enabled, enforce_eager must be True or cudagraph_mode must be PIECEWISE, otherwise a ValueError is raised.
- When xlite_graph_config.full_mode is enabled, ACLGraph capture is not used and --enforce-eager is recommended; the platform
  may force enforce_eager=True.
- enable_sp_by_pass is silently disabled whenever --enforce-eager is set.
- On Ascend, compilation modes other than NONE or VLLM_COMPILE are not supported and cudagraph_mode is forced to NONE.
tuning_advice:
  summary: Keep --enforce-eager off in production to retain ACL graph replay and torch.compile; enable it only as a fallback
    for graph-capture failures or when a feature (KVPP, xlite full_mode) requires eager mode.
  suggested_values:
  - scenario: Production serving on Ascend NPU with stable ACL graph capture (v1 and v2 workers)
    value: false
    reason: Leaving enforce_eager False keeps use_aclgraph True in both v1 (model_runner_v1.py:822) and v2 (v2/model_runner.py:189)
      runners, enabling graph replay and compile fusion for maximal throughput and lowest latency.
  - scenario: ACL graph capture fails with stream-resource errors (207008 / Insufficient_Stream_Resources)
    value: true
    reason: Docs recommend falling back to eager mode as a temporary mitigation; alternatively reduce cudagraph_capture_sizes
      or max_cudagraph_capture_size first.
  - scenario: KVPP enabled
    value: true
    reason: KVPP validation requires eager mode or PIECEWISE cudagraph mode (ascend_config.py:93-97); eager is the simplest
      supported configuration.
  - scenario: xlite_graph_config.full_mode enabled
    value: true
    reason: Docs state --enforce-eager is recommended with full_mode since ACLGraph capture is not used and the platform may
      force enforce_eager=True (platform.py:1200-1203).
  - scenario: Debugging model correctness or new model bring-up
    value: true
    reason: Eager mode removes graph/compile complexity, isolating model-level issues from capture issues.
  caveats:
  - Do not enable --enforce-eager as a default production setting; it disables ACL graph replay and torch.compile, costing
    substantial decode throughput.
  - Enabling it silently disables enable_sp_by_pass, which may reduce sequence-parallel optimization benefits.
  - When using speculative decoding, enforce_eager propagates to speculative_config.enforce_eager, disabling draft-model cudagraphs
    as well.
  - Prefer tuning cudagraph_capture_sizes / max_cudagraph_capture_size or switching to FULL / FULL_DECODE_ONLY before falling
    back to eager mode.
  quick_guide: Leave --enforce-eager off for performance; turn it on only as a fallback for graph-capture failures or when
    KVPP / xlite full_mode requires eager execution.
