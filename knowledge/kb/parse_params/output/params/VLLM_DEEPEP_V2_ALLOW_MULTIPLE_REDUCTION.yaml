name: VLLM_DEEPEP_V2_ALLOW_MULTIPLE_REDUCTION
type: env
category: communication
scope: vllm
source_file:
- vllm/envs.py:1958
- vllm/envs.py:285
- vllm/distributed/device_communicators/all2all.py:1059
value_type: bool
default: false
valid_choices: 0 or 1 (parsed via int(), truthy when non-zero)
cli_example: null
deprecated: false
performance_impact: low
performance_scope:
- latency
- throughput
impact_detail: 'This env var is read only in vLLM upstream (vllm/envs.py:1958) and passed as the

  `allow_multiple_reduction` kwarg to the DeepEP v2 all-to-all communicator in

  vllm/distributed/device_communicators/all2all.py:1059 (_make_all2all_kwargs).

  Per the inline comment, it "trade[s] precision for transfer size in combine" —

  i.e. it lets the DeepEP v2 combine kernel perform multiple reductions, reducing

  the amount of data transferred at the cost of numerical precision. This can lower

  combine latency and improve throughput for MoE all-to-all dispatch/combine.

  However, DeepEP is a CUDA/NVLink/RDMA-specific library (the surrounding code uses

  torch.cuda, NCCL GIN queries, NVL/RDMA buffers). vllm-ascend does NOT reference

  this env var anywhere in the provided context; Ascend MoE communication uses HCCL

  and its own all-to-all / dispatch-combine implementations, not DeepEP. Therefore on

  Ascend NPU this parameter has no runtime effect — it is only consumed by the

  upstream CUDA DeepEP v2 path. Impact on Ascend is effectively none; classified low

  only because it is a communication-tuning knob in the upstream codebase.

  '
usage_locations:
- file: vllm/envs.py:1958
  context: Environment variable definition; parsed as bool from int, default 0 (false).
