  relation: Related DeepEP buffer sizing parameter for the same communicator.
- name: VLLM_ALL2ALL_BACKEND
  relation: Selects the all-to-all backend; DeepEP v2 path must be active for this flag to matter.
constraints:
- Only takes effect when the DeepEP v2 all-to-all backend is selected; with other all-to-all backends it is ignored.
- Enabling it trades numerical precision for smaller combine transfer size, so it may degrade model accuracy.
- It is a CUDA/NVLink/RDMA DeepEP-specific option and has no effect on Ascend NPU, which uses HCCL-based communication.
tuning_advice:
  summary: Leave disabled on Ascend NPU; it only affects the CUDA DeepEP v2 combine path and has no Ascend effect.
  suggested_values:
  - scenario: Ascend NPU deployment (any v1 or v2 worker)
    value: 0
    reason: vllm-ascend does not consume this variable; Ascend MoE communication uses HCCL, so the flag is a no-op and should
      stay at default.
  - scenario: CUDA GPU with DeepEP v2 and accuracy tolerance for lower combine transfer size
    value: 1
    reason: Upstream comment states it trades precision for transfer size in combine, which can reduce combine latency/throughput
      cost.
  caveats:
  - Do not tune this expecting Ascend gains — it is not wired into vllm-ascend.
  - On CUDA, enabling it may reduce numerical accuracy; benchmark quality before production use.
  quick_guide: Keep at 0 on Ascend; only relevant to CUDA DeepEP v2 combine.
analysis_date: '2026-10-27'
