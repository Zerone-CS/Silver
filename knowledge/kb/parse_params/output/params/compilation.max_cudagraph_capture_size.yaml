value_type: int
default: <computed>
valid_choices: Any positive integer; must equal the largest value in cudagraph_capture_sizes when that list is explicitly
  set. 0 disables capture (set automatically under enforce_eager or CUDAGraphMode.NONE).
cli_example: '--compilation-config ''{"max_cudagraph_capture_size": 512}'''
deprecated: false
performance_impact: high
performance_scope:
- latency
- throughput
- memory
impact_detail: "This field is the upper bound on the token/batch size for which ACLGraph (Ascend's\nCUDA-graph equivalent)\
  \ buckets are captured. It is consumed in several distinct ways:\n\n1. Graph bucket coverage (throughput/latency): vLLM's\
  \ `_set_cudagraph_sizes()` derives\n   `cudagraph_capture_sizes` from this max. Any decode step whose padded token count\n\
  \   exceeds the largest captured bucket falls back to eager execution, which on Ascend\n   is significantly slower and,\
  \ in cross-DP setups, can desync HCCL collectives.\n   vllm_ascend/ascend_config.py:1394-1413 explicitly disables\n   `oproj_tensor_parallel_size`/`mlp_tensor_parallel_size`\
  \ (with a warning) when\n   `max_cudagraph_capture_size` does not cover `max_num_seqs * (1 + num_speculative_tokens)`,\n\
  \   because an oversized step would dispatch to eager and hang cross-DP HCCL collectives.\n\n2. Memory (memory): larger\
  \ capture sizes reserve more NPU memory for graph-private\n   buffers. vllm_ascend/platform.py:361 applies a \"reduced cg\
  \ cap\" (`_get_reduced_cg_cap`)\n   as an Ascend-specific memory-saving override when MC2 is used, then\n   platform.py:1271\
  \ restores it by injecting the reduced cap into\n   `cudagraph_capture_sizes` and resetting `max_cudagraph_capture_size\
  \ = None` before\n   upstream rebuilds the list. So on Ascend the effective value may be silently\n   reduced from what\
  \ the user set.\n\n3. Buffer sizing (memory): several Ascend attention paths size persistent per-request\n   buffers using\
  \ this value — dsa_v1.py:724 (`max_qli_reqs`), dsa_cp.py:293\n   (`max_padded_reqs`), sfa_cp.py:116 (`_pcp_o_proj_token_capacity`),\
  \ and\n   deepseek_v41/model.py:1071 (`_engram_max_tokens`). A larger value directly increases\n   these allocations; a\
  \ too-small value can truncate views and corrupt memory.\n\n4. MC2 token capacity (communication): ascend_forward_context.py:257\
  \ uses it as\n   `max_num_tokens` for computing `_mc2_tokens_capacity` when prefill MC2 is off,\n   which bounds HCCL comm\
  \ buffer sizing.\n\n5. Consistency enforcement: vllm_ascend/utils.py:779 raises ValueError if a user-set\n   max disagrees\
  \ with the max of an explicitly-set `cudagraph_capture_sizes`, otherwise\n   truncates with a warning.\n"
