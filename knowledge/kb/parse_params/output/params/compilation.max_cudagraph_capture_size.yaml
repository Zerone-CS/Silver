related_parameters:
- name: compilation.cudagraph_capture_sizes
  relation: Mutually exclusive with the CLI flag; if set, max must equal its largest element or a ValueError is raised (vllm_ascend/utils.py:779)
- name: compilation.cudagraph_mode
  relation: Set to 0 when mode is NONE; FULL/FULL_DECODE_ONLY benefit most from adequate capture size
- name: enforce_eager
  relation: When true, forces max_cudagraph_capture_size to 0 and disables capture
- name: max_num_seqs
  relation: Upper bound should be >= max_num_seqs * (1 + num_speculative_tokens) to cover decode steps
- name: speculative_config.num_speculative_tokens
  relation: Multiplies per-request token count in decode; raises required capture size
- name: additional_config.oproj_tensor_parallel_size
  relation: Disabled if capture bound does not cover max step (ascend_config.py:1394)
- name: additional_config.mlp_tensor_parallel_size
  relation: Disabled if capture bound does not cover max step (ascend_config.py:1394)
- name: additional_config.enable_prefill_mc2
  relation: When enabled, MC2 token capacity uses max_num_batched_tokens instead of this value
constraints:
- If cudagraph_capture_sizes is explicitly set, max_cudagraph_capture_size must equal the largest element of that list, otherwise
  a ValueError is raised.
- The CLI flag --max-cudagraph-capture-size and compilation_config.max_cudagraph_capture_size are mutually exclusive; setting
  both raises a ValueError.
- When enforce_eager is true or cudagraph_mode resolves to NONE, max_cudagraph_capture_size is forced to 0 and cudagraph_capture_sizes
  to an empty list.
- To keep oproj_tensor_parallel_size / mlp_tensor_parallel_size enabled, max_cudagraph_capture_size must be >= min(max_num_batched_tokens,
  max_num_seqs * (1 + num_speculative_tokens)).
tuning_advice:
  summary: Set max_cudagraph_capture_size to cover the largest realistic decode step (max_num_seqs * (1 + num_speculative_tokens)
    per DP rank) while staying within NPU memory for graph capture.
  suggested_values:
  - scenario: Uniform decode workload, no speculative decoding, DP=1
    value: max_num_seqs
    reason: Covers the largest decode batch so all decode steps hit captured graphs; avoids eager fallback.
  - scenario: EAGLE3/MTP speculative decoding with num_speculative_tokens=3, DP2, max_num_seqs=256
    value: 1024
    reason: Per-rank batch is 128 requests * 4 tokens = 512; setting 1024 gives headroom for concurrency growth to 257+ per
      the MiniMax-M3 doc guidance.
  - scenario: Memory-constrained single-card deployment (e.g. Dots3-Note)
    value: 16
    reason: Doc example uses max_cudagraph_capture_size=16 = max_num_seqs(4) * (1+num_spec_tokens(3)); keeps graph capture
      peak memory low.
  - scenario: ACLGraph capture fails with insufficient stream resources
    value: reduce current value
    reason: graph_mode.md recommends lowering max_cudagraph_capture_size to mitigate capture failures.
  caveats:
  - On Ascend the value may be silently reduced by the MC2 reduced-cg-cap override; verify effective capture sizes in logs.
  - Keep max_cudagraph_capture_size consistent with cudagraph_capture_sizes to avoid ValueError or truncation warnings.
  - If you rely on oproj/mlp tensor parallelism, ensure the bound covers the max step or those features are disabled with
    a warning.
  quick_guide: Set to max_num_seqs * (1 + num_speculative_tokens) per DP rank; raise to 1024 for high-concurrency spec-decode,
    lower to reduce graph memory.
