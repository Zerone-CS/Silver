name: compilation.max_cudagraph_capture_size
type: nested
category: compilation
scope: both
source_file:
- vllm/engine/arg_utils.py:1661
- vllm/engine/arg_utils.py:2606
- vllm/config/vllm.py:1029
- vllm/config/vllm.py:1783
