name: VLLM_ALLREDUCE_USE_FLASHINFER
type: env
category: communication
scope: vllm
source_file:
- vllm/envs.py:1860
- vllm/envs.py:267
- vllm/distributed/device_communicators/cuda_communicator.py:65
- vllm/distributed/device_communicators/flashinfer_all_reduce.py:191
value_type: bool
default: true
valid_choices: 0 or 1 (boolean)
cli_example: null
deprecated: false
performance_impact: low
performance_scope:
- latency
- throughput
impact_detail: 'This env var gates the FlashInfer all-reduce backend in vLLM''s CUDA device

  communicator (vllm/distributed/device_communicators/cuda_communicator.py:65).

  When enabled (default 1) and the group is a TP group and VLLM_BATCH_INVARIANT

  is off, `use_flashinfer_allreduce` is set True, causing the communicator to

  build a FlashInfer-based all-reduce workspace

  (flashinfer_all_reduce.py:191) instead of the default custom all-reduce /

  torch symmetric-memory path. FlashInfer all-reduce is a CUDA/NVSwitch

  (mnnvl) or trtllm-based kernel that can lower TP all-reduce latency on

  NVIDIA GPUs. On Ascend NPU, however, FlashInfer is a CUDA-only library and

  is not used: "vllm-ascend replaces the device communicator with its own"

  NPUCommunicator built on HCCL (torch_npu.distributed / HCCL all-reduce).

  The cuda_communicator.py code path that reads this env var is never

  exercised on Ascend, so the parameter has no effect on Ascend runtime

  performance. It only matters for NVIDIA GPU deployments. Because the

  parameter is inert on Ascend, its impact on Ascend NPU is effectively none;

  it is classified low only because it is a communication-backend selector

  that would be high-impact on the platform where it is actually honored.

  '
usage_locations:
- file: vllm/distributed/device_communicators/cuda_communicator.py:65
  context: Selects FlashInfer all-reduce for TP groups when enabled and batch-invariant mode is off; CUDA-only path.
- file: vllm/distributed/device_communicators/flashinfer_all_reduce.py:191
  context: Sizes the FlashInfer all-reduce workspace based on tuned standalone max size when the flag is set.
- file: vllm/envs.py:1860
  context: Environment variable definition, default '1'.
- file: vllm/envs.py:267
  context: 'Type stub declaration VLLM_ALLREDUCE_USE_FLASHINFER: bool = True.'
related_parameters:
- name: VLLM_ALLREDUCE_USE_SYMM_MEM
  relation: Alternative all-reduce backend (torch symmetric memory); both are TP-only and mutually competing backends.
- name: VLLM_ALLREDUCE_USE_FLASHINFER_PCIE_IPC
  relation: Sibling FlashInfer PCIe CUDA-IPC all-reduce backend, also gated off by VLLM_BATCH_INVARIANT.
- name: VLLM_BATCH_INVARIANT
  relation: When enabled, disables FlashInfer all-reduce (no fixed reduction order).
- name: VLLM_FLASHINFER_ALLREDUCE_BACKEND
  relation: Selects the FlashInfer all-reduce backend (mnnvl/trtllm) used when this flag is on.
constraints:
- FlashInfer all-reduce is only applied to tensor-parallel (tp) groups; for any other group name the flag is forced off.
- Enabling VLLM_BATCH_INVARIANT disables FlashInfer all-reduce regardless of this flag, because FlashInfer does not provide
  a fixed reduction order.
- FlashInfer all-reduce with the 'trtllm' backend is not supported for multi-node all-reduce and raises a ValueError; use
  the 'mnnvl' backend for multi-node.
- This parameter only affects the CUDA device communicator; on Ascend NPU the HCCL-based NPUCommunicator is used and this
  flag is not consulted.
tuning_advice:
  summary: Irrelevant on Ascend NPU — leave at default; only tune on NVIDIA GPU deployments where FlashInfer all-reduce is
    available.
  suggested_values:
  - scenario: Ascend NPU deployment (v1 or v2 worker)
    value: '1'
    reason: The flag is never read on Ascend because vllm-ascend uses HCCL-based NPUCommunicator; leaving the default avoids
      confusion and has no runtime effect.
  - scenario: NVIDIA GPU with NVSwitch, TP all-reduce latency sensitive
    value: '1'
    reason: Enables FlashInfer mnnvl all-reduce which can reduce TP all-reduce latency on supported hardware.
  - scenario: NVIDIA GPU requiring deterministic/batch-invariant results
    value: '0'
    reason: FlashInfer all-reduce has no fixed reduction order and is auto-disabled by VLLM_BATCH_INVARIANT; set explicitly
      to avoid ambiguity.
  caveats:
  - Do not expect any throughput or latency change on Ascend NPU from this variable.
  - On Ascend, tune HCCL-related settings (e.g. HCCL buffers, VLLM_ASCEND_ENABLE_FLASHCOMM1) instead of CUDA all-reduce backends.
  - On GPU, multi-node requires the mnnvl backend; trtllm backend raises for multi-node.
  quick_guide: 'Ascend: ignore (no effect). GPU: keep default 1 unless you need deterministic execution.'
analysis_date: '2026-10-27'
