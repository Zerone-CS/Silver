performance_impact: low
performance_scope:
- latency
impact_detail: 'This is a debug-only environment variable read in vllm/envs.py (VLLM_PATTERN_MATCH_DEBUG,

  default None). It is consumed exclusively by the with_pattern_match_debug decorator in

  vllm/compilation/passes/pass_manager.py:82. When set to a non-None value, the decorator wraps

  the custom compilation pass call in set_env_var("TORCHINDUCTOR_PATTERN_MATCH_DEBUG", debug_val),

  which turns on Inductor''s built-in pattern-match debug logging for the duration of that pass.

  When unset (the default), the decorator simply calls fn(*args, **kwargs) with no overhead.

  The performance effect is therefore limited to the compilation phase: "enabling it causes"

  Inductor to emit verbose pattern-match diagnostics, adding logging overhead during torch.compile

  graph lowering. It does not affect steady-state inference throughput or memory. On Ascend,

  vllm-ascend does not reference this variable; it only matters if the Ascend backend path goes

  through vLLM''s custom compilation pass manager (torch.compile / Inductor-based compilation).

  For Ascend-native graph compilation (ACLGraph / CANN), this flag has no effect.

  '
usage_locations:
