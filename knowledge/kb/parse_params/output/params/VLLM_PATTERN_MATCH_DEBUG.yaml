constraints:
- The value must be a valid fx.Node name string (e.g. 'getitem_34' or 'scaled_mm_3'); an invalid name will not match any node
  and produces no useful debug output.
- This variable only has an effect when vLLM's custom compilation passes run through torch.compile/Inductor; it is ignored
  on Ascend-native graph compilation paths.
tuning_advice:
  summary: Leave unset for production; only set to a specific fx.Node name when debugging Inductor pattern-match failures
    during compilation.
  suggested_values:
  - scenario: Production inference on Ascend NPU
    value: unset
    reason: Default None means the decorator adds no overhead; enabling it only adds compile-time logging noise.
  - scenario: Debugging a specific custom pass pattern match during torch.compile on Ascend
    value: getitem_34
    reason: Set to the fx.Node name you want Inductor to trace; matches the documented example format.
  caveats:
  - Only affects the compilation phase; no impact on runtime throughput or memory.
  - Has no effect on Ascend-native (ACLGraph/CANN) compilation paths that bypass Inductor.
  quick_guide: Keep unset unless debugging Inductor pattern matching; set to an fx.Node name only for compile-time diagnostics.
