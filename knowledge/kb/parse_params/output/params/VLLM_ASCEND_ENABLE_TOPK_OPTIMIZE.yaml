related_parameters:
- name: VLLM_ASCEND_ENABLE_FUSED_MC2
  relation: Both are Ascend performance feature toggles commonly enabled together for MoE models; fused MC2 is set via --additional-config
    enable_fused_mc2.
- name: VLLM_ASCEND_ENABLE_MLAPO
  relation: Another Ascend performance feature toggle (enable_mlapo) frequently combined with topk optimize in the same deployment.
- name: --quantization ascend
  relation: The GLM4.x docs pair this flag with W8A8 quantized models (--quantization ascend); the optimization is most relevant
    for quantized MoE models.
constraints:
- 'The value is interpreted as a boolean: only ''0'', empty string, ''false'' or ''False'' disable it; any other value (including
  ''1'') enables it.'
- This is a vllm-ascend-only environment variable; it has no effect on upstream vLLM GPU execution.
tuning_advice:
  summary: Enable VLLM_ASCEND_ENABLE_TOPK_OPTIMIZE=1 for MoE/quantized models (e.g. GLM-4.x W8A8) to reduce top-k routing
    overhead and improve decode latency/throughput on Ascend NPU.
  suggested_values:
  - scenario: GLM-4.x W8A8 (floatmtp) MoE deployment on Ascend, single or multi-node
    value: '1'
    reason: The GLM4.x tutorial explicitly exports VLLM_ASCEND_ENABLE_TOPK_OPTIMIZE=1 in all launch scripts, indicating it
      is the recommended performance setting for this model family.
  - scenario: Default / non-MoE or unverified models
    value: '0'
    reason: Leave disabled unless the model benefits from the top-k optimization; the default is off and the optimization
      is model-specific.
  caveats:
  - Benchmark with and without the flag on your target hardware to confirm the gain; the optimization is model-dependent.
  - Combine with other Ascend performance toggles (fused MC2, MLAPO) as shown in the GLM4.x docs for best results.
  - Ensure the value is exactly '1' (or any non-false string) to enable; '0' disables.
  quick_guide: export VLLM_ASCEND_ENABLE_TOPK_OPTIMIZE=1 for MoE/quantized models like GLM-4.x W8A8; leave 0 otherwise.
analysis_date: '2026-10-27'
