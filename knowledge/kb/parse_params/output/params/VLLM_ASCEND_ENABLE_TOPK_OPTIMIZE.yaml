- tests/e2e/common/multi_node/internal_dp/test_multi_node.py:30
- tests/e2e/common/single_node/test_single_node.py:348
- docs/source/tutorials/models/GLM4.x.md:138
value_type: bool
default: '0'
valid_choices: 0 or 1 (any value not in ('0', '', 'false', 'False') is treated as enabled)
cli_example: null
deprecated: false
performance_impact: medium
performance_scope:
- latency
- throughput
impact_detail: 'VLLM_ASCEND_ENABLE_TOPK_OPTIMIZE is an Ascend-specific environment flag that enables a

  top-k optimization path in the vllm-ascend model execution (notably for MoE / fused-MoE

  style models such as GLM-4.x W8A8 with MTP, per the GLM4.x tutorial). The provided context

  only shows the flag being consumed by the e2e test harnesses (tests/e2e/common/...), where

  it is read as a boolean feature toggle: "any value other than \"0\", \"\", \"false\", \"False\" is"

  treated as enabled and recorded as the "topk_optimize" feature in benchmark result metadata.

  The actual kernel-level effect lives in the vllm-ascend runtime (not shown in this context),

  where enabling the top-k optimization reduces the cost of the top-k selection / routing step

  in MoE layers, lowering per-token latency and improving decode throughput. Because the

  optimization is a compute-path change (not a memory-allocation change), its primary impact is

  on latency/throughput rather than memory footprint. The docs recommend enabling it (=1) in the

  GLM-4.7-W8A8-floatmtp deployment scripts, indicating it is a recommended performance toggle

  for that model family.

  '
usage_locations:
