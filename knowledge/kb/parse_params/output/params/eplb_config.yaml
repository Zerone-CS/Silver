name: --eplb-config
type: cli
category: parallelism
scope: both
source_file:
- vllm/engine/arg_utils.py:1234
- vllm/config/parallel.py:185
- vllm_ascend/ascend_config.py:279
- vllm_ascend/platform.py:960
- vllm_ascend/patch/platform/patch_eplb.py:152
- vllm_ascend/patch/platform/patch_fused_moe.py:138
value_type: dict
default: '{}'
valid_choices: 'EPLBConfig fields: use_async (bool), policy (''default''|''stair''), communicator (''torch_nccl''|''torch_gloo''|''nixl''|''pynccl''|None),
  num_redundant_experts (int), log_balancedness (bool), log_balancedness_interval (int); Ascend additional_config.eplb_config
  fields: dynamic_eplb, expert_map_path, expert_heat_collection_interval, algorithm_execution_interval, expert_map_record_path,
  num_redundant_experts, eplb_policy_type, eplb_heat_collection_stage, load_collection_phase, stair_config'
cli_example: '--eplb-config ''{"num_redundant_experts": 32, "use_async": true, "communicator": "torch_gloo", "policy": "stair"}'''
deprecated: false
performance_impact: high
performance_scope:
- throughput
- latency
- memory
impact_detail: "--eplb-config controls Expert Parallelism Load Balancing (EPLB) for MoE models. On Ascend it is\nsplit across\
  \ two schemas:\n(1) Upstream vLLM EPLBConfig (vllm/config/parallel.py:185) is used by Model Runner V2. It carries\n    num_redundant_experts\
  \ (extra physical expert slots that absorb hot-expert load), use_async\n    (non-blocking expert weight movement), policy\
  \ (\"default\" or \"stair\"), and communicator.\n    num_redundant_experts directly increases per-rank expert weight memory\
  \ (num_experts +\n    num_redundant_experts physical slots) but reduces MoE token imbalance, which raises effective\n  \
  \  MoE throughput. use_async=True overlaps expert migration with compute, hiding rebalancing\n    latency; synchronous EPLB\
  \ stalls the forward pass during migration.\n(2) Ascend legacy EplbConfig (vllm_ascend/ascend_config.py:279) is used by\
  \ Model Runner V1 via\n    additional_config[\"eplb_config\"]. It carries dynamic_eplb, expert_map_path,\n    expert_heat_collection_interval,\
  \ algorithm_execution_interval, num_redundant_experts,\n    eplb_policy_type (0=Random,1=DefaultEplb,2=SwiftBalanceEplb,3=FlashLB),\
  \ and\n    eplb_heat_collection_stage. These drive the Ascend-native EPLB worker that periodically\n    recomputes expert\
  \ placement from collected heat statistics.\nvllm_ascend/platform.py:960 (_validate_eplb_config) enforces the split: under\
  \ Model Runner V2 only\nload_collection_phase and stair_config are accepted in additional_config.eplb_config, and the\n\
  upstream communicator must be torch_gloo or hixl (NCCL/pynccl rejected due to multi-stream\nconflicts). Synchronous EPLB\
  \ is force-disabled (use_async forced True) on Ascend.\nvllm_ascend/patch/platform/patch_fused_moe.py:138 propagates Ascend\
  \ num_redundant_experts into the\nupstream fused-MoE factory so redundant expert slots exist at weight-load time; a mismatch\
  \ between\nupstream and Ascend redundant counts raises ValueError.\nvllm_ascend/patch/platform/patch_eplb.py:152 clamps\
  \ unset STAIR transfer limits to 1 when EPLB\nfalls back to torch_gloo (CPU-staged transfers cannot sustain a migration\
  \ storm), which throttles\ncross-node expert movement and thus rebalancing speed.\nNet effect: \"EPLB trades extra NPU memory\
  \ (redundant experts) for reduced MoE load imbalance and\"\nhigher steady-state throughput; async + STAIR policy + Gloo/hixl\
  \ communicator are the Ascend path.\n"
