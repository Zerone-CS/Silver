related_parameters:
- name: --enable-eplb
  relation: Must be set for EPLB to activate; MRv2 requires --enable-eplb, MRv1 uses additional_config eplb_config instead
- name: --enable-expert-parallel
  relation: EPLB only meaningful when expert parallelism is enabled on MoE models
- name: --all2all-backend
  relation: Determines MoE dispatch/combine path that EPLB rebalancing optimizes
- name: additional_config.eplb_config
  relation: Ascend MRv1 schema; MRv2 uses upstream --eplb-config instead, mixing schemas fails at startup
- name: --expert-placement-strategy
  relation: Initial expert placement (linear/round_robin) that EPLB later rebalances
constraints:
- Under Model Runner V2, additional_config.eplb_config may only contain load_collection_phase and stair_config; any other
  field raises ValueError.
- Under Model Runner V2, DYNAMIC_EPLB and EXPERT_MAP_RECORD env vars must be unset; use --enable-eplb instead or startup fails.
- additional_config.eplb_config.load_collection_phase other than 'all' requires --enable-eplb.
- On Ascend, the upstream eplb_config.communicator must be torch_gloo or hixl (or unset); torch_nccl/pynccl raise ValueError.
- Synchronous EPLB (use_async=False) is not supported on Ascend and is forced to asynchronous.
- Async EPLB requires the default policy; setting use_async with a non-default policy raises ValueError.
- expert_map_path must point to an existing readable .json file or a TypeError/ValueError is raised.
- expert_map_record_path must end in .json; setting it implicitly enables dynamic_eplb.
- Conflicting num_redundant_experts between upstream and Ascend config raises ValueError.
- All DP workers must use identical EPLB-related config (enable_eplb, eplb_config.log_balancedness) or a config-hash mismatch
  RuntimeError is raised.
tuning_advice:
  summary: Enable EPLB for large MoE deployments to cut expert load imbalance; on Ascend use async Gloo/hixl with STAIR policy
    and size num_redundant_experts to available NPU memory.
  suggested_values:
  - scenario: Model Runner V2, large MoE (e.g. DeepSeek) with EP across many NPUs, memory headroom available
    value: '{"num_redundant_experts": 32, "use_async": true, "communicator": "torch_gloo", "policy": "stair"}'
    reason: Redundant experts absorb hot-expert load; async Gloo movement overlaps migration with compute; STAIR is the Ascend
      default policy.
  - scenario: Model Runner V2, memory-constrained deployment
    value: '{"num_redundant_experts": 0, "use_async": true, "communicator": "torch_gloo"}'
    reason: Zero redundant experts avoids extra per-rank expert weight memory while keeping async EPLB plumbing ready.
  - scenario: Model Runner V1 (legacy Ascend schema via additional_config)
    value: '{"dynamic_eplb": true, "num_redundant_experts": 16, "eplb_policy_type": 2, "expert_heat_collection_interval":
      600, "algorithm_execution_interval": 50}'
    reason: SwiftBalanceEplb (type 2) is the Ascend default; heat collection every 600 iterations balances responsiveness
      vs overhead.
  - scenario: Multi-node EPLB where cross-node migration is undesirable
    value: '{"stair_config": {"cross_node_transfer_limit": 0}}'
    reason: Explicitly disabling cross-node transfers is preserved even on Gloo fallback; unset limits are clamped to 1.
  caveats:
  - On Ascend, synchronous EPLB is silently forced to async; do not rely on use_async=False.
  - torch_nccl/pynccl communicators are rejected on Ascend due to NCCL multi-stream conflicts; use torch_gloo or hixl.
  - When EPLB falls back to torch_gloo, unset STAIR transfer limits are clamped to 1, throttling migration; set limits explicitly
    if you need more aggressive rebalancing.
  - num_redundant_experts increases per-rank expert weight memory (num_experts + redundant slots); size it against available
    NPU HBM.
  - MRv1 and MRv2 use different schemas; mixing them fails at startup rather than being silently ignored.
  - All DP workers must share identical EPLB config or a config-hash mismatch error occurs.
  quick_guide: 'For MoE on Ascend MRv2: --enable-eplb plus --eplb-config with use_async=true, communicator=torch_gloo/hixl,
    policy=stair, and num_redundant_experts sized to memory headroom.'
