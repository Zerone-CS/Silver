name: --data-parallel-size
type: cli
category: parallelism
scope: both
source_file:
- vllm/config/parallel.py:129
- vllm/engine/arg_utils.py:1127
- vllm/engine/arg_utils.py:496
- vllm/engine/arg_utils.py:2188
- vllm_ascend/ascend_config.py:691
- vllm_ascend/ascend_config.py:1437
- vllm_ascend/patch/platform/patch_balance_schedule.py:142
- vllm_ascend/patch/platform/patch_engram_config.py:35
- vllm_ascend/patch/platform/patch_parallel_config.py:26
- vllm_ascend/platform.py:1097
- vllm_ascend/platform.py:1321
- vllm_ascend/worker/model_runner_v1.py:419
value_type: int
default: 1
valid_choices: integer >= 1
cli_example: --data-parallel-size 2
deprecated: false
performance_impact: high
performance_scope:
- throughput
- latency
- memory
impact_detail: "--data-parallel-size (alias -dp) controls the number of data-parallel replicas.\nEach DP rank runs an independent\
  \ copy of the model (attention weights replicated)\nand processes its own batch of requests, so raising DP multiplies aggregate\n\
  throughput and total KV-cache capacity roughly linearly, at the cost of\nreplicating model weights per rank (memory) and\
  \ requiring cross-DP coordination.\n\nUpstream (vllm/config/parallel.py:129): data_parallel_size is a Field(default=1, ge=1).\n\
  MoE layers are sharded according to tensor_parallel_size * prefill_context_parallel_size\n* data_parallel_size, so DP directly\
  \ changes the expert-sharding plane and thus\nper-rank expert weight footprint and all-to-all communication volume.\n\n\
  Ascend-specific effects:\n- \"vllm_ascend/worker/model_runner_v1.py:419 reads data_parallel_size into\"\n  self.dp_size,\
  \ which drives DP-aware token routing / dummy-batch handling in the\n  v1 model runner. DP>1 introduces per-step DP synchronization\
  \ collectives\n  (dp_sync_interval controls their frequency) that add latency.\n- \"vllm_ascend/patch/platform/patch_balance_schedule.py:142\
  \ allocates a per-DP-rank\"\n  balance_queue and runs an all_gather across the DP group each busy-loop iteration\n  when\
  \ balance scheduling is enabled (requires DP>1). This is a per-step collective\n  that scales with DP size.\n- \"vllm_ascend/platform.py:1321\
  \ passes data_parallel_size into\"\n  compilation_config.set_splitting_ops_for_v1, which affects graph splitting /\n  cudagraph\
  \ behavior (e.g. DeepEP high-throughput disables cudagraphs when DP>1).\n- \"vllm_ascend/patch/platform/patch_parallel_config.py:26\
  \ overrides\"\n  use_sequence_parallel_moe to drop upstream's DP>1 requirement, so on Ascend\n  FlashComm/SP MoE can run\
  \ at DP=1 — meaning DP is not required to get SP benefits.\n- \"vllm_ascend/ascend_config.py:691 auto-enables engram dp_shared_memory\
  \ when DP>1\"\n  (or PCP>1) under the v2 model runner, sharing host tables across DP peers to\n  avoid per-step lookup collectives.\n\
  - \"vllm_ascend/ascend_config.py:1437 requires finegrained_tp_config module sizes to\"\n  divide data_parallel_size.\n-\
  \ \"vllm_ascend/platform.py:1097 requires DP>1 for DyntraLB decode-side load balancing.\"\n"
