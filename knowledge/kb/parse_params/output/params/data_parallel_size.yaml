related_parameters:
- name: --tensor-parallel-size
  relation: MoE sharding plane = TP * PCP * DP; world size = DP * PP * TP * PCP.
- name: --prefill-context-parallel-size
  relation: Combined with DP in MoE sharding and world size; PCP>1 also triggers engram dp_shared_memory.
- name: --pipeline-parallel-size
  relation: Multiplies into total world size; must divide nnodes together with DP.
- name: --enable-expert-parallel
  relation: EP shards experts across the DP*TP plane; DP>1 shards expert weights across DP even with EP off.
- name: --data-parallel-size-local
  relation: Number of DP replicas on this node; must be consistent with total DP size.
- name: --data-parallel-rank
  relation: Enables external LB mode for MoE DP deployments; requires DP>1.
- name: --dp-sync-interval
  relation: Controls frequency of DP finish-sync all-reduces; must match across DP ranks.
- name: --enable-balance-scheduling
  relation: Balance scheduling requires DP>1 and adds per-step DP all_gather.
- name: --all2all-backend
  relation: DeepEP high-throughput disables cudagraphs when DP>1.
- name: finegrained_tp_config
  relation: Module TP sizes must divide data_parallel_size.
- name: dyntra_lb_config
  relation: Requires data_parallel_size > 1 on PD-disaggregated decode nodes.
constraints:
- --data-parallel-size must be an integer greater than or equal to 1.
- When --nnodes is greater than 1, the total world size (data_parallel_size × pipeline_parallel_size × tensor_parallel_size
  × prefill_context_parallel_size) must be evenly divisible by --nnodes.
- When --nnodes is greater than 1, --data-parallel-backend must be mp (Ray backend is not allowed with multi-node).
- finegrained_tp_config module TP sizes (oproj/lmhead/embedding/mlp tensor_parallel_size) must divide data_parallel_size.
- DyntraLB (dyntra_lb_config.enabled) requires data_parallel_size > 1 and all DP ranks on a single node.
- Engram dp_shared_memory requires data_parallel_size > 1 or prefill_context_parallel_size > 1.
- mm_tensor_ipc='torch_shm' is not supported when data_parallel_size > 1 (or TP>1 or PP>1).
- Engram embedding_across_dp is not supported with elastic EP when data_parallel_size > 1.
tuning_advice:
  summary: Increase --data-parallel-size to scale throughput and KV-cache capacity for MoE models, but keep DP small enough
    that per-step DP sync overhead and weight replication stay acceptable on Ascend NPU.
  suggested_values:
  - scenario: Single-node dense model, latency-sensitive
    value: 1
    reason: DP>1 adds sync collectives without MoE sharding benefit; keep DP=1 and scale with TP instead.
  - scenario: MoE model, throughput-oriented, single node with multiple NPUs
    value: 2
    reason: DP=2 shards expert weights across the DP×TP plane and doubles aggregate throughput while keeping DP sync overhead
      modest.
  - scenario: Large MoE with expert parallelism across many NPUs
    value: 4
    reason: Higher DP increases aggregate KV-cache and throughput; combine with --enable-expert-parallel and monitor DP sync
      cost.
  - scenario: PD-disaggregated decode node using DyntraLB
    value: 2
    reason: DyntraLB requires data_parallel_size > 1 and all DP ranks on one node; DP=2 is the minimum viable setting.
  caveats:
  - Verify finegrained_tp_config module sizes divide data_parallel_size before enabling fine-grained TP.
  - When using multi-node (--nnodes > 1), ensure DP×PP×TP×PCP is divisible by nnodes and use --data-parallel-backend mp.
  - Avoid deepep_high_throughput with DP>1 if decode cudagraphs are needed; use deepep_low_latency or allgather_reducescatter
    instead.
  - On Ascend, DP=1 still supports FlashComm/SP MoE, so do not raise DP solely to enable sequence parallelism.
  quick_guide: Set --data-parallel-size to the number of model replicas you want; use >1 for MoE throughput scaling, keep
    1 for latency-sensitive dense workloads.
