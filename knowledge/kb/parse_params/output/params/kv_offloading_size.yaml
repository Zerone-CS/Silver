related_parameters:
- name: --kv-offloading-backend
  relation: Selects the offloading backend (native/lmcache); offloading only activates when --kv-offloading-size is set. For
    lmcache the size is not propagated.
- name: --gpu-memory-utilization
  relation: Determines NPU HBM KV cache size; offloading supplements it with CPU memory when HBM is exhausted.
- name: --kv-cache-memory-bytes
  relation: Alternative explicit control of NPU KV cache size; offloading adds a CPU tier on top.
- name: --enable-prefix-caching
  relation: Offloaded KV blocks can be reused across requests; prefix caching interacts with offload hit behavior.
- name: VLLM_USE_SIMPLE_KV_OFFLOAD
  relation: Env var that switches native backend connector from OffloadingConnector to SimpleCPUOffloadConnector.
constraints:
- KV offloading is only activated when --kv-offloading-size is set; if it is None the backend setting is ignored and no offloading
  occurs.
- When --kv-offloading-backend is lmcache, --kv-offloading-size is not propagated to the connector; capacity is managed by
  the standalone LMCache server.
- The value is interpreted in GiB and converted to bytes via kv_offloading_size * (1 << 30) for the native backend.
- When TP > 1, the value is the total buffer size summed across all TP ranks, not per-rank.
tuning_advice:
  summary: Enable KV offloading with a modest CPU buffer only when NPU HBM KV cache is the throughput bottleneck (long context
    / high concurrency); otherwise leave it unset to avoid host-copy latency.
  suggested_values:
  - scenario: Default / latency-sensitive serving where HBM KV cache is sufficient
    value: unset
    reason: Leaving --kv-offloading-size unset disables offloading entirely, avoiding NPU<->CPU KV copy overhead and host
      memory usage.
  - scenario: Long-context or high-concurrency serving where NPU HBM KV cache limits batch size
    value: 4.0
    reason: A small CPU buffer (a few GiB) can hold evicted KV blocks and raise effective concurrency/throughput; start small
      and measure latency impact.
  - scenario: Multi-rank TP deployment
    value: 8.0
    reason: When TP > 1 the value is the total across all TP ranks, so size it as the aggregate CPU buffer you can afford
      on the host.
  caveats:
  - Measure end-to-end latency after enabling; offload/reload copies can dominate for short requests.
  - Ensure host DRAM has room for the configured buffer plus other host processes.
  - Verify the chosen --kv-offloading-backend is supported by your vllm-ascend version before relying on it.
  quick_guide: Leave unset unless HBM KV cache is the bottleneck; then set a few GiB and watch latency.
analysis_date: '2026-10-27'
