name: --kv-offloading-size
type: cli
category: kv_cache
scope: vllm
source_file:
- vllm/config/cache.py:237
- vllm/engine/arg_utils.py:1323
- vllm/engine/arg_utils.py:777
- vllm/engine/arg_utils.py:2121
- vllm/config/vllm.py:1038
- vllm/config/vllm.py:1055
value_type: float
default: null
valid_choices: Any positive float (GiB); None disables KV offloading
cli_example: --kv-offloading-size 4.0
deprecated: false
performance_impact: medium
performance_scope:
- throughput
- memory
impact_detail: 'This is an upstream vLLM parameter (vllm/config/cache.py:237, CacheConfig.kv_offloading_size).

  No vllm-ascend override or reference was found in the provided context, so on Ascend it flows

  through the same upstream path: "EngineArgs -> CacheConfig -> VllmConfig._post_init_kv_transfer_config"

  (vllm/config/vllm.py:1038-1066). When set to a non-None value, vLLM enables KV cache offloading

  to CPU by auto-configuring KVTransferConfig: "for the \"native\" backend it selects"

  "OffloadingConnector" (or "SimpleCPUOffloadConnector" when VLLM_USE_SIMPLE_KV_OFFLOAD is set) and

  writes cpu_bytes_to_use = kv_offloading_size * (1 << 30) into kv_connector_extra_config

  (vllm/config/vllm.py:1055). For the "lmcache" backend it selects "LMCacheMPConnector" and does

  NOT propagate the size (capacity owned by the standalone LMCache server).

  Performance mechanism: "enabling offloading adds a CPU-side KV cache tier. This can increase"

  effective KV cache capacity (allowing larger batches / higher concurrency and thus higher

  throughput when NPU HBM KV cache is the bottleneck), but every offload/reload of KV blocks

  moves data over PCIe/host interconnect between NPU HBM and CPU DRAM, adding latency and

  consuming host memory and PCIe bandwidth. On Ascend NPU, HBM is typically the scarce resource,

  so offloading can help long-context / high-concurrency serving, but the NPU<->CPU copy path

  (via host memory, not HCCL) becomes a new bottleneck. The parameter itself does not change

  compute kernels or graph capture; it changes the KV cache tiering and connector selection.

  '
usage_locations:
- file: vllm/config/cache.py:237
  context: CacheConfig field definition and docstring; None disables offloading
- file: vllm/engine/arg_utils.py:1323
  context: CLI flag --kv-offloading-size registered in CacheConfig argument group
- file: vllm/engine/arg_utils.py:777
  context: EngineArgs field mirroring CacheConfig.kv_offloading_size
- file: vllm/engine/arg_utils.py:2121
  context: Passed into CacheConfig construction in create_engine_config
- file: vllm/config/vllm.py:1038
  context: Early return when kv_offloading_size is None (offloading disabled)
- file: vllm/config/vllm.py:1055
