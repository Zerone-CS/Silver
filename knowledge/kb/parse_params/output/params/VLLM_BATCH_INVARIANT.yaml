related_parameters:
- name: rl_config.enable_batch_invariant
  relation: When true, sets VLLM_BATCH_INVARIANT=1 before workers start
- name: HCCL_DETERMINISTIC
  relation: Set to 'strict' by worker-side batch-invariant init
- name: LCCL_DETERMINISTIC
  relation: Set to '1' by worker-side batch-invariant init
- name: disable_custom_all_reduce
  relation: Forced True when VLLM_BATCH_INVARIANT is set
- name: weight_nz_mode
  relation: RL mode (which may enable batch invariant) forces weight_nz_mode=0
- name: COMPILE_CUSTOM_KERNELS
  relation: Batch-invariant custom ops require building vllm-ascend from source with COMPILE_CUSTOM_KERNELS=1
constraints:
- Batch-invariant mode requires building vllm-ascend from source with VLLM_BATCH_INVARIANT=1 (and COMPILE_CUSTOM_KERNELS=1)
  so the batch_invariant_ops custom operator library is built and installed.
- Batch invariance requires custom operators for Atlas A2, A3, and 950PR&950DT products; on unsupported hardware or when Triton/AscendC
  batch-invariant ops are unavailable, initialization is skipped with a warning and determinism is not guaranteed.
- When VLLM_BATCH_INVARIANT is set, all vllm-ascend custom ops are disabled (enable_custom_op returns False).
- When rl_config.enabled is false, all other rl_config sub-fields including enable_batch_invariant are ignored.
tuning_advice:
  summary: Enable only when deterministic, batch-composition-independent output is required; otherwise leave disabled to keep
    Ascend custom kernels and fused paths.
  suggested_values:
  - scenario: RL training-inference consistency / validation requiring deterministic output
    value: '1'
    reason: Deterministic output independent of batch composition is required for validation to succeed; use rl_config.enable_batch_invariant
      or set VLLM_BATCH_INVARIANT=1.
  - scenario: Standard high-throughput serving
    value: '0'
    reason: Keeps Ascend custom ops, fused all-reduce+RMSNorm, custom all-reduce, and fused FIA paths enabled for maximum
      throughput.
  caveats:
  - Must build vllm-ascend from source with VLLM_BATCH_INVARIANT=1 and COMPILE_CUSTOM_KERNELS=1 to get the batch-invariant
    operator library.
  - Expect lower throughput and higher latency; benchmark before deploying in latency-sensitive serving.
  - Pair with HCCL_DETERMINISTIC=strict and LCCL_DETERMINISTIC=1 for full determinism across collectives.
  quick_guide: Set VLLM_BATCH_INVARIANT=1 only for deterministic RL/validation workloads; keep 0 for throughput.
analysis_date: '2026-10-27'
