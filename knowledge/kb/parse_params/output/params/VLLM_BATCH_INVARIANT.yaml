name: VLLM_BATCH_INVARIANT
type: env
category: other
scope: both
source_file:
- vllm/envs.py:619
- vllm_ascend/batch_invariant.py:175
- vllm_ascend/ascend_config.py:393
- vllm_ascend/utils.py:561
- vllm_ascend/sample/sampler.py:96
- vllm_ascend/attention/attention_v1.py:982
value_type: bool
default: false
valid_choices: 0 or 1 (parsed as bool(int(...)))
cli_example: null
deprecated: false
performance_impact: high
performance_scope:
- latency
- throughput
- memory
impact_detail: "VLLM_BATCH_INVARIANT enables deterministic, batch-composition-independent\nexecution. On Ascend it is read\
  \ in several hot paths, each of which trades\nperformance for determinism:\n\n1. Custom op disable (vllm_ascend/utils.py:561):\
  \ when set, enable_custom_op()\n   returns False, so vllm_ascend_C custom kernels are NOT loaded. All ops fall\n   back\
  \ to generic torch_npu/CANN paths, which is a significant throughput loss\n   on Ascend since custom ops are the optimized\
  \ kernels.\n\n2. Sampler fallback (vllm_ascend/sample/sampler.py:96 and\n   _310p/sample/sampler.py:156): AscendTopKTopPSampler.forward_native\
  \ falls\n   back to vLLM's native top-k/top-p implementation instead of the torch_npu\n   optimized apply_top_k_top_p +\
  \ random_sample path. This adds per-step\n   sampling latency.\n\n3. Attention dispatch (vllm_ascend/attention/attention_v1.py:982):\
  \ in\n   ChunkedPrefill mixing prefill+decode, batch-invariant mode forces the\n   per-phase FIA split path (_forward_fia_chunked_prefill_split)\
  \ regardless of\n   hardware capability, instead of the fused single FIA call. This splits one\n   kernel launch into two,\
  \ increasing latency and reducing fusion benefit.\n\n4. Upstream vLLM effects that also apply: disable_custom_all_reduce=True\n\
  \   (vllm/config/parallel.py:1058) disables the custom all-reduce kernel,\n   forcing slower collective; enable_allreduce_rms_fusion\
  \ returns False\n   (vllm/config/vllm.py:184) disabling fused all-reduce+RMSNorm; cascade\n   attention is disabled (vllm/config/vllm.py:1926);\
  \ FlashAttention AOT\n   scheduling disabled and max_num_splits forced to 1\n   (vllm/v1/attention/backends/flash_attn.py:786,817);\
  \ flashinfer fixed split\n   sizes and disable_split_kv (vllm/v1/attention/backends/flashinfer.py:707).\n\nNet effect: \"\
  lower throughput and higher latency, but deterministic outputs\"\nrequired for RL validation / training-inference consistency.\n"
