deprecated: false
performance_impact: medium
performance_scope:
- latency
- memory
impact_detail: "--load-format selects which ModelLoader implementation is used to read checkpoint\nweights into NPU memory.\
  \ It does NOT affect steady-state inference throughput or\nper-token latency, but it strongly affects:\n(1) Cold-start /\
  \ engine-restart latency — the weight-loading phase. On Ascend,\n    vllm-ascend adds two Ascend-native loaders that change\
  \ this phase dramatically:\n    - \"\\\"netloader\\\" (vllm_ascend/model_loader/netloader/netloader.py): loads weights\"\
  \n      over the network from a peer/seed instance instead of disk. Internally it\n      deep-copies the LoadConfig, strips\
  \ netloader-specific keys from\n      model_loader_extra_config, and forces load_config.load_format = \"auto\"\n      (line\
  \ 759) before delegating to DefaultModelLoader. This avoids slow disk\n      reads on network/high-latency storage and can\
  \ cut startup time substantially.\n    - \"\\\"rfork\\\" (vllm_ascend/model_loader/rfork/rfork_loader.py): builds a seed\
  \ key\"\n      from model identity + deployment topology, fetches weights from an existing\n      seed instance via a transfer\
  \ engine, and falls back to the default loader\n      (forcing load_format = \"auto\", line 197) if no seed is available.\
  \ This is\n      designed for fast multi-instance scale-out / restart.\n(2) Peak host/NPU memory during load — \"dummy\"\
  \ allocates random weights without\n    reading any checkpoint (used for profiling / memory profiling), while\n    \"safetensors\"\
  /\"auto\" stream real weights. On Ascend DeepSeek V4.1 Engram,\n    the loader choice gates a preflight checkpoint check\
  \ and per-table storage\n    dtype detection (vllm_ascend/models/deepseek_v41/model.py:1034,1042): when\n    load_format\
  \ == \"dummy\" the preflight is skipped and storage dtype is inferred\n    from hardware capability rather than the checkpoint,\
  \ avoiding a large\n    per-rank allocation (24-51 GiB) before discovering a missing index/key.\n(3) Correctness-adjacent\
  \ behavior — vllm/config/vllm.py:1369 skips\n    maybe_untie_word_embeddings() for \"dummy\"/\"sharded_state\"/\n    \"\
  runai_streamer_sharded\" because those formats cannot reveal the original\n    checkpoint's tied-embedding layout. This\
  \ affects model structure, not runtime\n    speed directly.\nvllm-ascend does not globally override the default (still \"\
  auto\"), but it adds\nthe \"netloader\" and \"rfork\" choices and enforces format restrictions for the\nAscend Engram path\
  \ (platform.py:1622) and for dp_shared_memory (engram.py:103).\n"
