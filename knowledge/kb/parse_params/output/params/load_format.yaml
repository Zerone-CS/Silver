related_parameters:
- name: --model-loader-extra-config
  relation: Passed to the selected loader; netloader and rfork read their settings from this JSON config
- name: --safetensors-load-strategy
  relation: Only meaningful when load_format is safetensors/auto; controls prefetch/parallel read strategy
- name: --download-dir
  relation: Directory used by loaders that download weights from HF hub
- name: --quantization
  relation: Netloader uses DefaultModelLoader with process_weights_after_loading when quantization is set
- name: --speculative-config
  relation: Draft model uses draft_load_config.load_format; fastsafetensors falls back to auto for PP>1 draft
- name: --enable-sleep-mode
  relation: dummy load_format is used for profiling/sleep-mode weight reload workflows
constraints:
- When Ascend Engram is active (DeepSeek V4.1 with engram_layer_ids), --load-format must be one of auto, safetensors, or dummy;
  other values raise a ValueError.
- When Engram dp_shared_memory is enabled, --load-format must be auto, safetensors, or pt, otherwise a ValueError is raised.
- Loading a model from object storage (S3/GCS/Azure Run:ai URI) requires --load-format to be modelexpress, runai_streamer,
  or runai_streamer_sharded; auto is silently overridden to runai_streamer, and any other value raises a ValueError.
- The netloader loader internally forces load_format to auto before delegating to DefaultModelLoader, so the netloader-specific
  keys must be supplied via --model-loader-extra-config, not as the effective loader format.
- The rfork loader falls back to the default loader (forcing load_format to auto) when no seed instance is available or any
  transfer step fails.
tuning_advice:
  summary: Use auto/safetensors for normal single-instance startup; use netloader or rfork on Ascend to cut cold-start/restart
    latency in multi-instance or network-storage deployments; use dummy only for profiling.
  suggested_values:
  - scenario: Standard single-instance deployment with local fast storage
    value: auto
    reason: Default; tries safetensors and falls back to pytorch bin, works with all Ascend paths including Engram (auto/safetensors/dummy
      allowed).
  - scenario: Multi-instance scale-out or frequent restarts on Ascend
    value: rfork
    reason: RFork fetches weights from an existing seed instance via transfer engine, avoiding repeated disk reads; falls
      back to auto if no seed is available.
  - scenario: Network or high-latency storage on Ascend
    value: netloader
    reason: Netloader loads weights over the network from a peer, avoiding slow disk reads; configure via --model-loader-extra-config.
  - scenario: Profiling / memory profiling without real weights
    value: dummy
    reason: Allocates random weights without reading checkpoint; skips Engram preflight and large per-rank allocation, but
      outputs are meaningless.
  - scenario: DeepSeek V4.1 with Engram enabled
    value: safetensors
    reason: Ascend Engram requires auto/safetensors/dummy; safetensors is explicit and avoids fallback ambiguity.
  caveats:
  - netloader and rfork require --model-loader-extra-config JSON; without it they fall back to auto and you lose the startup-speed
    benefit.
  - Do not use dummy for production serving — outputs are random.
  - For Engram, only auto/safetensors/dummy are accepted; other formats raise ValueError.
  - load_format does not affect steady-state throughput; do not expect token/sec gains from changing it.
  quick_guide: Keep auto for normal startup; use rfork/netloader on Ascend to speed cold start; use dummy only for profiling.
