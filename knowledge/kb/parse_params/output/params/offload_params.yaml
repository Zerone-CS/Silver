related_parameters:
- name: --offload-backend
  relation: Must be 'prefetch' (or 'auto' with offload_group_size > 0) for --offload-params to have any effect; ignored for
    uva/noop backends
- name: --offload-group-size
  relation: Enables prefetch offloading; if 0, no layers are offloaded and --offload-params is inert
- name: --offload-num-in-group
  relation: Determines which layers within each group are offloaded; --offload-params then filters which parameters within
    those layers
- name: --offload-prefetch-step
  relation: Controls how far ahead H2D copies are issued; interacts with the amount of data selected by --offload-params to
    hide transfer latency
- name: --cpu-offload-params
  relation: Analogous selective filter for the UVA backend; different matching semantics (segment match on parameter names)
    but same concept
constraints:
- 'Segment matching is exact on dot-separated segments: ''w13_weight'' matches ''mlp.experts.w13_weight'' but not ''mlp.experts.w13_weight_scale'',
  and ''expert'' or ''w2'' will not match ''experts'' or ''w2_weight''.'
- If the set is empty, ALL parameters of each offloaded layer are offloaded (no filtering).
- Layers whose parameters do not match any segment are skipped entirely and not offloaded.
- The parameter only has effect when prefetch offloading is active (offload_backend='prefetch' or 'auto' with offload_group_size
  > 0); otherwise it is ignored.
tuning_advice:
  summary: Use --offload-params to offload only the largest, most transfer-efficient weight tensors (MLP/MoE expert weights)
    when prefetch offloading is enabled, balancing HBM savings against H2D transfer overhead on Ascend NPU.
  suggested_values:
  - scenario: Dense MLP models (e.g. Llama/Qwen) with prefetch offloading on Ascend, want to free HBM with minimal latency
      cost
    value: '{gate_up_proj, down_proj}'
    reason: These are the largest contiguous MLP weights; offloading only them frees the most HBM per transfer and matches
      the Ascend e2e test configuration (test_cpu_weight_offload.py:128).
  - scenario: MoE models with expert weights, prefetch offloading on Ascend
    value: '{w13_weight, w2_weight}'
    reason: MoE expert weights dominate model size; segment matching distinguishes them from their scale tensors (w13_weight_scale)
      so only the compute weights are moved.
  - scenario: Maximum HBM savings, latency less critical (large batch prefill or memory-bound deployment)
    value: '{} (empty set)'
    reason: Empty set offloads all parameters of each offloaded layer, maximizing freed HBM; combine with a larger --offload-prefetch-step
      to hide the extra transfer latency.
  - scenario: Latency-sensitive decode with limited HBM headroom
    value: '{down_proj}'
    reason: Offloading a single large weight minimizes per-step H2D volume while still freeing meaningful HBM, keeping decode
      latency low.
  caveats:
  - Only effective with --offload-backend prefetch (or auto with --offload-group-size > 0); has no effect with uva or noop
    backends.
  - Segment matching is exact — use full segment names like 'gate_up_proj' or 'w13_weight', not partial substrings like 'w2'.
  - On Ascend, more selected parameters means more NZ-buffer H2D copies per forward; keep the selected set small and contiguous
    to avoid decode latency regressions.
  - Verify offloading actually occurred (check logs / memory) since a non-matching set silently disables offloading for those
    layers.
  quick_guide: Set --offload-params to the largest weight segments (gate_up_proj/down_proj or w13_weight/w2_weight) when using
    --offload-backend prefetch; leave empty only when maximum HBM savings outweigh transfer cost.
