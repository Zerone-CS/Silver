name: --offload-params
type: cli
category: memory
scope: both
source_file:
- vllm/config/offload.py:70
- vllm/engine/arg_utils.py:1357
- vllm/engine/arg_utils.py:553
- vllm/model_executor/offloader/prefetch.py:161
- vllm/model_executor/offloader/prefetch.py:200
- vllm_ascend/model_executor/offloader/base.py:25
- vllm_ascend/model_executor/offloader/prefetch.py:148
value_type: list[str]
default: set()
valid_choices: any set of parameter name segments (exact dot-separated segments); empty set means offload all parameters of
  each offloaded layer
cli_example: --offload-params gate_up_proj down_proj
deprecated: false
performance_impact: high
performance_scope:
- memory
- latency
- throughput
impact_detail: '--offload-params is the selective filter for the prefetch offload backend

  (--offload-backend prefetch). It only takes effect when prefetch offloading is

  active (offload_group_size > 0). In vllm upstream, PrefetchOffloader.wrap_modules

  (vllm/model_executor/offloader/prefetch.py:200) builds a whitelist of parameter

  names per offloaded layer: "if offload_params is non-empty, only parameters whose"

  fully-qualified name contains one of the given segments (matched as ".{p}." inside

  ".{prefix}{name}.") are offloaded; otherwise ALL parameters of the layer are

  offloaded. Layers whose whitelist ends up empty are skipped entirely (line 211-212),

  so the parameter directly controls how many bytes are moved to CPU and how many

  H2D copies happen per forward pass.

  On Ascend, vllm_ascend/model_executor/offloader/base.py:create_offloader constructs

  an AscendPrefetchOffloader passing prefetch.offload_params straight through

  (line 25). AscendPrefetchOffloader (vllm_ascend/model_executor/offloader/prefetch.py:148)

  subclasses the upstream PrefetchOffloader and monkey-patches vllm_prefetch._ModuleOffloader

  with its own _ModuleOffloader to use NZ-format static buffers, then calls

  super().wrap_modules() — so the exact same segment-matching whitelist logic from

  upstream applies on Ascend. The Ascend-specific effect is that offloaded weights

  are staged through NZ-layout buffers and copied over HCCL/H2D streams; selecting

  fewer/larger contiguous params (e.g. gate_up_proj, down_proj, w13_weight, w2_weight)

  reduces the number of H2D transfers and NZ repack operations per step, which

  directly affects decode latency and achievable throughput, while also freeing NPU

  HBM (memory). Selecting too many params (or leaving it empty) offloads everything

  and maximizes HBM savings but increases per-step transfer overhead and can starve

  the compute stream if prefetch_step is too small.

  '
