name: --max-logprobs
type: cli
category: model
scope: vllm
source_file:
- vllm/config/model.py:254
- vllm/engine/arg_utils.py:917
- vllm/engine/arg_utils.py:562
- vllm/engine/arg_utils.py:1846
- vllm/sampling_params.py:839
- vllm/config/vllm.py:2964
- vllm/config/parallel.py:174
- vllm/config/speculative.py:1290
- vllm/entrypoints/scale_out/derender/serving.py:66
value_type: int
default: 20
valid_choices: Integer >= -1; -1 means no cap (all output_length * vocab_size logprobs allowed)
cli_example: --max-logprobs 20
deprecated: false
performance_impact: medium
performance_scope:
- memory
- throughput
impact_detail: '--max-logprobs caps the number of top logprobs a request may return. It is defined

  in vllm/config/model.py:254 as ModelConfig.max_logprobs (Field(default=20, ge=-1)),

  plumbed through EngineArgs (arg_utils.py:562, 1846) into ModelConfig, and enforced

  per-request in SamplingParams._validate_logprobs (sampling_params.py:839): if

  max_logprobs == -1 it is replaced by the model vocab size, and any request asking for

  more logprobs than the cap raises VLLMValidationError. The performance mechanism is

  memory and post-processing cost: "when logprobs are requested, the sampler must gather"

  and materialize top-k logprob values per output token. With -1 (no cap), a request can

  ask for vocab_size logprobs per token, i.e. output_length * vocab_size floats, which

  the docstring explicitly warns "may cause OOM". A larger cap therefore increases the

  size of the logprobs tensor that must be gathered, copied off the NPU, and serialized

  in the detokenizer/output processor, raising host-device copy volume and CPU

  post-processing time. It also interacts with batch-sharded sampling: in

  vllm/config/vllm.py:2964, enable_batch_sharded_sampling is rejected when

  max_logprobs < 0 because the fixed-width logprobs gather cannot be sized for

  vocab-size requests. On Ascend NPU the gather/copy path runs over the same

  device-to-host transfer and CANN kernels as on GPU; no vllm-ascend-specific override

  of this parameter was found in the provided context, so the upstream semantics apply.

  The parameter does not change model compute or KV-cache sizing, so its impact is

  indirect (medium) and only materializes for requests that actually request logprobs.

  '
