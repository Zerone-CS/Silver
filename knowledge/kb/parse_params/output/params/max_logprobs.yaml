related_parameters:
- name: --logprobs
  relation: Per-request SamplingParams.logprobs is validated against max_logprobs; exceeding it raises an error
- name: --logprobs-mode
  relation: Determines whether raw/processed logprobs or logits are returned, affecting the gather cost
- name: --enable-batch-sharded-sampling
  relation: Cannot be enabled when max_logprobs is -1 (negative cap blocks sharded sampling)
- name: --max-model-len
  relation: Upper bound on output_length, which multiplies with vocab_size to size the worst-case logprobs tensor
constraints:
- --max-logprobs must be greater than or equal to -1 (Field ge=-1); smaller values are rejected.
- A request whose logprobs value exceeds max_logprobs (or vocab size when max_logprobs is -1) raises VLLMValidationError.
- enable_batch_sharded_sampling cannot be enabled when max_logprobs is -1.
- Derender payloads with more top_logprobs than max_logprobs are rejected with an error response.
tuning_advice:
  summary: Keep the default cap of 20 unless clients genuinely need more; avoid -1 on Ascend to prevent OOM and preserve batch-sharded
    sampling.
  suggested_values:
  - scenario: Standard OpenAI-compatible serving (default)
    value: 20
    reason: Matches the OpenAI Chat Completions default and bounds the logprobs gather/copy cost per token.
  - scenario: Clients need a modest number of top logprobs (e.g. evaluation or reranking)
    value: 50
    reason: Raises the cap enough for typical top-k logprob use while keeping the per-token logprobs tensor small relative
      to vocab size.
  - scenario: Deployments using enable_batch_sharded_sampling on tensor-parallel
    value: 20
    reason: Batch-sharded sampling requires a non-negative max_logprobs; keeping a finite cap preserves the sharded sampling
      path.
  - scenario: Debugging where full-vocab logprobs are required
    value: -1
    reason: Only for controlled debugging; disables the cap but risks OOM and blocks batch-sharded sampling, so never use
      in production.
  caveats:
  - Never set -1 in production serving; the worst-case logprobs tensor is output_length * vocab_size and can exhaust NPU/host
    memory.
  - Large caps increase device-to-host copy volume and detokenizer CPU time on Ascend, lowering throughput for logprob-heavy
    workloads.
  - A negative value silently disables enable_batch_sharded_sampling, which may reduce sampling throughput on multi-NPU tensor-parallel
    setups.
  quick_guide: Leave --max-logprobs at 20; raise modestly only if clients need more top logprobs, and never use -1 in production.
