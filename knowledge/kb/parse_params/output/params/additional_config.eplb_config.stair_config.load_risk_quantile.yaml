name: additional_config.eplb_config.stair_config.load_risk_quantile
type: nested
category: scheduling
scope: vllm-ascend
source_file:
- vllm_ascend/ascend_config.py:197
- vllm_ascend/ascend_config.py:219
- vllm_ascend/ascend_config.py:231
- vllm_ascend/ascend_config.py:245
value_type: float
default: 0.75
valid_choices: float strictly greater than 0.5 and strictly less than 1.0 (finite)
cli_example: null
deprecated: false
performance_impact: medium
performance_scope:
- throughput
- latency
impact_detail: 'load_risk_quantile is a tuning knob of the MRv2 STAIR expert-parallel load-balancing

  policy in vllm-ascend (vllm_ascend/ascend_config.py, StairConfig). It is a one-sided

  standard-normal quantile that is converted to a z-score via

  NormalDist().inv_cdf(self.load_risk_quantile) (the z_score property, line 229-231).

  That z-score is used to compute mean-plus-deviation expert and rank risk, i.e. how

  pessimistic the balancer is about load spikes when deciding replica counts and expert

  placement. A higher quantile yields a larger z-score, so the risk estimate weights

  tail/peak load more heavily, biasing the planner toward more replicas and more

  aggressive rebalancing; a lower quantile (closer to 0.5) yields a smaller z-score and

  a more mean-driven, conservative plan. Because the resulting plan changes expert

  placement and replica counts across ranks, it indirectly affects per-rank compute

  balance, all-to-all/HCCL communication volume, and therefore decode throughput and

  tail latency on Ascend NPU. The effect is indirect (it does not itself allocate memory

  or set parallelism), hence medium impact. It only matters when the MRv2 STAIR EPLB

  policy is active; otherwise it is inert.

  '
usage_locations:
- file: vllm_ascend/ascend_config.py:219
  context: 'Field definition load_risk_quantile: float = 0.75 inside StairConfig'
- file: vllm_ascend/ascend_config.py:229
  context: z_score property converts the quantile to a z-score via NormalDist().inv_cdf for mean-plus-deviation risk
- file: vllm_ascend/ascend_config.py:244
