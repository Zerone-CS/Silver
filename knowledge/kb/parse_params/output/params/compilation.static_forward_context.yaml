impact_detail: "static_forward_context is a runtime registry (dict) populated during model\nconstruction: \"each attention/MoE/linear-attention\
  \ layer registers itself under\"\nits layer name so that code outside the model forward pass can reach the layer\nobjects\
  \ (and their bound kv_cache tensors). It is not a user-tunable knob but a\ndata structure whose contents drive several Ascend\
  \ hot paths:\n- KV cache binding: \"bind_kv_cache(kv_caches, static_forward_context, ...) walks\"\n  this map to attach\
  \ allocated KV tensors to each layer (vllm_ascend/_310p/\n  model_runner_310p.py:725, _310p/worker/v2/model_runner.py:792).\
  \ The map's\n  completeness directly determines whether KV memory is correctly bound.\n- \"Mamba/linear-attention state\
  \ copy: v1 model_runner_v1.py:1020 and :2435 pass\"\n  static_forward_context into mamba_utils.preprocess_mamba/postprocess_mamba_align\n\
  \  so the copy kernels can locate per-layer state buffers. This runs every decode\n  step under mamba_cache_mode=\"align\"\
  , so lookups here are on the critical path.\n- \"KDA state copy plan (v2): initialize_kda_state_copy(static_forward_context,\"\
  \n  max_num_seqs) at v2/model_runner.py:429 precomputes copy plans once at init.\n- \"KVPP runtime (v2): KVPPRuntime.create_from_kv_cache\
  \ consumes the map at\"\n  v2/model_runner.py:451.\n- \"Sparse-KV offload (v2): iterates static_forward_context.values()\
  \ to find\"\n  AscendSFAKVOffloadImpl layers (v2/model_runner.py:467).\n- 310P linear-attn spec recovery: \"v2/_310p/model_runner.py:693\
  \ iterates the map\"\n  to restore linear_attn KV specs.\nBecause the map is built once and read many times, its size (number\
  \ of layers)\nand correctness affect per-step latency (dict lookups, iteration) and memory\n(it holds references to layer\
  \ objects and their KV tensors, keeping them alive).\nIt is not directly settable by the user; it is derived from the model\n\
  architecture and compilation config.\n"
