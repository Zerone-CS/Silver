related_parameters:
- name: compilation_config
  relation: static_forward_context is a field of CompilationConfig; populated during model init
- name: cudagraph_mode
  relation: Graph capture and KV binding rely on the map being fully populated before capture
- name: mamba_cache_mode
  relation: align/all modes pass static_forward_context into mamba pre/postprocess kernels
- name: kv_cache_config
  relation: bind_kv_cache uses the map to attach KV tensors; layer names must match kv_cache_groups
- name: sparse_kv_offload_config.use_fused_copy_sfa
  relation: v2 iterates the map to locate AscendSFAKVOffloadImpl layers when fused copy is enabled
constraints:
- Layer names in static_forward_context must be unique; registering a duplicate name raises ValueError (e.g. sparse_swa.py:96).
- Every layer name referenced by kv_cache_groups must exist in static_forward_context for bind_kv_cache to attach KV tensors
  correctly.
- The map must be fully populated before KV cache binding, graph capture, and prefill execution; v2 explicitly publishes sealed
  plans before warmup/capture.
- This is a runtime-derived structure, not a user-settable CLI/config value; users cannot directly assign it.
tuning_advice:
  summary: Not a user-tunable knob; ensure the model registers all layers correctly and avoid stale entries to keep KV binding
    and per-step lookups correct and cheap.
  suggested_values:
  - scenario: Standard dense/MoE model on 910B (v1 or v2)
    value: <computed by model init>
    reason: The map is auto-populated; do not attempt to set it. Verify via get_layers_from_vllm_config that all attention/MoE
      layers are present.
  - scenario: Hybrid Mamba/linear-attention model with mamba_cache_mode='align'
    value: <computed>
    reason: Ensure all mamba layers register in the map so preprocess/postprocess_mamba can locate state buffers; missing
      entries break state copy.
  - scenario: 310P deployment with linear-attention layers
    value: <computed>
    reason: 310P v2 recovers linear_attn KV specs by iterating the map; confirm linear_attn layers are registered to avoid
      dropped KV specs.
  caveats:
  - Do not manually mutate static_forward_context; it is managed by model construction and KV binding.
  - Watch NPU memory if layers are re-created (e.g. profiling teardown) — stale references in the map can retain KV tensors.
  quick_guide: Leave it alone — it is auto-built; just ensure the model registers every layer so KV binding and Mamba state
    copy work.
analysis_date: '2026-10-27'
