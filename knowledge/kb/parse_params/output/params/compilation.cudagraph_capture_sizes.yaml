value_type: list[int]
default: null
valid_choices: Any ascending list of positive integers; each size is a batch/token count to capture as an ACL graph. When
  None, sizes are inferred from max_cudagraph_capture_size / max_num_seqs / max_num_batched_tokens.
cli_example: '--compilation-config ''{"cudagraph_capture_sizes": [1, 2, 4, 8, 16, 32, 64, 128]}'''
deprecated: false
performance_impact: high
performance_scope:
- latency
- throughput
- memory
impact_detail: "This parameter defines the exact set of batch/token sizes for which ACL graphs (Ascend's\nequivalent of CUDA\
  \ graphs) are captured. It is the primary lever controlling the\ngraph-vs-eager tradeoff on Ascend NPU.\n\nUpstream vLLM:\
  \ \"`vllm/v1/cudagraph_dispatcher.py:75` builds `_bs_to_padded_graph_size`\"\nfrom `cudagraph_capture_sizes`; any runtime\
  \ batch size is padded up to the next captured\nsize and dispatched to that graph. Sizes not covered fall back to eager\
  \ execution.\n`vllm/config/vllm.py:1784` clears the list when `enforce_eager` is set, and\n`vllm/config/vllm.py:1030` clears\
  \ it when cudagraph mode falls back to NONE.\n\nvllm-ascend overrides / augments this heavily:\n- \"`vllm_ascend/platform.py:1268`\
  \ (recompute path): if `reduced_cg_cap` is set, it injects\"\n  that size into the list and resets `max_cudagraph_capture_size\
  \ = None`, then calls\n  `vllm_config._set_cudagraph_sizes()` to rebuild the list.\n- \"`vllm_ascend/platform.py:1286`:\
  \ when TP > 1 and SP / shared-expert-DP / DSA-CP is\"\n  enabled, capture sizes are rewritten to TP-aligned multiples via\n\
  \  `update_sizes_for_sequence_parallelism`; if no size is a multiple of tp_size an\n  AssertionError is raised. This directly\
  \ changes which graphs get captured.\n- \"`vllm_ascend/worker/model_runner_v1.py:660`: the sorted list becomes\"\n  `cudagraph_batch_sizes`,\
  \ the dispatch table used at runtime to pick a graph.\n- \"`vllm_ascend/worker/worker.py:868`: capture sizes are excluded\
  \ from the compile/warmup\"\n  size list, so each captured size triggers a dummy run + graph capture at startup\n  (startup\
  \ latency and NPU memory cost scale with list length).\n- \"`vllm_ascend/ascend_forward_context.py:256`: `max_cudagraph_capture_size`\
  \ (derived from\"\n  this list) sizes the MC2/MegaMoe token capacity, i.e. HCCL comm buffer allocation.\n- \"`vllm_ascend/attention/context_parallel/dsa_cp.py:292`\
  \ and `dsa_v41_cp.py:276`: the max\"\n  capture size sizes per-request metadata buffers for DSA context-parallel attention.\n\
  - \"`vllm_ascend/ascend_config.py:1397`: if the largest capture size does not cover the\"\n  largest possible decode step,\
  \ `oproj_tensor_parallel_size` / `mlp_tensor_parallel_size`\n  are silently disabled (with a warning) to avoid eager fallback\
  \ desyncing cross-DP HCCL\n  collectives.\n- \"`vllm_ascend/worker/v2/aclgraph_utils.py:114`: under v2 with speculative\
  \ decoding and\"\n  FULL_DECODE_ONLY, raw sizes are rounded up to multiples of decode_query_len, so actual\n  graph sizes\
  \ differ from the configured list.\n\nNet effect: \"more/larger capture sizes reduce per-step launch overhead and improve\
  \ decode\"\nthroughput and latency, but increase NPU memory (each graph holds its own workspace) and\nstartup capture time;\
  \ too many graphs can exhaust stream resources (CANN error 207008).\nToo few sizes cause frequent eager fallback, hurting\
  \ throughput and, in cross-DP setups,\nrisking collective desync.\n"
