related_parameters:
- name: compilation.max_cudagraph_capture_size
  relation: Upper bound; when set, sizes are inferred from it. Mutually exclusive with an explicit sizes list at CLI level.
- name: compilation.cudagraph_mode
  relation: If NONE or enforce_eager, capture sizes are cleared and no graphs are captured.
- name: compilation.compile_sizes
  relation: Capture sizes are removed from the warmup/compile size list to avoid double work.
- name: scheduler_config.max_num_seqs
  relation: Default capture sizes are derived from max_num_seqs; also bounds decode batch sizes.
- name: scheduler_config.max_num_batched_tokens
  relation: Caps reduced_cg_cap and bounds the largest possible step.
- name: speculative_config.num_speculative_tokens
  relation: With EAGLE/MTP, each size must be n*(K+1); v2 rounds sizes to decode_query_len multiples.
- name: tensor_parallel_size
  relation: With SP/shared-expert-DP/DSA-CP, sizes must be multiples of tp_size or an AssertionError is raised.
- name: additional_config.oproj_tensor_parallel_size
  relation: Disabled if max capture size does not cover the largest decode step.
- name: additional_config.mlp_tensor_parallel_size
  relation: Disabled if max capture size does not cover the largest decode step.
constraints:
- When tensor parallelism > 1 and sequence parallelism, shared-expert DP, or DSA context parallelism is enabled, at least
  one capture size must be a multiple of tensor_parallel_size, otherwise an AssertionError is raised.
- With EAGLE speculative decoding under fullgraph mode, each capture size must be n*(K+1) where K is num_speculative_tokens
  and n is a supported batch size.
- The CLI flag --cudagraph-capture-sizes and compilation_config.cudagraph_capture_sizes are mutually exclusive; setting both
  raises a ValueError.
- If enforce_eager is set or cudagraph_mode resolves to NONE, the capture sizes list is cleared and has no effect.
- Capture sizes must be positive integers; the dispatcher asserts the list is non-empty when cudagraphs are enabled.
tuning_advice:
  summary: Choose a capture-size list that covers your realistic decode batch sizes (accounting for speculative tokens and
    TP alignment) while keeping the list short enough to fit NPU memory and stream resources.
  suggested_values:
  - scenario: Uniform decode, no speculative decoding, typical serving
    value: '[1, 2, 4, 8, 16, 32, 64, 128, 256]'
    reason: Geometric coverage of common decode batch sizes minimizes eager fallback while keeping graph count and memory
      modest.
  - scenario: EAGLE/MTP speculative decoding with num_speculative_tokens=K
    value: '[n*(K+1) for n in (1,2,4,8,16,32,64)]'
    reason: Fullgraph verification fixes tokens per step to n*(K+1); sizes not on this stride will not match captured graphs.
  - scenario: DSpark / DeepSeek-V4 with num_speculative_tokens=5, target ~60 concurrency
    value: '[6, 12, 24, 48, 96, 192, 360]'
    reason: Each sequence processes 6 tokens per step, so batch_size/6 gives concurrency; 360 covers ~60 concurrent sequences.
  - scenario: TP>1 with SP/shared-expert-DP/DSA-CP enabled
    value: Multiples of tensor_parallel_size, e.g. [8, 16, 32, 64, 128, 256] for TP=8
    reason: vllm-ascend rewrites sizes to TP-aligned multiples and raises AssertionError if none qualify.
  - scenario: Hitting CANN stream-resource errors (207008) or NPU OOM during capture
    value: Reduce list length and lower max_cudagraph_capture_size
    reason: Fewer/smaller graphs reduce per-graph workspace and stream usage; docs recommend reducing capture sizes as the
      primary mitigation.
  caveats:
  - Prefer FULL or FULL_DECODE_ONLY over PIECEWISE/FULL_AND_PIECEWISE for uniform decode workloads to reduce graph count.
  - Verify the effective list after startup logs, since vllm-ascend may inject reduced_cg_cap or TP-align sizes.
  - Ensure the largest capture size covers max_num_seqs * decode_query_len, otherwise oproj/mlp TP gets disabled.
  quick_guide: Set a short geometric list of decode batch sizes (scaled by K+1 for speculative decoding and aligned to tp_size
    when SP is on); reduce it if capture fails on stream resources.
analysis_date: '2026-10-27'
