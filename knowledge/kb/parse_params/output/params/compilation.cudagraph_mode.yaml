  relation: When enabled, platform.py rewrites cudagraph_mode and may force enforce_eager
- name: speculative_config
  relation: Presence of spec config changes decode_mode computation under XliteGraph; dynamic spec decoding forces PIECEWISE
    upstream
- name: parallel_config.prefill_context_parallel_size
  relation: MRV2 PCP restricts allowed modes to NONE or FULL_DECODE_ONLY
- name: finegrained_tp_config.oproj_tensor_parallel_size
  relation: Requires graph mode (cudagraph_mode != NONE)
constraints:
- When KVPP is enabled and enforce_eager is False, cudagraph_mode must be PIECEWISE or a ValueError is raised.
- When oproj_tensor_parallel_size or mlp_tensor_parallel_size > 1, cudagraph_mode must not be NONE (graph mode required).
- In MRV2 PCP with data_parallel_size > 1, cudagraph_mode must be NONE or FULL_DECODE_ONLY.
- In MRV2 PCP with sparse MLA (index_topk), cudagraph_mode must be NONE or FULL_DECODE_ONLY.
- In MRV2 PCP, if full cudagraphs are used they must be exactly FULL_DECODE_ONLY.
- If cudagraph_mode requires piecewise compilation but compilation mode is not VLLM_COMPILE and breakable cudagraph is disabled,
  the mode is automatically downgraded (possibly to NONE).
- When XliteGraph is enabled with full_mode, cudagraph_mode is forced to NONE and enforce_eager is set True.
tuning_advice:
  summary: Use FULL_DECODE_ONLY for decode-heavy serving to minimize latency; use PIECEWISE when FA3 or graph-incompatible
    ops are present; use NONE only for debugging or features requiring eager.
  suggested_values:
  - scenario: Standard decode-heavy LLM serving on Ascend (no FA3, no CP)
    value: FULL_DECODE_ONLY
    reason: Captures the whole decode step into ACL graph, minimizing host-side dispatch and kernel-launch overhead for the
      dominant decode phase.
  - scenario: FA3 attention enabled (flash_attn_with_kvcache)
    value: PIECEWISE
    reason: FA3 tiling is host-side and cannot be captured into ACL graph; PIECEWISE keeps it outside the graph while capturing
      the rest.
  - scenario: Context parallel (PCP) deployment
    value: FULL_DECODE_ONLY
    reason: Docs state FULL is not sufficiently supported in CP; MRV2 PCP only allows NONE or FULL_DECODE_ONLY.
  - scenario: KVPP enabled (non-eager)
    value: PIECEWISE
    reason: KVPP validation requires PIECEWISE when not eager, otherwise raises ValueError.
  - scenario: Debugging / precision dump / features requiring eager
    value: NONE
    reason: Disables ACL graph so every step runs eagerly; required for some debug paths and avoids graph capture overhead.
  caveats:
  - Verify the effective mode in logs — XliteGraph and compilation-mode normalization can silently change it.
  - FULL modes increase memory usage for graph pools and an extra update stream; ensure headroom.
  - Ensure compilation_config.mode is VLLM_COMPILE (or breakable cudagraph enabled) or PIECEWISE/FULL may be downgraded.
  quick_guide: Default PIECEWISE; switch to FULL_DECODE_ONLY for max decode throughput when no FA3/CP constraints apply.
