value_type: str
default: PIECEWISE
valid_choices:
- NONE
- PIECEWISE
- FULL
- FULL_DECODE_ONLY
- FULL_AND_PIECEWISE
cli_example: '--compilation-config ''{"cudagraph_mode": "FULL_DECODE_ONLY"}'''
deprecated: false
performance_impact: high
performance_scope:
- latency
- throughput
- memory
impact_detail: 'On Ascend, cudagraph_mode selects whether the model runner captures ACL graphs

  (torch.npu.NPUGraph) and which portions of the forward pass are captured. It is the

  master switch for graph execution, which is the primary latency/throughput lever on NPU.


  v1 worker (vllm_ascend/worker/model_runner_v1.py:661): if cudagraph_capture_sizes is

  non-empty AND cudagraph_mode != NONE, the runner builds self.cudagraph_batch_sizes

  (sorted capture sizes) and uses ACL graph replay for those batch sizes. If mode is NONE,

  cudagraph_batch_sizes is empty and every step runs eagerly — losing kernel-launch

  overhead amortization and host-side dispatch savings. At model_runner_v1.py:436 the mode

  also selects the debugger backend (PrecisionDebugger for eager vs AclGraphDumper for

  graph), confirming graph vs eager is a real runtime branch.


  v2 worker (vllm_ascend/worker/v2/model_runner.py:184): self.use_aclgraph is True only

  when cudagraph_mode != NONE AND (compilation mode is VLLM_COMPILE or breakable cudagraph

  is enabled) AND not enforce_eager. So on v2, setting cudagraph_mode=NONE disables ACL

  graph entirely. At line 198, if cudagraph_mode.has_full_cudagraphs() the runner allocates

  a dedicated update_stream (torch.npu.Stream) used for full-graph metadata updates — a

  memory/stream resource cost only incurred in FULL modes. At line 983, PIECEWISE mode

  triggers _preserve_dummy_query_tokens logic that pads dummy query tokens to decode_query_len

  during profiling, affecting capture shape alignment.


  vllm-ascend platform override (vllm_ascend/platform.py:1191-1208): when XliteGraph is

  enabled (ascend_config.xlite_graph_config.enabled), the platform REWRITES

  compilation_config.cudagraph_mode. If xlite full_mode is set, mixed_mode becomes NONE;

  otherwise mixed_mode = current mode''s mixed_mode() and decode_mode = NONE when no

  speculative config. The resulting mode is recomputed and enforce_eager is forced True

  when the resulting mode is empty or xlite full_mode is on. This means the user-supplied

  cudagraph_mode can be silently downgraded/neutralized under XliteGraph.


  Upstream normalization (vllm/config/vllm.py:1010-1030): if the mode requires piecewise

  compilation but compilation mode is not VLLM_COMPILE and breakable cudagraph is disabled,

  the mode is downgraded via without_piecewise(); if it falls back to NONE, capture sizes

  are zeroed. On Ascend, compilation mode is forced to NONE unless VLLM_COMPILE

  (platform.py:1216-1221), so PIECEWISE/FULL modes that require compilation can be

  downgraded unless breakable cudagraph is enabled.


  Net effect: "FULL/FULL_DECODE_ONLY give the lowest decode latency (whole decode step"

  captured, minimal host overhead) at the cost of extra memory for graph pools and an

  update stream; PIECEWISE keeps incompatible ops (e.g. FA3 attention whose tiling is

  host-side) outside the graph for flexibility; NONE is fully eager (highest latency,

  lowest memory, required for some features).

  '
