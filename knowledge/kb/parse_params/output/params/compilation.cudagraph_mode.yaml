related_parameters:
- name: compilation_config.mode
  relation: PIECEWISE/FULL modes require VLLM_COMPILE (or breakable cudagraph); otherwise downgraded to without_piecewise()
- name: enforce_eager
  relation: When enforce_eager is True, compilation mode is forced NONE and cudagraph_mode effectively disabled
- name: compilation_config.cudagraph_capture_sizes
  relation: Capture sizes only used when cudagraph_mode != NONE; zeroed when mode falls back to NONE
- name: compilation_config.max_cudagraph_capture_size
  relation: Zeroed when mode falls back to NONE; bounds full-graph batch sizes
