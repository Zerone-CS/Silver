- vllm/engine/arg_utils.py:538
- vllm/config/cache.py:130
- vllm/v1/core/sched/scheduler.py:303
- vllm/v1/engine/core.py:225
- vllm/v1/core/kv_cache_utils.py:755
- vllm_ascend/patch/platform/patch_kv_cache_utils.py:112
- vllm_ascend/patch/platform/patch_kv_cache_utils.py:135
- vllm_ascend/patch/platform/patch_mamba_config.py:173
- vllm_ascend/platform.py:416
- vllm_ascend/models/layer/attention/layer.py:137
- vllm_ascend/distributed/kv_transfer/kv_p2p/sfa_pd_rd2h/dspark_context.py:68
- vllm_ascend/_310p/worker/v2/model_runner.py:412
- vllm_ascend/_310p/worker/v2/model_runner.py:732
- vllm_ascend/_310p/model_runner_310p.py:992
value_type: bool
default: true
valid_choices: 'true | false (CLI: --enable-prefix-caching / --no-enable-prefix-caching; argparse default is None, resolved
  to CacheConfig.enable_prefix_caching=True)'
cli_example: --enable-prefix-caching
deprecated: false
performance_impact: high
performance_scope:
- throughput
- latency
- memory
impact_detail: 'Prefix caching (APC) is the KV-cache reuse mechanism: the scheduler hashes prompt

  blocks and, on a cache hit, skips recomputation of the matched prefix, so it directly

  reduces prefill compute and TTFT for workloads with shared prefixes (system prompts,

  multi-turn chat, RAG). In vLLM v1 the flag is consumed at three points:

  (1) vllm/v1/core/sched/scheduler.py:303 passes enable_caching into KVCacheManager,

  which decides whether block hashes are tracked and blocks are retained after free;

  (2) vllm/v1/engine/core.py:225 installs the request_block_hasher (and hash fn) only

  when prefix caching or a KV connector is active — with APC off, no per-request hashing

  cost is paid at all;

  (3) vllm/v1/core/kv_cache_utils.py:755 uses it to decide whether hash_block_size can

  differ from scheduler_block_size (block-hash granularity for hybrid/multi-group caches).

  On Ascend, vllm-ascend patches this logic in

  vllm_ascend/patch/platform/patch_kv_cache_utils.py (lines 112 and 135): when prefix

  caching is disabled it returns scheduler_block_size for both scheduler and hash block

  sizes, avoiding the LCM/GCD alignment computation; when enabled it computes

  hash_block_size = gcd(group block sizes) (or delegates to upstream for dcp==1) so

  hashing granularity stays aligned with the smallest cacheable group. This affects

  hybrid-attention models (MLA + SWA, Mamba) where multiple KV cache groups exist.

  For Mamba/hybrid models, vllm_ascend/patch/platform/patch_mamba_config.py:173 sets

  mamba_block_size = block_size when APC is on (block-aligned mamba cache mode), else

  mamba_block_size = max_model_len — a large memory difference for recurrent state.

  vllm_ascend/platform.py:416 similarly adjusts mamba_block_size when APC is off and

  KV transfer with hybrid cache is used. On the 310P path

  (vllm_ascend/_310p/model_runner_310p.py:992 and _310p/worker/v2/model_runner.py:732),

  MambaSpec block tables allocate max_num_blocks_per_req pages per request when APC is

  on versus a single page when off — a direct KV-cache memory footprint difference.

  On the 310P v2 worker (model_runner.py:412), APC being on combined with FULL cudagraph

  mode forces eager execution for PrefillCacheHit/ChunkedPrefill batches, trading some

  graph-capture benefit for correctness of cache-hit prefill.

  vllm-ascend also silently disables APC in one case:

  vllm_ascend/models/layer/attention/layer.py:137-140 sets

  cache_config.enable_prefix_caching = False when the MLA attention backend is

  TRITON_MLA or FLASHINFER, so on those backends the flag has no effect.

  Finally, vllm_ascend/distributed/kv_transfer/kv_p2p/sfa_pd_rd2h/dspark_context.py:68

  raises a ValueError if APC is enabled on the P-side DSpark draft-KV path.

  '
