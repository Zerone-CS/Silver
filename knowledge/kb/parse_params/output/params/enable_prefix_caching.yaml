related_parameters:
- name: --prefix-caching-hash-algo
  relation: Selects the hash function used for block hashing; only relevant when prefix caching is enabled
- name: --prefix-cache-retention-interval
  relation: Controls retention of sliding-window/Mamba prefix-cache blocks; only meaningful with APC on
- name: --block-size
  relation: Prefix cache matching granularity is block-size based; hash_block_size derives from group block sizes
- name: --enable-chunked-prefill
  relation: Commonly enabled together for long-context/multi-user workloads; chunked prefill interacts with cache-hit prefill
    batching
- name: --kv-transfer-config
  relation: KV connectors also require block hashing; upstream enables hashing when either APC or a connector is active
- name: --compilation-config (cudagraph_mode)
  relation: On 310P v2 worker, APC + FULL cudagraph mode forces eager for prefill/cache-hit batches
- name: --mamba-block-size
  relation: vllm-ascend sets mamba_block_size based on APC state for hybrid/Mamba models
constraints:
- P-side DSpark draft-KV generation (SFA PD RD2H) requires local prefix caching to be disabled; enabling --enable-prefix-caching
  raises a ValueError on that path.
- When the MLA attention backend resolves to TRITON_MLA or FLASHINFER, vllm-ascend forcibly sets enable_prefix_caching to
  False, so the flag has no effect on those backends.
- For hybrid/Mamba models with KV transfer enabled, mamba_cache_mode must be 'align'; mamba_block_size must be a multiple
  of block_size when explicitly set.
- KV cache events (--kv-events-config with enable_kv_cache_events) only produce useful events when prefix caching is enabled;
  otherwise a warning is logged.
tuning_advice:
  summary: Enable prefix caching for any workload with shared prompt prefixes (system prompts, multi-turn chat, RAG) to cut
    prefill compute and TTFT; disable only for single-shot unique prompts or when a feature (DSpark P-side, TRITON_MLA/FLASHINFER
    MLA backend) forbids it.
  suggested_values:
  - scenario: High-throughput serving with shared system prompts / multi-turn chat / RAG (v1 and v2 workers)
    value: true
    reason: Reuses KV blocks for matched prefixes, skipping prefill compute and reducing TTFT; docs (GLM5.md, Dots3-Note.md)
      recommend enabling it for high-throughput and long-context multi-user scenarios.
  - scenario: Single-shot requests with unique prompts and no prefix overlap
    value: false
    reason: No cache hits to exploit; disabling avoids per-request block hashing overhead (vllm/v1/engine/core.py:225 skips
      hasher install) and simplifies block-size alignment on Ascend.
  - scenario: MLA models running on TRITON_MLA or FLASHINFER backend
    value: false
    reason: vllm-ascend silently forces enable_prefix_caching=False for these backends (layer.py:137), so setting it true
      has no effect; set false explicitly to avoid confusion.
  - scenario: P-side DSpark draft-KV generation (SFA PD RD2H)
    value: false
    reason: dspark_context.py:68 raises ValueError if prefix caching is enabled on this path; paired AscendStore prefix reuse
      is handled separately.
  - scenario: Hybrid/Mamba models where KV memory is tight
    value: false
    reason: With APC off, mamba_block_size falls back to max_model_len and MambaSpec block tables allocate only 1 page per
      request (310P paths), reducing recurrent-state memory at the cost of prefix reuse.
  caveats:
  - vllm-ascend silently disables prefix caching when the MLA backend is TRITON_MLA or FLASHINFER (vllm_ascend/models/layer/attention/layer.py:137-140);
    verify the effective backend before relying on APC.
  - On the 310P v2 worker, APC combined with FULL cudagraph mode forces eager execution for PrefillCacheHit/ChunkedPrefill
    batches (model_runner.py:412), partially offsetting graph-capture gains.
  - For hybrid/Mamba models, APC changes mamba_block_size (block_size vs max_model_len) and MambaSpec block-table sizing,
    which materially changes KV memory footprint.
  - With multiple KV cache groups (hybrid attention), the Ascend patch computes hash_block_size as gcd of group block sizes
    when APC is on, which can differ from scheduler_block_size and affect matching granularity.
  - Enabling APC adds per-request block hashing cost (sha256 by default); consider --prefix-caching-hash-algo xxhash for lower
    hashing overhead if collision risk is acceptable.
  quick_guide: Enable --enable-prefix-caching for shared-prefix/high-throughput workloads; disable for unique single-shot
    prompts, TRITON_MLA/FLASHINFER MLA backends, or P-side DSpark.
analysis_date: '2026-10-27'
