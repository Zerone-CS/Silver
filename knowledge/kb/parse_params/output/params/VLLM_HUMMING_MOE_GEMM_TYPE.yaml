name: VLLM_HUMMING_MOE_GEMM_TYPE
type: env
category: model
scope: vllm
source_file:
- vllm/envs.py:1517
- vllm/envs.py:191
- vllm/model_executor/layers/fused_moe/experts/fused_humming_moe.py:104
value_type: str
default: null
valid_choices:
- indexed
- grouped
- auto
cli_example: null
deprecated: false
performance_impact: low
performance_scope:
- throughput
impact_detail: 'This parameter only affects the "humming" MoE kernel path in upstream vLLM

  (vllm/model_executor/layers/fused_moe/experts/fused_humming_moe.py). The humming

  kernels are a GPU-oriented MoE GEMM implementation; there is no reference to

  VLLM_HUMMING_MOE_GEMM_TYPE anywhere in vllm-ascend, and the Ascend MoE path uses

  its own fused MoE operators (Ascend-native grouped/indexed GEMM via CANN), not the

  humming kernels. get_humming_moe_gemm_type() reads the env var and selects between

  "indexed", "grouped_contiguous" (when value is "grouped"), or auto-selects based on

  moe_parallel_config.use_ep. On Ascend NPU this code path is not exercised, so the

  parameter has no measurable runtime effect on Ascend hardware. Its performance

  relevance is confined to GPU deployments using humming MoE kernels.

  '
usage_locations:
- file: vllm/envs.py:1517
  context: Reads VLLM_HUMMING_MOE_GEMM_TYPE from environment, default None
- file: vllm/model_executor/layers/fused_moe/experts/fused_humming_moe.py:104
  context: get_humming_moe_gemm_type() selects indexed/grouped_contiguous GEMM for humming MoE
related_parameters:
- name: VLLM_HUMMING_USE_F16_ACCUM
  relation: Sibling humming-kernel tuning env var; both only affect the humming MoE path
- name: VLLM_HUMMING_ONLINE_QUANT_CONFIG
  relation: Humming kernel quantization config, same GPU-only kernel family
constraints:
- Valid values are 'indexed', 'grouped', or 'auto'; any other non-null value is passed through as the gemm type string and
  may cause an invalid kernel selection.
- When set to 'grouped', the code maps it to 'grouped_contiguous' internally.
- 'When unset or ''auto'', the gemm type is chosen automatically: ''grouped_contiguous'' if expert parallelism (use_ep) is
  enabled, otherwise ''indexed''.'
tuning_advice:
  summary: No tuning needed on Ascend NPU; leave unset. Only relevant for GPU humming MoE kernels.
  suggested_values:
  - scenario: Ascend NPU deployment (any MoE model)
    value: auto
    reason: The humming MoE kernel path is not used on Ascend; leaving it unset/auto avoids confusion and has no runtime effect.
  - scenario: GPU deployment with expert parallelism using humming MoE
    value: grouped
    reason: Auto-selection already picks grouped_contiguous when use_ep is enabled; setting 'grouped' makes this explicit.
  caveats:
  - Do not expect any throughput change on Ascend NPU from this variable.
  quick_guide: Ignore on Ascend; only affects GPU humming MoE kernel selection.
analysis_date: '2026-10-27'
