constraints:
- The value must be one of 'auto', 'cpu', or the current platform device type (on Ascend this is 'npu'); other values are
  rejected by argparse choices.
- The flag only takes effect for HF 'fast' (torchvision-backed) processors that accept a 'device' argument; other processors
  ignore it and stay on CPU.
- An explicit 'device' entry in --mm-processor-kwargs overrides this flag entirely.
- '''auto'' resolves to the accelerator only for an encode-only EC producer instance whose tensor transport is torch_shm;
  everywhere else it resolves to ''cpu''.'
tuning_advice:
  summary: 'Leave at the default ''auto'' for standard Ascend deployments; only consider

    forcing ''npu'' in encode-only EC producer setups where preprocessing is a

    measurable bottleneck and torch_shm transport is used.

    '
  suggested_values:
  - scenario: Standard single-instance Ascend serving (no EC disaggregation)
    value: auto
    reason: '''auto'' resolves to ''cpu'' here, which is the safe default; forcing ''npu'' would contend the NPU with the
      language model for no benefit.'
  - scenario: Encode-only EC producer with --mm-tensor-ipc=torch_shm and heavy image/video preprocessing
    value: auto
    reason: '''auto'' correctly resolves to the accelerator in this case, offloading preprocessing to the NPU without a host
      copy.'
  - scenario: Debugging or CPU-only preprocessing to isolate NPU memory pressure
    value: cpu
    reason: Forces the processor onto CPU, freeing NPU memory and avoiding contention with the model.
  caveats:
  - Verify the model uses an HF 'fast' processor; slow processors ignore the device setting.
  - Do not set an explicit 'device' in --mm-processor-kwargs simultaneously; it silently overrides this flag.
  - Measure end-to-end latency before/after; preprocessing is usually a small fraction of total latency for LLM decode.
  quick_guide: Keep 'auto' unless running an encode-only EC producer with torch_shm transport and preprocessing-bound workloads.
