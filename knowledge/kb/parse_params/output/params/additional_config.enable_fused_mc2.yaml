name: additional_config.enable_fused_mc2
type: nested
category: communication
scope: vllm-ascend
source_file:
- vllm_ascend/ascend_config.py:608
- vllm_ascend/ascend_config.py:442
- vllm_ascend/ascend_config.py:671
- vllm_ascend/ascend_config.py:833
- vllm_ascend/ascend_config.py:1007
- vllm_ascend/lora/fused_moe.py:176
value_type: int
default: 0
valid_choices: 0, 1, 2 (2 is normalized to 1 at validation time; final effective value is 0 or 1)
cli_example: null
deprecated: false
performance_impact: high
performance_scope:
- latency
- throughput
- memory
impact_detail: "enable_fused_mc2 selects the fused MoE communication-computation path on Ascend NPU.\nIt is an Ascend-only\
  \ switch (defined in vllm_ascend/ascend_config.py, not in upstream vLLM),\nconsumed by the MoE layer to choose between the\
  \ standard dispatch/combine ops and a single\nfused C++ operator.\n\nValue semantics (from ascend_config.py:671-677 and\
  \ docs):\n- \"0: fused path disabled — MoE uses the unfused dispatch/combine path.\"\n- 1: \"selects dispatch_ffn_combine\
  \ (a fused dispatch + FFN + combine op). When set to 1,\"\n  _MEGA_MOE_SUPPORTED is forced to False, so the fused path routes\
  \ to dispatch_ffn_combine\n  rather than mega_moe (see test_fused_mc2_rolls_back_even_when_config_supported).\n- 2: \"requests\
  \ CANN MegaMoe; the validator checks importlib.util.find_spec(\\\"cann_ops_transformer\\\")\"\n  and, if present, sets _MEGA_MOE_SUPPORTED=True\
  \ and normalizes enable_fused_mc2 to 1.\n  If the CANN MegaMoe package is absent, _MEGA_MOE_SUPPORTED stays False and the\
  \ value is\n  still normalized to 1 (dispatch_ffn_combine path).\n\nPerformance mechanism: \"the fused MC2 operator fuses\
  \ the all-to-all dispatch, the expert FFN\"\ncompute, and the all-to-all combine into one kernel, eliminating intermediate\
  \ HBM round-trips\nand overlapping HCCL communication with NPU compute. This directly reduces MoE layer latency\nand raises\
  \ throughput on MoE models (e.g. DeepSeek, GLM, MiniMax). The fused path also\nallocates a per-rank token buffer sized by\
  \ mega_moe_max_tokens (default 65536), so workspace\nmemory scales with that value — enabling the fused path increases device\
  \ memory usage.\n\nThe docs (DeepSeek-V4-Pro tutorial) explicitly recommend enable_fused_mc2=1 to accelerate\ncommunication\
  \ on Prefill nodes (A3 series). Because the fused op is a single C++ kernel,\nit cannot be patched by Ascend MoE LoRA (fused_moe.py:176\
  \ raises if enable_fused_mc2 != 0).\n"
