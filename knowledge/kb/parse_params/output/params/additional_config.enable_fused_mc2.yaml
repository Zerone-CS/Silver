related_parameters:
- name: mega_moe_max_tokens
  relation: Per-rank token capacity for the fused MC2/MegaMoe path; workspace memory scales linearly with it. Only meaningful
    when enable_fused_mc2 is 1/2.
- name: mc2_comm_alg
  relation: Mutually exclusive — mc2_comm_alg='hierarchy' raises ValueError if enable_fused_mc2 is non-zero.
- name: enable_mc2_hierarchy_comm
  relation: Deprecated alias that sets mc2_comm_alg='hierarchy', which conflicts with enable_fused_mc2.
- name: multistream_overlap_shared_expert
  relation: Auto-disabled (set to False with a warning) when enable_fused_mc2 == 1.
- name: combine_quant_mode
  relation: Forces the MC2 combine stage comm quant_mode in the fused path; 0 uses the model's own quant.
- name: enable_prefill_mc2
  relation: Related MC2 switch controlling mc2_token_capacity reservation for prefill batches.
- name: enable_mlapo
  relation: Independent MoE/MLA optimization; both can be enabled together.
constraints:
- enable_fused_mc2 must be 0 or 1 after normalization; value 2 is only accepted as an input and is converted to 1 (with MegaMoe
  support detection).
- enable_fused_mc2 cannot be combined with mc2_comm_alg='hierarchy' (or the deprecated enable_mc2_hierarchy_comm=true); a
  ValueError is raised.
- MiniMax M3 models do not support enable_fused_mc2=1 (dispatch_ffn_combine); use 2 to enable MegaMoe or 0 to disable.
- Ascend MoE LoRA cannot be used when enable_fused_mc2 is non-zero; an AssertionError is raised.
- If MegaMoe is supported by the environment but the model config does not support it, enable_fused_mc2 is silently downgraded
  to 0 with a warning.
- Unknown keys in additional_config are rejected (extra='forbid'); a typo in enable_fused_mc2 fails fast.
tuning_advice:
  summary: Enable enable_fused_mc2=1 on MoE models (especially A3 prefill nodes) to fuse dispatch/FFN/combine and overlap
    HCCL communication with NPU compute; keep 0 for LoRA, MiniMax M3 without MegaMoe, or hierarchy communication.
  suggested_values:
  - scenario: MoE model (DeepSeek/GLM) on A3 series, prefill nodes, no LoRA, no hierarchy comm
    value: 1
    reason: Enables dispatch_ffn_combine to fuse all-to-all dispatch, expert FFN, and combine into one kernel, reducing MoE
      latency and raising throughput; docs recommend this for A3 prefill nodes.
  - scenario: MiniMax M3 model with CANN MegaMoe package (cann_ops_transformer) available
    value: 2
    reason: Value 2 requests MegaMoe; if cann_ops_transformer is found it enables MegaMoe (normalized to 1), otherwise falls
      back to dispatch_ffn_combine. Required because MiniMax M3 rejects enable_fused_mc2=1.
  - scenario: Using Ascend MoE LoRA, or mc2_comm_alg='hierarchy', or non-MoE model
    value: 0
    reason: Fused MC2 is incompatible with LoRA patching and hierarchy communication; non-MoE models gain nothing from the
      fused MoE path.
  - scenario: Default / conservative deployment
    value: 0
    reason: Default disables the fused path, avoiding extra workspace memory and compatibility constraints.
  caveats:
  - Tune mega_moe_max_tokens alongside enable_fused_mc2 — too small truncates tokens (precision loss), too large wastes device
    memory.
  - Do not set enable_fused_mc2 together with mc2_comm_alg='hierarchy'; the config validator raises an error.
  - Enabling the fused path auto-disables multistream_overlap_shared_expert with a warning.
  - The legacy VLLM_ASCEND_ENABLE_FUSED_MC2 env var is ignored; use the additional_config key.
  quick_guide: Set additional_config.enable_fused_mc2=1 for MoE models on A3 to fuse MoE communication+compute; use 2 for
    MiniMax M3 with MegaMoe; keep 0 for LoRA or hierarchy comm.
