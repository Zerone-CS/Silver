name: VLLM_MOE_SKIP_PADDING
type: env
category: model
scope: both
source_file:
- vllm/envs.py:1579
- vllm/envs.py:210
- vllm/v1/worker/gpu/model_runner.py:1279
- vllm/model_executor/layers/fused_moe/router/fused_topk_router.py:20
- vllm/model_executor/layers/fused_moe/router/fused_topk_bias_router.py:24
