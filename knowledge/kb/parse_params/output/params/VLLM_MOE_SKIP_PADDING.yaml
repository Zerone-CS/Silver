value_type: bool
default: true
valid_choices: 0 or 1 (parsed via bool(int(os.getenv(...))))
cli_example: null
deprecated: false
performance_impact: medium
performance_scope:
- throughput
- latency
impact_detail: 'Upstream vLLM: "when enabled, the model runner marks trailing cudagraph/DP padding"

  rows in `is_padding` (vllm/v1/worker/gpu/model_runner.py:1279), and MoE routers

  (fused_topk_router.py:20, fused_topk_bias_router.py:24) and MegaMoE

  (deepseek_v4/nvidia/model.py:691, fi_moe.py:50) read this mask to force padding

  tokens'' topk_ids to -1 so dispatch and expert GEMMs drop them. This reduces wasted

  expert compute on padding rows, improving throughput/latency when padding is

  significant (small batches, cudagraph padding, DP padding).


  vllm-ascend: "the flag is consumed in the sequence-parallel MoE path of several"

  Ascend models (deepseek_v4/model.py:929, deepseek_v4/dspark.py:271,

  deepseek_v4/mtp.py:137, deepseek_v41/model.py:1542, deepseek_v41/dspark.py:252,

  kimi_k3.py:855, minimax_m3/minimax_m3.py:1187). When enabled and a forward context

  is available, it computes `sp_padding_mask(...)` from the current `is_padding` and

  installs it into `forward_context.is_padding` before `sp_shard` splits the token

  axis. This propagates the padding mask into the sharded MoE computation so that

  padding tokens are skipped in the expert dispatch/GEMM. The mask is restored after

  the SP region (e.g. dspark/mtp save `orig_is_padding` and restore it) to avoid

  leaking a sharded mask into subsequent steps. Net effect on Ascend: avoids wasted

  expert compute on padding tokens under sequence-parallel MoE, improving effective

  throughput; the mask computation itself is a small overhead. It only takes effect

  when sequence-parallel MoE is active and a forward context exists.

  '
