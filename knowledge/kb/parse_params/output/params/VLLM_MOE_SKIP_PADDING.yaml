related_parameters:
- name: VLLM_USE_FUSED_MOE_GROUPED_TOPK
  relation: Both affect MoE expert selection; grouped topk is the router that consumes the padding mask
- name: --enable-expert-parallel
  relation: Padding skipping reduces wasted expert compute, most beneficial with EP MoE dispatch
- name: compilation_config.cudagraph_mode
  relation: Padding rows originate from cudagraph/DP padding; more padding means larger benefit
constraints:
- The value is parsed as bool(int(...)), so only '0' or '1' are valid; other strings raise a ValueError at import time.
- On Ascend, the flag only has an effect when sequence-parallel MoE is active and a forward context is available; otherwise
  the mask logic is skipped.
- Requires a MoE kernel that treats topk_id == -1 as a skip sentinel; kernels that do not support the sentinel will not benefit
  and may misbehave.
tuning_advice:
  summary: Keep enabled (default) for sequence-parallel MoE models on Ascend to skip expert compute on padding tokens; disable
    only if a kernel lacks -1 sentinel support.
  suggested_values:
  - scenario: DeepSeek V4/V4.1, Kimi-K3, MiniMax-M3 with sequence-parallel MoE on Ascend
    value: 1
    reason: Enables sp_padding_mask propagation so padding tokens are dropped from expert dispatch/GEMM, improving effective
      throughput.
  - scenario: Small-batch decode or DP/cudagraph padding-heavy workloads
    value: 1
    reason: Padding fraction is largest here, so skipping padding expert compute yields the biggest latency/throughput gain.
  - scenario: MoE kernel without topk_id == -1 skip-sentinel support
    value: 0
    reason: Without sentinel support the mask cannot be honored; disabling avoids relying on unsupported behavior.
  caveats:
  - Only effective under sequence-parallel MoE with an available forward context on Ascend.
  - Mask bookkeeping (save/restore is_padding) is required to avoid leaking sharded masks across draft steps; keep the flag
    consistent across a run.
  quick_guide: Leave VLLM_MOE_SKIP_PADDING=1 (default) for SP-MoE models on Ascend; set 0 only if your MoE kernel cannot handle
    -1 skip sentinels.
analysis_date: '2026-10-27'
