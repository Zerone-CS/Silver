name: speculative.target_parallel_config
type: nested
category: speculation
scope: both
source_file:
- vllm/config/speculative.py:1
- tests/ut/spec_decode/test_eagle_proposer.py:482
- tests/ut/spec_decode/test_eagle_proposer.py:2788
value_type: dict
default: <computed>
valid_choices: A ParallelConfig object; tensor_parallel_size must equal the target model's tensor_parallel_size
cli_example: null
deprecated: false
performance_impact: low
performance_scope:
- throughput
- memory
impact_detail: 'target_parallel_config is the ParallelConfig describing the target (verifier) model''s

  parallelism, stored on SpeculativeConfig. It is not a user-facing CLI flag; it is derived

  from the main vLLM ParallelConfig and consumed by speculative proposers to decide whether

  the draft model can share the target''s parallel layout. In vllm-ascend v1, the

  AscendDraftModelProposer (tests/ut/spec_decode/test_eagle_proposer.py:482, :2788) reads

  speculative_config.target_parallel_config.tensor_parallel_size and compares it against

  draft_parallel_config.tensor_parallel_size. The test comment at line 480

  ("remove when target_tp != draft_tp will be supported") shows that on Ascend the draft and

  target tensor-parallel sizes must currently match (both forced to 1 in the test). When they

  match, the proposer can reuse the target''s TP layout and avoid extra communication /

  weight duplication; when they differ, the code path is unsupported. The parameter itself

  does not directly allocate memory or launch kernels — it gates which speculative execution

  path is taken, so its runtime performance effect is indirect and low.

  '
usage_locations:
- file: tests/ut/spec_decode/test_eagle_proposer.py:482
  context: AscendDraftModelProposer test sets target_parallel_config.tensor_parallel_size = 1 to match draft TP (target_tp
    != draft_tp unsupported)
- file: tests/ut/spec_decode/test_eagle_proposer.py:2788
  context: Draft model proposer setup forces target and draft tensor_parallel_size to 1 before constructing AscendDraftModelProposer
related_parameters:
- name: speculative.draft_parallel_config
  relation: Must have tensor_parallel_size equal to target_parallel_config.tensor_parallel_size on Ascend (target_tp != draft_tp
    not yet supported)
- name: speculative.method
  relation: Only relevant for draft_model / eagle-style speculative methods that instantiate a proposer
- name: tensor_parallel_size
  relation: target_parallel_config is derived from the main ParallelConfig; its TP size mirrors the target model's TP size
constraints:
- On vllm-ascend v1, the draft model's tensor_parallel_size must equal the target model's tensor_parallel_size; target_tp
  != draft_tp is not yet supported (see TODO in test_eagle_proposer.py:480).
- target_parallel_config is not set directly by users; it is populated from the main ParallelConfig and should not be overridden
  manually.
tuning_advice:
  summary: Do not tune directly; ensure draft and target tensor-parallel sizes match when using speculative decoding on Ascend
    v1.
  suggested_values:
  - scenario: Speculative decoding (draft_model/eagle) on Ascend v1
    value: target_parallel_config.tensor_parallel_size == draft_parallel_config.tensor_parallel_size
    reason: vllm-ascend v1 AscendDraftModelProposer requires target_tp == draft_tp; mismatched TP is unsupported and will
      fail or fall back.
  - scenario: Single-NPU or TP=1 deployment
    value: 1
    reason: Tests force both target and draft TP to 1, the simplest supported configuration.
  caveats:
  - Leave this field at its computed value; it is derived from --tensor-parallel-size of the target model.
  - If you need a different draft TP, verify vllm-ascend version supports target_tp != draft_tp before relying on it.
  quick_guide: Keep draft TP equal to target TP; do not set target_parallel_config manually.
analysis_date: '2026-10-27'
