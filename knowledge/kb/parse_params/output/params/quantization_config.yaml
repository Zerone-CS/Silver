related_parameters:
- name: --quantization
  relation: quantization_config is auto-populated from the matching online shorthand when --quantization is in ONLINE_QUANT_SHORTHAND_NAMES;
    the two must be consistent
- name: --allow-deprecated-quantization
  relation: Gates whether deprecated quantization methods are permitted
- name: --dtype
  relation: When no quantization is applied, dtype determines weight data type; quantization_config overrides this for quantized
    layers
- name: --model
  relation: HF model config's quantization_config attribute is used when --quantization is None
constraints:
- quantization_config.targets is mutually exclusive with quantization_config.linear and quantization_config.moe; specifying
  both raises a ValueError.
- Each targets key must be a valid online shorthand name or a regex prefixed with 're:'; invalid names or malformed regexes
  raise a ValueError.
- When --quantization is one of the ONLINE_QUANT_SHORTHAND_NAMES, quantization_config is auto-populated from that shorthand
  and should not conflict with a manually supplied config.
- On Ascend, the resolved quant type must be supported by the registered Ascend scheme registry; unsupported quant_type/layer_type
  combinations raise NotImplementedError.
tuning_advice:
  summary: Use --quantization-config to select the fastest Ascend-supported quant scheme (e.g. W8A8/FP8) for linear and MoE
    layers to maximize NPU Cube throughput and cut memory.
  suggested_values:
  - scenario: Throughput-oriented dense/MoE serving on Ascend 910B/910C with a W8A8 checkpoint
    value: '{"linear": "int8_per_channel_static", "moe": "int8_per_channel_static"}'
    reason: Selects Ascend-native W8A8 quantized GEMM/MoE kernels, the primary fast path on Da Vinci Cube units.
  - scenario: FP8-capable hardware wanting dynamic activation scaling
    value: '{"linear": "fp8_per_tensor_dynamic"}'
    reason: Dynamic per-tensor FP8 avoids static calibration while keeping quantized matmul throughput.
  - scenario: Mixed precision where only MoE layers are quantized (e.g. Kimi-K2-Thinking)
    value: '{"targets": {"MoE": "int8_per_channel_static"}}'
    reason: Docs instruct setting targets to MoE for the quantized Kimi-K2-Thinking checkpoint; targets is mutually exclusive
      with linear/moe.
  - scenario: Memory-constrained deployment needing weight compression
    value: '{"linear": "mxfp4"}'
    reason: Lower-bit weight quantization reduces NPU HBM footprint at some accuracy cost, if the Ascend scheme registry supports
      it.
  caveats:
  - Verify the chosen quant key is supported by the Ascend scheme registry; unsupported combos raise NotImplementedError at
    model build.
  - Do not combine targets with linear/moe — it raises a ValueError.
  - On 310P ensure packed_modules_mapping consistency to avoid fused-module fallback and NZ/transpose issues.
  - Changing this value re-keys the rfork fingerprint and forces weight reload.
  quick_guide: Set --quantization-config to the Ascend-supported W8A8/FP8 scheme matching your checkpoint to unlock quantized
    NPU kernels; keep it consistent with --quantization.
analysis_date: '2026-10-27'
