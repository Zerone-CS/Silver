name: --quantization-config
type: cli
category: quantization
scope: both
source_file:
- vllm/engine/arg_utils.py:902
- vllm/engine/arg_utils.py:577
- vllm/engine/arg_utils.py:830
- vllm/config/model.py:235
- vllm/config/quantization.py:32
- vllm/config/quantization.py:177
- vllm_ascend/quantization/configs/compressed_tensors_config.py:45
- vllm_ascend/_310p/quantization/modelslim_config.py:75
- vllm_ascend/model_loader/rfork/identity.py:193
value_type: dict
default: null
valid_choices: dict with keys linear, moe, targets, ignore; quant key names include fp8_per_tensor_static, fp8_per_tensor_dynamic,
  fp8_per_token, fp8_per_channel_static, fp8_per_block_static, fp8_per_block_dynamic, mxfp8, mxfp4, int8_per_channel_static
cli_example: '--quantization-config ''{"linear": "fp8_per_tensor_dynamic"}'''
deprecated: false
performance_impact: high
performance_scope:
- throughput
- latency
- memory
impact_detail: '--quantization-config is the user-facing knob that selects the numeric precision

  (and thus the compute/memory cost) of linear and MoE layers. In upstream vLLM it is

  resolved in EngineArgs.create_engine_config via resolve_quantization_config()

  (vllm/engine/arg_utils.py:830-834), which turns the dict/QuantizationConfigArgs into

  a concrete QuantizationConfig. The chosen QuantKey (e.g. fp8_per_tensor_dynamic,

  mxfp8, int8_per_channel_static) determines which quantized GEMM kernels are dispatched

  per layer, directly changing matmul throughput, weight/activation memory footprint,

  and whether dequant overhead is paid at runtime.

  On Ascend, the resolved config is consumed by vllm-ascend''s registered quantization

  configs: "AscendModelSlimConfig (registered under ASCEND_QUANTIZATION_METHOD, with a"

  310P override at vllm_ascend/_310p/quantization/modelslim_config.py:75) and

  AscendCompressedTensorsConfig (registered under COMPRESSED_TENSORS_METHOD at

  vllm_ascend/quantization/configs/compressed_tensors_config.py:45). These map the

  per-layer quant type to Ascend-native schemes (W8A8, W4A8, etc.) that run on the

  Da Vinci Cube units, so the config choice governs whether the fast quantized NPU

  kernels are used versus a slower unquantized fallback. The config also feeds the

  rfork fingerprint digest (vllm_ascend/model_loader/rfork/identity.py:193), so changing

  it re-keys weight-loading caches. Because it selects the actual compute precision of

  the dominant GEMM/MoE ops, its impact on Ascend throughput and memory is high.

  '
usage_locations:
- file: vllm/engine/arg_utils.py:902
  context: CLI argument registration for --quantization-config in ModelConfig group
- file: vllm/engine/arg_utils.py:830
