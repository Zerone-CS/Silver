name: VLLM_DEEPEP_BUFFER_SIZE_MB
type: env
category: communication
scope: vllm
source_file:
- vllm/envs.py:1935
- vllm/envs.py:280
- vllm/distributed/device_communicators/all2all.py:222
- vllm/distributed/device_communicators/all2all.py:307
value_type: int
default: 1024
valid_choices: positive integer (MB); no explicit upper bound enforced in code
cli_example: null
deprecated: false
performance_impact: low
performance_scope:
- memory
- latency
impact_detail: "This env var only feeds the DeepEP (NVIDIA DeepEP) all-to-all communication\nbackend in vLLM upstream. In\
  \ vllm/distributed/device_communicators/all2all.py\nit is read in two places:\n- \"DeepEPHTAll2AllManager._make_all2all_kwargs\
  \ (line 222): sets num_nvl_bytes\"\n  = VLLM_DEEPEP_BUFFER_SIZE_MB * 1024 * 1024, and for internode (when\n  VLLM_DEEPEP_HIGH_THROUGHPUT_FORCE_INTRA_NODE\
  \ is false) also sets\n  num_rdma_bytes to the same value.\n- \"DeepEPLLAll2AllManager._make_all2all_kwargs (line 307):\
  \ sets num_nvl_bytes\"\n  for the low-latency DeepEP buffer; num_rdma_bytes is instead computed via\n  deep_ep.Buffer.get_low_latency_rdma_size_hint.\n\
  The value is passed to the DeepEP Buffer constructor as the size of the\nNVL (intra-node NVLink) and RDMA (inter-node) communication\
  \ buffers. Larger\nbuffers reserve more device/host memory per rank but reduce the chance of\nbuffer overflow / reallocation\
  \ during large dispatch-combine batches; smaller\nbuffers save memory but can cause failures or fallback when token counts\
  \ are\nlarge. This is a memory-vs-robustness tradeoff, not a hot-path compute knob,\nhence low performance impact.\nOn Ascend\
  \ NPU: \"DeepEP is a CUDA/NVLink/RDMA-specific library. vllm-ascend\"\ndoes not use DeepEP; Ascend MoE all-to-all goes through\
  \ HCCL-based\ncommunication (e.g. Ascend-native dispatch/combine). No usage of\nVLLM_DEEPEP_BUFFER_SIZE_MB was found in\
  \ vllm-ascend source, so this\nparameter has no runtime effect on Ascend NPU. It is effectively a no-op\nunless a DeepEP-based\
  \ all2all backend is somehow selected, which is not the\ncase on Ascend.\n"
usage_locations:
- file: vllm/envs.py:1935
  context: Environment variable definition, parsed as int with default 1024 MB.
- file: vllm/envs.py:280
  context: 'Type stub declaration VLLM_DEEPEP_BUFFER_SIZE_MB: int = 1024.'
