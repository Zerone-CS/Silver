related_parameters:
- name: VLLM_DEEPEP_HIGH_THROUGHPUT_FORCE_INTRA_NODE
  relation: When false and internode is true, this buffer size is also used for num_rdma_bytes; when true, RDMA buffer is
    0.
- name: VLLM_DEEPEP_LOW_LATENCY_USE_MNNVL
  relation: Affects low-latency DeepEP buffer configuration alongside this size.
- name: VLLM_ALL2ALL_BACKEND
  relation: DeepEP backend must be selected for this parameter to be read at all.
constraints:
- The value must be a positive integer number of megabytes; it is multiplied by 1024*1024 to form byte counts for DeepEP buffers.
- This parameter only takes effect when a DeepEP-based all2all backend is selected; it is ignored otherwise.
- On Ascend NPU, DeepEP is not used, so this parameter has no effect.
tuning_advice:
  summary: No tuning needed on Ascend NPU — DeepEP is not used; on CUDA systems raise it only if large MoE dispatch batches
    overflow the default 1024 MB buffer.
  suggested_values:
  - scenario: Ascend NPU deployment (vllm-ascend v1 or v2 worker)
    value: 1024
    reason: DeepEP is not used on Ascend; leave at default (or unset) since the value has no runtime effect.
  - scenario: CUDA GPU with DeepEP backend and large MoE all-to-all batches
    value: 2048
    reason: Larger NVL/RDMA buffers reduce overflow risk for big dispatch-combine batches at the cost of extra memory.
  - scenario: CUDA GPU with tight memory budget and small batches
    value: 512
    reason: Smaller buffers free memory for KV cache when token counts per batch are modest.
  caveats:
  - Do not expect any effect on Ascend NPU; Ascend MoE communication uses HCCL, not DeepEP.
  - Only relevant when VLLM_ALL2ALL_BACKEND selects a DeepEP backend on CUDA hardware.
  quick_guide: Ignore on Ascend NPU; on CUDA DeepEP setups tune between 512 and 2048 MB based on batch size vs memory budget.
analysis_date: '2026-10-27'
