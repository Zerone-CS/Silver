related_parameters:
- name: --offload-backend
  relation: Must be 'prefetch' (or 'auto' with group_size>0) for this parameter to take effect; on Ascend only 'prefetch'
    is honored.
- name: --offload-num-in-group
  relation: Number of layers offloaded per group; must be <= offload_group_size. Offload fraction = num_in_group / group_size.
- name: --offload-prefetch-step
  relation: Number of layers prefetched ahead; must be >= 1 when group_size > 0. Higher hides more latency but uses more NPU
    memory.
- name: --offload-params
  relation: Selects which parameter name segments to offload; empty means all params of offloaded layers.
- name: --cpu-offload-gb
  relation: Alternative UVA offloading backend; on Ascend this is a no-op (only prefetch is supported), so mutually exclusive
    in practice.
constraints:
- offload_group_size must be >= 0; 0 disables prefetch offloading.
- offload_num_in_group must be <= offload_group_size, otherwise a ValueError is raised.
- offload_prefetch_step must be >= 1 when offload_group_size > 0, otherwise a ValueError is raised.
- On Ascend, weight offloading only works with --offload-backend prefetch; the uva backend is not implemented and falls back
  to a no-op offloader.
tuning_advice:
  summary: 'Use --offload-group-size together with --offload-num-in-group to trade NPU HBM for H2D

    transfer overhead; on Ascend this is the only working weight-offload path. Pick the

    smallest offload fraction (num_in_group/group_size) that frees enough memory, and rely on

    --offload-prefetch-step to hide the transfer latency.

    '
  suggested_values:
  - scenario: Model fits but KV cache is starved; want to free a little HBM with minimal latency cost
    value: 8
    reason: group_size=8 with num_in_group=1 offloads only 1/8 of layers, freeing modest HBM while keeping transfer overhead
      low; matches Ascend e2e test config.
  - scenario: Model barely fits / needs significant HBM relief, latency less critical
    value: 4
    reason: group_size=4 with num_in_group=1 offloads 1/4 of layers, freeing more HBM at higher per-token transfer cost; validated
      in Ascend e2e test.
  - scenario: Selective offload of only heavy MLP/MoE weights to minimize overhead
    value: 8
    reason: Combine group_size=8 with --offload-params {gate_up_proj,down_proj} (or w13_weight/w2_weight) so only large weights
      move, as in the Ascend e2e test.
  - scenario: Disable offloading (default)
    value: 0
    reason: No offloading; full weights resident in HBM, best latency/throughput when memory permits.
  caveats:
  - On Ascend, --cpu-offload-gb (UVA backend) is a no-op; only --offload-backend prefetch with offload_group_size > 0 actually
    offloads weights.
  - Every offloaded layer adds an H2D copy per forward pass; if compute is too fast relative to host-to-device bandwidth,
    throughput drops. Increase --offload-prefetch-step to hide more latency at the cost of extra NPU memory.
  - Larger group_size with fixed num_in_group reduces the offloaded fraction, saving less memory but reducing transfer overhead
    — tune the ratio, not just the absolute value.
  - Offloading is compatible with ACL graph capture on Ascend (validated with cudagraph_capture_sizes in e2e tests), but verify
    accuracy with your model/quantization.
  - Weight offloading disables some fused/optimized paths (e.g. DeepSeek V4 heterogeneous shared-expert fusion is skipped
    when offload_group_size > 0), which can reduce throughput beyond the raw transfer cost.
  quick_guide: Set --offload-backend prefetch and --offload-group-size N (with --offload-num-in-group <= N) to free HBM on
    Ascend; start with 8/1 and lower group_size only if you need more memory.
