name: --offload-group-size
type: cli
category: memory
scope: both
source_file:
- vllm/config/offload.py:54
- vllm/engine/arg_utils.py:1345
- vllm/engine/arg_utils.py:550
- vllm/model_executor/offloader/base.py:145
- vllm_ascend/model_executor/offloader/base.py:22
value_type: int
default: 0
valid_choices: integer >= 0 (0 disables prefetch offloading)
cli_example: --offload-group-size 8
deprecated: false
performance_impact: high
performance_scope:
- memory
- latency
- throughput
impact_detail: 'This parameter controls the prefetch-based CPU weight offloading backend. When

  offload_group_size > 0, vLLM''s create_offloader (vllm/model_executor/offloader/base.py:145)

  selects the PrefetchOffloader (or, on Ascend, AscendPrefetchOffloader via

  vllm_ascend/model_executor/offloader/base.py:22). The model''s layers are partitioned into

  groups of N layers; the last `offload_num_in_group` layers of each group have their weights

  kept in CPU memory and copied to NPU on demand via explicit async prefetch (H2D transfer),

  hiding transfer latency behind compute of preceding layers.

  Memory mechanism: "offloading weights frees NPU HBM that would otherwise hold those layers''"

  parameters, allowing larger models to fit or more KV cache to be allocated (higher

  gpu_memory_utilization headroom). This is the primary benefit — enabling a model that would

  otherwise OOM on a given NPU.

  Latency/throughput mechanism: every forward pass incurs H2D copies for the offloaded layers.

  If prefetching (offload_prefetch_step) successfully hides the transfer behind compute, the

  throughput penalty is small; if not (e.g. compute-bound layers too fast relative to PCIe/H2D

  bandwidth), each offloaded layer adds a stall, reducing tokens/sec. Larger group_size with

  the same num_in_group means fewer offloaded layers overall (offload fraction = num_in_group /

  group_size), so larger group_size = less memory saved but less transfer overhead.

  Ascend specifics: "vllm-ascend''s create_offloader only honors the \"prefetch\" backend"

  (AscendPrefetchOffloader with mode="cpu"); the "uva" backend falls through to NoopOffloader.

  So on Ascend, --offload-group-size is the ONLY way to activate weight offloading — cpu_offload_gb

  (UVA) is effectively a no-op. The H2D path uses Ascend host-to-device copies (not CUDA), and

  the e2e tests (test_cpu_weight_offload.py) exercise group_size=4/num_in_group=1 and

  group_size=8/num_in_group=2 with both eager and graph (cudagraph_capture_sizes) modes,

  confirming compatibility with ACL graph capture on Ascend.

  '
usage_locations:
- file: vllm/config/offload.py:54
  context: 'Field definition offload_group_size: int = Field(default=0, ge=0) with docstring describing group-based offloading.'
- file: vllm/config/offload.py:100
  context: 'Validator: prefetch backend active when offload_group_size > 0; enforces num_in_group <= group_size and prefetch_step
    >= 1.'
- file: vllm/model_executor/offloader/base.py:145
  context: create_offloader auto-selects prefetch backend when offload_group_size > 0; passes group_size to PrefetchOffloader.
- file: vllm_ascend/model_executor/offloader/base.py:22
  context: Ascend create_offloader builds AscendPrefetchOffloader from prefetch.offload_group_size when backend == 'prefetch'.
