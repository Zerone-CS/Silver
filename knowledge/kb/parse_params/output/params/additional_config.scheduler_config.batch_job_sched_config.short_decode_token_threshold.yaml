- name: additional_config.scheduler_config.batch_job_sched_config.reserve_max_blocks
  relation: Upper bound on reserved blocks used by the same scheduler
constraints:
- short_decode_token_threshold must be a positive integer; values <= 0 raise a ValueError at config validation time.
- The parameter only takes effect when batch_job_sched_config.enabled is set to true.
tuning_advice:
  summary: Tune short_decode_token_threshold to match the workload's short-output length so the batch-job-aware scheduler
    can protect short decode jobs under KV pressure.
  suggested_values:
  - scenario: Chat/interactive workloads with many short responses (tens of tokens)
    value: 32
    reason: Default 32 matches typical short chat completions; keeps short jobs classified correctly.
  - scenario: Workloads dominated by very short outputs (e.g. classification, yes/no answers)
    value: 16
    reason: Lower threshold so only truly short jobs are prioritised, avoiding over-prioritisation.
  - scenario: Mixed workloads with longer short-form outputs (e.g. summaries of ~100 tokens)
    value: 128
    reason: Raise threshold so medium-length jobs also benefit from short-decode prioritisation under KV pressure.
  caveats:
  - Only effective when batch_job_sched_config.enabled is true.
  - Tune jointly with low_available_tokens_threshold; the two together determine scheduling order.
  - Monitor per-job latency distribution after changing to ensure long jobs are not starved.
  quick_guide: Set to roughly the p50 output length of your short requests; default 32 is fine for chat.
analysis_date: '2026-10-27'
