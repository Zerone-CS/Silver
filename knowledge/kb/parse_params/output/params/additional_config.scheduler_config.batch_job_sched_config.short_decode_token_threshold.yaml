- vllm_ascend/ascend_config.py:1552
value_type: int
default: 32
valid_choices: any positive integer (> 0)
cli_example: null
deprecated: false
performance_impact: medium
performance_scope:
- throughput
- latency
impact_detail: 'This parameter is defined only in vllm-ascend (vllm_ascend/ascend_config.py:1533) as part of

  BatchJobSchedConfig, the config for the batch-job-aware scheduler. It is a threshold used to

  classify a decode job as "short decode" (per docs: "Threshold for classifying a job as ''short

  decode''"). The batch-job-aware scheduler uses this classification together with

  low_available_tokens_threshold to decide scheduling priority: "when available KV tokens exceed"

  low_available_tokens_threshold, long decode jobs are prioritised; when available tokens are at

  or below that threshold, short decode jobs are prioritised. By changing which jobs count as

  "short", this parameter shifts which requests get scheduled first under KV-cache pressure,

  affecting decode-step latency distribution and overall throughput (e.g. protecting short jobs

  from head-of-line blocking by long jobs, or vice versa). It has no effect unless

  batch_job_sched_config.enabled is true. The parameter does not directly allocate memory or

  change kernel behavior; its impact is indirect via scheduling order.

  '
usage_locations:
- file: vllm_ascend/ascend_config.py:1533
  context: Field definition with default 32 in BatchJobSchedConfig pydantic dataclass
- file: vllm_ascend/ascend_config.py:1552
  context: after model_validator rejects values <= 0 with ValueError
related_parameters:
- name: additional_config.scheduler_config.batch_job_sched_config.enabled
  relation: Master switch; short_decode_token_threshold has no effect unless enabled is true
- name: additional_config.scheduler_config.batch_job_sched_config.low_available_tokens_threshold
  relation: Companion threshold that decides long-vs-short decode prioritisation based on available KV tokens
- name: additional_config.scheduler_config.batch_job_sched_config.max_jobs
  relation: Bounds how many jobs are tracked by the same scheduler
- name: additional_config.scheduler_config.batch_job_sched_config.reserve_margin_blocks
