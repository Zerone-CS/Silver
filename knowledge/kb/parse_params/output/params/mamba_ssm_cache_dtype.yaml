related_parameters:
- name: --mamba-cache-dtype
  relation: Controls the conv state dtype and, when --mamba-ssm-cache-dtype is 'auto', also determines the SSM state dtype
- name: --dtype
  relation: Model activation dtype; used as the fallback when both mamba cache dtypes are 'auto'. On 310P must be float16
- name: --enable-mamba-cache-stochastic-rounding
  relation: Requires --mamba-ssm-cache-dtype float16, otherwise VllmConfig raises ValueError
- name: --mamba-cache-mode
  relation: Determines whether Mamba state checkpoints are cached (prefix caching); affects how much SSM state memory is allocated
- name: --use-replayssm
  relation: Appends extra ReplaySSM ring buffers (activation, fp32, activation) on top of the base (conv, ssm) dtype tuple
- name: --gpu-memory-utilization
  relation: SSM cache dtype changes the per-block Mamba state size, which interacts with the memory budget set by gpu-memory-utilization
constraints:
- When --enable-mamba-cache-stochastic-rounding is set, --mamba-ssm-cache-dtype must be exactly float16 or VllmConfig validation
  raises a ValueError.
- On Atlas 300I DUO and Atlas 200I Pro (310P) devices only float16 is supported for --mamba-ssm-cache-dtype.
- On Atlas 300I DUO and Atlas 200I Pro, --dtype float16 must also be set because these devices only support FP16.
- The parameter only affects the SSM state; the conv state dtype is still controlled by --mamba-cache-dtype.
- When set to 'auto', the SSM state dtype is inherited from --mamba-cache-dtype, so the flag has no independent effect.
tuning_advice:
  summary: On Ascend 310P hardware always set --mamba-ssm-cache-dtype float16; on other Ascend devices leave it 'auto' unless
    you need to trade precision for SSM state memory.
  suggested_values:
  - scenario: Atlas 300I DUO / Atlas 200I Pro (310P) running Qwen3.5/Qwen3.8 hybrid Mamba models
    value: float16
    reason: vllm-ascend docs state only float16 is supported on 310P, and all 310P e2e tests pass mamba_ssm_cache_dtype=float16
      together with dtype=float16.
  - scenario: Enabling --enable-mamba-cache-stochastic-rounding
    value: float16
    reason: vllm/config/vllm.py:1351 raises ValueError unless the SSM cache dtype is exactly float16 when stochastic rounding
      is enabled.
  - scenario: Default deployment on non-310P Ascend devices (e.g. 910B/910 series) with model dtype bfloat16
    value: auto
    reason: Leaving it 'auto' inherits --mamba-cache-dtype (which defaults to the model dtype), avoiding an extra precision
      loss and keeping the SSM state consistent with the rest of the cache.
  - scenario: Memory-constrained deployment where Mamba state HBM is the bottleneck
    value: float16
    reason: float16 halves the SSM state footprint versus float32, allowing more blocks/batch slots within the same --gpu-memory-utilization
      budget.
  caveats:
  - Setting float32 doubles the SSM state memory and increases per-token state-update cost on Ascend AI cores, reducing throughput
    and increasing decode latency.
  - This flag only changes the SSM state dtype; the conv state remains controlled by --mamba-cache-dtype, so setting only
    this flag does not fully control Mamba cache memory.
  - With 'auto' the flag is a no-op because the SSM dtype is inherited from --mamba-cache-dtype; do not expect any effect
    from leaving it at default.
  - vllm-ascend does not override this field in code; the upstream CacheConfig value is used directly, but the 310P platform
    restriction to float16 comes from the vllm-ascend documentation and tests.
  - When --use-replayssm is enabled, extra ReplaySSM ring buffers are appended with activation/fp32/activation dtypes regardless
    of this flag, so the SSM dtype does not cover the full Mamba state memory.
  quick_guide: Use float16 on 310P (required) and when enabling stochastic rounding; otherwise leave 'auto' to inherit from
    --mamba-cache-dtype.
analysis_date: '2026-10-27'
