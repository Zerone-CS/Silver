name: --mamba-ssm-cache-dtype
type: cli
category: kv_cache
scope: both
source_file:
- vllm/config/cache.py:174
- vllm/engine/arg_utils.py:737
- vllm/engine/arg_utils.py:1303
- vllm/engine/arg_utils.py:2112
- vllm/model_executor/layers/mamba/mamba_utils.py:68
- vllm/model_executor/layers/mamba/mamba_utils.py:82
- vllm/model_executor/layers/mamba/mamba_mixer.py:470
- vllm/model_executor/layers/mamba/mamba_mixer2.py:1175
- vllm/model_executor/layers/mamba/gdn/base.py:57
- vllm/config/vllm.py:1351
value_type: str
default: auto
valid_choices:
- auto
- float16
- bfloat16
- float32
cli_example: --mamba-ssm-cache-dtype float16
deprecated: false
performance_impact: medium
performance_scope:
- memory
- latency
- throughput
impact_detail: 'This parameter controls the torch dtype of the SSM (state-space model) state tensor

  in the Mamba cache, while the conv state remains governed by --mamba-cache-dtype.

  It is consumed by MambaStateDtypeCalculator._mamba_state_dtype (vllm/model_executor/

  layers/mamba/mamba_utils.py), which is called from get_state_dtype() in every Mamba

  layer implementation: "mamba1_state_dtype (mamba_mixer.py:470), mamba2_state_dtype"

  (mamba_mixer2.py:1175), and gated_delta_net_state_dtype (gdn/base.py:57). The returned

  dtype tuple determines the allocation dtype of the per-layer Mamba state buffers, so

  it directly changes the HBM footprint of the Mamba cache: "float32 doubles the SSM"

  state size versus float16/bfloat16, which reduces the number of blocks that fit in

  the KV-cache budget and therefore the achievable batch size / throughput. The dtype

  also affects the precision and the cost of the recurrent state update kernels

  (selective_scan / causal_conv1d style ops): fp32 state updates are more expensive

  per token than fp16 on Ascend AI cores, adding decode latency, while fp16 halves

  state memory traffic. When set to "auto", the SSM dtype is inherited from

  --mamba-cache-dtype (which itself defaults to the model dtype), so the parameter has

  no independent effect unless explicitly set. On Ascend, vllm-ascend does not define

  its own override of this field; the upstream CacheConfig value flows through

  unchanged, but the vllm-ascend docs constrain it to float16 on Atlas 300I DUO /

  Atlas 200I Pro (310P) hardware, and the 310P e2e tests always pass

  mamba_ssm_cache_dtype="float16" together with dtype="float16". There is also a hard

  interaction with --enable-mamba-cache-stochastic-rounding: "vllm/config/vllm.py:1351"

  raises ValueError unless the SSM cache dtype is exactly float16 when stochastic

  rounding is enabled.

  '
