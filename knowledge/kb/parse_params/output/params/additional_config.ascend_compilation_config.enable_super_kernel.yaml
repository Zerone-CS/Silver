performance_impact: high
performance_scope:
- latency
- throughput
impact_detail: 'enable_super_kernel controls whether the Ascend Super Kernel optimization is applied

  during ACL graph capture / static-kernel compilation. It is a vllm-ascend-only nested

  config field (no upstream vLLM equivalent).


  Mechanism (v1 path, vllm_ascend/compilation/compiler_interface.py:122-135): when

  enable_static_kernel is true, the compiler sets options["static_kernel_compile"]=True

  and a sym_range for static-shape kernels. Only if enable_super_kernel is also true does

  it additionally set options["super_kernel_optimize"]=True and

  options["super_kernel_optimize_options"]={"dcci_after_kernel_end": [".*"]}. This asks

  the CANN/npugraph_ex compiler to fuse/optimize kernels into a Super Kernel and to insert

  DCCI (data cache clean/invalidate) after each kernel end, reducing per-kernel launch and

  cache-maintenance overhead during graph replay — directly lowering decode-step latency

  and raising throughput for static-shape workloads.


  Mechanism (v2 path, vllm_ascend/worker/v2/utils.py:68-79): torch_npu_graph_wrapper reads

  enable_super_kernel, wraps graph capture in super_kernel_scope("full_model",

  enable_super_kernel), and after capture calls graph.super_kernel_optimize(...) with the

  same dcci_after_kernel_end option. So on v2 the optimization is applied to the captured

  full-model ACL graph.


  Mechanism (v1 ACLGraphWrapper, vllm_ascend/compilation/acl_graph.py:111): the wrapper

  stores self.enable_super_kernel from the Ascend config and uses it to bracket graph

  execution with super_kernel_scope_begin/end (see test at tests/ut/compilation/test_acl_graph.py:398).


  The flag is also part of AscendCompiler.compute_hash (compiler_interface.py:252), so

  toggling it invalidates the compilation cache and forces recompilation.


  vllm-ascend overrides: "platform.py forcibly sets enable_super_kernel=False whenever"

  cudagraph_mode is NONE (line 1309), when piecewise compilation is required (line 1333),

  or when the mode is unsupported and falls back to NONE (line 1343). The after-validator

  in ascend_config.py also disables it on hardware lacking NPUGRAPH_EX support and asserts

  it cannot be enabled without enable_static_kernel.

  '
