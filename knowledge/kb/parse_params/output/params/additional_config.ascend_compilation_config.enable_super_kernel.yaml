related_parameters:
- name: additional_config.ascend_compilation_config.enable_static_kernel
  relation: 'Hard dependency: super kernel requires static kernel to be enabled; when enable_super_kernel is omitted it inherits
    enable_static_kernel''s value.'
- name: additional_config.ascend_compilation_config.enable_npugraph_ex
  relation: 'Transitive dependency: static kernel (and thus super kernel) requires npugraph_ex; disabling npugraph_ex disables
    both.'
- name: compilation_config.cudagraph_mode
  relation: When cudagraph_mode is NONE or requires piecewise compilation, vllm-ascend forcibly disables super kernel.
constraints:
- enable_super_kernel can only be enabled when enable_static_kernel is also enabled; otherwise an assertion error is raised.
- enable_static_kernel (and therefore enable_super_kernel) requires enable_npugraph_ex to be enabled.
- On hardware profiles that do not support NPUGRAPH_EX, enable_super_kernel is forcibly disabled at config validation time.
- When cudagraph_mode is NONE, requires piecewise compilation, or is unsupported and falls back to NONE, vllm-ascend forcibly
  sets enable_super_kernel to false.
- If enable_super_kernel is omitted but enable_static_kernel is set, enable_super_kernel inherits the enable_static_kernel
  value.
tuning_advice:
  summary: Enable super kernel only alongside static kernel for static-shape, latency-sensitive decode workloads; otherwise
    leave it off.
  suggested_values:
  - scenario: Static-shape decode-heavy serving where shapes are stable and extra compile time is acceptable (v1 and v2)
    value: true
    reason: Adds super_kernel_optimize with dcci_after_kernel_end to the npugraph_ex compiler options / full-model graph,
      reducing per-kernel launch and cache overhead and lowering decode latency.
  - scenario: Dynamic-shape or highly variable batch workloads
    value: false
    reason: Static kernel compilation (a prerequisite) is only beneficial when shape changes are minimal; super kernel adds
      compile cost without payoff otherwise.
  - scenario: Want static kernel but not super kernel
    value: false
    reason: Explicitly set false to override the inheritance from enable_static_kernel, as shown in the graph_mode docs example.
  caveats:
  - Must be paired with enable_static_kernel=true and enable_npugraph_ex=true, or config validation fails.
  - Forcibly disabled when cudagraph_mode is NONE or piecewise; verify cudagraph_mode is FULL to keep it active.
  - Toggling it invalidates the compilation cache, so expect a recompile on the first run after changing it.
  quick_guide: Set enable_super_kernel=true only with enable_static_kernel=true and enable_npugraph_ex=true for static-shape
    latency-sensitive decode; set false to opt out of the static-kernel inheritance.
