name: compilation.pass_config.enable_sp
type: nested
category: compilation
scope: both
source_file:
- vllm/config/vllm.py:1677-1698
- vllm/config/vllm.py:1877-1896
- vllm/config/compilation.py:1227-1244
- vllm/config/compilation.py:1547-1564
- vllm/compilation/passes/pass_manager.py:161-164
- vllm/v1/worker/gpu_model_runner.py:3494-3500
- vllm/v1/worker/gpu_model_runner.py:4012-4020
- vllm/v1/worker/utils.py:749-775
- vllm_ascend/ascend_config.py:944-948
- vllm_ascend/worker/model_runner_v1.py:6349-6360
- vllm_ascend/worker/model_runner_v1.py:6588-6594
value_type: bool
default: false
valid_choices:
- true
- false
cli_example: null
deprecated: false
performance_impact: medium
performance_scope:
- latency
- throughput
impact_detail: "enable_sp enables the SequenceParallelismPass (and, if fuse_gemm_comms is set, the\nAsyncTPPass) in vLLM's\
  \ compilation pass manager (vllm/compilation/passes/pass_manager.py:161-164).\nOn GPU this shards the token dimension across\
  \ TP ranks for the RMSNorm/residual regions and\nfuses the all-reduce with the norm, reducing per-rank activation work and\
  \ communication volume.\n\nOn Ascend the effect is different and largely indirect:\n- \"vllm-ascend reads this flag in AscendConfig\
  \ (vllm_ascend/ascend_config.py:944-948) to compute\"\n  `enable_sp_by_pass`, which is only true when the model is NOT in\
  \ enforce_eager mode and\n  enable_sp is set. This gates Ascend-specific SP-by-pass behavior.\n- \"In the v1 Ascend model\
  \ runner (vllm_ascend/worker/model_runner_v1.py:6349-6360),\"\n  `_should_align_cudagraph_capture_sizes()` returns true\
  \ when FULL decode cudagraph mode is\n  active AND (DSA-CP or enable_sp() or pass_config.enable_sp). This forces cudagraph\
  \ capture\n  sizes to be aligned to LCM(TP, query_len), which changes the set of captured graph shapes and\n  therefore\
  \ memory footprint and decode latency (more/larger graphs = more HBM for graph\n  capture, but stable CP/SP dispatch).\n\
  - \"`update_pass_config()` (model_runner_v1.py:6588-6594) temporarily overrides\"\n  pass_config.enable_sp with the result\
  \ of `enable_sp(vllm_config)` during a context, meaning\n  the effective value seen by the runner may differ from the user-set\
  \ value.\n- \"Upstream, enable_sp forces full-graph compilation (splitting_ops cleared, cudagraph_mode\"\n  promoted to\
  \ FULL) and pads num_tokens to a multiple of TP, which adds padding overhead but\n  enables collective fusion.\n\nNet: \"\
  on Ascend, SP is documented as unavailable for all current model categories in the v0.23.0\"\nsupport matrix, so the primary\
  \ observable effect is on cudagraph capture-size alignment and\npass-config gating rather than a direct throughput win.\n"
