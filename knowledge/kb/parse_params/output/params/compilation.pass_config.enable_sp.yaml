related_parameters:
- name: compilation.pass_config.fuse_gemm_comms
  relation: Setting fuse_gemm_comms forces enable_sp=True; AsyncTPPass only added when both are set
- name: compilation.pass_config.sp_min_token_num
  relation: Auto-computed from hidden_size, TP size and dtype when enable_sp is on and value is None
- name: tensor_parallel_size
  relation: SP requires TP>1; auto-disabled when TP==1. Also determines token padding multiple
- name: compilation.cudagraph_mode
  relation: SP forces FULL cudagraph mode and clears splitting_ops when use_inductor_graph_partition is off
- name: compilation.splitting_ops
  relation: Cleared to empty list when SP is enabled (full-graph compilation required)
- name: enforce_eager
  relation: Ascend enable_sp_by_pass requires enforce_eager to be false
- name: additional_config.enable_flashcomm1
  relation: Docs recommend migrating from SP to FlashComm1 on Ascend
constraints:
- Sequence parallelism requires tensor_parallel_size > 1; it is automatically disabled (and fuse_gemm_comms cleared) when
  TP==1.
- Sequence parallelism requires full-graph compilation; when use_inductor_graph_partition is off, splitting_ops is cleared
  and cudagraph_mode is promoted to FULL.
- When SP is enabled, num_tokens must be a multiple of tensor_parallel_size; the runner pads tokens accordingly and asserts
  this invariant.
- With speculative decoding, cudagraph capture sizes must be a multiple of both (num_speculative_tokens + 1) and tensor_parallel_size,
  otherwise a ValueError is raised.
- SP only takes effect in VLLM_COMPILE compilation mode; other modes emit a warning that SP is running in the wrong compile
  mode.
- On Ascend, enable_sp_by_pass is only active when enforce_eager is false.
tuning_advice:
  summary: On Ascend, prefer FlashComm1 over enable_sp; only enable SP when you specifically need the cudagraph-size alignment
    path and are on a supported model/version.
  suggested_values:
  - scenario: Default Ascend deployment (v0.23.0+, any current model category)
    value: false
    reason: Docs mark SP unavailable for all current model categories; FlashComm1 is the recommended replacement.
  - scenario: Migrating a v0.18.0 deployment that relied on SP
    value: false
    reason: Switch to additional_config.enable_flashcomm1 instead of enable_sp per release notes.
  - scenario: GPU/upstream reference or experimental Ascend SP validation with TP>1 and full-graph compile
    value: true
    reason: Enables SequenceParallelismPass and cudagraph-size alignment; requires TP>1 and VLLM_COMPILE mode.
  caveats:
  - Do not enable together with enforce_eager on Ascend — enable_sp_by_pass will be false and SP has no effect.
  - 'Watch HBM usage after enabling: cudagraph capture-size alignment to LCM(TP, query_len) can grow the captured graph set.'
  - If using speculative decoding, ensure num_speculative_tokens+1 and TP are compatible or a ValueError will be raised.
  quick_guide: Leave enable_sp off on Ascend; use additional_config.enable_flashcomm1 for sequence-parallel-style communication
    optimization.
analysis_date: '2026-10-27'
