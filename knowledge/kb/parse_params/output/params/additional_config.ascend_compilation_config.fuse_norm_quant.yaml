name: additional_config.ascend_compilation_config.fuse_norm_quant
type: nested
category: compilation
scope: vllm-ascend
source_file:
- vllm_ascend/ascend_config.py:127
- vllm_ascend/compilation/graph_fusion_pass_manager.py:58
value_type: bool
default: true
valid_choices: true or false (boolean; note that string values like "false" are coerced by the pydantic config validator)
cli_example: null
deprecated: false
performance_impact: medium
performance_scope:
- latency
- throughput
impact_detail: 'fuse_norm_quant controls whether the AddRMSNormQuantFusionPass is registered in the

  Ascend graph fusion pass manager. In vllm_ascend/compilation/graph_fusion_pass_manager.py:58,

  the pass is only appended when BOTH fuse_norm_quant is true AND the current hardware

  profile supports HardwareCapability.GRAPH_NORM_QUANT_FUSION. When enabled, the pass fuses

  the RMSNorm (AddRMSNorm) operation with the following quantization op into a single

  AscendC/CANN fused kernel during torch.compile/ACLGraph capture, eliminating one kernel

  launch and one intermediate tensor round-trip per norm+quant site (present in every

  transformer layer). This reduces per-layer launch overhead and memory traffic, improving

  decode latency and throughput. When disabled, the two ops execute separately, adding

  kernel launch overhead and intermediate memory writes. The pass is a compile-time graph

  transformation, so its effect is baked into the captured graph and applies to both

  prefill and decode. On hardware profiles that do not support GRAPH_NORM_QUANT_FUSION

  (e.g. Atlas 300I DUO / 310P), the flag has no effect regardless of value — the pass is

  skipped by the profile check, which is why 310P test cases and docs set it to false.

  '
