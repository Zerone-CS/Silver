related_parameters:
- name: --data-parallel-size
  relation: device_ids is sliced per local DP rank in DP deployments; the Ascend patch fixes the interaction with sharded
    ASCEND_RT_VISIBLE_DEVICES
- name: --tensor-parallel-size
  relation: Number of device IDs must be sufficient for TP x PP x DP local ranks; device selection determines which NPUs form
    the HCCL group
- name: --distributed-executor-backend
  relation: Has no effect when set to ray; Ray placement groups must be used instead
- name: ASCEND_RT_VISIBLE_DEVICES
  relation: Alternative device-selection mechanism; --device-ids avoids remapping it, preserving full topology visibility
- name: --data-parallel-multi-port-external-lb
  relation: DP supervisor derives per-child device_ids from this flag
constraints:
- --device-ids must not contain duplicate device IDs; duplicates raise ValueError.
- --device-ids must not mix integer IDs and UUID strings in the same list; mixing raises ValueError.
- --device-ids has no effect when the Ray executor is used; use Ray placement groups for device selection instead.
- The number of device IDs provided must be enough to cover all local ranks required by tensor, pipeline and local data parallelism.
tuning_advice:
  summary: Use --device-ids to pin an instance to specific NPUs while keeping full topology visible to HCCL, and rely on the
    vllm-ascend DP patch when sharding ASCEND_RT_VISIBLE_DEVICES per rank.
  suggested_values:
  - scenario: Single-node TP/EP run on an 8-NPU Ascend node, want all devices
    value: 0,1,2,3,4,5,6,7
    reason: Passing all physical IDs keeps the full HCCS topology visible so HCCL can pick the best links, matching the pattern
      in examples/offline_data_parallel.py.
  - scenario: Co-locating multiple vLLM instances on one node
    value: 0,1,2,3
    reason: Pin each instance to a disjoint contiguous set of NPUs so HCCL groups stay within one interconnect domain and
      instances do not contend for devices.
  - scenario: Application-level data parallel with per-rank env sharding
    value: 0,1,2,3,4,5,6,7
    reason: The vllm-ascend patch_dp_device_ids patch tolerates a pre-sharded ASCEND_RT_VISIBLE_DEVICES; passing the full
      device list per rank keeps resolution consistent.
  caveats:
  - Do not combine --device-ids with the Ray executor; it is silently ignored there.
  - Avoid mixing integer IDs and UUIDs, and avoid duplicate IDs, or startup fails with ValueError.
  - On Ascend, verify the chosen IDs are on the same HCCS ring; cross-ring selection degrades collective bandwidth.
  quick_guide: Pass a comma-separated list of physical NPU IDs (e.g. --device-ids "0,1,2,3") to pin devices without remapping
    ASCEND_RT_VISIBLE_DEVICES; not supported with Ray.
analysis_date: '2026-10-27'
