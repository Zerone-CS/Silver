name: --device-ids
type: cli
category: hardware
scope: both
source_file:
- vllm/engine/arg_utils.py:1081
- vllm/engine/arg_utils.py:488
- vllm/engine/arg_utils.py:1966
- vllm_ascend/patch/platform/__init__.py:51
- vllm_ascend/patch/__init__.py:86
- examples/offline_data_parallel.py:128
value_type: list[int]
default: null
valid_choices: Comma-separated physical device IDs (integers) or device UUIDs; must not mix integers and UUIDs; must not contain
  duplicates
cli_example: --device-ids "2,3,5,7"
deprecated: false
performance_impact: medium
performance_scope:
- throughput
- latency
impact_detail: '--device-ids selects which physical NPU devices a vLLM instance uses without setting

  ASCEND_RT_VISIBLE_DEVICES / CUDA_VISIBLE_DEVICES. In upstream vLLM it is resolved by

  ArgUtils._resolve_device_ids (vllm/engine/arg_utils.py:1966), which validates duplicates,

  rejects mixed int/UUID lists, and composes with CUDA_VISIBLE_DEVICES. The help text states

  the intent: "avoiding CUDA_VISIBLE_DEVICES preserves full GPU topology visibility for"

  GPU-NIC affinity and DeepGEMM. On Ascend the analogous effect is that the process keeps

  full visibility of all NPUs, so HCCL can build its topology (HCCS vs RoCE links) and

  device-to-device affinity correctly instead of being restricted to a remapped visible set.

  This directly affects collective communication efficiency (HCCL all-reduce/all-gather,

  MC2/MegaMoe dispatch-combine) and therefore throughput and latency of TP/EP/DP runs.

  vllm-ascend does not redefine the flag itself but patches the DP device-id resolution path:

  vllm_ascend/patch/platform/patch_dp_device_ids.py (registered at

  vllm_ascend/patch/platform/__init__.py:51) rewrites

  vllm.v1.core.dp_utils.get_physical_gpu_ids_for_local_dp_rank so that a pre-sharded

  ASCEND_RT_VISIBLE_DEVICES (one slice per DP rank) is tolerated instead of applying the

  local_dp_rank * world_size offset, which otherwise raises IndexError. The Ascend example

  examples/offline_data_parallel.py:128-169 builds device_ids from torch.npu.device_count()

  and passes them as the LLM(device_ids=...) kwarg, showing the intended Ascend usage for

  application-level data parallelism. The parameter itself does not change per-token compute;

  its performance effect is indirect, via correct device placement and preserved topology

  for HCCL/NIC affinity.

  '
