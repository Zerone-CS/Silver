related_parameters:
- name: additional_config.scheduler_config.dyntra_lb_config.mode
  relation: Selects static vs dynamic balancing strategy; only meaningful when enabled=true
- name: additional_config.scheduler_config.dyntra_lb_config.start_step
  relation: Step at which balancing begins; only used when enabled=true
- name: additional_config.scheduler_config.dyntra_lb_config.end_step
  relation: Step at which balancing stops (-1 = never); only used when enabled=true
- name: additional_config.scheduler_config.dyntra_lb_config.bubble_threshold
  relation: Bubble-time threshold that triggers rebalancing; only used when enabled=true
- name: additional_config.scheduler_config.dyntra_lb_config.long_req_block_threshold
  relation: Long-request blocking threshold; only used when enabled=true
- name: additional_config.scheduler_config.dyntra_lb_config.dynamic_max_step
  relation: Max steps for dynamic mode; only used when enabled=true and mode=dynamic
- name: additional_config.scheduler_config.enable_balance_scheduling
  relation: Mutually exclusive; enabling both raises ValueError
- name: additional_config.scheduler_config.recompute_scheduler_enable
  relation: Independent sibling; both true selects combined DyntraLB recompute scheduler
- name: kv_transfer_config.kv_role
  relation: Must be 'kv_consumer' (PD-disaggregated D node) for DyntraLB to be valid
- name: parallel_config.data_parallel_size
  relation: Must be > 1 for DyntraLB to be valid
constraints:
- DyntraLB is only supported on PD-disaggregated decode nodes where kv_role='kv_consumer'; enabling it on prefill or PD-mixed
  nodes raises ValueError.
- data_parallel_size must be greater than 1; enabling DyntraLB with data_parallel_size <= 1 raises ValueError.
- DyntraLB cannot be combined with enable_balance_scheduling; enabling both raises ValueError.
- DyntraLB balances across data-parallel ranks within one node only; it is not available across multiple DP nodes.
- dyntra_lb_config.mode must be one of 'static' or 'dynamic'.
- dyntra_lb_config.start_step must be >= 0.
- dyntra_lb_config.end_step must be -1 or >= 0, and when set must be greater than start_step.
- dyntra_lb_config.bubble_threshold must be > 0.
- dyntra_lb_config.long_req_block_threshold must be > 0.
- dyntra_lb_config.dynamic_max_step must be > 0.
- Unknown keys under additional_config are rejected (extra='forbid'); a typo in the dyntra_lb_config block fails fast.
tuning_advice:
  summary: Enable DyntraLB only on PD-disaggregated decode nodes with data_parallel_size > 1 and skewed decode load, using
    dynamic mode for production.
  suggested_values:
  - scenario: Production PD-disaggregated decode node with dp_size > 1 and variable request lengths
    value: true
    reason: Balances attention KV-cache load across DP ranks, raising aggregate decode throughput and reducing tail latency
      when ranks are imbalanced.
  - scenario: Uniform/short decode workloads or single-DP-rank deployments
    value: false
    reason: No imbalance to correct; the per-step bookkeeping and migration overhead would only add cost. Also required since
      dp_size must be > 1.
  - scenario: Benchmarking or short runs where balancing should not kick in
    value: false
    reason: Avoids migration overhead during measurement; alternatively keep enabled but set start_step high and end_step
      to bound the active window.
  caveats:
  - Must be on a kv_role='kv_consumer' D node with data_parallel_size > 1; otherwise platform validation raises ValueError.
  - Cannot be combined with enable_balance_scheduling.
  - Pair with mode='dynamic' (recommended for production) and tune bubble_threshold/long_req_block_threshold to the workload's
    request-length distribution.
  - Verified models are Qwen3-30B and Qwen3.5-35B; validate on other models before relying on it.
  quick_guide: Set dyntra_lb_config.enabled=true only on PD-disaggregated decode nodes with dp_size>1 and skewed load; keep
    false otherwise.
analysis_date: '2026-10-27'
