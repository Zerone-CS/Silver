name: additional_config.scheduler_config.dyntra_lb_config.enabled
type: nested
category: scheduling
scope: vllm-ascend
source_file:
- vllm_ascend/ascend_config.py:1586
- vllm_ascend/ascend_config.py:524
- vllm_ascend/platform.py:1079
- vllm_ascend/patch/platform/patch_engine_core.py:34
- vllm_ascend/patch/platform/patch_dyntra_lb_core.py:73
value_type: bool
default: false
valid_choices: true or false
cli_example: null
deprecated: false
performance_impact: high
performance_scope:
- throughput
- latency
impact_detail: 'DyntraLB (Dynamic Traffic Load Balancing) is an Ascend-only scheduler extension that

  rebalances decode requests across data-parallel ranks within a single node. When

  `dyntra_lb_config.enabled` is true, `vllm_ascend/platform.py:1079` validates the

  deployment shape and `vllm_ascend/patch/platform/patch_engine_core.py:34` swaps the

  upstream `DPEngineCoreProc` for `DyntraLBDPEngineCoreProc`. That subclass

  (`patch_dyntra_lb_core.py:324`) reads the sibling knobs (mode, start_step, end_step,

  bubble_threshold, long_req_block_threshold, dynamic_max_step) in `_init_data_parallel`

  and then, during the engine loop, measures per-rank bubble time and long-request

  blocking, and issues cross-rank request migrations to equalize attention KV-cache load.

  The mechanism directly targets DP imbalance: "on a PD-disaggregated decode node with"

  data_parallel_size > 1, uneven KV-cache occupancy across DP ranks causes some ranks to

  finish early (bubble) while others are still decoding, wasting NPU cycles. By moving

  requests from overloaded to underloaded ranks, DyntraLB raises aggregate decode

  throughput and reduces tail latency. The cost is per-step bookkeeping (bubble timing,

  long-request tracking) and the migration overhead itself, which is why it is gated by

  start_step/end_step and bubble_threshold. When false (default), the upstream

  DPEngineCoreProc is used unchanged and no balancing occurs. It is mutually exclusive

  with `enable_balance_scheduling` and interacts with `recompute_scheduler_enable`

  (both true selects the combined DyntraLB recompute scheduler).

  '
