related_parameters:
- name: --additional-config (enable_kvpp)
  relation: KVPP requires kv_transfer_config with MooncakeConnectorV2 or AscendStoreConnector; KVPP must be disabled on decode-only
    node
- name: --tensor-parallel-size
  relation: prefill/decode tp_size in kv_connector_extra_config must satisfy prefill_tp_size % decode_tp_size == 0 for non-MLA
    PD
- name: --speculative-config
  relation: KVPP only supports speculative method mtp or dspark; EAGLE block-drop suppression interacts with spec decoding
- name: --enforce-eager / compilation_config.cudagraph_mode
  relation: KVPP supports eager or PIECEWISE cudagraph only
- name: --enable-prefix-caching
  relation: Connector enabled forces block hashing even when prefix caching is off
- name: HCCL_BUFFSIZE
  relation: PD prefill node recommended to set HCCL_BUFFSIZE=256 alongside kv-transfer-config
constraints:
- For non-MLA PD disaggregation, the prefill tp_size must be divisible by the decode tp_size (prefill_tp_size % decode_tp_size
  == 0), otherwise startup asserts.
- When KVPP is enabled, kv_connector must be MooncakeConnectorV2 (or AscendStoreConnector), otherwise a ValueError is raised.
- When KVPP is enabled, kv_role must not be kv_consumer on the decode-only node (KVPP must be disabled there).
- KVPP and decode context parallel (DCP) cannot be enabled at the same time.
- KVPP supports only eager execution or PIECEWISE cudagraph mode.
- KVPP currently supports only non-hybrid MLA models.
- KVPP supports speculative decoding only with method='mtp' or method='dspark'.
- Only one HiSparseConnector may be configured, and it requires a positive host_pool_gib in kv_connector_extra_config.
- recompute_scheduler_enable is only valid on PD-disaggregated D nodes (kv_role is kv_consumer); enabling it on P nodes or
  PD-mixed mode fails at startup.
tuning_advice:
  summary: 'Use --kv-transfer-config to enable PD disaggregation or KV pooling; choose the connector

    matching your transport (MooncakeConnectorV1/V2 for RDMA/HCCL PD, AscendStoreConnector for

    host-memory pooling), set kv_role correctly per node, and align prefill/decode tp_size.

    '
  suggested_values:
  - scenario: PD disaggregation prefill node (MooncakeConnectorV1, optimized config)
    value: '{"kv_connector":"MooncakeConnectorV1","kv_buffer_device":"npu","kv_role":"kv_producer","kv_parallel_size":"1","kv_port":"20001"}'
    reason: Documented optimized PD prefill config; kv_buffer_device=npu keeps transfer buffer in HBM for low latency.
  - scenario: PD disaggregation decode node
    value: '{"kv_connector":"MooncakeConnectorV1","kv_role":"kv_consumer","kv_port":"20002"}'
    reason: Decode node consumes KV; kv_role must be kv_consumer so recompute scheduler and consumer-side prefix behavior
      apply.
  - scenario: KVPP prefill node (MooncakeConnectorV2)
    value: '{"kv_connector":"MooncakeConnectorV2","kv_role":"kv_producer","kv_port":37000}'
    reason: KVPP requires MooncakeConnectorV2 (or AscendStoreConnector); enable_kvpp in additional-config on P node only.
  - scenario: KV pooling with AscendStoreConnector
    value: '{"kv_connector":"AscendStoreConnector","kv_role":"kv_producer","kv_connector_extra_config":{"lookup_rpc_port":"0","backend":"memcache","use_layerwise":false,"load_async":true}}'
    reason: Host-memory KV pooling; keep use_layerwise=false and load_async=true as required by KVPP.
  caveats:
  - Ensure prefill tp_size is divisible by decode tp_size for non-MLA PD, otherwise startup asserts.
  - Do not enable KVPP on the decode-only node; KVPP and DCP are mutually exclusive.
  - On hybrid mamba-align models, a pure prefill producer suppresses the EAGLE block drop to preserve prefix hits; verify
    kv_role is set correctly to avoid zero P-side prefix hits.
  - Set HCCL_BUFFSIZE=256 and add --enforce-eager on the PD prefill node for the documented optimized configuration.
  quick_guide: Set kv_connector + kv_role per node; use MooncakeConnectorV1/V2 for PD, AscendStoreConnector for pooling; align
    prefill/decode tp_size.
analysis_date: '2026-10-27'
