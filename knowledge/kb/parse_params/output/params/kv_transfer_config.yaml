name: --kv-transfer-config
type: cli
category: kv_cache
scope: both
source_file:
- vllm/engine/arg_utils.py:1713
- vllm/engine/arg_utils.py:714
- vllm/config/vllm.py:419
- vllm/config/kv_transfer.py:17
- vllm_ascend/ascend_config.py:85
- vllm_ascend/ascend_config.py:872
- vllm_ascend/patch/platform/patch_kv_cache_coordinator.py:40
- vllm_ascend/patch/platform/patch_kv_cache_utils.py:606
- vllm_ascend/patch/platform/patch_mamba_block_aligned_split.py:95
- vllm_ascend/patch/platform/patch_mamba_config.py:47
- vllm_ascend/patch/platform/patch_pp_mtp.py:38
value_type: dict
default: null
valid_choices: JSON object with fields such as kv_connector, kv_role, kv_port, kv_buffer_device, kv_parallel_size, kv_connector_extra_config;
  kv_connector values on Ascend include MooncakeConnectorV1, MooncakeConnectorV2, AscendStoreConnector, MultiConnector
cli_example: --kv-transfer-config '{"kv_connector":"MooncakeConnectorV1","kv_role":"kv_producer","kv_port":"20001"}'
deprecated: false
performance_impact: high
performance_scope:
- latency
- throughput
- memory
impact_detail: "This parameter enables distributed KV cache transfer (PD disaggregation / KV pooling) and is\nthe master switch\
  \ that changes the entire runtime data path on Ascend. When set, vLLM builds\na KV connector and the engine becomes a \"\
  kv transfer instance\" (is_kv_transfer_instance),\nwhich upstream uses to alter attention backend selection (vllm/v1/attention/selector.py:137)\n\
  and to enable block hashing even without prefix caching (vllm/v1/core/kv_cache_utils.py:754).\nOn Ascend, vllm-ascend reads\
  \ kv_transfer_config in many hot paths:\n- \"ascend_config.py:872 derives pd_tp_ratio / pd_head_ratio / num_head_replica\
  \ from the\"\n  \"prefill\"/\"decode\" tp_size entries in kv_connector_extra_config for non-MLA models, which\n  directly\
  \ controls how KV heads are replicated across the P/D boundary and thus the\n  communication volume and memory footprint\
  \ of the transfer.\n- \"patch_kv_cache_coordinator.py:40 (_skips_eagle_block_drop) and\"\n  patch_mamba_block_aligned_split.py:95\
  \ change prefix-cache hit behavior based on kv_role:\n  a pure PD prefill producer suppresses the EAGLE last-block drop,\
  \ which otherwise pins\n  P-side prefix hits to 0 on hybrid mamba-align models. This directly affects prefix-cache\n  hit\
  \ rate and therefore prefill latency/throughput.\n- \"patch_kv_cache_utils.py:606 attaches kv_transfer_config onto KVCacheConfig\
  \ so the\"\n  coordinator can read the PD role; this affects block allocation and cache-hit alignment.\n- \"patch_mamba_config.py:47\
  \ and patch_pp_mtp.py:38 branch on kv_connector / kv_role to\"\n  decide mamba cache mode and PP+MTP behavior.\nThe connector\
  \ choice (MooncakeConnectorV1/V2 vs AscendStoreConnector) determines the\ntransport (RDMA/HCCL vs host memory pool) and\
  \ thus the transfer latency and HBM/host memory\ntradeoff. kv_buffer_device=\"npu\" keeps the KV buffer in device memory\
  \ (faster transfer,\nmore HBM used); host pooling (AscendStoreConnector with host_pool_gib) trades HBM for\nhost memory.\
  \ Overall this parameter has high impact on latency, throughput and memory.\n"
