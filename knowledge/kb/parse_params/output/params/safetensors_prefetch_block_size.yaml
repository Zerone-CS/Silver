related_parameters:
- name: --safetensors-load-strategy
  relation: Prefetch (and thus this block size) only runs when strategy is 'prefetch', or when strategy is None on a network
    FS that fits in RAM
- name: --safetensors-prefetch-num-threads
  relation: Companion parameter controlling the number of prefetch worker threads; block size controls per-read chunk size
- name: --load-format
  relation: Only relevant for safetensors checkpoints; ignored for other load formats
constraints:
- The value must be an integer greater than or equal to 1 (Field(ge=1)).
- The parameter has no effect unless safetensors prefetching is active (safetensors_load_strategy='prefetch', or strategy
  unset on an NFS/Lustre filesystem whose checkpoint fits in RAM).
- It only applies to safetensors checkpoints; it is ignored for non-safetensors load formats.
tuning_advice:
  summary: Leave at default unless loading large safetensors checkpoints from network storage (NFS/Lustre) with --safetensors-load-strategy
    prefetch, where a larger block size speeds up loading.
  suggested_values:
  - scenario: Default / local NVMe or SSD storage
    value: default
    reason: Prefetch is usually not triggered on local storage; the default block size is adequate and avoids extra memory
      use.
  - scenario: Large checkpoints on NFS/Lustre with prefetch enabled
    value: 4M
    reason: Larger read chunks reduce syscall overhead and improve sequential read throughput on high-latency network filesystems,
      shortening model-load time.
  - scenario: Memory-constrained host prefetching a checkpoint near RAM capacity
    value: 1M
    reason: Smaller block size limits transient per-read memory pressure, reducing OOM risk when the checkpoint nearly fills
      available RAM.
  caveats:
  - Only tune this together with --safetensors-load-strategy prefetch (or rely on the automatic network-FS prefetch path).
  - Benchmark model-load time before and after; gains are storage-dependent and irrelevant to inference performance.
  - Applies to both v1 and v2 Ascend worker paths identically since vllm-ascend does not modify this loading logic.
  quick_guide: Only matters for prefetch on network storage; use 4M for faster loads, 1M if RAM-tight, otherwise keep default.
analysis_date: '2026-10-27'
