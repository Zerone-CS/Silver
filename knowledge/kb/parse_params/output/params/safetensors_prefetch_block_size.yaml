name: --safetensors-prefetch-block-size
type: cli
category: model
scope: vllm
source_file:
- vllm/config/load.py:93
- vllm/engine/arg_utils.py:989
- vllm/engine/arg_utils.py:376
- vllm/model_executor/model_loader/weight_utils.py:873
- vllm/model_executor/model_loader/weight_utils.py:948
- vllm/model_executor/model_loader/default_loader.py:295
value_type: int
default: DEFAULT_SAFETENSORS_PREFETCH_BLOCK_SIZE
valid_choices: integer >= 1; accepts human-readable strings (e.g. 1K, 2M, 1G) via human_readable_int
cli_example: --safetensors-prefetch-block-size 4M
deprecated: false
performance_impact: low
performance_scope:
- latency
impact_detail: 'This parameter only takes effect during the model loading phase, and only when

  safetensors prefetching is active. In vllm/model_executor/model_loader/weight_utils.py

  (safetensors_weights_iterator), should_prefetch is true when

  safetensors_load_strategy == "prefetch", or when the strategy is None and the

  checkpoint filesystem is a network FS (nfs/nfs4/lustre) AND the checkpoint fits in

  RAM (<= 90% of available RAM). When should_prefetch is true, _prefetch_all_checkpoints

  is called with block_size=safetensors_prefetch_block_size, which controls the read

  chunk size used to pull checkpoint files into the OS page cache before workers load

  them. A larger block size means fewer read syscalls and better sequential I/O

  throughput on high-latency/network storage, reducing model-load wall time; a smaller

  block size reduces per-read memory pressure. It does NOT affect steady-state

  inference throughput or latency — only startup/weight-loading time. On Ascend NPU

  this is a pure host-side (CPU/storage) concern; vllm-ascend does not override or

  reference this parameter, so upstream behavior applies unchanged. The default

  (DEFAULT_SAFETENSORS_PREFETCH_BLOCK_SIZE) is defined in vllm/envs.py and is not

  shown in the provided context.

  '
usage_locations:
