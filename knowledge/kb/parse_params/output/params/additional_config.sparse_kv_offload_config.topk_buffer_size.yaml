name: additional_config.sparse_kv_offload_config.topk_buffer_size
type: nested
category: kv_cache
scope: vllm-ascend
source_file:
- vllm_ascend/ascend_config.py:1694
- vllm_ascend/ascend_config.py:1713
- vllm_ascend/ascend_config.py:1765
- vllm_ascend/attention/sfa_kv_offload.py:582
- vllm_ascend/distributed/kv_transfer/sparse_kv_offload/sparse_kv_offload_manager.py:117
value_type: int
default: 4096
valid_choices: positive integer; must be >= index_topk; must be divisible by block_size; for fused_copy_sfa must be a multiple
  of 256, at least Q_max*2048 and at most 32512
cli_example: null
deprecated: false
performance_impact: high
performance_scope:
- memory
- latency
- throughput
impact_detail: "topk_buffer_size defines the per-request device-resident \"hot\" KV buffer capacity (in tokens)\nused by the\
  \ sparse KV offload path on Ascend NPU. It is consumed in three main places:\n\n1. Memory allocation (vllm_ascend/distributed/kv_transfer/sparse_kv_offload/sparse_kv_offload_manager.py:117-145):\n\
  \   allocate_kv_offload_topk_buffer_pair computes\n     topk_buffer_k_size_bytes = max_num_topk_rows * topk_buffer_size\
  \ * num_kv_heads * k_dim * 2\n     topk_buffer_v_size_bytes = max_num_topk_rows * topk_buffer_size * num_kv_heads * v_dim\
  \ * 2\n   and allocates a single int8 tensor of size (k+v) on NPU. So HBM usage scales linearly with\n   topk_buffer_size\
  \ * max_num_topk_rows. max_num_topk_rows is min(max_num_batched_tokens,\n   max_num_seqs * decode_width) in the legacy path,\
  \ or 2*copy_sfa_pool_capacity(max_num_seqs)\n   in the fused_copy_sfa path (plus COPY_SFA_TAIL_BLOCKS*block_size added to\
  \ topk_buffer_size).\n   Larger topk_buffer_size directly increases NPU HBM footprint of the offload hot buffer.\n\n2. Runtime\
  \ hot-token window (vllm_ascend/worker/model_runner_v1.py:3509 and\n   vllm_ascend/worker/v2/model_states/default.py:251):\
  \ passed as `hot_tokens` to\n   request_states.prepare(...). This controls how many recently-used KV tokens are kept resident\n\
  \   on device (LRU resident capacity, see sfa_kv_offload.py:582 self.lru_resident_capacity =\n   offload_cfg.topk_buffer_size).\
  \ A larger window means more decode steps hit the device-resident\n   hot buffer instead of fetching from host DRAM, reducing\
  \ per-step KV fetch latency and\n   improving decode throughput; a smaller window increases DRAM traffic and stalls.\n\n\
  3. Scheduler-side slot allocation (sfa_pd_rd2h/scheduler.py:552): _resolve_copy_sfa_hot_tokens\n   returns topk_buffer_size\
  \ when fused_copy_sfa is enabled, sizing the CopySfaTopkSlotAllocator\n   pool. This affects how many hot slots are available\
  \ for the fused LIM+Copy-SFA path.\n\nNet effect: \"topk_buffer_size trades NPU HBM (linear) against decode latency/throughput\"\
  \n(larger = fewer DRAM fetches). It is a high-impact knob for the sparse KV offload feature.\n"
