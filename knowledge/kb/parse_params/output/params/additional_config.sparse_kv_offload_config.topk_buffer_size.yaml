related_parameters:
- name: additional_config.sparse_kv_offload_config.enabled
  relation: Master switch; topk_buffer_size only takes effect when sparse KV offload is enabled.
- name: additional_config.sparse_kv_offload_config.fused_op_type
  relation: When set to fused_copy_sfa, imposes stricter constraints (multiple of 256, >= Q_max*2048, <= 32512) and adds tail
    blocks to the allocation.
- name: additional_config.sparse_kv_offload_config.dram_size_per_dp_GB
  relation: Host DRAM pool size; larger hot buffer reduces DRAM fetch pressure, interacting with DRAM sizing.
- name: additional_config.sparse_kv_offload_config.keep_device_kv_cache
  relation: When true (debug), max_num_topk_rows may be enlarged to max(max_num_topk_rows, request_rows), increasing HBM usage.
- name: model_config.hf_text_config.index_topk
  relation: topk_buffer_size must be >= index_topk; index_topk is the sparse attention top-k.
- name: cache_config.block_size
  relation: topk_buffer_size must be divisible by block_size.
- name: speculative_config.num_speculative_tokens
  relation: decode_width = 1 + num_speculative_tokens affects max_num_topk_rows and Q_max for fused path.
constraints:
- topk_buffer_size must be a positive integer (greater than 0).
- topk_buffer_size must be greater than or equal to the model's index_topk.
- topk_buffer_size must be divisible by the cache block_size.
- When fused_op_type is fused_copy_sfa, topk_buffer_size must be a multiple of 256, at least Q_max*2048 (Q_max = 1 + num_speculative_tokens,
  or 1 without speculative decoding), and at most 32512.
- Sparse KV offload (and thus topk_buffer_size) is only supported for sparse attention models with index_topk and without
  compress_ratios.
- Sparse KV offload requires PD disaggregation on the Decode node unless keep_device_kv_cache is enabled for debugging.
- Sparse KV offload does not support context parallel (prefill_context_parallel_size * decode_context_parallel_size > 1) or
  pipeline parallel (pipeline_parallel_size > 1).
tuning_advice:
  summary: Size topk_buffer_size to hold enough recent KV tokens on device to avoid DRAM fetches during decode, while keeping
    NPU HBM within budget; start at 2x index_topk and validate divisibility and fused-path bounds.
  suggested_values:
  - scenario: Legacy sparse offload path (fused_op_type=none), typical sparse attention model
    value: 4096
    reason: Default value; must be >= index_topk and divisible by block_size. Reasonable starting point when HBM is constrained.
  - scenario: Fused LIM + Copy-SFA path (fused_op_type=fused_copy_sfa) with MTP3
    value: 8192
    reason: Documented example value; satisfies multiple-of-256, >= Q_max*2048 (Q_max=4 -> 8192) and <= 32512 bounds.
  - scenario: HBM-constrained deployment with small index_topk
    value: 2048
    reason: Minimum practical value when index_topk is small; reduces hot-buffer HBM footprint at the cost of more DRAM fetches.
  - scenario: Latency-sensitive decode with ample HBM
    value: 16384
    reason: Larger hot window reduces DRAM KV fetches during decode, improving latency/throughput, provided HBM budget allows
      (must remain <= 32512 for fused path).
  caveats:
  - Always verify topk_buffer_size >= index_topk and divisible by block_size before deployment; violations raise ValueError
    at startup.
  - For fused_copy_sfa, keep topk_buffer_size a multiple of 256 within [Q_max*2048, 32512]; the runtime adds tail blocks automatically.
  - Monitor NPU HBM after increasing topk_buffer_size, since allocation scales with max_num_topk_rows which depends on max_num_seqs
    and speculative tokens.
  - Do not enable keep_device_kv_cache in production; it retains full device KV cache and defeats the memory-saving purpose.
  quick_guide: Set topk_buffer_size to ~2x index_topk (multiple of 256 for fused path, <=32512), divisible by block_size,
    and sized to fit NPU HBM.
