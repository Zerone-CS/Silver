constraints:
- The value must be a positive integer number of seconds; a non-integer string will raise a ValueError when the env var is
  parsed.
- The timeout only applies to tool-parsing plugins that explicitly pass it to regex calls; parsers that do not use it are
  unaffected.
tuning_advice:
  summary: Leave at the default 1 second unless you observe regex-timeout warnings or pathological tool-parsing latency; this
    is a CPU-side safety bound, not an NPU performance knob.
  suggested_values:
  - scenario: Default tool-calling workloads with well-behaved model output
    value: 1
    reason: Default of 1 second is sufficient for normal tool-call regex matching and bounds worst-case CPU time.
  - scenario: Long model outputs or complex tool-call schemas triggering regex-timeout warnings
    value: 3
    reason: A modest increase reduces spurious TimeoutError warnings that cause tool calls to be dropped, at the cost of slightly
      longer worst-case CPU blocking.
  - scenario: Latency-sensitive serving where output-processing thread stalls must be minimized
    value: 1
    reason: Keeping the timeout small caps the maximum time a pathological regex can block the output-processing thread.
  caveats:
  - Do not treat this as an Ascend NPU tuning parameter; it does not affect NPU kernels, memory, or HCCL communication.
  - Raising it does not improve throughput; it only changes how long a CPU regex is allowed to run before being aborted.
  quick_guide: Keep at 1s by default; raise to ~3s only if you see regex-timeout warnings dropping tool calls.
