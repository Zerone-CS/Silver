related_parameters:
- name: kv_transfer_config.kv_connector
  relation: Determines which connector interprets the extra_config keys.
- name: compilation_config.cudagraph_mode
  relation: use_layerwise=true forces PIECEWISE mode via requires_piecewise_for_cudagraph.
- name: kv_transfer_config.kv_role
  relation: Combined with consumer_is_to_put/load and save_decode_cache to decide put/load behavior.
- name: cache_config.kv_offloading_size
  relation: Upstream auto-populates cpu_bytes_to_use from it for native offload backend.
- name: sparse_kv_offload_config.enabled
  relation: SfaRemoteD2HConnector asserts producer has it false and consumer has it true.
constraints:
- SfaRemoteD2HConnector requires kv_connector_extra_config["transfer_backend"] to be set, and currently only "memfabric" is
  supported.
- enable_offload_prefix_caching must be a boolean, otherwise a ValueError is raised.
- HiSparseConnector requires host_pool_gib to be set and it must be a positive float; only one HiSparseConnector may be configured.
- SfaRemoteD2HConnector producer (P) must run with sparse_kv_offload_config.enabled=false and consumer (D) with sparse_kv_offload_config.enabled=true.
- With MultiConnector, connector-specific keys must be placed in the AscendStoreConnector child's kv_connector_extra_config,
  not the root.
- The Yuanrong store's use_layerwise must match kv_connector_extra_config.use_layerwise.
tuning_advice:
  summary: 'Set connector-specific keys deliberately: "enable use_layerwise for latency"

    overlap (accepting PIECEWISE cudagraph), pick the right backend, and size

    CPU offload capacity to available host memory.

    '
  suggested_values:
  - scenario: PD-disaggregated prefill node using AscendStoreConnector, latency-sensitive
    value:
      backend: mooncake
      use_layerwise: true
    reason: Layerwise per-layer KV access overlaps transfer with compute, reducing TTFT; forces PIECEWISE cudagraph which
      is acceptable for prefill.
  - scenario: Decode node that only reads KV from store
    value:
      consumer_is_to_load: true
      consumer_is_to_put: false
      load_async: true
    reason: Async load avoids blocking decode steps; disabling put reduces store traffic.
  - scenario: SFA PD RD2H connector deployment
    value:
      transfer_backend: memfabric
      use_layerwise: true
    reason: transfer_backend is mandatory (only memfabric supported); layerwise defaults to true on both sides.
  - scenario: PreemptOffloadConnector with CPU offload
    value:
      enable_offload_prefix_caching: true
      cpu_bytes_to_use: 1073741824
    reason: Enables prefix caching in CPU offload and sets a bounded host memory budget to avoid OOM.
  caveats:
  - use_layerwise=true forces cudagraph_mode to PIECEWISE, disabling full CUDA-graph capture — a throughput tradeoff for latency.
  - memcache_dp_init_barrier defaults to true; disabling it removes a startup sync but risks races across DP ranks during
    graph capture.
  - With MultiConnector, keys must go into the AscendStoreConnector child config, not the root dict.
  - SfaRemoteD2HConnector requires transfer_backend; omitting it raises ValueError at startup.
  - cpu_bytes_to_use / offload host memory ratio must be sized to actual host DRAM to avoid OOM or wasted memory.
  quick_guide: Enable use_layerwise for latency overlap, set backend and transfer_backend explicitly, and size CPU offload
    capacity to host memory.
analysis_date: '2026-10-27'
