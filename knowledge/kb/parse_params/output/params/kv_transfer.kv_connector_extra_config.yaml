value_type: dict
default: {}
valid_choices: Free-form dict; recognized keys depend on the connector (e.g. use_layerwise, consumer_is_to_put, consumer_is_to_load,
  save_decode_cache, load_async, backend, memcache_dp_init_barrier, transfer_backend, enable_offload_prefix_caching, cpu_bytes_to_use,
  num_workers, mooncake_protocol, device_name, host_pool_gib, connectors)
cli_example: null
deprecated: false
performance_impact: high
performance_scope:
- latency
- throughput
- memory
impact_detail: "This is the free-form per-connector configuration dict that drives KV-transfer\nbehavior. On Ascend it is\
  \ read by multiple connectors and directly changes the\ndata path, so it has high performance impact.\n\nAscendStoreConnector\
  \ (vllm_ascend/distributed/kv_transfer/kv_pool/ascend_store/ascend_store_connector.py:109-117):\n- \"use_layerwise (default\
  \ False) selects per-layer KV access. When true, the\"\n  connector declares requires_piecewise_for_cudagraph()==True, which\
  \ forces\n  cudagraph_mode to PIECEWISE (upstream vllm/config/vllm.py:1766). Layerwise\n  transfer overlaps KV load/store\
  \ with compute, improving latency/throughput,\n  but disables full CUDA-graph capture.\n- \"backend (default \\\"mooncake\\\
  \") selects the layerwise protocol/data-plane\"\n  (get_layerwise_protocol / get_layerwise_data_plane). The data plane choice\n\
  \  (block_key vs gva) changes whether block-key layerwise or GVA layerwise\n  transfer is used, affecting transfer efficiency.\n\
  - \"consumer_is_to_put / consumer_is_to_load / save_decode_cache / load_async\"\n  (pool_scheduler.py:104-117) control whether\
  \ the decode side writes/reads KV\n  and whether loads are async — directly affecting decode latency and store\n  traffic.\n\
  - \"memcache_dp_init_barrier (default True) synchronizes DP ranks before NPU\"\n  graph capture; disabling it removes a\
  \ startup barrier but risks races.\n\nSfaRemoteD2HConnector (sfa_pd_rd2h/connector.py:73, worker.py:98):\n- \"use_layerwise\
  \ defaults to True here (layer-wise on both sides).\"\n- \"transfer_backend is REQUIRED and currently only \\\"memfabric\\\
  \" is supported;\"\n  missing it raises ValueError at startup.\n\nPreemptOffloadConnector (preempt_offload_connector.py:77-82):\n\
  - \"enable_offload_prefix_caching (default False) and cpu_bytes_to_use /\"\n  offload host memory ratio control CPU offload\
  \ capacity, affecting memory\n  headroom and preemption behavior.\n\nUpstream vllm/config/vllm.py:1054 auto-populates cpu_bytes_to_use\
  \ from\nkv_offloading_size for the native offload backend. Mooncake connector reads\nnum_workers (default 10), mooncake_protocol\
  \ (default \"rdma\"), device_name.\nHiSparseConnector requires host_pool_gib (positive float).\n\nBecause these keys gate\
  \ async/layerwise paths, CUDA-graph mode, and CPU\noffload capacity, misconfiguration can cause large latency regressions,\n\
  reduced throughput, or OOM.\n"
