- vllm_ascend/worker/v2/model_states/default.py:77
- vllm_ascend/patch/platform/patch_dyntra_lb_core.py:126
value_type: int
default: 128
valid_choices: integer >= 1 (Field(ge=1)); CLI default is None and resolved at engine-config creation time
cli_example: --max-num-seqs 128
deprecated: false
performance_impact: high
performance_scope:
- throughput
- latency
- memory
impact_detail: '--max-num-seqs caps the number of sequences the scheduler batches into a single

  iteration (vllm/config/scheduler.py:63, DEFAULT_MAX_NUM_SEQS = 128). It is the

  primary knob for decode batch width, so it directly drives NPU utilization,

  throughput and per-token latency.


  Upstream mechanism: "vllm/config/vllm.py:2160 computes the default CUDA-graph"

  capture ceiling as min(max_num_seqs * decode_query_len * 2, 512/1024), and

  vllm/config/compilation.py:712 documents that this ceiling exists to avoid OOM

  with small max_num_seqs and to limit large-graph capture cost. So max_num_seqs

  also indirectly controls how many ACLGraph/CUDA-graph shapes get captured.


  Ascend override (vllm_ascend/platform.py:1503-1537, _get_reduced_cg_cap): when

  the user has NOT set max_cudagraph_capture_size or cudagraph_capture_sizes,

  vllm-ascend injects its own default capture cap equal to

  min(max_num_seqs * decode_query_len, 512) — note the deliberate removal of the

  CUDA-oriented trailing "* 2". decode_query_len = 1 + num_speculative_tokens.

  This means on Ascend, raising --max-num-seqs enlarges the ACLGraph capture

  upper bound (up to 512), increasing graph capture time and memory, while

  lowering it shrinks the captured shape set.


  vllm_ascend/ascend_config.py:1392: when oproj_tensor_parallel_size /

  mlp_tensor_parallel_size are enabled, max_step = min(max_num_batched_tokens,

  max_num_seqs * decode_query_len) must be covered by the largest cudagraph

  capture size, otherwise those TP features are silently disabled with a warning

  (an oversized step would dispatch to eager and hang cross-DP HCCL collectives).


  vllm_ascend/worker/model_runner_v1.py:418 sets self.max_num_reqs from

  max_num_seqs, and :3968 uses it to shape dummy/warmup runs (num_reqs =

  min(max_num_reqs, cdiv(num_tokens, max_query_len))), so it sizes per-request

  buffers and warmup work. vllm_ascend/worker/v2/model_runner.py:430 passes it to

  initialize_kda_state_copy, and v2 model_states/default.py:77 allocates

  CpuGpuBuffer(max_num_seqs) for sparse KV offload (plus max_num_seqs + 2 pool

  slots), so it directly sizes pinned host memory in that path.


  vllm_ascend/patch/platform/patch_dyntra_lb_core.py:126-173 uses max_num_seqs as

  the per-card running-set cap when rebalancing load across DP ranks

  (fill_running_from_waiting pulls waiting requests until len(running) reaches

  max_num_seqs), so it bounds the DP load-balancer''s admission per card.


  Docs: "batch_invariance.md:192 recommends decreasing --max-num-seqs to reduce"

  preemption (preemption forces recompute through the prefill path and breaks

  batch invariance); graph_mode.md:306 and preempt_offload_connector.md:19 note

  the decode token budget is sized as max_num_seqs * (1 + num_speculative_tokens).

  '
