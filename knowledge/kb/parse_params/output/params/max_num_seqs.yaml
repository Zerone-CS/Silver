name: --max-num-seqs
type: cli
category: scheduling
scope: both
source_file:
- vllm/config/scheduler.py:63
- vllm/engine/arg_utils.py:1595
- vllm/engine/arg_utils.py:559
- vllm/config/vllm.py:2160
- vllm/config/compilation.py:712
- vllm_ascend/platform.py:1515
- vllm_ascend/platform.py:1528
- vllm_ascend/ascend_config.py:1392
- vllm_ascend/worker/model_runner_v1.py:418
- vllm_ascend/worker/model_runner_v1.py:3968
