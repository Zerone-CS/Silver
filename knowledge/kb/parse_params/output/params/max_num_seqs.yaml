related_parameters:
- name: --max-num-batched-tokens
  relation: 'Coupled: max_step = min(max_num_batched_tokens, max_num_seqs * decode_query_len); decode deployments typically
    size max_num_batched_tokens ~ max_num_seqs * (1 + num_spec_tokens)'
- name: --max-cudagraph-capture-size
  relation: If set explicitly, overrides the Ascend default cap derived from max_num_seqs; must cover max_num_seqs * decode_query_len
    for oproj/mlp TP to stay enabled
- name: --cudagraph-capture-sizes
  relation: Explicit list disables the max_num_seqs-derived default capture cap
- name: --num-speculative-tokens
  relation: decode_query_len = 1 + num_speculative_tokens multiplies the effective decode batch width and capture cap
- name: --gpu-memory-utilization
  relation: Larger max_num_seqs needs more KV cache; docs suggest raising gpu-memory-utilization to avoid preemption
- name: --max-model-len
  relation: Longer context per request reduces the concurrency that fits in KV cache for a given max_num_seqs
- name: --data-parallel-size
  relation: max_num_seqs applies per DP rank; max_num_queued_reqs should be sized ~ data_parallel_size * max_num_seqs
- name: --enable-batch-sharded-sampling
  relation: Requires max_num_seqs >= tensor_parallel_size
constraints:
- --max-num-seqs must be at least 1.
- For Mamba/hybrid models with full cudagraphs, max_num_seqs must not exceed the number of available Mamba cache blocks, otherwise
  graph capture raises a ValueError.
- Enabling batch-sharded sampling requires max_num_seqs to be at least tensor_parallel_size.
- When oproj_tensor_parallel_size / mlp_tensor_parallel_size are set, the largest cudagraph capture size must be >= min(max_num_batched_tokens,
  max_num_seqs * (1 + num_speculative_tokens)), otherwise those features are disabled.
tuning_advice:
  summary: Size --max-num-seqs to the concurrency your KV cache can hold without preemption, and keep it consistent with --max-num-batched-tokens
    and the ACLGraph capture cap.
  suggested_values:
  - scenario: High-throughput online serving on Ascend with ample KV cache (v1 and v2 workers)
    value: 128
    reason: Matches upstream DEFAULT_MAX_NUM_SEQS; keeps the Ascend default capture cap at min(128 * decode_query_len, 512)
      and gives good NPU batch utilization.
  - scenario: 'Latency-sensitive / batch-invariance-critical workloads (docs: batch_invariance.md)'
    value: 32
    reason: Fewer concurrent requests share the KV cache, reducing preemption and recompute that break batch invariance and
      inflate TPOT.
  - scenario: Decode node in PD disaggregation with MTP/speculative decoding
    value: 12
    reason: KVPP doc example uses max_num_seqs=12 with max_num_batched_tokens=32768; decode nodes mainly schedule 1 + num_spec_tokens
      tokens per request, so a small max_num_seqs suffices.
  - scenario: Enabling oproj_tensor_parallel_size / mlp_tensor_parallel_size
    value: 64
    reason: Keep max_num_seqs * (1 + num_speculative_tokens) within the largest cudagraph capture size (default cap 512) so
      the TP features are not silently disabled.
  caveats:
  - Always check startup logs for 'GPU KV cache size' and 'Maximum concurrency for ... tokens per request' to confirm max_num_seqs
    fits the KV cache.
  - If you explicitly set --max-cudagraph-capture-size or --cudagraph-capture-sizes, the Ascend max_num_seqs-derived default
    cap no longer applies — verify the explicit cap still covers max_num_seqs * decode_query_len.
  - Raising --max-num-seqs without raising --max-num-batched-tokens can leave the scheduler token-budget-bound rather than
    sequence-bound.
  quick_guide: Set --max-num-seqs to the KV-cache-feasible concurrency (start at 128, lower to ~32 for latency/batch-invariance,
    ~12 for PD decode nodes) and keep max_num_seqs * (1 + num_spec_tokens) within the ACLGraph capture cap.
