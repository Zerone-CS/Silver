name: speculative.max_model_len
type: nested
category: speculation
scope: vllm
source_file:
- vllm/config/speculative.py:1613
- vllm/config/speculative.py:1615
- vllm/config/speculative.py:1631
- vllm/config/speculative.py:1644
value_type: int
default: null
valid_choices: Any positive integer; must be <= draft model max_model_len and <= target model max_model_len
cli_example: null
deprecated: false
performance_impact: low
performance_scope:
- memory
- latency
impact_detail: 'speculative.max_model_len (the `max_model_len` field of SpeculativeConfig) sets the

  maximum sequence length the draft model is allowed to handle. In

  `_maybe_override_draft_max_model_len` (vllm/config/speculative.py:1613-1656), when this

  value is provided it is validated against both the draft model''s max_model_len and the

  target model''s max_model_len, and then returned as the effective draft max length. When

  it is None (the default), the effective draft length is `min(draft_max_model_len,

  target_max_model_len)`.


  The value flows into the draft model''s ModelConfig.max_model_len, which in turn sizes

  the draft model''s KV cache and attention metadata. A smaller value reduces draft-model

  KV cache memory footprint and can reduce per-step attention work in the draft model,

  but it also means sequences longer than this value will skip speculation entirely

  (the docstring explicitly notes it is "mainly used for testing that sequences can skip

  speculation"). In the v1 upstream speculator (vllm/v1/worker/gpu/spec_decode/

  autoregressive/speculator.py:236-238) the draft max seq len is clamped to

  `self.max_model_len`, and in suffix decoding (vllm/v1/spec_decode/suffix_decoding.py:85)

  the number of speculative tokens is bounded by `self.max_model_len - num_tokens - 1`.


  On Ascend, vllm-ascend does not define or override this parameter; it is consumed

  through the upstream SpeculativeConfig path. The vllm-ascend e2e test

  (tests/e2e/pull_request/two_card/spec_decode/test_spec_decode_heavy.py:269) exercises

  the boundary where `prompt_len + num_speculative_tokens > max_model_len`, which

  deterministically triggers the `input_fits_in_drafter=False` path (skip speculation).

  Because it primarily controls whether speculation is skipped at the length boundary

  and the draft KV cache size, its steady-state throughput impact is low; it is mainly a

  correctness/testing knob rather than a primary tuning lever.

  '
usage_locations:
- file: vllm/config/speculative.py:1613
  context: _maybe_override_draft_max_model_len validates and returns the effective draft max length
- file: vllm/config/speculative.py:1631
