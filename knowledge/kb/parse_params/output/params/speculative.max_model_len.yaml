related_parameters:
- name: max_model_len
  relation: Target model max length; speculative.max_model_len must not exceed it
- name: speculative.num_speculative_tokens
  relation: Combined with prompt length, determines whether speculation is skipped at the boundary
- name: speculative.method
  relation: Only relevant when speculative decoding is enabled
- name: speculative.draft_model_config.max_model_len
  relation: Upper bound for speculative.max_model_len
constraints:
- speculative.max_model_len must not be larger than the draft model's max_model_len, otherwise a ValueError is raised.
- speculative.max_model_len must not be larger than the target model's max_model_len, otherwise a ValueError is raised.
- When speculative.max_model_len is not set, the effective draft max length is min(draft_max_model_len, target_max_model_len).
tuning_advice:
  summary: Leave unset in production; only set it to a value <= both draft and target max_model_len when you intentionally
    want to test or force speculation skipping at a length boundary.
  suggested_values:
  - scenario: Production deployment (default behavior)
    value: unset
    reason: Leaving it unset lets the effective draft length be min(draft_max_model_len, target_max_model_len), maximizing
      speculation coverage.
  - scenario: Testing speculation-skip boundary behavior
    value: 1024
    reason: A small value like 1024 (as used in the vllm-ascend e2e test) deterministically triggers input_fits_in_drafter=False
      when prompt_len + num_speculative_tokens exceeds it.
  - scenario: Reducing draft-model KV cache memory for long-context serving
    value: 4096
    reason: A conservative draft max length caps draft KV cache growth while remaining <= target max_model_len; verify it
      does not cause excessive speculation skipping.
  caveats:
  - Do not set it larger than either the draft or target model max_model_len; this raises a ValueError at config validation.
  - On Ascend, this is not a primary performance lever; prefer tuning num_speculative_tokens and max_model_len for throughput.
  quick_guide: Leave speculative.max_model_len unset unless you need to test speculation skipping; if set, keep it <= min(draft,
    target) max_model_len.
analysis_date: '2026-10-27'
