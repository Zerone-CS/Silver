- file: vllm/v1/worker/gpu/spec_decode/autoregressive/speculator.py:237
  context: Draft max seq len clamped to self.max_model_len during proposal
- file: vllm/v1/spec_decode/suffix_decoding.py:85
  context: Number of speculative tokens bounded by max_model_len - num_tokens - 1
- file: tests/e2e/pull_request/two_card/spec_decode/test_spec_decode_heavy.py:269
