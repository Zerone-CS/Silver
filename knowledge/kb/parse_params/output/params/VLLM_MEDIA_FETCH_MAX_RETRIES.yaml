related_parameters:
- name: VLLM_IMAGE_FETCH_TIMEOUT
  relation: Base timeout for image fetch; each retry multiplies this by the backoff factor
- name: VLLM_VIDEO_FETCH_TIMEOUT
  relation: Base timeout for video fetch; each retry multiplies this by the backoff factor
- name: VLLM_AUDIO_FETCH_TIMEOUT
  relation: Base timeout for audio fetch; each retry multiplies this by the backoff factor
- name: VLLM_MEDIA_CACHE
  relation: Caching reduces the need to re-fetch media, lowering the practical importance of retries
- name: VLLM_MEDIA_URL_ALLOW_REDIRECTS
  relation: Redirect handling affects whether a fetch succeeds on first attempt, influencing retry frequency
constraints:
- Values below 1 are clamped to 1, so setting 0 does not disable fetching but results in a single attempt.
- Only retryable exceptions trigger a retry; non-retryable errors are raised immediately regardless of this value.
tuning_advice:
  summary: Keep the default (3) for typical multimodal serving; lower it for latency-sensitive deployments and raise it only
    when media hosts are known to be flaky.
  suggested_values:
  - scenario: Default multimodal serving with reasonably reliable media hosts
    value: 3
    reason: Default balances resilience against transient fetch failures with bounded worst-case latency.
  - scenario: Latency-sensitive online serving where failing fast is preferred
    value: 1
    reason: Single attempt avoids the quadrupling timeout and cumulative sleep of retries, minimizing tail latency at the
      cost of resilience.
  - scenario: Batch/offline processing against unreliable or rate-limited media hosts
    value: 5
    reason: More attempts absorb transient slowness/failures, acceptable because offline latency is less critical.
  caveats:
  - Because each retry multiplies the timeout by the backoff factor, raising this value can multiply worst-case latency; pair
    with a sensible VLLM_IMAGE_FETCH_TIMEOUT/VLLM_VIDEO_FETCH_TIMEOUT.
  - Enable VLLM_MEDIA_CACHE to avoid repeated fetches and reduce reliance on retries.
  - This setting does not affect Ascend NPU throughput or memory; do not expect NPU-level gains from tuning it.
  quick_guide: Leave at 3; set to 1 for fail-fast latency-sensitive serving, raise to 5 only for flaky media hosts in offline
    jobs.
analysis_date: '2026-10-27'
