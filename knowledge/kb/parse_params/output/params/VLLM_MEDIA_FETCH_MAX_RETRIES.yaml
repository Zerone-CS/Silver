- vllm/envs.py:77
- vllm/connections.py:246
- vllm/connections.py:292
value_type: int
default: 3
valid_choices: integer >= 1 (values below 1 are clamped to 1 via max(..., 1))
cli_example: null
deprecated: false
performance_impact: low
performance_scope:
- latency
impact_detail: 'This env var only controls the retry loop for fetching remote media (images,

  audio, video) from URLs in multimodal serving, implemented in

  vllm/connections.py via the _sync_retry and _async_retry decorators. At

  vllm/connections.py:246 and :292, max_retries = max(envs.VLLM_MEDIA_FETCH_MAX_RETRIES, 1)

  bounds the number of attempts. Each attempt uses a per-attempt timeout of

  base_timeout * (_RETRY_BACKOFF_FACTOR ** attempt), and on a retryable failure

  the code sleeps for backoff = _RETRY_BACKOFF_FACTOR ** attempt before retrying.

  Therefore a higher value increases worst-case wall-clock latency for a request

  whose media URL is slow or flaky (more attempts, each with a larger timeout,

  plus cumulative sleep), while a lower value fails faster. It does not touch

  NPU compute, HCCL communication, KV cache, or model execution at all — the

  retry happens in the API-server/input-processing HTTP fetch path before any

  NPU work. There is no vllm-ascend override of this parameter; it is a pure

  upstream vLLM env var and behaves identically on Ascend. Impact on Ascend NPU

  runtime is therefore low and indirect: "it only affects end-to-end request"

  latency for multimodal inputs with remote media URLs, not throughput or NPU

  memory.

  '
