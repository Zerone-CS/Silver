name: --mm-tensor-ipc
type: cli
category: communication
scope: vllm
source_file:
- vllm/config/multimodal.py:225
- vllm/engine/arg_utils.py:1435
- vllm/engine/arg_utils.py:624
- vllm/engine/arg_utils.py:1884
- vllm/config/model.py:415
- vllm/config/vllm.py:1526
- vllm/config/vllm.py:2727
- vllm/v1/engine/core_client.py:683
- vllm/v1/engine/utils.py:1127
value_type: str
default: direct_rpc
valid_choices:
- direct_rpc
- torch_shm
cli_example: --mm-tensor-ipc torch_shm
deprecated: false
performance_impact: medium
performance_scope:
- latency
- throughput
- memory
impact_detail: "This parameter selects the transport used to move multimodal (image/video) tensors\nfrom the API server /\
  \ frontend process to the engine core process. It is defined\nupstream in vllm/config/multimodal.py:225 as `mm_tensor_ipc:\
  \ MMTensorIPC = \"direct_rpc\"`.\nNo vllm-ascend override of this parameter was found in the provided context, so the\n\
  upstream behavior applies on Ascend as well.\n\nMechanism:\n- \"\\\"direct_rpc\\\" (default): tensors are serialized with\
  \ msgspec and sent over the\"\n  regular RPC channel. This copies the tensor bytes through the host (CPU) and\n  serializes/deserializes\
  \ them, adding per-request latency proportional to the\n  multimodal tensor size. In vllm/v1/engine/core_client.py:683-688,\
  \ when\n  mm_tensor_ipc != \"torch_shm\" (or no tensor_queue exists), `tensor_ipc_sender`\n  stays None and the MsgpackEncoder\
  \ has no out-of-band tensor consumer, so all\n  tensor data goes through the normal serialization path.\n- \"\\\"torch_shm\\\
  \": in vllm/v1/engine/utils.py:1127-1128 a multiprocessing Queue is\"\n  created (`get_mp_context().Queue()`) and in core_client.py:684-685\
  \ a\n  `TensorIpcSender(tensor_queue)` is attached to the MsgpackEncoder as an\n  out-of-band tensor consumer, enabling\
  \ zero-copy shared-memory IPC of the\n  multimodal tensors. This avoids the host copy/serialization of large image/video\n\
  \  tensors, reducing frontend->engine latency and CPU overhead for multimodal\n  workloads.\n- \"Additionally, in vllm/config/vllm.py:2727-2742,\
  \ on an EPD encoder instance\"\n  (encode-only EC producer), \"torch_shm\" is the ONLY transport that allows the\n  multimodal\
  \ processor to run on the accelerator (`--mm-processor-device=auto`\n  resolves to the device only when mm_tensor_ipc ==\
  \ \"torch_shm\"). With\n  \"direct_rpc\" the processor is forced to CPU because any other transport would\n  copy device\
  \ tensors back to host, negating the benefit. So on Ascend, choosing\n  \"torch_shm\" can move image/video preprocessing\
  \ onto the NPU for encoder\n  instances, which is a meaningful throughput/latency win for EPD deployments.\n\nOn Ascend\
  \ NPU specifically, the shared-memory path is host-side (torch.multiprocessing\nshared memory), so it does not use HCCL;\
  \ it reduces CPU-side copy/serialization\noverhead. The benefit scales with multimodal tensor size and request rate.\n"
