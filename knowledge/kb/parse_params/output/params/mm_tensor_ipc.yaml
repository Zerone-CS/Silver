related_parameters:
- name: --mm-processor-device
  relation: On EPD encoder instances, 'auto' resolves to the accelerator only when --mm-tensor-ipc=torch_shm; otherwise it
    stays on CPU.
- name: VLLM_WORKER_MULTIPROC_METHOD
  relation: Must be set to 'spawn' when --mm-tensor-ipc=torch_shm, otherwise a ValueError is raised.
- name: --mm-ipc-gpu-memory-gb
  relation: Related IPC memory budget for multimodal tensor IPC.
- name: --mm-processor-kwargs
  relation: The device for the HF processor is stored here; torch_shm enables device tensors to be carried.
constraints:
- When --mm-tensor-ipc=torch_shm is set, VLLM_WORKER_MULTIPROC_METHOD must be set to 'spawn', otherwise vLLM raises a ValueError
  at startup.
- torch_shm tensor IPC is only supported for DP=1 data flow (a single tensor queue is created since only DP=1 is supported
  for this data flow).
- On an EPD encoder instance, the multimodal processor runs on the accelerator only if --mm-tensor-ipc=torch_shm; with any
  other value it is forced to CPU.
tuning_advice:
  summary: Use torch_shm for multimodal workloads to avoid host copies of image/video tensors; keep direct_rpc for text-only
    or when spawn multiprocessing is not feasible.
  suggested_values:
  - scenario: Multimodal (image/video) serving with large tensors and DP=1
    value: torch_shm
    reason: Enables zero-copy shared-memory IPC via TensorIpcSender, avoiding msgspec serialization and host copies of large
      multimodal tensors, reducing frontend->engine latency.
  - scenario: EPD encode/prefill/decode deployment with encode-only encoder instances
    value: torch_shm
    reason: Only torch_shm allows --mm-processor-device=auto to run the multimodal processor on the NPU accelerator, offloading
      preprocessing from CPU.
  - scenario: Text-only models or deployments where spawn multiprocessing is not usable
    value: direct_rpc
    reason: Default transport; no shared-memory queue overhead and no spawn requirement.
  caveats:
  - Must set VLLM_WORKER_MULTIPROC_METHOD=spawn when using torch_shm, or startup fails with ValueError.
  - Only beneficial for multimodal workloads; no effect on text-only models.
  - Only DP=1 data flow is supported for the tensor IPC queue.
  quick_guide: For multimodal serving on Ascend, set --mm-tensor-ipc torch_shm together with VLLM_WORKER_MULTIPROC_METHOD=spawn
    to cut host-copy latency.
analysis_date: '2026-10-27'
