related_parameters:
- name: EngramConfig.cpu_offload
  relation: This env var provides the default value; an explicit cpu_offload setting takes precedence.
- name: EngramConfig.dp_shared_memory
  relation: Requires cpu_offload=True; setting dp_shared_memory without cpu_offload raises ValueError.
- name: EngramConfig.embedding_across_dp
  relation: Related Engram embedding sharding option; interacts with offload placement.
constraints:
- dp_shared_memory requires cpu_offload=True, otherwise a ValueError is raised.
- Engram configuration is rejected for models without n-gram embedding fields.
- Engram configuration requires the CUDA platform (current_platform.is_cuda()); it is not supported on Ascend NPU.
tuning_advice:
  summary: Leave at default on Ascend NPU; this is a CUDA-only Engram embedding placement knob with no effect on Ascend runtime.
  suggested_values:
  - scenario: Ascend NPU deployment (any model)
    value: '1'
    reason: Engram config is rejected on non-CUDA platforms, so the value is inert; keeping the default avoids confusion.
  - scenario: CUDA deployment with Engram n-gram embeddings and tight device memory
    value: '1'
    reason: Stores embedding tables in pinned CPU memory via UVA, freeing device memory at the cost of host lookup latency.
  - scenario: CUDA deployment where embedding lookup latency dominates
    value: '0'
    reason: Disables CPU offload so embeddings stay on device, avoiding host-memory read overhead.
  caveats:
  - No effect on Ascend NPU because EngramConfig.verify_model_config requires is_cuda().
  - Only relevant to models with Engram n-gram embeddings; ignored otherwise.
  quick_guide: On Ascend, ignore this variable — Engram CPU offload is CUDA-only and inactive.
