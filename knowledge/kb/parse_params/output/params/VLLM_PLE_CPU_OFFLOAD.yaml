- vllm/envs.py:157
- vllm/config/engram.py:27
- vllm/config/engram.py:46
value_type: bool
default: true
valid_choices: 0 or 1 (parsed via bool(int(...)))
cli_example: null
deprecated: false
performance_impact: low
performance_scope:
- memory
impact_detail: 'VLLM_PLE_CPU_OFFLOAD controls the default value of EngramConfig.cpu_offload

  (vllm/config/engram.py:27, _default_cpu_offload returns envs.VLLM_PLE_CPU_OFFLOAD).

  When enabled, Engram n-gram embedding tables are stored in pinned CPU memory and

  accessed via UVA lookup instead of residing on the accelerator device. This trades

  device memory for host memory and adds a host-memory read path per lookup.

  The parameter only takes effect for models that use Engram n-gram embeddings

  (EngramConfig.verify_model_config rejects models without n-gram embedding fields).

  On Ascend NPU, EngramConfig.verify_model_config requires current_platform.is_cuda(),

  so the Engram path (and therefore this env var) is not active on Ascend — the

  config is rejected before any offload behavior is applied. Hence the runtime

  performance impact on Ascend NPU is effectively none/low; the parameter is a

  CUDA-only memory-placement knob.

  '
usage_locations:
