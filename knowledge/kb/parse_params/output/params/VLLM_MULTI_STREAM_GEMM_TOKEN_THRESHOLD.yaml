name: VLLM_MULTI_STREAM_GEMM_TOKEN_THRESHOLD
type: env
category: model
scope: vllm
source_file:
- vllm/envs.py:2024
- vllm/envs.py:298
- vllm/models/deepseek_v4/attention.py:713
- vllm/models/deepseek_v41/attention.py:816
value_type: int
default: 1024
valid_choices: non-negative integer; 0 disables the multi-stream path entirely
cli_example: null
deprecated: false
performance_impact: low
performance_scope:
- latency
- throughput
impact_detail: 'This env var is defined only in upstream vLLM (vllm/envs.py:2024, typed at envs.py:298) and is

  consumed exclusively by the DeepSeek-V4 / V4.1 attention modules

  (vllm/models/deepseek_v4/attention.py:713 and vllm/models/deepseek_v41/attention.py:816). It is

  a token-count cutoff passed as the `enable=` predicate to `execute_in_parallel(...)`: when

  `hidden_states.shape[0] <= VLLM_MULTI_STREAM_GEMM_TOKEN_THRESHOLD`, the main FP8 attention-input

  GEMM (`_fused_wqa_wkv_gemm`) is overlapped on a separate CUDA stream with auxiliary bf16 GEMMs

  (indexer weights_proj, compressor kv-score, etc.). Above the threshold the FP8 GEMM saturates the

  device and the cross-stream sync becomes pure overhead, so overlap is skipped. The mechanism is

  CUDA-stream based (`aux_streams`, `ln_events`) and is specific to the NVIDIA DeepSeek-V4 MegaMoE

  path. There is NO reference to this env var anywhere in vllm-ascend, and the DeepSeek-V4/V4.1

  attention modules that read it are not part of the Ascend model implementations. On Ascend NPU

  this parameter therefore has no runtime effect — it neither changes latency, throughput, nor

  memory. It is documented here for completeness because it appears in the shared upstream envs.py.

  '
usage_locations:
- file: vllm/envs.py:2024
  context: Env var definition, default 1024, parsed as int
- file: vllm/envs.py:298
  context: 'Typed declaration VLLM_MULTI_STREAM_GEMM_TOKEN_THRESHOLD: int = 1024'
