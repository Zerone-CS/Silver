related_parameters:
- name: VLLM_SHARED_EXPERTS_STREAM_TOKEN_THRESHOLD
  relation: Sibling token-count cutoff for a different (shared-experts) separate-stream overlap path; same design pattern
- name: VLLM_DISABLE_SHARED_EXPERTS_STREAM
  relation: Related stream-overlap toggle for shared experts; both control CUDA-stream parallelism in MoE/attention
constraints:
- The value must be a non-negative integer; setting it to 0 disables the multi-stream overlap path entirely.
- The parameter only takes effect in the upstream DeepSeek-V4/V4.1 attention modules and has no effect on Ascend NPU where
  those modules are not used.
tuning_advice:
  summary: No Ascend tuning needed — this env var only affects the NVIDIA DeepSeek-V4 CUDA-stream overlap path and is inert
    on Ascend NPU.
  suggested_values:
  - scenario: Ascend NPU deployment (any model)
    value: 1024
    reason: Leave at default; the parameter is not read by any vllm-ascend code path, so changing it has no effect on NPU
      performance.
  - scenario: Upstream NVIDIA GPU DeepSeek-V4 with small per-step token counts
    value: 1024
    reason: Default empirically tuned (PR 41526) so overlap is a 5-45% win at or below 1024 tokens; only relevant on CUDA,
      not Ascend.
  caveats:
  - This parameter is defined only in upstream vLLM and is not referenced anywhere in vllm-ascend; it has no runtime impact
    on Ascend NPU.
  - The overlap mechanism relies on CUDA streams and events (aux_streams, ln_events) which are NVIDIA-specific; the Ascend
    attention implementations do not use this gating.
  - Setting it to 0 disables the multi-stream path entirely on the upstream CUDA path, which may hurt small-batch latency
    there but is irrelevant on Ascend.
  quick_guide: Ignore on Ascend — CUDA-only DeepSeek-V4 stream-overlap cutoff with no NPU effect.
analysis_date: '2026-10-27'
