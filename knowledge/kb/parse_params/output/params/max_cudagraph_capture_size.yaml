related_parameters:
- name: --cudagraph-capture-sizes
  relation: If specified, max_cudagraph_capture_size is set to the largest size in the list (or checked for consistency);
    if not specified, the size list is generated from this value
- name: --compilation-config.cudagraph_mode
  relation: Only relevant when graph mode is not NONE; enforce_eager forces this to 0 and clears capture sizes
- name: --max-num-seqs
  relation: Combined with (1 + num_speculative_tokens) to compute the largest possible decode step that must be covered by
    the capture bound
- name: --max-num-batched-tokens
  relation: Upper-bounds the largest possible step checked against the capture bound
- name: --speculative-config.num_speculative_tokens
  relation: Increases decode_query_len (1 + num_speculative_tokens), raising the required capture bound
- name: --additional-config.oproj_tensor_parallel_size
  relation: Disabled with a warning if the capture bound does not cover the largest possible step
- name: --additional-config.mlp_tensor_parallel_size
  relation: Disabled with a warning if the capture bound does not cover the largest possible step
- name: --additional-config.enable_fused_mc2
  relation: MC2 token capacity derived from this value sizes fused MC2 communication buffers
constraints:
- If cudagraph_capture_sizes is specified, max_cudagraph_capture_size must be consistent with the largest size in that list
  (it is set to that largest size).
- When enforce_eager is enabled, max_cudagraph_capture_size is forced to 0 and cudagraph_capture_sizes is cleared, so the
  value has no effect.
- When cudagraph_mode resolves to NONE, max_cudagraph_capture_size is set to 0 and capture sizes are cleared.
- For oproj_tensor_parallel_size / mlp_tensor_parallel_size to remain enabled, the capture bound must be at least min(max_num_batched_tokens,
  max_num_seqs * (1 + num_speculative_tokens)); otherwise they are disabled.
- oproj_tensor_parallel_size / mlp_tensor_parallel_size require graph mode (cudagraph_mode != NONE), tensor_parallel_size
  == 1, a PD decode (kv_consumer) node, and prefill_context_parallel_size == 1.
tuning_advice:
  summary: Set max_cudagraph_capture_size to cover the largest per-rank decode step (max_num_seqs * (1 + num_speculative_tokens),
    bounded by max_num_batched_tokens) so decode stays on ACL graphs, while keeping it small enough to avoid NPU memory pressure
    and capture resource exhaustion.
  suggested_values:
  - scenario: Uniform decode workload with no speculative decoding, default concurrency
    value: 512
    reason: Matches the upstream default cap; covers typical max_num_seqs decode batches without excessive graph memory.
  - scenario: Speculative decoding (e.g. EAGLE3 with num_speculative_tokens=3) and DP where per-rank batch exceeds 512
    value: 1024
    reason: 'MiniMax-M3 doc: with DP2 and max_num_seqs 256, each rank handles 128 requests producing 4*128=512 tokens; if
      concurrency rises to 257 the step becomes 516 > 512 and falls back to eager. Setting 1024 keeps decode on graphs.'
  - scenario: Memory-constrained deployment or ACL graph capture fails with stream-resource exhaustion
    value: 256
    reason: Reducing the capture size lowers reserved graph memory and stream resources; docs recommend lowering max_cudagraph_capture_size
      as the primary mitigation.
  - scenario: PD decode node using oproj_tensor_parallel_size / mlp_tensor_parallel_size
    value: 512
    reason: The capture bound must be >= min(max_num_batched_tokens, max_num_seqs * (1 + num_speculative_tokens)) or these
      TP options are disabled and cross-DP HCCL collectives could hang.
  caveats:
  - vllm-ascend may override your value with a reduced cap (platform.py:361); check logs to confirm the effective capture
    size.
  - Increasing this value raises NPU memory for MC2 communication buffers and per-request metadata buffers; monitor memory
    headroom.
  - Ensure the value covers the largest possible step when using oproj/mlp tensor parallelism, otherwise those features are
    silently disabled.
  - Prefer FULL or FULL_DECODE_ONLY cudagraph_mode for mostly uniform decode workloads to reduce capture count and memory.
  quick_guide: Set max_cudagraph_capture_size to at least max_num_seqs * (1 + num_speculative_tokens) per DP rank (commonly
    512, or 1024 with speculative decoding), and lower it if graph capture hits stream-resource limits.
analysis_date: '2026-10-27'
