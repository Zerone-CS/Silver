name: --max-cudagraph-capture-size
type: cli
category: compilation
scope: both
source_file:
- vllm/config/compilation.py:699
- vllm/engine/arg_utils.py:1660
- vllm/engine/arg_utils.py:465
- vllm/config/vllm.py:1029
- vllm/config/vllm.py:1783
- vllm_ascend/platform.py:361
- vllm_ascend/platform.py:1271
- vllm_ascend/ascend_config.py:1394
- vllm_ascend/ascend_forward_context.py:257
- vllm_ascend/attention/dsa_v1.py:724
- vllm_ascend/attention/context_parallel/dsa_cp.py:293
- vllm_ascend/attention/context_parallel/sfa_cp.py:116
- vllm_ascend/compilation/acl_graph.py:239
value_type: int
default: <computed>
valid_choices: positive integer; None means auto-derived from cudagraph_capture_sizes or capped at 512 by default (1024 on
  data center Blackwell GPUs)
cli_example: --max-cudagraph-capture-size 512
deprecated: false
performance_impact: high
performance_scope:
- latency
- throughput
- memory
impact_detail: "This parameter sets the upper bound of the ACL graph (Ascend's CUDA-graph equivalent) capture\nsize, which\
  \ determines the largest batch/token count that can be replayed from a captured graph\ninstead of running eagerly. On Ascend\
  \ it has several distinct effects:\n\n1. Graph coverage vs eager fallback (throughput/latency): In vllm/config/compilation.py:699\
  \ the\n   docstring states that if cudagraph_capture_sizes is not specified, the size list is generated\n   as [1,2,4] +\
  \ range(8,256,8) + range(256, max_cudagraph_capture_size+1, 16), capped at 512 by\n   default. Any step larger than the\
  \ largest captured size dispatches to eager execution, which\n   is significantly slower on NPU. The MiniMax-M3 doc explicitly\
  \ notes that batches above the\n   capture size \"skip graph capture and fall back to eager execution, lowering decode throughput\"\
  .\n\n2. Ascend override (memory): vllm_ascend/platform.py:361 (apply_config_platform_defaults) calls\n   _get_reduced_cg_cap\
  \ and, when non-None, overwrites max_cudagraph_capture_size with a reduced\n   cap (a memory-saving override tied to MC2\
  \ usage). Later, in platform.py:1271, the reduced cap\n   is folded into cudagraph_capture_sizes and max_cudagraph_capture_size\
  \ is reset to None so\n   upstream _set_cudagraph_sizes rebuilds the list. So the user-supplied value can be silently\n\
  \   reduced on Ascend.\n\n3. MC2 token capacity (memory/communication): vllm_ascend/ascend_forward_context.py:257 uses\n\
  \   max_cudagraph_capture_size as max_num_tokens when cudagraph_capture_sizes is set and prefill\n   MC2 is not enabled,\
  \ which sizes the fused MC2 / MegaMoe communication buffers per TP rank.\n   A larger capture size therefore reserves more\
  \ HCCL/symmetric buffer memory.\n\n4. Per-request buffer sizing (memory): dsa_v1.py:724, dsa_cp.py:293 and sfa_cp.py:116\
  \ size\n   persistent per-request metadata buffers (and PCP O-projection buffers) to\n   max(max_num_seqs, max_cudagraph_capture_size),\
  \ so a large value increases NPU memory for\n   these buffers.\n\n5. Cross-DP correctness gate (throughput): ascend_config.py:1394-1413\
  \ checks that the capture\n   bound covers the largest possible step (min(max_num_batched_tokens, max_num_seqs *\n   decode_query_len));\
  \ if not, oproj_tensor_parallel_size / mlp_tensor_parallel_size are\n   disabled with a warning because an oversized step\
  \ would dispatch to eager and hang cross-DP\n   HCCL collectives.\n\n6. Capture resource exhaustion (startup/memory): acl_graph.py:239\
  \ recommends lowering\n   max_cudagraph_capture_size when ACL graph capture fails with stream-resource exhaustion.\n"
