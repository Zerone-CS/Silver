name: additional_config.finegrained_tp_config.lmhead_tensor_parallel_size
type: nested
category: parallelism
scope: vllm-ascend
source_file:
- vllm_ascend/ascend_config.py:1338
- vllm_ascend/ascend_config.py:1419
- vllm_ascend/ascend_config.py:960
- vllm_ascend/distributed/parallel_state.py:199
- vllm_ascend/ops/vocab_parallel_embedding.py:120
- vllm_ascend/utils.py:959
value_type: int
default: 0
valid_choices: non-negative integer; 0 disables fine-grained LM-head TP; when > 0 it must divide data_parallel_size
cli_example: null
deprecated: false
performance_impact: medium
performance_scope:
- throughput
- memory
- latency
impact_detail: 'This is a vllm-ascend-only parameter (no upstream vLLM equivalent) that overrides the

  tensor-parallel degree used specifically for the LM head (vocab projection) of MoE models.

  When lmhead_tensor_parallel_size > 0, lmhead_tp_enable() returns True

  (vllm_ascend/utils.py:959) and init_ascend_model_parallel creates a dedicated "lmheadtp"

  process group via _create_or_get_group (vllm_ascend/distributed/parallel_state.py:207-208).

  The vocab-parallel embedding plan then routes the LM head through VocabParallelMode.FINE_GRAINED

  using get_lmhead_tp_group() (vllm_ascend/ops/vocab_parallel_embedding.py:135-139), so the

  LM-head weight and its matmul are sharded across the lmheadtp group instead of the full TP

  group. This reduces per-rank LM-head compute and weight memory (the vocab projection is large

  for big vocabularies), lowering decode latency for the LM-head matmul and freeing HBM, at the

  cost of an extra all-gather/reduce collective over the lmheadtp group. Because the LM head is

  executed every decode step, sharding it can meaningfully improve decode throughput and memory

  for MoE models with large vocabularies. The effect is indirect (medium): it does not change

  the core MoE expert computation, only the LM-head projection path and its communication.

  '
usage_locations:
- file: vllm_ascend/ascend_config.py:1338
