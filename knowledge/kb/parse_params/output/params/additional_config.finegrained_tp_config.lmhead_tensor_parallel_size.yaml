related_parameters:
- name: additional_config.finegrained_tp_config.embedding_tensor_parallel_size
  relation: Sibling fine-grained TP field; both must be non-negative and divide data_parallel_size.
- name: additional_config.finegrained_tp_config.oproj_tensor_parallel_size
  relation: Sibling field; oproj/mlp have stricter preconditions (TP==1, graph mode, PD decode node).
- name: additional_config.finegrained_tp_config.mlp_tensor_parallel_size
  relation: Sibling field with the same strict preconditions as oproj.
- name: enable_batch_sharded_sampling
  relation: Mutually exclusive — enabling both raises ValueError.
- name: prefill_context_parallel_size
  relation: PCP LM-head weight sharding cannot be combined with lmhead_tensor_parallel_size (raises ValueError).
- name: data_parallel_size
  relation: lmhead_tensor_parallel_size must divide data_parallel_size.
constraints:
- lmhead_tensor_parallel_size must be non-negative; negative values raise ValueError.
- The fine-grained TP sizes can be enabled only for MoE models; setting this on a dense model raises AssertionError.
- lmhead_tensor_parallel_size must divide data_parallel_size, otherwise an AssertionError is raised.
- enable_batch_sharded_sampling is incompatible with lmhead_tensor_parallel_size; enabling both raises ValueError.
- PCP LM-head weight sharding (prefill_context_parallel_size > 1 with PCP embedding/lmhead sharding enabled) cannot be combined
  with lmhead_tensor_parallel_size and raises ValueError.
tuning_advice:
  summary: 'Enable lmhead_tensor_parallel_size on MoE models with large vocabularies to shard the

    LM-head projection across a dedicated group, reducing per-rank LM-head compute/memory at

    the cost of an extra collective; keep it 0 (default) otherwise.

    '
  suggested_values:
  - scenario: MoE model with large vocabulary and spare DP ranks, decode-bound workload
    value: 2
    reason: Shards the LM-head matmul and weight across 2 ranks, cutting per-rank LM-head compute and HBM; must divide data_parallel_size.
  - scenario: Default / dense model / no LM-head bottleneck
    value: 0
    reason: Disables fine-grained LM-head TP; required for dense models and avoids the extra lmheadtp collective.
  - scenario: MoE with data_parallel_size = 8 and LM-head-bound decode
    value: 4
    reason: A larger lmheadtp group further reduces per-rank LM-head work; 4 divides 8, satisfying the divisibility constraint.
  caveats:
  - Do not combine with enable_batch_sharded_sampling — it raises ValueError.
  - Do not combine with PCP LM-head weight sharding (prefill_context_parallel_size > 1) — it raises ValueError.
  - Verify data_parallel_size % lmhead_tensor_parallel_size == 0 before launch to avoid AssertionError.
  - Benchmark the added lmheadtp collective; for small vocabularies the communication may outweigh the compute savings.
  quick_guide: Set to a divisor of data_parallel_size (e.g. 2 or 4) on MoE models with large vocabularies to shard the LM
    head; leave 0 otherwise.
analysis_date: '2026-10-27'
