name: --kv-sharing-fast-prefill
type: cli
category: kv_cache
scope: both
source_file:
- vllm/config/cache.py:221
- vllm/engine/arg_utils.py:1297
- vllm/engine/arg_utils.py:2110
- vllm/config/vllm.py:1793
- vllm/v1/attention/backends/utils.py:631
- vllm/v1/attention/backends/utils.py:1011
- vllm/v1/worker/gpu/attn_utils.py:156
- vllm/v1/engine/async_llm.py:388
- vllm_ascend/worker/model_runner_v1.py:2339
- vllm_ascend/worker/model_runner_v1.py:3710
- vllm_ascend/patch/worker/patch_v2/patch_model_runner.py:167
value_type: bool
default: false
valid_choices: true, false
cli_example: --kv-sharing-fast-prefill
deprecated: false
performance_impact: medium
performance_scope:
- latency
- throughput
impact_detail: "This flag enables the KV-sharing fast-prefill optimization for models with KV-sharing\narchitectures (e.g.\
  \ YOCO / Gemma3n). In such models only a subset of layers generate KV\ncaches; the trailing run of KV-sharing layers can\
  \ skip the prefill tokens entirely and\nonly process the last token(s), reducing prefill compute.\n\nUpstream mechanism\
  \ (vllm):\n- \"vllm/v1/worker/gpu/attn_utils.py:156 `get_kv_sharing_fast_prefill_eligible_layers`\"\n  returns the contiguous\
  \ suffix of KV-sharing attention layers when the flag is set;\n  otherwise returns an empty set (no optimization).\n- \"\
  vllm/v1/attention/backends/utils.py:631 `make_kv_sharing_fast_prefill_common_attn_metadata`\"\n  rewrites the attention\
  \ metadata for eligible layers so that only decode/logits\n  positions are attended, and vllm/v1/attention/backends/utils.py:1011\
  \ wraps the\n  underlying attention backend in a `FastPrefillAttentionBuilder` that applies this\n  rewrite. This reduces\
  \ the number of query tokens processed by those layers during\n  prefill, lowering prefill latency and FLOPs.\n- \"vllm/config/cache.py:283\
  \ lists `kv_sharing_fast_prefill` in the hash-ignored factors,\"\n  so toggling it does not invalidate the compiled graph\
  \ cache.\n\nAscend mechanism (vllm-ascend):\n- \"v1 worker (vllm_ascend/worker/model_runner_v1.py:2339) asserts that prompt\
  \ logprobs\"\n  are not requested when the flag is on, and at line 3710-3712 it populates\n  `cm_base.num_logits_indices`\
  \ / `cm_base.logits_indices_padded` via\n  `_prepare_kv_sharing_fast_prefill(logits_indices)` so the Ascend attention metadata\n\
  \  builders can implement the same fast-prefill path. This is the actual Ascend-side\n  wiring that makes the optimization\
  \ effective on NPU.\n- \"v2 worker (vllm_ascend/patch/worker/patch_v2/patch_model_runner.py:167) constructs an\"\n  upstream\
  \ `FastPrefillHelper` when the flag is set and no PCP manager is present,\n  delegating to the upstream fast-prefill machinery.\n\
  \nNet effect on Ascend: \"for KV-sharing models, prefill latency and prefill FLOPs are\"\nreduced (fewer tokens processed\
  \ in the trailing KV-sharing layers), improving\ntime-to-first-token and overall throughput for prefill-heavy workloads.\
  \ For models\nwithout KV sharing the flag is a no-op (eligible layer set is empty). It does not\nchange KV cache memory\
  \ footprint.\n"
