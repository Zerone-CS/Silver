related_parameters:
- name: --speculative-config
  relation: Mutually exclusive with EAGLE speculative decoding; enabling both raises ValueError.
- name: --enable-prefix-caching
  relation: Independent; fast prefill operates on attention metadata, not prefix cache.
- name: --max-num-batched-tokens
  relation: Larger prefill batches amplify the prefill savings from skipping KV-sharing layer tokens.
- name: --enforce-eager
  relation: Fast prefill metadata path interacts with cudagraph capture; upstream skips fast prefill during cudagraph capture
    steps.
constraints:
- Cannot be combined with EAGLE speculative decoding; vLLM raises a ValueError if --speculative-config uses EAGLE while --kv-sharing-fast-prefill
  is enabled.
- Requests that set prompt_logprobs are rejected (VLLMValidationError) when this flag is enabled, because fast prefill produces
  incorrect logprobs for prompt tokens.
- The v1 Ascend worker asserts that num_prompt_logprobs is zero when the flag is enabled.
- The optimization only takes effect for models with KV-sharing layers (e.g. Gemma3n / YOCO); for other models the eligible
  layer set is empty and the flag is a no-op.
- Requires model-side changes for correctness and to realize prefill savings, as warned by vLLM at startup.
tuning_advice:
  summary: Enable only for KV-sharing models (e.g. Gemma3n) with prefill-heavy workloads and no EAGLE speculation or prompt-logprob
    requests.
  suggested_values:
  - scenario: Serving a KV-sharing model (Gemma3n/YOCO) with long prompts and no EAGLE speculation
    value: true
    reason: Skips prefill tokens in trailing KV-sharing layers, reducing prefill latency and FLOPs on Ascend NPU.
  - scenario: Standard dense/MoE models without KV sharing
    value: false
    reason: Eligible layer set is empty; the flag is a no-op and adds no benefit.
  - scenario: Using EAGLE speculative decoding
    value: false
    reason: vLLM raises ValueError when combined with EAGLE; must be disabled.
  - scenario: Requests require prompt_logprobs
    value: false
    reason: Requests with prompt_logprobs are rejected when the flag is enabled.
  caveats:
  - On Ascend v2 worker, the fast-prefill helper is skipped when PCP is enabled (pcp_manager is not None).
  - Verify model-side support for fast prefill; otherwise correctness may be affected.
  - Benchmark prefill-heavy vs decode-heavy workloads separately; gains only appear in prefill.
  quick_guide: Set --kv-sharing-fast-prefill only for KV-sharing models with prefill-heavy traffic, no EAGLE, and no prompt-logprob
    requests.
analysis_date: '2026-10-27'
