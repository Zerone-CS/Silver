name: additional_config.scheduler_config.short_request_first_config.long_max_wait_ms
type: nested
category: scheduling
scope: vllm-ascend
source_file:
- vllm_ascend/ascend_config.py:1571
- vllm_ascend/ascend_config.py:1578
- vllm_ascend/patch/platform/patch_balance_schedule.py:132
- vllm_ascend/core/scheduler_profiling_chunk.py:105
- vllm_ascend/core/short_request_first_scheduler.py:383
value_type: float
default: 0.0
valid_choices: any float >= 0; 0 disables long-request promotion (strict short-first priority)
cli_example: null
deprecated: false
performance_impact: medium
performance_scope:
- latency
- throughput
impact_detail: 'This is a vllm-ascend-only parameter (no upstream vLLM equivalent). It is read from

  additional_config["scheduler_config"]["short_request_first_config"] via the pydantic

  ShortRequestFirstConfig dataclass (vllm_ascend/ascend_config.py:1571) and passed into

  install_short_request_first_waiting_queue() at three scheduler construction sites:

  patch_balance_schedule.py:132 (balance-scheduling patched scheduler),

  scheduler_profiling_chunk.py:105 (profiling-chunk scheduler), and

  short_request_first_scheduler.py:383 (ShortRequestFirstAsyncScheduler). The value is

  only consumed when short_request_first_config.enabled is True; otherwise the waiting

  queue is never installed and the value has no effect.

  Mechanism: "ShortRequestFirst reorders the waiting queue so that requests with"

  num_prompt_tokens <= threshold are scheduled ahead of long prefills. long_max_wait_ms

  is the anti-starvation fairness gate: "once the oldest long request has waited longer"

  than this many milliseconds, it becomes eligible for promotion ahead of waiting short

  requests. Setting it to 0 disables promotion entirely (strict short-first priority),

  which maximizes short-request TTFT but can starve long requests and inflate their

  tail latency. A positive value bounds long-request queueing delay at the cost of

  occasionally delaying short requests, trading short-request TTFT for long-request

  fairness. Because it changes the order in which prefills are admitted into the batch,

  it indirectly affects batch composition, prefill/decode interleaving, and thus

  throughput and TTFT on Ascend NPU — but it is a fairness/latency-shaping knob rather

  than a raw throughput knob.

  '
usage_locations:
