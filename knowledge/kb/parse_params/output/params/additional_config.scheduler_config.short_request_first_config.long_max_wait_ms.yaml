related_parameters:
- name: additional_config.scheduler_config.short_request_first_config.enabled
  relation: Master switch; long_max_wait_ms is only used when enabled is True
- name: additional_config.scheduler_config.short_request_first_config.threshold
  relation: Defines which requests count as short (num_prompt_tokens <= threshold); determines the population that long requests
    wait behind
- name: additional_config.scheduler_config.enable_balance_scheduling
  relation: One of the scheduler paths (patch_balance_schedule) that installs the short-request-first waiting queue
- name: additional_config.scheduler_config.profiling_chunk_config
  relation: Profiling-chunk scheduler path also installs the short-request-first waiting queue
constraints:
- long_max_wait_ms must be >= 0; a negative value raises ValueError at config validation.
- long_max_wait_ms has no effect unless short_request_first_config.enabled is True.
- ShortRequestFirst does not support batch-job-aware, profiling-chunk, or PD-disaggregated D-node scheduling.
tuning_advice:
  summary: Start at 0 to establish a strict short-first baseline, measure long-request wait distribution, then set long_max_wait_ms
    inside [W_normal, W_slo] to bound long-request starvation.
  suggested_values:
  - scenario: Baseline measurement / short-request TTFT is the only priority
    value: 0
    reason: Disables long-request promotion and keeps strict short-first priority, giving the best short-request TTFT; use
      this to measure the long-request wait distribution.
  - scenario: Balanced production serving where long-request tail latency matters
    value: P90-P95 of long-request wait under the 0 baseline
    reason: Setting long_max_wait_ms near W_normal bounds long-request queueing delay while preserving most short-first benefit.
  - scenario: Short-request TTFT is critical but long requests must not starve
    value: value biased toward W_slo (max tolerable extra queueing delay)
    reason: Biasing toward W_slo keeps short requests prioritized longer while still guaranteeing long requests eventually
      get promoted.
  caveats:
  - Only takes effect when short_request_first_config.enabled is True.
  - Not a throughput knob — do not raise it expecting higher tokens/sec; it shapes latency fairness.
  - Not supported on PD-disaggregated D-node scheduling or batch-job-aware scheduling.
  quick_guide: Leave at 0 for strict short-first; set to the P90-P95 long-request wait time to prevent long-request starvation.
analysis_date: '2026-10-27'
