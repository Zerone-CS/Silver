cli_example: --max-num-scheduled-tokens <value>
deprecated: false
performance_impact: high
performance_scope:
- latency
- throughput
- memory
impact_detail: "This parameter caps the number of tokens the scheduler may issue in a single\niteration (token_budget). In\
  \ vLLM upstream, SchedulerConfig.max_num_scheduled_tokens\ndefaults to None and is resolved in VllmConfig._set_max_num_scheduled_tokens()\n\
  (vllm/config/vllm.py:2112) to max_num_batched_tokens, or reduced by the speculative\ndecoding draft-slot delta (max_num_new_slots_for_drafting).\
  \ The v1 scheduler\n(vllm/v1/core/sched/scheduler.py:125) reads it as self.max_num_scheduled_tokens and\nuses it as the\
  \ per-step token budget; it also bounds chunked-prefill chunk sizing\n(scheduler.py:473).\n\nOn Ascend, vllm-ascend does\
  \ NOT override the value but re-implements the scheduler\nloop in several patched schedulers that all consume self.max_num_scheduled_tokens\n\
  directly as token_budget:\n  - \"vllm_ascend/patch/platform/patch_balance_schedule.py:185 (DP prefill-balancing\"\n    scheduler)\
  \ sets token_budget = self.max_num_scheduled_tokens and asserts\n    total_num_scheduled_tokens <= self.max_num_scheduled_tokens\
  \ at line 724.\n  - \"vllm_ascend/core/dyntra_lb_scheduler.py:446/1057 (dynamic load-balancing\"\n    scheduler) does the\
  \ same.\n  - \"vllm_ascend/core/batch_job_aware_scheduler.py:265 uses it to predict per-round\"\n    token demand for KV\
  \ block reservation.\nSo on Ascend this parameter directly controls the per-iteration batch token count,\nwhich drives NPU\
  \ compute utilization, KV-cache block allocation pressure, and\nprefill/decode interleaving.\n\nIt also feeds the model\
  \ runner's batch-execution decision. In\nvllm_ascend/worker/model_runner_v1.py:2356 the runner computes\nmax_num_scheduled_tokens\
  \ = max(num_scheduled_tokens_np) and passes it into\n_determine_batch_execution_and_padding (line 2387). On the 310P path\n\
  (vllm_ascend/_310p/model_runner_310p.py:175) the uniform-decode / spec-decode graph\nreplay decision compares max_num_scheduled_tokens\
  \ against uniform_decode_query_len;\nif they mismatch, force_eager=True and the ACL graph is bypassed, hurting decode\n\
  latency. Thus the value interacts with graph capture and speculative decoding.\n\nLarger values raise throughput (more tokens\
  \ per NPU step, better compute saturation)\nbut increase per-step memory (activation/KV block demand) and can raise first-token\n\
  latency for other requests; smaller values reduce memory pressure and improve\ninter-request fairness/latency at the cost\
  \ of throughput.\n"
