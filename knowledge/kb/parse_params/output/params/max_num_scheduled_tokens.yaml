related_parameters:
- name: --max-num-batched-tokens
  relation: default source; max_num_scheduled_tokens defaults to this value when unset
- name: --max-num-seqs
  relation: together bound per-step batch size (tokens x seqs)
- name: --long-prefill-token-threshold
  relation: further caps chunked-prefill chunk size (min of the two)
- name: --speculative-config
  relation: spec decoding reduces effective scheduled tokens via max_num_new_slots_for_drafting; also affects uniform-decode
    graph gating
- name: --enable-chunked-prefill
  relation: chunk size is bounded by max_num_scheduled_tokens
constraints:
- The value must be >= 0; a negative value is rejected by the field validator (ge=0).
- When speculative decoding is enabled, the resolved value must be > 0 or a ValueError is raised telling you to increase max_num_batched_tokens
  or decrease draft token slots.
- The scheduler asserts that total scheduled tokens never exceed max_num_scheduled_tokens; setting it below what a single
  request needs will stall or error.
- If unset, it is automatically set equal to max_num_batched_tokens (minus spec-decode draft slots), so it cannot exceed the
  worker's configured batch capacity.
tuning_advice:
  summary: Leave it equal to max_num_batched_tokens for max throughput; lower it only to reduce memory pressure or improve
    inter-request latency, and keep it aligned with uniform_decode_query_len when using spec decode on 310P.
  suggested_values:
  - scenario: Throughput-oriented serving on Atlas 800/A2/A3 with ample HBM
    value: <equal to max_num_batched_tokens>
    reason: Default resolution fills each NPU step to batch capacity, maximizing compute saturation and tokens/sec.
  - scenario: Memory-constrained NPU or long-context prefill causing OOM/preemption
    value: <smaller than max_num_batched_tokens, e.g. 0.5x>
    reason: Reduces per-step activation and KV block demand, avoiding preemption at some throughput cost.
  - scenario: Latency-sensitive / many short requests
    value: <moderate value, e.g. 2048-4096>
    reason: Smaller token budget improves fairness and reduces head-of-line latency for concurrent requests.
  - scenario: Speculative decoding on 310P
    value: <aligned with uniform_decode_query_len>
    reason: Matching uniform_decode_query_len keeps the uniform-decode path eligible for ACL graph replay instead of forcing
      eager mode.
  caveats:
  - Do not set below the largest single-request chunk you expect; the scheduler asserts total scheduled tokens <= this value.
  - On Ascend the patched balance/dyntra schedulers use it as the hard token budget, so changes take effect immediately per
    step.
  - Verify graph replay is not being disabled on 310P by checking that decode batches stay uniform.
  quick_guide: Keep it equal to --max-num-batched-tokens unless you need to cut memory or latency; never set it below a single
    request's chunk.
analysis_date: '2026-10-27'
