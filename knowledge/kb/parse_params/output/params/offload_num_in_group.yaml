related_parameters:
- name: --offload-group-size
  relation: offload_num_in_group must be <= offload_group_size; group_size=0 disables prefetch offloading entirely
- name: --offload-prefetch-step
  relation: Companion knob controlling how many layers ahead to prefetch; together they determine whether H2D latency is hidden
- name: --offload-params
  relation: Restricts which parameter segments are offloaded; if empty all params of offloaded layers are offloaded, changing
    effective transfer volume
- name: --offload-backend
  relation: Must be 'prefetch' (or auto with offload_group_size>0) for this parameter to have any effect
- name: --cpu-offload-gb
  relation: Alternative UVA offload backend; mutually exclusive in effect with prefetch offloading
constraints:
- offload_num_in_group must be >= 1.
- offload_num_in_group must be <= offload_group_size, otherwise OffloadConfig validation raises a ValueError.
- This parameter has no effect unless prefetch offloading is active (offload_backend='prefetch' or offload_group_size > 0).
- When prefetch offloading is enabled, offload_prefetch_step must be >= 1.
tuning_advice:
  summary: Use prefetch offloading only when weights exceed NPU HBM; keep offload_num_in_group small (1-2) and pair with a
    prefetch_step large enough to hide H2D latency.
  suggested_values:
  - scenario: Model slightly exceeds NPU HBM, want minimal transfer overhead
    value: 1
    reason: Default; offloads only the last layer of each group, minimizing H2D traffic while freeing some memory.
  - scenario: Model significantly exceeds NPU HBM, need to free more memory and can tolerate transfer cost
    value: 2
    reason: Ascend e2e test uses group_size=8, num_in_group=2 with selective MLP offload; offloads more weight bytes per group
      to fit larger models.
  - scenario: Selective offload of only large MLP weights (offload_params set)
    value: 2
    reason: Restricting offload_params to gate_up_proj/down_proj limits transfer volume, allowing a higher num_in_group without
      saturating H2D bandwidth.
  caveats:
  - Always keep offload_num_in_group <= offload_group_size to avoid a startup ValueError.
  - Raise offload_prefetch_step together with offload_num_in_group so async prefetch can hide the larger H2D transfer.
  - Benchmark both eager and graph modes on Ascend; the e2e test validates accuracy under both, but throughput impact differs.
  quick_guide: Set offload_group_size>0 and offload_num_in_group=1-2 only when weights don't fit in NPU HBM; increase prefetch_step
    to hide transfer latency.
analysis_date: '2026-10-27'
