name: --offload-num-in-group
type: cli
category: memory
scope: both
source_file:
- vllm/config/offload.py:62
- vllm/engine/arg_utils.py:1349
- vllm/engine/arg_utils.py:551
- vllm/model_executor/offloader/base.py:166
- vllm_ascend/model_executor/offloader/base.py:23
value_type: int
default: 1
valid_choices: integer >= 1, and must be <= offload_group_size
cli_example: --offload-num-in-group 2
deprecated: false
performance_impact: medium
performance_scope:
- memory
- latency
- throughput
impact_detail: 'This parameter controls how many layers (the last N of each group of

  offload_group_size layers) are offloaded from NPU/GPU memory to CPU and

  asynchronously prefetched back during the forward pass. It only takes effect

  when the prefetch offload backend is active (offload_backend="prefetch" or

  offload_group_size > 0).


  Upstream path: "vllm/config/offload.py defines offload_num_in_group (default 1,"

  ge=1) and validates it against offload_group_size. vllm/model_executor/offloader/base.py

  create_offloader() passes num_in_group into PrefetchOffloader, which uses it to

  determine how many layers per group are held on CPU and streamed back via async

  H2D copies. Larger num_in_group offloads more weight bytes to CPU, freeing NPU

  HBM (memory benefit) but increasing H2D transfer volume per forward pass and

  the risk of prefetch not fully hiding latency (latency/throughput cost).


  Ascend path: "vllm_ascend/model_executor/offloader/base.py create_offloader()"

  reads prefetch.offload_num_in_group and constructs AscendPrefetchOffloader with

  num_in_group, prefetch_step, offload_params, mode="cpu". So vllm-ascend does NOT

  override the value or its default — it faithfully forwards the upstream config

  into an Ascend-aware offloader. The Ascend-specific mechanism is that the H2D

  prefetch copies move weights from host memory to NPU HBM (over PCIe/HCCS),

  and the async prefetch is intended to overlap these transfers with NPU compute.

  The e2e test (tests/e2e/pull_request/one_card/test_cpu_weight_offload.py) uses

  offload_group_size=8, offload_num_in_group=2 with offload_params={"gate_up_proj",

  "down_proj"} to verify accuracy under both eager and graph modes, confirming the

  parameter is functional on Ascend.


  Net effect: "this is a memory-vs-latency tradeoff knob. It does not change"

  compute kernels; it changes how much weight data lives on CPU and how much

  transfer bandwidth is consumed per step.

  '
