value_type: dict
default: null
valid_choices: JSON object matching ECTransferConfig schema (ec_role, ec_connector, ec_connector_module_path, ec_connector_extra_config,
  etc.)
cli_example: '--ec-transfer-config ''{"ec_role": "ec_producer", "ec_connector": "ECMemcacheConnector", "ec_connector_extra_config":
  {"recv_buffer_tokens": 1024}}'''
deprecated: false
performance_impact: medium
performance_scope:
- latency
- throughput
- memory
impact_detail: "--ec-transfer-config enables distributed encoder-cache (EC) transfer, i.e. sharing\nmultimodal encoder outputs\
  \ (embeddings) across instances/processes instead of\nrecomputing them. When set (non-None), vLLM instantiates an EC connector:\n\
  - \"vllm/v1/core/sched/scheduler.py:180 creates an ECConnectorFactory connector in the\"\n  SCHEDULER role, adding per-step\
  \ metadata handling to the scheduling loop.\n- \"vllm/v1/engine/core.py:219 sets is_ec_consumer, which gates whether the\
  \ engine runs\"\n  the sampler (a producer-only instance skips sampling work).\n- \"vllm/distributed/ec_transfer/ec_connector/base.py:87\
  \ reads is_ec_producer/is_ec_consumer\"\n  to decide transfer direction.\nOn Ascend, vllm_ascend/distributed/ec_transfer/ec_memcache_connector.py:57\
  \ reads\nec_transfer_config.get_from_extra_config(\"recv_buffer_tokens\", DEFAULT_RECV_BUFFER_TOKENS)\nto size the receive\
  \ buffer used by the ECMemcacheConnector. This buffer size directly\naffects memory footprint and the amount of encoder-cache\
  \ data that can be received per\nstep: \"too small throttles transfer throughput (more round-trips / stalls), too large\"\
  \nwastes NPU/host memory. The connector also adds cross-instance communication overhead\n(latency) that is only worthwhile\
  \ when encoder outputs are reused across requests.\nThe config is also folded into the VllmConfig hash (vllm/config/vllm.py:557),\
  \ so\nchanging it invalidates cached compilation artifacts.\n"
usage_locations:
