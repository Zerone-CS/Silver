related_parameters:
- name: --kv-transfer-config
  relation: Sibling distributed-transfer config; EC transfer shares connector infrastructure and is often deployed alongside
    KV transfer
- name: --ec-manager-config
  relation: Companion config controlling the encoder cache manager behavior
- name: --max-num-batched-tokens
  relation: Upper bound for ec_connector_extra_config.recv_buffer_tokens on Ascend
- name: --instance-id
  relation: Used to build the EC shared region engine_id (instance_id + dp rank)
constraints:
- On Ascend, ec_connector_extra_config.recv_buffer_tokens must be an integer (booleans are rejected).
- On Ascend, ec_connector_extra_config.recv_buffer_tokens must be between MIN_RECV_BUFFER_TOKENS and scheduler_config.max_num_batched_tokens.
- The ECMemcacheConnector requires ec_transfer_config to be set, otherwise it raises ValueError.
- When using the CPU EC connector, ec_connector_extra_config.ec_cpu_bytes must be specified or a ValueError is raised.
- With the legacy Ray executor and world_size > 1, setting ec_transfer_config raises NotImplementedError; use VLLM_USE_RAY_V2_EXECUTOR_BACKEND=1
  or the multiprocessing executor.
tuning_advice:
  summary: Enable EC transfer only for multimodal workloads with encoder-output reuse; on Ascend size recv_buffer_tokens to
    the expected per-step encoder-cache volume within max_num_batched_tokens.
  suggested_values:
  - scenario: Multimodal serving with repeated images/encoder outputs across instances
    value: '{"ec_role": "ec_producer", "ec_connector": "ECMemcacheConnector", "ec_connector_extra_config": {"recv_buffer_tokens":
      1024}}'
    reason: Enables encoder-cache sharing; recv_buffer_tokens sized to a moderate per-step volume to balance memory and transfer
      throughput.
  - scenario: High-throughput consumer instance with large batches
    value: '{"ec_role": "ec_consumer", "ec_connector": "ECMemcacheConnector", "ec_connector_extra_config": {"recv_buffer_tokens":
      4096}}'
    reason: Larger receive buffer reduces transfer round-trips; must stay <= max_num_batched_tokens.
  - scenario: Text-only or no encoder reuse
    value: unset
    reason: Leave unset to avoid EC connector overhead and extra communication latency.
  caveats:
  - recv_buffer_tokens must not exceed max_num_batched_tokens on Ascend or startup fails.
  - Legacy Ray executor with world_size > 1 is unsupported; use RayExecutorV2 or multiprocessing.
  - CPU EC connector requires ec_cpu_bytes in ec_connector_extra_config.
  quick_guide: Set --ec-transfer-config only for multimodal encoder-cache reuse; on Ascend tune recv_buffer_tokens within
    [MIN_RECV_BUFFER_TOKENS, max_num_batched_tokens].
analysis_date: '2026-10-27'
