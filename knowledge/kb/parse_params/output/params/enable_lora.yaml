related_parameters:
- name: --max-loras
  relation: Number of adapter slots preallocated in NPU memory; only meaningful when --enable-lora is set
- name: --max-lora-rank
  relation: Upper bound on adapter rank; determines per-slot tensor size and thus memory cost
- name: --max-cpu-loras
  relation: Size of CPU-side LoRA cache; only used when --enable-lora is set
- name: --fully-sharded-loras
  relation: Shards LoRA computation across TP ranks; only relevant with --enable-lora
- name: --lora-modules
  relation: Adapters loaded at startup; requires --enable-lora to take effect
- name: compilation_config.cudagraph_specialize_lora
  relation: Creates separate graphs for LoRA-active/inactive batches; no effect when --enable-lora is False
- name: --speculative-config
  relation: Combining with LoRA requires larger max_num_batched_tokens or raises ValueError
constraints:
- When --enable-lora is combined with speculative decoding, max_num_batched_tokens must be at least max_num_seqs * (num_speculative_tokens
  + 1), otherwise engine startup raises ValueError.
- Saving sharded state is not supported with --enable-lora=True (raises ValueError in save_sharded_state_offline example).
- Adapters registered via --lora-modules are only loaded when --enable-lora is set.
- compilation_config.cudagraph_specialize_lora has no effect when --enable-lora is False.
tuning_advice:
  summary: Enable --enable-lora only when serving adapters; keep --max-loras and --max-lora-rank as small as possible to preserve
    NPU HBM for KV cache.
  suggested_values:
  - scenario: Serving a single adapter per batch on Ascend NPU
    value: true
    reason: Set --enable-lora with --max-loras 1 and the smallest --max-lora-rank that fits the adapter (e.g. 8 or 16) to
      minimize preallocated adapter memory and leave HBM for KV cache.
  - scenario: Multi-adapter serving with TP
    value: true
    reason: Use --max-loras equal to the number of concurrently active adapters and consider --fully-sharded-loras to distribute
      LoRA compute across tensor-parallel ranks on Ascend.
  - scenario: Base-model-only deployment (no adapters)
    value: false
    reason: Leaving --enable-lora off skips LoRA slot allocation, LoRA-wrapped kernels, and LoRA graph specialization, maximizing
      KV cache and throughput.
  caveats:
  - Each active LoRA slot (--max-loras) preallocates NPU HBM sized by --max-lora-rank, directly reducing KV cache capacity
    and throughput under memory pressure.
  - LoRA-wrapped linear layers add per-token matmul/scaling ops on Ascend, increasing decode latency versus the plain dense
    path.
  - On Ascend, LoRA with ACL graph capture (e.g. cudagraph_mode FULL_DECODE_ONLY) requires explicit cudagraph_capture_sizes
    and increases startup time; cudagraph_specialize_lora adds separate graphs for LoRA-active vs inactive batches.
  - Combining LoRA with speculative decoding forces a larger max_num_batched_tokens, increasing memory footprint.
  - Dynamic adapter loading/unloading after startup additionally requires VLLM_ALLOW_RUNTIME_LORA_UPDATING=True.
  quick_guide: Enable --enable-lora only when serving adapters, and keep --max-loras/--max-lora-rank minimal to protect KV
    cache on Ascend NPU.
