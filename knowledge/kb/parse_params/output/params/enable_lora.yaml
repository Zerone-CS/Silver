name: --enable-lora
type: cli
category: model
scope: both
source_file:
- vllm/engine/arg_utils.py:1480
- vllm/engine/arg_utils.py:629
- vllm/engine/arg_utils.py:2474
- vllm/config/compilation.py:673
value_type: bool
default: false
valid_choices:
- true
- false
cli_example: --enable-lora
deprecated: false
performance_impact: medium
performance_scope:
- throughput
- memory
- latency
impact_detail: "--enable-lora is a master switch. In vllm/engine/arg_utils.py:2474, when enable_lora is True a\nLoRAConfig\
  \ object is constructed and attached to the engine config; when False, lora_config is\nNone and the entire LoRA code path\
  \ (LoRA manager, adapter slot allocation, LoRA-wrapped linear\nlayers, LoRA-aware CUDA/NPU graph capture) is skipped. Enabling\
  \ it therefore has direct runtime\ncost on Ascend NPU:\n1. Memory: each active LoRA slot (--max-loras) preallocates adapter\
  \ tensors sized by\n   --max-lora-rank, consuming NPU HBM that would otherwise go to KV cache, reducing the number\n   of\
  \ cacheable blocks and thus throughput under memory pressure.\n2. Latency/throughput: LoRA-wrapped linear layers add extra\
  \ matmul + scaling ops per token\n   (punica/bgmv-style kernels on Ascend), so per-token compute is higher than the base\
  \ model.\n3. Graph capture: vllm/config/compilation.py:667-673 shows cudagraph_specialize_lora creates\n   separate graphs\
  \ for LoRA-active vs LoRA-inactive batches; when enable_lora is False this\n   option has no effect. On Ascend, ACL graph\
  \ capture with LoRA requires additional capture\n   sizes and startup time (see test_lora_310p.py using cudagraph_mode FULL_DECODE_ONLY\
  \ with\n   capture sizes [1,2,4]).\n4. Speculative decoding interaction: arg_utils.py:2478-2490 raises if max_num_batched_tokens\
  \ is\n   too small relative to max_num_seqs * (num_speculative_tokens + 1) when LoRA + spec decode\n   are combined, forcing\
  \ larger batches and more memory.\nWhen enable_lora is False, none of these costs apply and the engine runs the plain dense\
  \ path.\n"
