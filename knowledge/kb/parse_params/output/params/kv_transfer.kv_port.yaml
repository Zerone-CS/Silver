related_parameters:
- name: kv_transfer_config.kv_connector
  relation: Selects which connector (MooncakeConnectorV2, MooncakeLayerwiseConnector, SFA PD RD2H, etc.) consumes kv_port;
    each connector uses a different port-offset formula.
- name: kv_transfer_config.kv_role
  relation: Producer (prefill) and consumer (decode) nodes must use non-overlapping kv_port ranges when co-located on one
    host.
- name: tensor_parallel_size
  relation: Multiplies the reserved port window (kv_port + dp_rank*tp_size*...); larger TP needs a larger free port block.
- name: data_parallel_size / data_parallel_rank
  relation: Each DP rank gets a disjoint sub-range starting at kv_port + dp_rank*tp_size*pp_size*pcp_size.
- name: pipeline_parallel_size
  relation: Included in the port window size for MooncakeConnectorV2 and base worker/scheduler.
- name: prefill_context_parallel_size
  relation: Included in the port window size; layerwise connector asserts pcp_size == 1 on decoder nodes.
constraints:
- The derived handshake ports (kv_port plus rank offsets) must all fall within the valid TCP port range 1-65535; a large tp_size*dp_size*pp_size*pcp_size
  window can overflow past 65535.
- Prefill and decode nodes co-located on the same host must use non-overlapping kv_port ranges so their derived handshake
  ports do not collide.
- The scheduler control port is placed at kv_port + max_device_id + data_parallel_rank, so the reserved worker range [kv_port,
  kv_port + max_device_id) must not overlap another engine's range.
- Mooncake Hybrid Connector requires decode_context_parallel_size == 1 (asserted in mooncake_hybrid_connector.py).
- Mooncake Layerwise Connector requires prefill_context_parallel_size == 1 on decoder (kv_consumer) nodes.
tuning_advice:
  summary: Pick a kv_port whose derived range (kv_port + tp_size*dp_size*pp_size*pcp_size) is free on every host and does
    not overlap the peer role's range; this is a correctness/availability setting, not a throughput knob.
  suggested_values:
  - scenario: Single-host P/D disaggregation with MooncakeConnectorV2 (prefill and decode on same host)
    value: 37000
    reason: Docs example uses kv_port 37000 for prefill and 37010 for decode; separated base ports keep the derived handshake
      ranges disjoint on one host.
  - scenario: Decode node co-located with prefill node
    value: 37010
    reason: Docs example assigns decode a distinct base port (37010) so its derived range does not collide with the prefill
      node's range.
  - scenario: Large TP/DP/PP topology needing a wide port window
    value: 20000
    reason: Choose a low base so kv_port + tp_size*dp_size*pp_size*pcp_size stays below 65535; verify the full window is free
      with ss/netstat before launch.
  - scenario: Layerwise connector on decode nodes
    value: 37000
    reason: Layerwise reserves decode_data_parallel_size * decode_tensor_parallel_size consecutive ports from kv_port; a modest
      base with a small window suffices.
  caveats:
  - Always verify the full reserved range (not just kv_port) is free on the host; a single occupied port in the window breaks
    the handshake.
  - When running multiple DP engines or multiple P/D roles on one host, allocate each a disjoint base port block sized to
    its parallel topology.
  - If P/D handshake times out, first compare the connector topology, prefill pp_size, and the available kv_port range before
    suspecting network issues.
  quick_guide: Set kv_port to a free base such that kv_port + tp_size*dp_size*pp_size*pcp_size is unoccupied and disjoint
    from the peer role's range.
