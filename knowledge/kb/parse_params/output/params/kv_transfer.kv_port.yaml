cli_example: null
deprecated: false
performance_impact: medium
performance_scope:
- latency
- throughput
impact_detail: "kv_port is the base TCP port from which every Mooncake-family P/D connector on Ascend\nderives its per-rank\
  \ handshake/control-plane ports. It is not a tuning knob for compute,\nbut it directly gates whether the disaggregated prefill/decode\
  \ (PD) data path can be\nestablished and how many concurrent worker sockets can coexist on a host.\n\nDerivation formulas\
  \ observed in vllm-ascend:\n- \"base_scheduler.py:82 — side_channel_port = kv_port + max_device_id + data_parallel_rank,\"\
  \n  where max_device_id = tp_size * dp_size * pcp_size * pp_size. Worker handshake ports\n  occupy [kv_port, kv_port + dp_size*pp_size*pcp_size*tp_size),\
  \ and the scheduler control\n  port is placed immediately after that range to avoid collision.\n- \"base_worker.py:108-112\
  \ — side_channel_port = kv_port + dp_rank*tp_size*pp_size*pcp_size,\"\n  handshake_port = side_channel_port + device_index\
  \ where\n  device_index = (pp_rank*pcp_size + pcp_rank)*tp_size + tp_rank.\n- \"mooncake_connector.py:1763 and mooncake_hybrid_connector.py:1340\
  \ — same\"\n  kv_port + dp_rank*tp_size*pp_size*pcp_size base.\n- \"mooncake_layerwise_connector.py:877/1232 — kv_port +\
  \ dp_rank*tp_size (scheduler) and\"\n  kv_port + dp_rank*pcp_size*tp_size + pcp_rank*tp_size + tp_rank (worker).\n- \"sfa_pd_rd2h/scheduler.py:261\
  \ — kv_port + data_parallel_rank*tp_size, explicitly using\"\n  the GLOBAL data_parallel_rank so single-host multi-DP engines\
  \ get disjoint ranges.\n\nPerformance mechanism: \"if the derived port range overlaps another process, another DP\"\nengine\
  \ on the same host, or the scheduler control port, socket bind fails and the PD\nhandshake times out — the request stalls\
  \ or the engine fails to start, which manifests\nas a hard latency/throughput cliff (requests hang until timeout). When\
  \ ports are chosen\ncorrectly, kv_port has no steady-state cost; it only determines the size of the reserved\nport window.\
  \ The window size scales with tp_size * dp_size * pp_size * pcp_size, so large\nparallel topologies require a correspondingly\
  \ large contiguous free port block.\n"
