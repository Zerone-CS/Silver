related_parameters:
- name: --worker-cls
  relation: The extension class is dynamically inherited by the worker class selected via --worker-cls; conflicts with existing
    worker attributes raise an assertion
- name: --distributed-executor-backend
  relation: collective_rpc (the primary consumer of extension methods) requires a distributed executor such as mp or ray
- name: --sd-worker-cls
  relation: Speculative-decoding worker class; extension is applied to the main worker class, not the SD worker
constraints:
- The value must be a fully-qualified dotted Python class path resolvable by resolve_obj_by_qualname on the worker process;
  otherwise worker construction fails.
- The extension class must not define any non-dunder attribute that already exists on the worker class, or an assertion error
  is raised during worker initialization.
- Passing a class object directly instead of a string is not supported for worker_cls; the extension mechanism likewise expects
  a string qualname.
tuning_advice:
  summary: Leave empty for production; only set it to inject diagnostic/probe methods for testing on Ascend.
  suggested_values:
  - scenario: Production inference on Ascend NPU
    value: unset
    reason: No extension needed; avoids any startup class-mutation and keeps the worker class clean.
  - scenario: Ascend e2e/debugging where you need to call custom methods via collective_rpc (e.g. alignment or flash-path
      probes)
    value: my_module.MyWorkerExtension
    reason: Injects the probe methods onto the Ascend worker class so collective_rpc can invoke them, matching the pattern
      in the Ascend e2e tests.
  caveats:
  - Ensure the extension class name does not collide with any existing worker attribute, or worker init asserts.
  - The module containing the extension class must be importable on every worker process (including spawned mp workers).
  - Do not use this to add per-step logic; injected methods run only when explicitly invoked via collective_rpc.
  quick_guide: Keep --worker-extension-cls empty in production; use it only to inject test/probe methods callable via collective_rpc.
analysis_date: '2026-10-27'
