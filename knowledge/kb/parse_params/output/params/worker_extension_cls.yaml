name: --worker-extension-cls
type: cli
category: parallelism
scope: both
source_file:
- vllm/config/parallel.py:276
- vllm/engine/arg_utils.py:1253
- vllm/engine/arg_utils.py:710
- vllm/engine/arg_utils.py:2383
- vllm/v1/worker/worker_base.py:285
- tests/e2e/pull_request/four_card/model_runner_v2/test_qwen38_pp_mtp_prefix_cache.py:91
- tests/e2e/pull_request/four_card/test_glm5_3_flash.py:128
value_type: str
default: ''
valid_choices: Any fully-qualified Python class name (dotted path) resolvable at worker import time; empty string disables
  the extension
cli_example: --worker-extension-cls my_module.MyWorkerExtension
deprecated: false
performance_impact: low
performance_scope:
- latency
- throughput
impact_detail: 'This parameter does not change any kernel, scheduling, or memory-allocation behavior by

  itself. In vLLM upstream (vllm/v1/worker/worker_base.py:285), when worker_extension_cls is

  non-empty, the worker class is dynamically extended at construction time: the extension

  class is resolved via resolve_obj_by_qualname, its attributes are checked for conflicts

  against the worker class (assert not hasattr(worker_class, attr)), and then it is appended

  to worker_class.__bases__ (worker_class.__bases__ = worker_class.__bases__ + (worker_extension_cls,)).

  This is a one-time class-mutation cost at worker startup, not a per-token cost. The

  extension''s methods are then reachable through collective_rpc calls (as seen in the Ascend

  e2e tests, e.g. runner.model.collective_rpc("install_align_probe") and

  collective_rpc("check_flash_paths")). Any performance effect is therefore indirect: it

  depends entirely on what the injected methods do (e.g. extra probes, alignment checks,

  flash-path validation). On Ascend, vllm-ascend does not override or reinterpret this

  parameter — it is passed through ParallelConfig unchanged (vllm/engine/arg_utils.py:2383)

  and the same dynamic-inheritance mechanism applies to the Ascend worker class. The

  parameter is primarily a testing/debugging hook (all Ascend usage sites are e2e tests

  injecting probe workers), so its runtime performance impact on production inference is

  negligible.

  '
usage_locations:
