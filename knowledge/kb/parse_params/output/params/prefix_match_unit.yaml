related_parameters:
- name: --enable-prefix-caching
  relation: prefix_match_unit only has effect when prefix caching (or a KV connector) is active
- name: --block-size
  relation: prefix_match_unit must divide every prefix-cacheable KV cache group's block size
- name: --decode-context-parallel-size
  relation: AscendStore multiplies prefix_match_unit by dcp_size to derive hash_block_size
- name: --mamba-cache-mode
  relation: Fine-grained partial hits require mamba groups in 'align' mode; otherwise hashing backs off to scheduler block
    size
- name: --speculative-config
  relation: EAGLE block drop and DSpark prefix identity interact with prefix_match_unit
constraints:
- prefix_match_unit must be a positive integer (Field gt=0).
- Every prefix-cacheable KV cache group's block size must be divisible by prefix_match_unit, otherwise vLLM raises a ValueError.
- In AscendStore, block_size * dcp_size must be divisible by prefix_match_unit * dcp_size (assert 'block_size must be divisible
  by hash_block_size').
- Fine-grained partial hits only take effect when prefix caching or a KV connector is enabled; otherwise hash_block_size equals
  the scheduler block size.
- On hybrid mamba models, partial hash hits require mamba groups in 'align' cache mode; otherwise hashing backs off to the
  scheduler block size.
tuning_advice:
  summary: Enable fine-grained prefix matching (e.g. --prefix-match-unit 16) for workloads with long shared prefixes to reuse
    partial physical pages, keeping the unit a divisor of every KV cache group block size.
  suggested_values:
  - scenario: Long shared prefixes (RAG, multi-turn chat, few-shot) on Qwen3.5/Qwen3.6 hybrid models
    value: 16
    reason: Docs recommend --enable-prefix-caching --prefix-match-unit 16 to reuse more of a partial physical page; 16 divides
      typical block sizes.
  - scenario: Default / no fine-grained matching needed
    value: unset
    reason: Leaving it unset falls back to the GCD of prefix-cacheable group block sizes, avoiding extra hash metadata and
      prefill splits.
  - scenario: AscendStore KV pool with DCP enabled
    value: 16
    reason: hash_block_size = prefix_match_unit * dcp_size; ensure block_size * dcp_size is divisible by it to satisfy the
      AscendStore assert.
  caveats:
  - Verify prefix_match_unit divides every KV cache group block size before enabling, or startup raises ValueError / assert.
  - Weigh the extra hash metadata, copy-on-write, and prefill split cost against the prefill tokens saved.
  - On hybrid mamba-align models with EAGLE, confirm output consistency (see test_hybrid_prefix_match_unit_cached_output_consistency).
  quick_guide: Use --enable-prefix-caching --prefix-match-unit 16 for long shared prefixes; leave unset otherwise.
analysis_date: '2026-10-27'
