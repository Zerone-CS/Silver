name: --prefix-match-unit
type: cli
category: kv_cache
scope: both
source_file:
- vllm/config/cache.py:91
- vllm/engine/arg_utils.py:739
- vllm/engine/arg_utils.py:1309
- vllm/engine/arg_utils.py:2114
