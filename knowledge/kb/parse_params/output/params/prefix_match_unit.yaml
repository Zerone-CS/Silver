- vllm_ascend/distributed/kv_transfer/kv_pool/ascend_store/dspark_prefix_cache.py:68
- vllm_ascend/patch/platform/patch_kv_cache_coordinator.py:50
value_type: int
default: null
valid_choices: Any positive integer (gt=0); must divide every prefix-cacheable KV cache group's block size
cli_example: --prefix-match-unit 16
deprecated: false
performance_impact: medium
performance_scope:
- latency
- throughput
- memory
impact_detail: 'prefix_match_unit sets the finest token boundary at which a prefix-cache hit can land.

  In upstream vLLM (vllm/config/cache.py:91) it is an optional int (gt=0) that equals the

  `hash_block_size` used throughout the KV cache code. In vllm/v1/core/kv_cache_utils.py:773

  `resolve_kv_cache_block_sizes` uses it as the hash_block_size override; when None it falls

  back to the GCD of prefix-cacheable group block sizes. A finer unit lets a request reuse a

  partial physical KV block, reducing recomputed prefill tokens (lower TTFT / higher prefix-hit

  throughput) at the cost of more hash metadata, copy-on-write operations, and an extra prefill

  split at the final matching boundary (see vllm/v1/core/sched/scheduler.py:358, where a finer

  unit enables `mamba_partial_cache_hit` and adds a stop at the prompt''s last hash boundary).

  On Ascend, vllm-ascend reads `cache_config.prefix_match_unit` directly in the AscendStore

  KV pool: "pool_scheduler.py:136 and pool_worker.py:256 compute `hash_block_size ="

  (prefix_match_unit or min(cacheable_block_sizes)) * dcp_size`, then assert every group''s

  block size is divisible by it. This hash_block_size drives the block-hash keys used for

  prefix lookups and KV transfer, so it directly affects how many tokens can be served from

  cache (throughput/latency) and the size of the hash metadata (memory). dspark_prefix_cache.py:68

  folds prefix_match_unit into the DSpark prefix-cache identity digest, so changing it

  invalidates previously stored DSpark prefix entries. patch_kv_cache_coordinator.py:50 notes

  that on hybrid mamba-align models a fine prefix_match_unit can interact with the EAGLE

  last-block drop, which is why the drop is suppressed for standalone/producer instances.

  Net effect on Ascend: "medium — it does not change the compiled graph (excluded from the"

  cache config hash factors at cache.py:270) but materially changes prefix-hit length,

  prefill recompute, and hash metadata footprint.

  '
