name: --long-prefill-token-threshold
type: cli
category: scheduling
scope: both
source_file:
- vllm/config/scheduler.py:70
- vllm/engine/arg_utils.py:558
- vllm/engine/arg_utils.py:1609
- vllm/v1/core/sched/scheduler.py:474
- vllm/v1/core/sched/scheduler.py:661
- vllm_ascend/patch/platform/patch_balance_schedule.py:243
- vllm_ascend/patch/platform/patch_balance_schedule.py:550
- vllm_ascend/core/dyntra_lb_scheduler.py:506
- vllm_ascend/core/dyntra_lb_scheduler.py:866
- vllm_ascend/core/recompute_scheduler.py:281
- vllm_ascend/core/recompute_scheduler.py:664
- vllm_ascend/core/scheduler_profiling_chunk.py:369
- vllm_ascend/core/scheduler_profiling_chunk.py:844
value_type: int
default: 0
valid_choices: integer >= 0; 0 disables the cap
cli_example: --long-prefill-token-threshold 2048
deprecated: false
performance_impact: medium
performance_scope:
- latency
- throughput
impact_detail: 'This parameter caps the number of new tokens scheduled for a single prefill

  request per scheduler step. In upstream vLLM v1 (vllm/v1/core/sched/scheduler.py:661)

  the logic is: "if 0 < long_prefill_token_threshold < num_new_tokens, then"

  num_new_tokens is clamped to the threshold before being further clamped by

  token_budget. It also feeds the Mamba block-aligned split path

  (scheduler.py:474-476) where it bounds max_prefill_tokens used to decide

  chunk-end alignment.


  vllm-ascend does NOT override the default (still 0) but re-implements the same

  clamp in every Ascend scheduler variant: "patch_balance_schedule.py (DP prefill"

  balancing patch, lines 243 and 550), dyntra_lb_scheduler.py (dynamic load-balance

  scheduler, lines 506 and 866), recompute_scheduler.py (lines 281 and 664), and

  scheduler_profiling_chunk.py (lines 369 and 844). In all of these the identical

  pattern `if 0 < threshold < num_new_tokens: num_new_tokens = threshold` is applied

  before the token_budget clamp.


  Mechanism on Ascend: "chunked prefill splits a long prompt into multiple scheduler"

  steps. A smaller threshold forces more, smaller prefill chunks, which:

  (1) reduces per-step prefill compute and thus per-step latency / TTFT variance,

  (2) increases the number of steps needed to finish a long prompt (more decode

  interleaving opportunities, better fairness for concurrent decodes),

  (3) can lower prefill throughput because each chunk has fixed per-step overhead

  (kernel launch, HCCL all-reduce/all-gather, graph replay setup) that is amortized

  over fewer tokens. On Ascend NPU, per-step overhead is relatively high due to

  CANN kernel dispatch and HCCL collective latency, so very small thresholds can

  noticeably degrade prefill throughput. Conversely, a large threshold (or 0) lets

  a single long prefill monopolize the step, starving decodes and inflating

  inter-token latency for other requests.

  '
