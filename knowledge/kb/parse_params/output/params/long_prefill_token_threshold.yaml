related_parameters:
- name: --max-num-batched-tokens
  relation: Upper bound on total tokens per step; the long-prefill threshold is applied before this clamp, so it must be <=
    max-num-batched-tokens to have any effect.
- name: --enable-chunked-prefill
  relation: The threshold only matters when chunked prefill is active; without chunking a long prompt is scheduled whole or
    rejected.
- name: --max-num-seqs
  relation: Smaller thresholds let more concurrent requests interleave decodes, interacting with max-num-seqs for fairness.
- name: --scheduler-cls
  relation: Ascend custom schedulers (dyntra_lb_scheduler, recompute_scheduler, scheduler_profiling_chunk) each re-implement
    the clamp; behavior depends on which scheduler is selected.
- name: --max-model-len
  relation: The threshold must be small enough that chunked prefill can still cover prompts up to max-model-len within the
    token budget.
constraints:
- The value must be a non-negative integer (Field(ge=0)); negative values are rejected at config validation.
- A value of 0 disables the cap entirely, meaning a long prompt may consume the full token budget in one step.
- For encoder-decoder models the value is forcibly reset to 0 because chunked prefill is disabled for them.
- The threshold only takes effect when it is strictly less than the number of new tokens the request would otherwise schedule;
  values larger than max-num-batched-tokens have no practical effect.
tuning_advice:
  summary: Leave at 0 for max prefill throughput; set a moderate value (e.g. 2048-4096) when long prompts starve concurrent
    decodes and inflate inter-token latency.
  suggested_values:
  - scenario: Offline batch / throughput-oriented prefill-heavy workloads
    value: 0
    reason: Disabling the cap lets each prefill step use the full token budget, amortizing Ascend per-step overhead (CANN
      dispatch, HCCL) over more tokens and maximizing prefill throughput.
  - scenario: Online serving with mixed long-prompt and decode traffic, latency-sensitive
    value: 2048
    reason: Caps long prefill chunks so decodes from other requests can interleave each step, reducing inter-token latency
      and TTFT variance while keeping chunks large enough to amortize Ascend per-step overhead.
  - scenario: Very long prompts (e.g. >32K) with tight decode SLOs
    value: 1024
    reason: Smaller chunks give finer-grained interleaving of decodes; use only if decode latency is the bottleneck, since
      prefill throughput will drop on Ascend due to higher per-step overhead.
  - scenario: DeepSeek-style models with MTP/speculative decoding and chunked prefill
    value: 128
    reason: Matches the vllm-ascend e2e accuracy test configuration (test_accuracy.py uses long_prefill_token_threshold=128
      with chunked prefill and MTP), keeping chunks small enough to preserve spec-decode padding and graph replay.
  caveats:
  - Values below the KV-cache block size (e.g. 128) can cause partial-block prefill chunks and extra block allocations on
    Ascend.
  - The threshold is applied before max-num-batched-tokens clamping, so values >= max-num-batched-tokens are effectively no-ops.
  - Behavior differs across Ascend scheduler variants; verify with the scheduler actually in use (dyntra_lb_scheduler, recompute_scheduler,
    scheduler_profiling_chunk, or the balance-schedule patch).
  - In scheduler_profiling_chunk, a small threshold overrides the dynamic chunk manager's prediction, so avoid combining a
    small threshold with profiling-based chunk sizing.
  quick_guide: Keep 0 for throughput; use 1024-4096 for latency-sensitive mixed workloads on Ascend.
analysis_date: '2026-10-27'
