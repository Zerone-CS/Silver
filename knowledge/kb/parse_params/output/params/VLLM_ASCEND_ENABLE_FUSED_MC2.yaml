related_parameters:
- name: enable_fused_mc2
  relation: additional_config key that replaces this legacy env var; the env var is no longer supported
- name: mega_moe_max_tokens
  relation: Per-rank token capacity for the fused MC2/MegaMoe path; must be tuned to actual expert load to avoid precision
    degradation
- name: combine_quant_mode
  relation: comm_quant_mode passed to npu_moe_distribute_combine_v2 in the fused MC2 path
- name: mc2_comm_alg
  relation: Selects dispatch/combine comm_alg (fullmesh/hierarchy/fullmesh_v2) used by MC2 ops
- name: enable_prefill_mc2
  relation: Reserves mc2_token_capacity for prefill batches in the MC2 path
constraints:
- The legacy VLLM_ASCEND_ENABLE_FUSED_MC2 environment variable is no longer supported; use the additional_config key enable_fused_mc2
  instead.
- Value 2 (CANN MegaMoe) only takes effect when the model and parallel configuration support it.
- On A5, SiTU models require a CANN MegaMoe wrapper exposing activation and activation_params, which are bound from the MoE
  configuration during initialization.
- If a rank's actual MoE load exceeds mega_moe_max_tokens, precision degradation may occur.
tuning_advice:
  summary: 'For MoE models on Ascend NPU, enable the fused MC2 path via additional_config enable_fused_mc2

    (the legacy env var is deprecated) to reduce MoE launch overhead and communication stalls;

    use value 1 for dispatch-FFN-combine and value 2 for CANN MegaMoe when supported.

    '
  suggested_values:
  - scenario: MoE model (e.g. DeepSeek-V4, Qwen3.5/3.6 MoE) on A2/A3 with supported parallel config
    value: 1
    reason: Selects dispatch-FFN-combine fused path, consolidating shared/routed expert computation to cut launch overhead
      and improve MoE throughput.
  - scenario: MoE model on A5 with CANN MegaMoe support and SiTU activation wrapper available
    value: 2
    reason: Selects CANN MegaMoe path for maximum fusion when model and parallel configuration support it.
  - scenario: Dense (non-MoE) model or unsupported parallel config
    value: 0
    reason: Fused MC2 only benefits MoE layers; leave disabled to avoid unnecessary overhead or fallback.
  caveats:
  - Migrate from the env var to additional_config enable_fused_mc2; the env var is no longer supported.
  - Tune mega_moe_max_tokens to actual expert load to avoid precision degradation and excessive device memory use.
  - Verify HCCL_BUFFSIZE is large enough (e2e tests use 1024) for the fused all-to-all communication.
  quick_guide: Set additional_config enable_fused_mc2=1 for MoE models to fuse dispatch-FFN-combine; use 2 for CANN MegaMoe
    on supported hardware.
