impact_detail: 'This environment variable is the legacy switch for the fused MC2 (MegaMoe / dispatch-FFN-combine)

  MoE path in vllm-ascend. Per the docs it maps to the additional_config key `enable_fused_mc2`

  (integer, unchanged type conversion). When enabled, the MoE layer consolidates the all-to-all

  dispatch, expert FFN computation, and combine into fused kernels (dispatch_ffn_combine /

  npu_moe_distribute_combine_v2), reducing kernel launch overhead and inter-rank communication

  stalls for MoE models (e.g. DeepSeek-V4, Qwen3.5/3.6 MoE variants). This directly affects decode

  latency and MoE throughput on Ascend NPU. Value 1 selects the dispatch-FFN-combine path; value 2

  selects the CANN MegaMoe path when the model and parallel configuration support it. The fused path

  interacts with `mega_moe_max_tokens` (per-rank token capacity after dispatch) and `combine_quant_mode`

  (comm_quant_mode for the combine op), both of which tune the fused kernel''s buffer sizing and

  quantization. The e2e tests enable it alongside TP=2, HCCL_BUFFSIZE=1024, and AIV op expansion for

  speculative decoding (eagle3/dspark) workloads, indicating it is exercised in MoE + spec-decode

  scenarios.

  '
