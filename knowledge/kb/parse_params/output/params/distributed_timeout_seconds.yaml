  context: ParallelConfig field definition with docstring describing timeout semantics
- file: vllm/engine/arg_utils.py:481
  context: EngineArgs field mirroring ParallelConfig.distributed_timeout_seconds
- file: vllm/engine/arg_utils.py:1066
  context: CLI argument registration under ParallelConfig argument group
