name: --distributed-timeout-seconds
type: cli
category: communication
scope: vllm
source_file:
- vllm/config/parallel.py:328
- vllm/engine/arg_utils.py:481
- vllm/engine/arg_utils.py:1066
- vllm/v1/worker/gpu_worker.py:1536
value_type: int
default: null
valid_choices: Any positive integer number of seconds; null means PyTorch default (600s for NCCL, 1800s for gloo)
cli_example: --distributed-timeout-seconds 1800
deprecated: false
performance_impact: low
performance_scope:
- latency
impact_detail: 'This parameter only sets the timeout passed to torch.distributed.init_process_group

  (vllm/v1/worker/gpu_worker.py:1535-1546 converts distributed_timeout_seconds into a

  timedelta and forwards it to init_distributed_environment). It does not change any

  compute, memory, or communication algorithm — it only bounds how long collective

  operations (HCCL on Ascend) may block before raising a timeout error. On Ascend the

  backend is HCCL rather than NCCL, but the same timeout plumbing applies through the

  torch.distributed init path. Therefore it has no steady-state throughput or memory

  effect; its only runtime relevance is preventing spurious startup/collective timeouts

  during slow model loading or multi-node bring-up, which otherwise cause a crash and

  full restart (a latency/availability concern, not a throughput one). No vllm-ascend

  override of this parameter was found in the provided context.

  '
usage_locations:
