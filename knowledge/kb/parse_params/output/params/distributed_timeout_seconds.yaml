related_parameters:
- name: --cpu-distributed-timeout-seconds
  relation: Sibling parameter controlling timeout for CPU (gloo) communication groups; default 1800s
- name: --nnodes
  relation: Multi-node setups are the primary reason to increase this timeout
- name: --distributed-executor-backend
  relation: Determines which distributed backend/process group is initialized and thus which default timeout applies
constraints:
- The value must be a positive integer number of seconds; if left unset (null), PyTorch's default timeout is used (600s for
  NCCL, 1800s for gloo).
- This timeout applies to the process group initialization and collective operations; setting it too low will cause collective
  operations to fail with a timeout error on slow or large multi-node deployments.
tuning_advice:
  summary: Leave at default for single-node; raise it for large multi-node Ascend deployments where model loading or HCCL
    init is slow.
  suggested_values:
  - scenario: Single-node multi-NPU (TP within one node)
    value: unset
    reason: Default PyTorch timeout is sufficient; no slow cross-node init to accommodate.
  - scenario: Multi-node Ascend cluster with slow model download or large world size
    value: 1800
    reason: Gives HCCL init and weight loading enough time to complete across nodes without spurious timeout errors.
  - scenario: Very large multi-node deployment with slow shared storage
    value: 3600
    reason: Further headroom for slow checkpoint loading before process group init completes.
  caveats:
  - Raising the timeout delays detection of genuine HCCL hangs; keep it as small as reliably works.
  - Pair with --cpu-distributed-timeout-seconds if CPU/gloo groups also time out.
  quick_guide: Keep default for single-node; set 1800-3600s for slow multi-node Ascend bring-up.
analysis_date: '2026-10-27'
