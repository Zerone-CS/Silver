name: --prefix-cache-retention-interval
type: cli
category: kv_cache
scope: both
source_file:
- vllm/config/cache.py:148
- vllm/engine/arg_utils.py:1290
- vllm/engine/arg_utils.py:542
- vllm/v1/core/kv_cache_coordinator.py:34
- vllm/v1/core/kv_cache_utils.py:1671
- vllm_ascend/patch/platform/patch_kv_cache_coordinator.py:138
- vllm_ascend/patch/platform/patch_kv_cache_utils.py:630
- vllm_ascend/models/deepseek_v41/cache_config.py:273
value_type: int
default: 0
valid_choices: non-negative integer that is a multiple of the scheduler block size, or None (dense retention)
cli_example: --prefix-cache-retention-interval 0
deprecated: false
performance_impact: medium
performance_scope:
- latency
- memory
impact_detail: 'This parameter controls how densely sliding-window and Mamba (linear-attention)

  prefix-cache checkpoints are retained. It only affects KV cache groups whose spec

  is SlidingWindowSpec or MambaSpec (see _validate_prefix_cache_retention_interval in

  vllm/v1/core/kv_cache_coordinator.py:34). Full-attention and chunked-local groups

  always cache densely and ignore it.


  Mechanism: "with value 0 (default) only \"semantic\" checkpoints are retained (latest"

  replay boundary and shared-prefix junctions). Positive values additionally retain

  periodic checkpoints every N tokens, and None retains checkpoints densely. Denser

  retention means more prefix-cache hits on repeated prompts (lower prefill latency,

  higher throughput for prefix-sharing workloads) but consumes more KV cache blocks

  for the retained checkpoints, reducing the number of blocks available for active

  sequences (memory pressure). Sparser retention (0) frees blocks but may miss

  prefix hits, forcing recomputation of sliding-window/Mamba state.


  Ascend specifics: "vllm-ascend does NOT override the value itself but re-plumbs it."

  In vllm_ascend/patch/platform/patch_kv_cache_coordinator.py:138 the coordinator

  reads the interval from envs_vllm.VLLM_PREFIX_CACHE_RETENTION_INTERVAL (not the

  CacheConfig field directly) and re-runs upstream validation

  (_validate_prefix_cache_retention_interval) against the scheduler block size and

  kv_cache_config. In vllm_ascend/patch/platform/patch_kv_cache_utils.py:630 and

  vllm_ascend/models/deepseek_v41/cache_config.py:273 the value is propagated into

  the Ascend-specific KVCacheConfig for DeepSeek-V4.1 / GLM5-Next hybrid layouts.

  So on Ascend the effective value flows through the env var path, and the

  DeepSeek-V4.1 four-slot hybrid cache honors it. The Ascend e2e test

  (tests/e2e/pull_request/four_card/test_kimi_k3.py:393) sets it to None to force

  dense retention so a 1536-token hybrid-cache page is created, confirming that the

  default sparse policy can skip checkpoints and change hit behavior.

  '
