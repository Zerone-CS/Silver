related_parameters:
- name: --enable-prefix-caching
  relation: Retention only matters when prefix caching is enabled; without it no checkpoints are retained
- name: --block-size
  relation: Positive retention interval must be a multiple of the scheduler block size
- name: --mamba-cache-mode
  relation: Governs Mamba cache behavior; retention applies to Mamba cache groups
- name: --enable-mamba-fine-grained-prefix-cache
  relation: Related fine-grained Mamba prefix-cache toggle affecting checkpoint granularity
- name: --prefix-match-unit
  relation: Both are prefix-caching implementation details excluded from the compute-graph hash
constraints:
- The value must be non-negative; negative values raise a ValueError.
- A positive value must be an exact multiple of the scheduler block size, otherwise a ValueError is raised.
- On a model with no sliding-window or Mamba KV cache group, setting a non-zero value raises a ValueError; only 0 (or None)
  is accepted.
- The parameter only applies to sliding-window and Mamba cache groups; full-attention and chunked-local groups ignore it.
tuning_advice:
  summary: Keep the default 0 for most workloads; use None or a block-size-multiple positive interval only for sliding-window/Mamba
    models with heavy prefix reuse.
  suggested_values:
  - scenario: General serving, no strong prefix reuse, or full-attention-only models
    value: 0
    reason: Default sparse policy retains only semantic checkpoints, minimizing KV cache block consumption and preserving
      concurrency.
  - scenario: Sliding-window/Mamba hybrid models with heavy repeated-prefix workloads (e.g. multi-turn chat, RAG)
    value: unset
    reason: Dense retention maximizes prefix-cache hit rate, cutting prefill recomputation latency at the cost of more retained
      blocks.
  - scenario: Balanced tradeoff on hybrid models with moderate prefix reuse
    value: 2048
    reason: A positive interval that is a multiple of the scheduler block size retains periodic checkpoints, balancing hit
      rate against block usage.
  caveats:
  - Verify the value is a multiple of --block-size or startup will fail with a ValueError.
  - On Ascend confirm the value is propagated via VLLM_PREFIX_CACHE_RETENTION_INTERVAL to the patched coordinator.
  - Monitor KV cache block utilization; dense retention can starve active sequences of blocks under high concurrency.
  quick_guide: Leave at 0 unless you run a sliding-window/Mamba model with heavy prefix reuse, then try None or a block-size-multiple
    interval.
