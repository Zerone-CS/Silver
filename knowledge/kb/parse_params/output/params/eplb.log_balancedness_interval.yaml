related_parameters:
- name: eplb.log_balancedness
  relation: Master switch; log_balancedness_interval only takes effect when log_balancedness is true (log_stats passed to
    step)
- name: eplb.window_size
  relation: expert_load_window_size; recording window used together with the interval to decide when to record load
- name: eplb.step_interval
  relation: expert_rearrangement_step_interval; the modulo clock (expert_rearrangement_step) shared with the logging interval
constraints:
- log_balancedness_interval must be a positive integer; a value of 0 would cause a modulo-by-zero error in the step() and
  _should_record_current_step() computations.
- The interval only has an effect when log_balancedness is enabled (log_stats is true); otherwise the logging branch is skipped.
tuning_advice:
  summary: Keep the interval large in production to avoid per-step HCCL collective syncs for balancedness logging; use small
    values only for debugging.
  suggested_values:
  - scenario: Production serving with EPLB enabled (v2-ascend MRv2)
    value: 100
    reason: Reduces the frequency of _sync_load_pass collective syncs across the EP group, lowering per-step latency overhead
      while still providing periodic balancedness visibility.
  - scenario: Debugging / validating load balancing behavior
    value: 1
    reason: Logs balancedness every step for maximum observability, matching the documented example; acceptable only for short
      diagnostic runs due to collective sync cost.
  - scenario: Default / balanced tradeoff
    value: 10
    reason: Moderate logging frequency that limits collective sync overhead while giving reasonably frequent balancedness
      metrics.
  caveats:
  - On Ascend, each logging trigger performs a cross-rank sync (_sync_load_pass) over the EP group via HCCL; at large EP sizes
    a small interval can noticeably increase per-step latency.
  - A small interval also keeps expert-load recording enabled more often (via should_record_tensor), adding minor per-step
    bookkeeping overhead.
  - vllm-ascend docs list the default as 1, meaning logging every step — this is a debugging-friendly default, not a production-optimal
    one.
  - This parameter is observability-only; it does not change the rearrangement policy or memory footprint, only the frequency
    of stats collection.
  quick_guide: Set log_balancedness_interval to 100+ in production; use 1 only for debugging.
