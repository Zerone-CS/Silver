name: eplb.log_balancedness_interval
type: nested
category: observability
scope: both
source_file:
- vllm/distributed/eplb/eplb_state.py:591
- vllm/distributed/eplb/eplb_state.py:704
- tests/ut/worker/v2/test_eplb_load_collection_phase.py:160
value_type: int
default: 1
valid_choices: positive integer (>= 1)
cli_example: null
deprecated: false
performance_impact: low
performance_scope:
- latency
- throughput
impact_detail: 'This parameter controls how often EPLB balancedness statistics are logged. In

  vllm/distributed/eplb/eplb_state.py:591, the EplbState.step() method checks

  `self.expert_rearrangement_step % self.parallel_config.eplb_config.log_balancedness_interval == 0`

  to decide whether to run the balancedness logging path. When triggered, it calls

  `_sync_load_pass()` which performs a cross-rank (HCCL) all-reduce/sync of the

  expert_load_pass tensor across the EP group, then computes per-rank token counts

  and the balancedness ratio. This is a collective communication operation across

  the expert-parallel group, so it adds synchronization overhead on the critical

  path of the MoE forward step.

  Additionally, at eplb_state.py:704, `_should_record_current_step()` uses the

  interval to determine whether expert-load recording should be enabled for the

  current step (via `should_record_tensor`). A smaller interval means the sliding

  window recording is enabled more frequently, which keeps the per-layer load

  recording active more often, adding minor per-step bookkeeping overhead.

  On Ascend, the sync load pass involves HCCL collective communication across the

  EP group, so a very small interval (e.g. 1) causes a collective sync every step,

  which can measurably increase per-step latency and reduce throughput, especially

  at large EP sizes. The default of 1 (per vllm-ascend docs) means logging every

  step — fine for debugging but costly in production. This is primarily an

  observability parameter; its performance effect is indirect (extra collectives

  and recording overhead) rather than a direct throughput/memory knob.

  '
usage_locations:
- file: vllm/distributed/eplb/eplb_state.py:591
