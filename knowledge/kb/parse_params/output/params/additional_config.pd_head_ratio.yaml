source_file:
- vllm_ascend/ascend_config.py:648
- vllm_ascend/ascend_config.py:556
value_type: int
default: 1
valid_choices: positive integer; derived automatically at runtime, not user-settable
cli_example: null
deprecated: false
performance_impact: low
performance_scope:
- throughput
