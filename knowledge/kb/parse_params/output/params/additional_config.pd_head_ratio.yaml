impact_detail: 'pd_head_ratio is a pure-derived field in vllm-ascend''s AscendConfig (vllm_ascend/ascend_config.py:648).

  The class docstring explicitly lists it among "Pure-derived fields computed automatically and not

  user-settable" (line 556), alongside enable_sp_by_pass, pd_tp_ratio, and num_head_replica. It is

  initialized to a sentinel default of 1 and is intended to be overwritten by the derive_and_validate

  logic (line 684 onward) based on the actual parallel configuration (PD disaggregation / prefill-decode

  split, tensor-parallel size, and attention head count). Because it is derived rather than user-input,

  setting it directly in additional_config has no meaningful effect on the runtime code path — the

  derivation overwrites it. Its downstream role is to express the ratio between attention heads across

  the prefill/decode (P/D) split so that head-level work can be partitioned/replicated correctly; an

  incorrect value would affect how attention heads are distributed across P and D instances, which

  indirectly influences per-instance compute balance and KV-cache memory footprint. However, since the

  value is computed from the parallel config rather than tuned by the user, its direct performance

  impact is low — the real performance levers are the parallel sizes (tensor-parallel-size,

  prefill/decode instance counts) from which it is derived.

  '
usage_locations:
- file: vllm_ascend/ascend_config.py:648
  context: 'Field declaration pd_head_ratio: int = 1 as a derived field with sentinel default.'
- file: vllm_ascend/ascend_config.py:556
  context: Docstring lists pd_head_ratio among pure-derived, non-user-settable fields.
