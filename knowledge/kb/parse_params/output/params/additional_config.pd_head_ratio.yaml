- name: additional_config.enable_sp_by_pass
  relation: Another pure-derived field in the same derived-fields group.
- name: tensor-parallel-size
  relation: Primary input from which pd_head_ratio is derived.
constraints:
- pd_head_ratio is a pure-derived field and is not user-settable; providing it in additional_config is overwritten by derive_and_validate.
- additional_config uses extra='forbid', so unknown keys fail fast, but pd_head_ratio is a recognized (derived) key rather
  than an unknown one.
tuning_advice:
  summary: Do not set pd_head_ratio manually — it is derived from the P/D parallel layout; tune tensor-parallel-size and P/D
    instance counts instead.
  suggested_values:
  - scenario: Any deployment (default behavior)
    value: 1
    reason: Leave at the sentinel default; derive_and_validate overwrites it based on the actual parallel configuration.
  - scenario: PD-disaggregated deployment needing head-level balance
    value: <computed>
    reason: Adjust tensor-parallel-size and prefill/decode instance counts so the derived head ratio yields balanced per-instance
      head counts.
  caveats:
  - Setting this field explicitly has no effect because it is recomputed at config derivation time.
  - Focus tuning effort on the parallel sizes that feed the derivation rather than on this derived output.
  quick_guide: Leave pd_head_ratio alone; it is auto-derived from your P/D and tensor-parallel configuration.
