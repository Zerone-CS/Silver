name: --max_model_len
type: cli
category: model
scope: both
source_file:
- vllm/config/model.py:215
- vllm/engine/arg_utils.py:379
- vllm/engine/arg_utils.py:461
- vllm_ascend/patch/platform/patch_balance_schedule.py:251
- vllm_ascend/patch/platform/patch_kv_cache_coordinator.py:62
- vllm_ascend/patch/platform/patch_mamba_config.py:176
- vllm_ascend/platform.py:420
- vllm_ascend/worker/block_table.py:346
value_type: int
default: null
valid_choices: Any positive integer; -1 or 'auto' to auto-select the largest length that fits in device memory; supports human-readable
  suffixes k/m/g/K/M/G (e.g. 1k=1000, 1K=1024, 25.6k=25600)
cli_example: --max-model-len 8192
deprecated: false
performance_impact: high
performance_scope:
- memory
- throughput
- latency
impact_detail: '--max_model_len sets the maximum context length (prompt + output) per request and is a

  first-order driver of NPU memory and scheduling behavior on Ascend.


  Memory: "In vllm_ascend/worker/block_table.py:346-373, MultiGroupBlockTable computes"

  max_num_blocks_per_req = cdiv(max_model_len, block_size * dcp_world_size) for each KV cache

  group. This directly sizes the per-request block table buffers allocated on the NPU, so a

  larger max_model_len increases block-table memory linearly. More importantly, max_model_len

  bounds the KV cache capacity requirement: "the KV cache must be able to hold at least one"

  request of max_model_len tokens, so a value larger than what fits in the remaining HBM after

  weights causes startup OOM (documented in Cohere-Transcribe.md:251 and Qwen-VL-Dense.md:294).

  For models with full causal attention masks, mask memory grows quadratically with

  max_model_len (Cohere-Transcribe.md:251), which is an Ascend-specific OOM risk.


  Throughput/concurrency: vllm_ascend/patch/platform/patch_kv_cache_coordinator.py:62

  (_select_kv_token_budget) falls back to max_model_len as the KV token budget when

  max_in_flight_tokens is unset, and the coordinator stores self.max_model_len (line 128) used

  in cache-block accounting. Upstream vllm/config/cache.py:219 defines kv_cache_max_concurrency

  as "Per-DP-engine maximum concurrency at max_model_len tokens" — a larger max_model_len

  lowers the number of concurrent requests the KV cache can hold, reducing batch size and

  therefore decode throughput.


  Scheduling: "vllm_ascend/patch/platform/patch_balance_schedule.py:251 clamps num_new_tokens to"

  max_model_len - num_computed_tokens - num_sampled_tokens_per_step, and line 282 notes that a

  request reaching max_model_len yields num_new_tokens == 0 and is skipped. So max_model_len

  caps the total tokens a request can generate and interacts with chunked prefill and

  speculative decoding (num_sampled_tokens_per_step).


  Hybrid/mamba models: vllm_ascend/patch/platform/patch_mamba_config.py:176 sets

  mamba_block_size = model_config.max_model_len when prefix caching is off or mamba_cache_mode

  is not "align"; vllm_ascend/platform.py:420 treats mamba_block_size == max_model_len as the

  "unset" sentinel and replaces it with block_size when KV transfer with hybrid models is used.

  Thus max_model_len indirectly influences mamba block sizing and the Triton postprocess path

  selection on Ascend.


  vllm-ascend does not override the default value of max_model_len itself; it inherits the

  upstream ModelConfig default (None -> derived from HF config) and the human-readable parsing

  from vllm/engine/arg_utils.py:379-381.

  '
