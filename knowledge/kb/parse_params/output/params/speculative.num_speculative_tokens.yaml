name: speculative.num_speculative_tokens
type: nested
category: speculation
scope: both
source_file:
- vllm/config/speculative.py:1484
- vllm/config/vllm.py:616
- vllm/engine/arg_utils.py:1704
- vllm/engine/arg_utils.py:2484
- vllm_ascend/platform.py:1534
- vllm_ascend/ascend_config.py:1389
- vllm_ascend/worker/model_runner_v1.py:572
- vllm_ascend/worker/model_runner_v1.py:633
- vllm_ascend/worker/dcp_utils.py:104
- vllm_ascend/worker/worker.py:1213
- vllm_ascend/_310p/model_runner_310p.py:105
value_type: int
default: <computed>
valid_choices: positive integer; must be divisible by the draft model's n_predict when larger than it; HPC attention backend
  caps at 3; fused sparse-KV path requires 1 + num_speculative_tokens <= 14
cli_example: --spec-tokens <n>
deprecated: false
performance_impact: high
performance_scope:
- latency
- throughput
- memory
impact_detail: "num_speculative_tokens (n) is the number of draft tokens proposed per decode step. It is the\nsingle most\
  \ pervasive speculative-decoding knob and touches nearly every Ascend runtime path:\n\n1. Decode step width / graph capture.\
  \ In vllm_ascend/platform.py:1532-1537\n   (_get_reduced_cg_cap) and vllm_ascend/ascend_config.py:1387-1393, Ascend computes\n\
  \   decode_query_len = 1 + num_speculative_tokens and uses it to size the default ACLGraph\n   capture upper bound: \"min(max_num_seqs\
  \ * decode_query_len, 512). A larger n therefore\"\n   inflates the default max_cudagraph_capture_size, which increases\
  \ graph capture time and\n   memory for captured graphs, but also lets larger decode batches stay on the graph path\n  \
  \ instead of falling back to eager. In ascend_config.py the same decode_query_len feeds\n   max_step = min(max_num_batched_tokens,\
  \ max_num_seqs * decode_query_len); if the largest\n   capture size does not cover max_step, oproj_tensor_parallel_size\
  \ / mlp_tensor_parallel_size\n   are silently disabled (warning at line 1401) because an oversized step would dispatch to\n\
  \   eager and hang cross-DP HCCL collectives.\n\n2. Model runner bookkeeping. vllm_ascend/worker/model_runner_v1.py:572\
  \ sets\n   decode_threshold = 1 + n, which drives the \"is this a uniform decode batch\" decision used\n   for ACLGraph\
  \ dispatch and MC2 token capacity (set_mc2_tokens_capacity at line 567 uses\n   uniform_decode_query_len). Line 633 passes\
  \ n into NPUInputBatch, which sizes the block\n   table (npu_input_batch.py:140) and per-request speculative slots. dcp_utils.py:104\
  \ uses the\n   same 1 + n threshold for DCP decode scheduling.\n\n3. KV cache / memory. Each running request must reserve\
  \ n extra KV slots per step\n   (vllm/config/vllm.py num_lookahead_tokens), so larger n reduces the number of concurrent\n\
  \   sequences that fit in HBM. On Ascend this directly shrinks max_num_seqs for a fixed KV\n   budget, which in turn shrinks\
  \ the ACLGraph capture bound above.\n\n4. Correctness-related zeroing. vllm_ascend/worker/worker.py:1209-1217 enables Mamba+Eagle3\n\
  \   KV zeroing only when method == \"eagle3\" and n > 1, adding a per-step zeroing cost.\n\n5. 310P path. vllm_ascend/_310p/model_runner_310p.py:105\
  \ feeds n into NPUInputBatch; for\n   ngram on 310P the graph uniform_decode_query_len is forced to 1 (line 114-118), so\
  \ n does\n   not widen the graph shape there.\n\nNet effect: \"raising n increases accepted tokens per step (lower inter-token\
  \ latency, higher\"\nthroughput when acceptance rate is high) but costs more draft-model compute, more KV memory,\nlarger\
  \ graph captures, and higher rejection-sampling overhead. The optimum is workload- and\nacceptance-rate-dependent.\n"
