related_parameters:
- name: speculative_config.method
  relation: Determines which proposer is used (eagle3, deepseek_mtp, ngram, dspark, etc.); some methods impose extra constraints
    on n (e.g. eagle3 + Mamba zeroing when n > 1).
- name: speculative_config.model
  relation: Draft model config may supply a default n via n_predict; n must be divisible by n_predict when larger.
- name: max_num_batched_tokens
  relation: Must be >= max_num_seqs * (n + 1) when LoRA + spec decode are enabled; also bounds max_step in ascend_config.py.
- name: max_num_seqs
  relation: Together with n determines the default ACLGraph capture cap (max_num_seqs * (1 + n), capped at 512) and the xlite
    decode-only token budget.
- name: compilation_config.max_cudagraph_capture_size
  relation: If explicitly set, overrides the n-derived default; if too small relative to max_num_seqs*(1+n), oproj/mlp tensor-parallel
    is disabled.
- name: xlite_graph_config.full_mode
  relation: Decode-only xlite budget is max_num_seqs * (1 + n); larger n increases the budget.
- name: parallel_config.data_parallel_size
  relation: Dynamic speculative decoding (num_speculative_tokens_per_batch_size) is disabled when DP > 1, falling back to
    static n.
- name: attention backend (HPC)
  relation: HPC attention backend rejects n > 3.
constraints:
- If a draft model is provided but num_speculative_tokens is not set and the draft config has no n_predict, vLLM raises ValueError.
- When num_speculative_tokens exceeds the draft model's n_predict, it must be divisible by n_predict or a ValueError is raised.
- When LoRA and speculative decoding are both enabled, max_num_batched_tokens must be at least max_num_seqs * (num_speculative_tokens
  + 1), otherwise a ValueError is raised.
- The HPC attention backend only supports up to 3 speculative tokens (mtp in {0,1,2,3}); larger values raise ValueError.
- For the fused sparse-KV offload path, Q_max = 1 + num_speculative_tokens must be between 1 and 14.
- oproj_tensor_parallel_size / mlp_tensor_parallel_size require graph mode and a cudagraph capture bound that covers max_num_seqs
  * (1 + num_speculative_tokens); otherwise they are disabled.
tuning_advice:
  summary: Tune n to the draft model's acceptance rate and the KV/graph budget; start small (1-3) and increase only while
    acceptance stays high and memory allows.
  suggested_values:
  - scenario: DeepSeek MTP (deepseek_mtp) on Ascend, large-scale EP deployment
    value: 1
    reason: vllm-ascend docs recommend num_speculative_tokens=1 for deepseek_mtp in large-scale EP; keeps KV lookahead and
      graph capture small.
  - scenario: Eagle3 draft model with high acceptance rate, memory headroom available
    value: 3
    reason: Balances accepted tokens per step against KV lookahead and graph capture cost; stays within typical acceptance-rate
      sweet spot.
  - scenario: HPC attention backend
    value: 3
    reason: HPC backend rejects n > 3, so 3 is the maximum allowed.
  - scenario: Fused sparse-KV offload (fused_copy_sfa) with draft8
    value: 8
    reason: Docs show draft8 example with num_speculative_tokens=8; Q_max = 9 stays within the 1..14 bound and topk_buffer_size
      must be >= 18432.
  - scenario: Memory-constrained deployment or low acceptance rate
    value: 1
    reason: Minimizes KV lookahead and graph capture size, maximizing concurrent sequences.
  caveats:
  - Raising n increases the default ACLGraph capture cap; if it hits the 512 ceiling, further increases no longer widen the
    graph but still cost KV memory.
  - Ensure max_num_batched_tokens >= max_num_seqs * (n + 1) when using LoRA, and generally to keep max_step within the capture
    bound.
  - If oproj/mlp tensor-parallel is enabled, verify the capture bound covers max_num_seqs*(1+n) or the feature will be silently
    disabled.
  - Monitor acceptance rate; if it drops below ~50%, reduce n.
  quick_guide: Start with n=1-3, raise only while acceptance rate stays high and KV/graph memory permits; cap at 3 for HPC
    attention and 14 for fused sparse-KV.
analysis_date: '2026-10-27'
