related_parameters:
- name: VLLM_MAX_AUDIO_DECODE_DURATION_S
  relation: Companion guard limiting decoded audio duration in seconds; both are enforced during audio decoding and either
    can reject a request
- name: VLLM_MAX_AUDIO_CLIP_FILESIZE_MB
  relation: Companion guard limiting the compressed audio file size before decoding
- name: VLLM_MAX_AUDIO_PREPROCESS_WORKERS
  relation: Controls the thread pool size for STT preprocessing; together they bound frontend CPU/memory pressure
- name: VLLM_MAX_EMBED_DECODE_BYTES
  relation: Analogous memory guard for client-supplied embedding payloads
constraints:
- Audio inputs whose decoded float32 PCM would exceed VLLM_MAX_AUDIO_DECODE_BYTES are rejected with a ValueError before the
  buffer is allocated.
- The limit is enforced both as a pre-decode estimate (soundfile path) and incrementally during decoding (pyav path), so it
  cannot be bypassed by header sample-rate forgery.
- The default of 256 MiB is sized to cover 600s of mono 48 kHz float32 audio; lowering it below the size of legitimate inputs
  will cause valid requests to fail.
tuning_advice:
  summary: 'Leave at the default 256 MiB for typical speech-to-text workloads; only raise

    it if you legitimately serve long or multi-channel audio, and lower it only

    when host RAM is tight and inputs are known to be short.

    '
  suggested_values:
  - scenario: Standard STT serving with short-to-medium clips (<= 10 min mono)
    value: 268435456
    reason: Default 256 MiB covers 600s mono 48 kHz float32 and matches the companion duration guard; no change needed.
  - scenario: Long-form or multi-channel audio (e.g. stereo/multichannel meetings, > 10 min)
    value: 1073741824
    reason: Raise to 1 GiB so legitimate multi-channel inputs are not rejected, while still bounding a single request's host
      PCM allocation.
  - scenario: Memory-constrained host / many concurrent audio requests
    value: 67108864
    reason: Lower to 64 MiB to cap per-request host RAM when inputs are known to be short, reducing OOM risk on the API server
      frontend.
  caveats:
  - This is a host (CPU) memory guard, not an NPU memory knob; it does not affect HBM usage, KV cache, or NPU throughput.
  - Setting it too low causes valid audio requests to fail with a ValueError mentioning VLLM_MAX_AUDIO_DECODE_BYTES.
  - It is enforced before allocation, so raising it does not by itself increase steady-state memory — only the worst-case
    per-request peak.
  - No vllm-ascend override exists; behavior is identical to upstream vLLM on Ascend.
  quick_guide: Keep the 256 MiB default unless serving long/multichannel audio (raise) or host RAM is tight (lower).
analysis_date: '2026-10-27'
