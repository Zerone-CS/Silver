name: VLLM_MAX_AUDIO_DECODE_BYTES
type: env
category: memory
scope: vllm
source_file:
- vllm/envs.py:1012
- vllm/envs.py:83
- vllm/envs.py:2319
- vllm/entrypoints/speech_to_text/base/serving.py:127
- vllm/multimodal/media/audio.py:185
- vllm/multimodal/media/audio.py:233
value_type: int
default: 268435456
valid_choices: Any non-negative integer (bytes); 0 or negative effectively disables the guard when passed as max_decode_bytes
cli_example: null
deprecated: false
performance_impact: low
performance_scope:
- memory
- latency
impact_detail: 'This env var is read once at SpeechToText serving init

  (vllm/entrypoints/speech_to_text/base/serving.py:127) into

  self.max_audio_decode_bytes and passed down as max_decode_bytes to the audio

  loaders (vllm/multimodal/media/audio.py). It is a security/memory-safety guard,

  not a throughput knob: "in load_audio_soundfile it is checked BEFORE decoding"

  (estimated_bytes = frames * channels * 4 compared against the limit, raising

  ValueError before f.read allocates the PCM buffer), and in the pyav path it is

  checked incrementally during decoding (total_decode_bytes accumulated per chunk,

  raising before the full allocation). Its performance effect is therefore

  indirect: "it bounds the peak host (CPU) RAM a single audio request can allocate"

  during preprocessing, preventing a decompression-bomb style multi-GiB float32

  PCM allocation that could trigger host OOM / swap and stall the API server

  frontend. It does not touch NPU compute, HCCL, KV cache, or the model forward

  path. There is no vllm-ascend override of this variable in the provided

  context; it is a pure upstream vLLM frontend/media parameter that applies

  identically on Ascend since audio preprocessing runs on CPU before tensors are

  moved to the NPU.

  '
usage_locations:
- file: vllm/envs.py:1012
  context: Definition of the env var with default 268435456 (256 MiB)
- file: vllm/envs.py:83
  context: Type annotation in the envs module (int = 268_435_456)
