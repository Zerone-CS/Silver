tuning_advice:
  summary: Tune load_window_bins to balance rebalance stability against responsiveness for the STAIR EPLB policy on Ascend
    NPU.
  suggested_values:
  - scenario: Stable, steady-state MoE serving with predictable expert load
    value: 64
    reason: Default value provides a balanced smoothing horizon that avoids excessive rebalancing churn while still tracking
      moderate load drift.
  - scenario: Highly bursty or skewed expert routing where fast reaction matters
    value: 32
    reason: Smaller window reacts faster to emerging imbalance, reducing tail latency on overloaded ranks at the cost of more
      frequent rebalances.
  - scenario: Noisy load with frequent transient spikes causing rebalance thrash
    value: 128
    reason: Larger window smooths transient spikes, reducing unnecessary expert migrations and HCCL transfer overhead.
  caveats:
  - Increasing the window reduces rebalance frequency but may leave imbalance uncorrected longer; monitor per-rank load balance
    after changing.
  - Only relevant when the MRv2 STAIR EPLB policy is enabled; no effect otherwise.
  quick_guide: Keep default 64; lower toward 32 for bursty loads, raise toward 128 to suppress rebalance thrash.
