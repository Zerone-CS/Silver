impact_detail: 'load_window_bins controls how many chronological bins the MRv2 STAIR EPLB policy

  uses to compress the upstream EPLB load window (vllm_ascend/ascend_config.py:194-196).

  Bin means and weights represent all samples in that window, so this value directly

  determines the statistical horizon over which expert/rank load is aggregated before

  the STAIR rebalancing decision is made. A larger window smooths transient load spikes

  and produces more stable expert placement (fewer unnecessary rebalances, less expert

  migration churn over HCCL), while a smaller window reacts faster to load shifts but

  risks over-reacting to noise, causing frequent rebalancing and extra cross-rank expert

  transfers. Because EPLB rebalancing drives expert redistribution across ranks (and

  potentially cross-node transfers), the choice affects steady-state throughput balance

  and tail latency of MoE inference on Ascend NPU. The parameter is validated in

  StairConfig._validate (vllm_ascend/ascend_config.py:242-243) and is read back from

  additional_config["eplb_config"]["stair_config"] (see tests/ut/patch/platform/

  test_patch_eplb.py:146-161), confirming it is consumed by the Ascend EPLB patch layer.

  '
