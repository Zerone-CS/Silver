name: kv_transfer_config.kv_connector_extra_config.consumer_is_to_put
type: nested
category: kv_cache
scope: vllm-ascend
source_file:
- docs/source/user_guide/feature_guide/kv_cache_pool_ascend_store.md:895
- docs/source/user_guide/feature_guide/kv_cache_pool_ascend_store.md:1536
- docs/source/tutorials/models/GLM5.3-Flash.md:1017
value_type: bool
default: false
valid_choices:
- true
- false
cli_example: null
deprecated: false
performance_impact: medium
performance_scope:
- throughput
- memory
impact_detail: 'consumer_is_to_put is a nested field inside kv_transfer_config.kv_connector_extra_config

  used by the AscendStoreConnector (KV Cache Pool / Ascend Store) in vllm-ascend. It is not

  defined in upstream vLLM; it is an Ascend-specific connector option documented in the

  vllm-ascend KV Cache Pool guide. When set to true, the Decode node is allowed to write

  (put) its KV cache blocks into the shared KV Pool backend (Mooncake / Memcache / Yuanrong).

  This changes the runtime data path: "instead of only loading KV from the pool, the Decode"

  worker also performs store-side transfers over the pool communication protocol (e.g.

  RoCE/HCCS via the Mooncake transfer engine), consuming NPU-side DMA/communication

  bandwidth and pool memory. Enabling it increases pool memory footprint and adds

  put-path traffic, which can reduce decode throughput if the pool link is saturated, but

  it enables cross-instance prefix reuse (later Prefill/Decode requests can hit the pooled

  KV), improving effective throughput for workloads with repeated prefixes. When disabled

  (default), the Decode node contributes no pool memory and performs no put traffic, as

  described in the GLM5.3-Flash tutorial where Decode keeps consumer_is_to_load and

  consumer_is_to_put disabled.

  '
