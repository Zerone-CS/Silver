impact_detail: "This env var only takes effect when CPU weight offloading is active (i.e. --cpu-offload-gb > 0\nor a weight\
  \ offloader is configured). It is read in two places:\n1. vllm/model_executor/offloader/base.py:should_pin_memory() — returns\n\
  \   is_pin_memory_available() and not envs.VLLM_WEIGHT_OFFLOADING_DISABLE_PIN_MEMORY.\n   This gates whether offloaded weight\
  \ tensors are allocated in pinned (page-locked) host memory.\n2. vllm/model_executor/model_loader/utils.py:189-198 — when\
  \ restoring CPU-resident parameters\n   after a temporary move to the target device, the restored CPU tensors are allocated\
  \ with\n   pin_memory=use_pin_memory. Setting the env var to 1 forces pin_memory=False.\nMechanism: \"pinned host memory\
  \ enables fast asynchronous DMA/H2D copies (on Ascend, host-to-device\"\ncopies via the CANN runtime / aclrtMemcpyAsync),\
  \ so offloaded weights can be streamed to the NPU\nwith lower latency and overlap. Disabling pin memory means the runtime\
  \ must stage through\npageable memory, adding copy latency and potentially blocking the copy stream. The tradeoff is\nthat\
  \ pinned memory is non-pageable and consumes host RAM that cannot be swapped, which matters on\nunified-memory or memory-constrained\
  \ hosts. On Ascend NPU, host memory is separate from device\nHBM, so the \"unified memory eats into GPU memory\" rationale\
  \ in the docstring does not directly\napply; the primary effect is copy latency for offloaded weights. When CPU offloading\
  \ is not used,\nthis env var has no runtime effect.\n"
