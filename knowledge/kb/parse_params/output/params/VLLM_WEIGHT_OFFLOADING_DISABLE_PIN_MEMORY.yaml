constraints:
- The value is parsed as bool(int(...)), so only integer strings like 0 or 1 are valid; other strings raise a ValueError at
  startup.
- This env var only affects behavior when CPU weight offloading is enabled; otherwise it is read but has no effect.
tuning_advice:
  summary: Keep pin memory enabled (default 0) for CPU weight offloading on Ascend to minimize host-to-device copy latency;
    disable only if host RAM is constrained.
  suggested_values:
  - scenario: CPU weight offloading enabled with sufficient host RAM
    value: 0
    reason: Pinned host memory enables faster asynchronous H2D copies of offloaded weights to the NPU, reducing load/streaming
      latency.
  - scenario: Host RAM constrained or pinned allocation fails/OOM
    value: 1
    reason: Disabling pin memory frees non-pageable host RAM at the cost of slower copies, avoiding host OOM.
  caveats:
  - Only relevant when --cpu-offload-gb > 0; no effect otherwise.
  - Setting to 1 trades copy latency for lower host memory pressure.
  quick_guide: Leave at 0 unless host memory is tight; only matters with CPU weight offloading.
