related_parameters:
- name: compilation.cudagraph_mode
  relation: splitting_ops is rewritten based on cudagraph_mode; piecewise modes force MLA/DSA into splitting_ops, full modes
    force []
- name: compilation.mode
  relation: Piecewise cudagraphs require mode=VLLM_COMPILE and non-empty splitting_ops; enforce_eager forces mode=NONE and
    splitting_ops=[]
- name: compilation.use_inductor_graph_partition
  relation: When True, FX-level splitting is skipped and splitting_ops is used as Inductor partition rules instead
- name: compilation.pass_config.enable_sp
  relation: Sequence parallelism requires full-graph compilation (empty splitting_ops or use_inductor_graph_partition)
- name: compilation.pass_config.fuse_gemm_comms
  relation: Collective/AsyncTP fusion requires full-graph compilation (empty splitting_ops)
- name: compilation.pass_config.fuse_qk_norm_rope_kvcache
  relation: Disabled when splitting_ops is None and use_inductor_graph_partition is False
- name: additional_config.ascend_compilation_config.enable_static_kernel
  relation: Forced False when piecewise splitting is active; requires empty splitting_ops to run
- name: additional_config.ascend_compilation_config.enable_super_kernel
  relation: Forced False when piecewise splitting is active
- name: additional_config.ascend_compilation_config.enable_npugraph_ex
  relation: Forced False when piecewise splitting is active
- name: enforce_eager
  relation: When True, mode=NONE and splitting_ops defaulted to []
constraints:
- Piecewise cudagraphs (cudagraph_mode PIECEWISE or FULL_AND_PIECEWISE) require compilation mode VLLM_COMPILE and non-empty
  splitting_ops, otherwise vllm-ascend raises an AssertionError.
- When use_inductor_graph_partition is False and splitting_ops is None, the QK-Norm+RoPE+KV cache fusion pass is disabled.
- Sequence parallelism (enable_sp) and collective/AsyncTP fusion (fuse_gemm_comms) require full-graph compilation, i.e. use_inductor_graph_partition
  must be True or splitting_ops must be empty.
- The v1 CUDAGraphDispatcher asserts that attention ops are present in splitting_ops when piecewise cudagraphs are used.
- An empty splitting_ops with cudagraph_mode PIECEWISE causes upstream to downgrade cudagraph_mode to NONE; with FULL_AND_PIECEWISE
  it downgrades to FULL.
tuning_advice:
  summary: Let vllm-ascend manage splitting_ops automatically; only override when you need full-graph compilation for SP/AsyncTP
    or static-kernel, and align it with cudagraph_mode.
  suggested_values:
  - scenario: Default decode/prefill with MLA or DSA attention on Ascend (piecewise cudagraph)
    value: <leave unset; vllm-ascend appends vllm::mla_forward and vllm::dsa_forward>
    reason: MLA/DSA attention kernels are not cudagraph-safe on NPU; vllm-ascend must split them out of the cudagraph, and
      manual values would be overwritten anyway.
  - scenario: Full cudagraph mode (FULL / FULL_DECODE_ONLY) with Ascend static-kernel / super-kernel enabled
    value: []
    reason: vllm-ascend sets splitting_ops = [] in this path so the FX graph is not split and static-kernel compiles once
      instead of per segment.
  - scenario: Enabling sequence parallelism (enable_sp) or collective/AsyncTP fusion (fuse_gemm_comms)
    value: []
    reason: These Inductor passes assert full-graph compilation (use_inductor_graph_partition or empty splitting_ops); a non-empty
      list disables them.
  - scenario: Enforce eager / no compilation
    value: []
    reason: With enforce_eager, mode is NONE and vllm-ascend defaults splitting_ops to [] when None; no piecewise compilation
      or cudagraph is used.
  caveats:
  - Do not manually set splitting_ops to a non-empty list while expecting static-kernel or super-kernel optimizations — vllm-ascend
    disables them in the piecewise path.
  - Manually setting splitting_ops = [] with cudagraph_mode PIECEWISE will cause upstream to downgrade cudagraph_mode to NONE,
    losing cudagraph benefits.
  - If you enable use_inductor_graph_partition, splitting_ops is used as Inductor partition rules rather than FX split points,
    changing the semantics.
  - vllm-ascend rewrites this field during check_and_update_config, so values set via CLI/config may not survive to runtime.
  quick_guide: Leave splitting_ops unset on Ascend — vllm-ascend rewrites it based on cudagraph_mode; only force [] when you
    need full-graph compilation (SP/AsyncTP/static-kernel).
analysis_date: '2026-10-27'
