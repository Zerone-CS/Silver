impact_detail: "splitting_ops controls where the Dynamo FX graph is split into piecewise subgraphs\n(vllm/compilation/backends.py:1177\
  \ -> split_graph(graph, fx_split_ops)). Each split\nboundary becomes a separate Inductor compilation unit and a separate\
  \ piecewise\ncudagraph capture region. On Ascend, vllm-ascend actively rewrites this list in\nNPUPlatform.check_and_update_config\
  \ (vllm_ascend/platform.py):\n- \"When enforce_eager is set, mode is forced to CompilationMode.NONE and splitting_ops\"\n\
  \  is set to [] if None (line 1213-1214) — no piecewise compilation, no cudagraph.\n- \"When cudagraph_mode requires piecewise\
  \ compilation (PIECEWISE / FULL_AND_PIECEWISE),\"\n  vllm-ascend calls compilation_config.set_splitting_ops_for_v1(...)\
  \ and then extends\n  the list with \"vllm::mla_forward\" and \"vllm::dsa_forward\" (lines 1319-1330). This\n  forces MLA/DSA\
  \ attention ops to be split out of the cudagraph, which is required\n  because those attention kernels are not cudagraph-safe\
  \ on NPU. It also disables\n  enable_npugraph_ex, enable_static_kernel and enable_super_kernel in\n  additional_config[\"\
  ascend_compilation_config\"] (lines 1331-1333), so the Ascend\n  static-kernel / super-kernel optimizations are turned off\
  \ whenever piecewise\n  splitting is active.\n- \"When cudagraph_mode has full cudagraphs (FULL / FULL_DECODE_ONLY), vllm-ascend\"\
  \n  sets splitting_ops = [] (line 1336) so the FX graph is NOT split — this is required\n  for static-kernel compilation\
  \ to run once instead of once per piecewise segment.\n- \"When cudagraph_mode is NONE, mode is set to NONE and the Ascend\
  \ graph/kernel\"\n  optimizations are disabled (lines 1305-1309).\nUpstream, splitting_ops also gates several Inductor fusion\
  \ passes: sequence\nparallelism (sequence_parallelism.py:607), collective/AsyncTP fusion\n(collective_fusion.py:981) and\
  \ the residual-scatter SP path (v1/worker/utils.py:768)\nall assert `use_inductor_graph_partition or not splitting_ops`,\
  \ i.e. a non-empty\nsplitting_ops disables those full-graph-only fusions. Empty splitting_ops with\nPIECEWISE cudagraph_mode\
  \ causes upstream to downgrade cudagraph_mode to NONE\n(compilation.py:1210-1217), and with FULL_AND_PIECEWISE it downgrades\
  \ to FULL\n(compilation.py:1218-1224). The v1 CUDAGraphDispatcher asserts that piecewise\ncudagraphs require attention to\
  \ be in splitting_ops (cudagraph_dispatcher.py:49-61).\nNet effect on Ascend: \"splitting_ops determines whether the model\
  \ runs as one\"\nmonolithic compiled graph (best for static-kernel / super-kernel, full cudagraph)\nor as multiple piecewise\
  \ segments (needed for MLA/DSA attention, but disables\nAscend static/super-kernel and adds per-segment compile + capture\
  \ overhead).\n"
