- file: vllm_ascend/spec_decode/dflash_proposer.py:91
  context: Instantiates DynamicSpecScheduler(method='dflash') when method == 'dflash'.
- file: vllm_ascend/spec_decode/dspark_proposer.py:64
  context: Instantiates DynamicSpecScheduler(method='dspark') when method == 'dspark'.
