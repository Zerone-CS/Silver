impact_detail: "This field selects which dynamic speculative-length scheduler is instantiated inside the\nAscend proposer.\
  \ It is read from get_ascend_config().dynamic_spec_config in two places:\n- \"vllm_ascend/spec_decode/dflash_proposer.py:91\
  \ — if method == \\\"dflash\\\", a DynamicSpecScheduler\"\n  is created with method=\"dflash\" and the configured method_params.\n\
  - \"vllm_ascend/spec_decode/dspark_proposer.py:64 — if method == \\\"dspark\\\", a DynamicSpecScheduler\"\n  is created\
  \ with method=\"dspark\".\nWhen set, the scheduler adapts the per-request verify budget (how many of the\nnum_speculative_tokens\
  \ drafted tokens are actually verified by the target model) based on\ndraft confidence (DSpark confidence head sigmoid,\
  \ or DFlash head-free max(softmax(logits))).\nThis directly changes the number of target-model verify tokens per step, which\
  \ is the dominant\ncost of speculative decoding on Ascend NPU. Lower verify length reduces target-model compute\nand latency\
  \ when the drafter is uncertain; higher verify length preserves acceptance gains when\nconfidence is high. Net effect is\
  \ a latency/throughput tradeoff that is workload-dependent.\nWhen method is None (default), self.dynamic_spec stays None\
  \ and the proposer uses the fixed\nnum_speculative_tokens path — no dynamic scheduling overhead.\nNote: \"the value must\
  \ match the speculative_config.method (\\\"dspark\\\" or \\\"dflash\\\"); the scheduler\"\nis only instantiated in the proposer\
  \ whose method matches, so a mismatch silently disables the\ndynamic path (dynamic_spec remains None).\n"
usage_locations:
- file: vllm_ascend/ascend_config.py:1305
  context: SUPPORTED_METHODS ClassVar defines valid values ('dspark', 'dflash'); None disables.
- file: vllm_ascend/ascend_config.py:1316
