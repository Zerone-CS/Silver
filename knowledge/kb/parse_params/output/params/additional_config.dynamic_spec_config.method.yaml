related_parameters:
- name: speculative_config.method
  relation: Must match this value ('dspark' or 'dflash'); the scheduler is only created in the proposer whose method matches.
- name: speculative_config.num_speculative_tokens
  relation: Upper bound on drafted tokens; dynamic scheduling decides how many of these are verified per request.
- name: additional_config.dynamic_spec_config.method_params
  relation: Method-specific hyperparameters (e.g. initial_verify_budget_per_req, budget_update_interval, budget_threshold)
    consumed by the DynamicSpecScheduler.
- name: additional_config.enable_kvpp
  relation: Mutually exclusive — KVPP raises ValueError if dynamic_spec_config.method is set.
- name: speculative_config.enable_adaptive_verification
  relation: KVPP rejects DSpark adaptive verification; related dynamic-verification feature.
constraints:
- dynamic_spec_config.method must be one of 'dspark', 'dflash', or None; any other value raises ValueError at config validation.
- dynamic_spec_config.method must match speculative_config.method ('dspark' or 'dflash'); otherwise the dynamic scheduler
  is never instantiated and the setting has no effect.
- KVPP (additional_config.enable_kvpp) cannot be combined with a non-None dynamic_spec_config.method — KVPP validation raises
  ValueError for dynamic speculative lengths.
- DSpark dynamic method requires a draft model with a DSpark confidence head; models without such a head must use 'dflash'
  or another method.
- Dynamic speculative decoding targets model runner v1 only; it is not supported on the v2 worker path.
tuning_advice:
  summary: Set to the same value as speculative_config.method ('dspark' or 'dflash') to enable confidence-based dynamic verify
    length; leave None to keep fixed num_speculative_tokens.
  suggested_values:
  - scenario: DSpark draft model with a confidence head (e.g. Qwen series), variable concurrency
    value: dspark
    reason: Uses the DSpark confidence head to adapt per-request verify budget, reducing target-model verify cost when the
      drafter is uncertain.
  - scenario: Draft model without a confidence head, or wanting a head-free confidence proxy
    value: dflash
    reason: DFlash estimates confidence from max(softmax(logits)) of the drafted token, requiring no extra neural head.
  - scenario: Fixed-length speculative decoding, KVPP enabled, or v2 worker path
    value: unset
    reason: None disables the dynamic path; KVPP and v2 do not support dynamic speculative lengths.
  caveats:
  - Ensure speculative_config.method equals this value, otherwise the scheduler is not created and the setting is a no-op.
  - Benchmark against a fixed num_speculative_tokens baseline; dynamic verify length can hurt acceptance at high confidence.
  - Do not combine with enable_kvpp — validation will raise.
  quick_guide: Set dynamic_spec_config.method to 'dspark' or 'dflash' matching speculative_config.method to enable dynamic
    verify length; leave None otherwise.
analysis_date: '2026-10-27'
