name: additional_config.enable_dsa_cp
type: nested
category: parallelism
scope: vllm-ascend
source_file:
- vllm_ascend/ascend_config.py:581
- vllm_ascend/ascend_config.py:432
- vllm_ascend/utils.py:1589
value_type: bool
default: false
valid_choices: 'true / false (lax bool coercion: string ''false''/''true'' also accepted)'
cli_example: null
deprecated: true
performance_impact: medium
performance_scope:
- latency
- throughput
impact_detail: 'enable_dsa_cp enables DSA-CP (sparse-attention context parallelism) for DeepSeek V3.2 / V4

  and same-architecture models. It is read via the helper vllm_ascend/utils.py:enable_dsa_cp(),

  which now reads the validated AscendConfig singleton (get_ascend_config().enable_dsa_cp)

  rather than bypassing validation through additional_config["enable_dsa_cp"].

  When enabled, DSA-CP splits the sparse-attention (DSA / LightningIndexer) computation across

  context-parallel ranks, and per the docs it automatically enables FlashComm as the all2all

  backend (no need to set enable_flashcomm1 separately). This changes the attention compute and

  communication pattern: "it adds all2all communication (FlashComm) but parallelizes the"

  long-context sparse attention work, which can reduce prefill latency and improve throughput

  for long-context DeepSeek V3.2/V4 workloads. The gate is resolved during init_ascend_config:

  the flag is only honored when the model is a DSA-style model (index_topk present) AND sequence

  parallelism is active (EP + TP>1 + DP>1 makes use_sequence_parallel_moe True); otherwise it is

  silently downgraded to False (see tests/ut/test_ascend_config.py:1667). It is a temporary

  optimization slated for removal once PCP is stable.

  '
usage_locations:
- file: vllm_ascend/ascend_config.py:581
  context: 'Field definition enable_dsa_cp: bool = False in AscendConfig (extra=forbid pydantic dataclass).'
- file: vllm_ascend/utils.py:1589
  context: enable_dsa_cp() helper returns get_ascend_config().enable_dsa_cp from the validated singleton.
- file: tests/ut/test_ascend_config.py:1667
  context: Model/parallel gate resolved during init_ascend_config; unsupported configs downgrade to False.
- file: tests/e2e/pull_request/four_card/context_parallel/test_accuracy.py:242
