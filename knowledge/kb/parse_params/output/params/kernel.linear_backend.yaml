name: kernel.linear_backend
type: nested
category: model
scope: vllm
source_file:
- vllm/engine/arg_utils.py:1678
- vllm/engine/arg_utils.py:2563
- vllm/model_executor/kernels/linear/__init__.py:250
- vllm/model_executor/kernels/linear/__init__.py:393
- vllm/model_executor/layers/linear.py:172
value_type: str
default: auto
valid_choices: auto plus backend names such as torch, xpu, flashinfer_cutedsl, aiter (normalized to lowercase with '-' replaced
  by '_'); exact set depends on registered linear kernels
cli_example: --linear-backend <backend>
deprecated: false
performance_impact: low
performance_scope:
- latency
- throughput
impact_detail: 'kernel.linear_backend selects which GEMM kernel implementation is used for

  linear layers. In upstream vLLM it is read in

  vllm/model_executor/kernels/linear/__init__.py (_get_linear_backend) and

  applied in _resolve_backend_kernels to filter the candidate kernel list for

  each layer type. UnquantizedLinearMethod.__init__ (vllm/model_executor/layers/linear.py:172)

  passes it to dispatch_unquantized_gemm, so it directly chooses the GEMM

  implementation for unquantized linear layers. It also gates platform-specific

  behavior (e.g. XPU W8A8 FP8 selection in compressed_tensors.py:828) and

  FlashInfer autotune warmup paths (kernel_warmup.py:340/383).

  On Ascend, none of the referenced backends (torch/xpu/flashinfer_cutedsl/aiter)

  map to Ascend-native GEMM kernels; vllm-ascend does not define or read this

  parameter in the provided context, so it has no Ascend-specific dispatch

  effect. The Ascend linear path is governed by vllm-ascend''s own platform

  dispatch (torch_npu / ACLNN ops) rather than this flag. Consequently the

  parameter has only a marginal, indirect effect on Ascend runtime — mainly

  through the generic fallback path when a requested backend has no kernel

  (a WARNING is logged and normal selection resumes). It does not change

  throughput/latency meaningfully on NPU.

  '
usage_locations:
- file: vllm/engine/arg_utils.py:1678
  context: Registers --linear-backend CLI argument from KernelConfig.linear_backend
- file: vllm/engine/arg_utils.py:2563
