related_parameters:
- name: kernel.linear_backend_per_quant
  relation: Per-quantization override; takes precedence over linear_backend in _get_linear_backend
- name: kernel.moe_backend
  relation: Sibling kernel backend selector for MoE layers
- name: kernel.enable_flashinfer_autotune
  relation: Interacts with flashinfer_cutedsl backend for autotune warmup
