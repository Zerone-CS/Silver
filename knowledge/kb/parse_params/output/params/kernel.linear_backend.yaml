constraints:
- Layer types without a kernel for the requested backend fall back to automatic selection with a WARNING rather than failing
  startup.
- The value is normalized to lowercase with '-' replaced by '_' before matching backend names.
- Setting linear_backend to a non-'auto' value overrides kernel_config.linear_backend only when the top-level value is not
  'auto'.
tuning_advice:
  summary: Leave at 'auto' on Ascend NPU; this flag targets GPU-specific GEMM backends and has negligible Ascend impact.
  suggested_values:
  - scenario: Ascend NPU deployment (v1 or v2 worker)
    value: auto
    reason: No Ascend-native backend is selectable via this flag; auto lets vllm-ascend's platform dispatch choose the appropriate
      linear kernels.
  - scenario: Debugging kernel selection on GPU reference
    value: torch
    reason: Forces the generic torch GEMM path, useful for isolating backend-specific issues; not beneficial on Ascend.
  caveats:
  - Do not expect throughput gains from setting a specific backend on Ascend; the flag does not map to ACLNN/torch_npu kernels.
  - If a requested backend lacks a kernel for a layer type, vLLM logs a WARNING and falls back, so behavior may be unchanged.
  quick_guide: Keep --linear-backend auto on Ascend; it only matters for GPU-specific GEMM backends.
analysis_date: '2026-10-27'
