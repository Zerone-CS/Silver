related_parameters:
- name: --max-num-queued-reqs
  relation: Sibling admission-control limit on number of in-flight requests; both enforced in API server and return HTTP 503
- name: --max-num-seqs
  relation: Per-DP-rank concurrency limit; max_num_queued_tokens is a global prefill-token cap across DP ranks
- name: --max-num-batched-tokens
  relation: Controls per-iteration prefill/decode token budget; interacts with prefill throughput used to size the queued-token
    limit
- name: --enable-chunked-prefill
  relation: Chunked prefill progress is not subtracted from queued tokens, so the count stays conservative
- name: --data-parallel-size
  relation: Limit is enforced across all DP ranks the API server routes to; size relative to aggregate prefill throughput
constraints:
- The value must be a non-negative integer (Field ge=0) or None for no limit.
- The limit is enforced in the API server process and covers the prefill backlog across all DP ranks it routes to, not per
  rank.
- A partially prefilled request contributes its full prompt_len until it transitions out of the prefill phase; chunked-prefill
  progress and prefix-cache hits are not subtracted.
tuning_advice:
  summary: Set to target_TTFT * aggregate_prefill_throughput to bound prefill backlog and protect TTFT without over-rejecting
    requests.
  suggested_values:
  - scenario: Latency-sensitive online serving with strict TTFT SLA
    value: target_TTFT_seconds * aggregate_prefill_tokens_per_sec
    reason: Directly implements the documented TTFT QoS formula, rejecting requests when the prefill backlog would exceed
      the latency target.
  - scenario: Throughput-oriented batch/offline workloads
    value: unset
    reason: Leave unset (None) to avoid 503 rejections and maximize throughput when TTFT is not a concern.
  - scenario: Disaggregated prefill-decode deployment
    value: prefill_pool_capacity_in_tokens
    reason: Maps directly to the prefill pool's capacity so the prefill workers are not oversubscribed.
  - scenario: Multi-DP-rank deployment
    value: data_parallel_size * per_rank_prefill_throughput * target_TTFT
    reason: The limit is enforced across all DP ranks the API server routes to, so use aggregate throughput in the formula.
  caveats:
  - Because the count is conservative, add headroom above the theoretical value to avoid premature 503s.
  - Coordinate with --max-num-queued-reqs so neither limit binds unexpectedly before per-rank admission does.
  - Monitor HTTP 503 rate; frequent rejections indicate the limit is too tight for the offered load.
  quick_guide: Set to target_TTFT × aggregate prefill throughput, or leave None for throughput-first workloads.
analysis_date: '2026-10-27'
