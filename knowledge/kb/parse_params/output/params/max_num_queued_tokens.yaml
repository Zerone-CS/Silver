name: --max-num-queued-tokens
type: cli
category: scheduling
scope: vllm
source_file:
- vllm/config/scheduler.py:87
- vllm/engine/arg_utils.py:1605
- vllm/engine/arg_utils.py:561
- vllm/engine/arg_utils.py:377
- vllm/v1/engine/async_llm.py:306
- vllm/v1/engine/async_llm.py:321
value_type: int
default: null
valid_choices: int >= 0, or None (no limit); accepts human-readable suffixes (e.g. 1K, 2M)
cli_example: --max-num-queued-tokens 1000000
deprecated: false
performance_impact: medium
performance_scope:
- latency
- throughput
impact_detail: 'This is an admission-control (TTFT QoS) parameter enforced in the API server

  process, not in the scheduler or on the NPU itself. In vllm/v1/engine/async_llm.py

  check_admission() reads scheduler_config.max_num_queued_tokens and compares it

  against output_processor.get_num_queued_tokens(), which sums prompt_len over all

  requests still in the prefill phase. If the incoming request would push the total

  over the limit, MaxQueuedTokensError is raised and mapped to HTTP 503, so the

  client/load balancer retries elsewhere.

  Performance mechanism: "it does not change per-token compute, kernel selection,"

  or memory allocation on Ascend NPU. Instead it bounds the prefill backlog, which

  indirectly controls TTFT (time-to-first-token) latency and protects the NPU from

  being flooded with long prompts that would starve decode steps. By capping the

  aggregate prompt tokens in prefill, it keeps the scheduler''s prefill/decode mix

  stable, which on Ascend matters because large prefill batches inflate TTFT and

  can reduce decode throughput. The count is conservative: a partially-prefilled

  request still contributes its full prompt_len until it leaves the prefill phase,

  because num_computed_tokens/num_cached_tokens are only propagated to the API

  server after prefill completes. This overestimation causes earlier rejection,

  preserving TTFT targets but potentially lowering effective throughput if set too

  low. No vllm-ascend override of this parameter was found in the provided context;

  it is a pure upstream vLLM v1 admission-control knob that applies equally on

  Ascend NPU deployments.

  '
