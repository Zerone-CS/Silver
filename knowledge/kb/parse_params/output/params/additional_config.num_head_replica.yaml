related_parameters:
- name: additional_config.pd_tp_ratio
  relation: Sibling pure-derived field; both computed from parallel config during derive_and_validate.
- name: additional_config.pd_head_ratio
  relation: Sibling pure-derived field; head-replica count is typically derived from the same PD head-ratio computation.
- name: additional_config.enable_sp_by_pass
  relation: Another pure-derived field in the same derived-fields group.
constraints:
- num_head_replica is a pure-derived field and is not user-settable; it is computed automatically during config derivation.
- Because AscendConfig uses extra="forbid", unknown or misspelled keys in additional_config raise an error at startup.
tuning_advice:
  summary: Do not tune num_head_replica directly — it is a derived field; control the underlying parallel/PD configuration
    instead.
  suggested_values:
  - scenario: Standard (non-PD) deployment
    value: 1
    reason: Default sentinel; no head replication is derived when PD disaggregation is not in use.
  - scenario: PD-disaggregated deployment needing head replication
    value: <computed>
    reason: Let derive_and_validate() compute it from the parallel/PD configuration rather than setting it manually.
  caveats:
  - Setting this field manually has no effect because it is overwritten during config derivation.
  - Tune the upstream parallel settings (tensor-parallel-size, PD ratios) that drive the derivation instead of this field.
  quick_guide: Leave num_head_replica unset; it is auto-derived from your parallel/PD configuration.
