impact_detail: 'num_head_replica is a pure-derived field in the vllm-ascend AscendConfig pydantic model

  (vllm_ascend/ascend_config.py:649). The class docstring explicitly lists it among

  "Pure-derived fields computed automatically and not user-settable" alongside

  enable_sp_by_pass, pd_tp_ratio, and pd_head_ratio (vllm_ascend/ascend_config.py:555-557).

  It is initialized to a sentinel default of 1 and is intended to be overwritten by the

  derive_and_validate() business-validation pass (vllm_ascend/ascend_config.py:684) based on

  the parallel configuration (e.g. PD-disaggregated TP/head ratios). Because it is derived

  rather than user-controlled, it does not itself introduce a tunable performance knob; any

  performance effect is indirect, flowing through the PD-disaggregation / head-replication

  logic that consumes it. No direct usage sites were found in the provided context, so the

  concrete runtime consumer cannot be confirmed from source alone. Setting it manually has no

  meaningful tuning effect and is discouraged.

  '
usage_locations:
