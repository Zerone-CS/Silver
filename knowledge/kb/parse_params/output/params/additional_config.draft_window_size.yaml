name: additional_config.draft_window_size
type: nested
category: speculation
scope: vllm-ascend
source_file:
- vllm_ascend/ascend_config.py:586
- vllm_ascend/ascend_config.py:437
- vllm_ascend/spec_decode/llm_base_proposer.py:415
value_type: int
default: null
valid_choices: any positive integer (block-aligned internally); null/absent disables the window
cli_example: null
deprecated: false
performance_impact: high
performance_scope:
- throughput
- latency
impact_detail: 'draft_window_size caps only the draft model''s attention to the most recent N tokens

  (sliding-window draft attention). It is read from the validated AscendConfig singleton

  in vllm_ascend/spec_decode/llm_base_proposer.py:417 (self.draft_window_size =

  get_ascend_config().draft_window_size) and, when non-None, a SlidingWindowAdapter is

  constructed (see test asserting SlidingWindowAdapter(4096, 16, 8, 4, "cpu")). The

  mechanism: "draft models are often trained on short contexts (4-8k); when the running"

  context grows far beyond that, the draft''s attention goes out-of-distribution and the

  acceptance rate collapses, turning speculation into pure overhead. Capping the draft''s

  KV attention to a short in-distribution window restores acceptance length (docs cite

  GLM-5.2 DSpark draft recovering from ~1.0 to ~4.7-5.5 at 32k, up to +381% end-to-end

  throughput). The target model still attends to the full context, so output quality is

  unchanged. This is a pure speculation-efficiency lever: it does not change target

  compute or memory, but it directly changes the number of accepted tokens per verify

  step, hence decode throughput and latency. It only takes effect when speculative

  decoding is enabled with a compatible method (eagle3, dflash, dspark).

  '
usage_locations:
- file: vllm_ascend/ascend_config.py:586
  context: 'Field definition draft_window_size: int | None = None in AscendConfig (pydantic dataclass, extra=forbid).'
