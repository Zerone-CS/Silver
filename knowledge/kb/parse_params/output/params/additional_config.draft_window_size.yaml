related_parameters:
- name: speculative_config.method
  relation: Only effective for eagle3, dflash, dspark; ignored (force-disabled) for mtp.
- name: speculative_config.num_speculative_tokens
  relation: Determines verify depth; acceptance gains from the window translate into more accepted tokens per step.
- name: speculative_config.model
  relation: The draft model's native sliding_window (if any) sets a lower bound for a useful draft_window_size.
- name: VLLM_USE_V2_MODEL_RUNNER
  relation: Feature works on MRV1 (default); not yet supported under V2 model runner.
constraints:
- draft_window_size is only honored when speculative decoding is enabled with method eagle3, dflash, or dspark.
- For method mtp the window is force-disabled (ignored with a warning) because MTP reuses the target model's own layers.
- For a dspark draft paired with a DeepSeek-V4 target, a warning is logged and windowing degrades acceptance because the draft
  is already long-context stable.
- The feature is not supported under VLLM_USE_V2_MODEL_RUNNER=1; it works on the default MRV1 model runner.
- Unknown keys in additional_config are rejected (extra=forbid), so the key must be spelled exactly draft_window_size.
tuning_advice:
  summary: Enable a draft KV sliding window (512-4096) for eagle3/dflash/dspark drafts that lose acceptance at long context;
    leave off for mtp or already long-context-stable drafts.
  suggested_values:
  - scenario: Draft trained on short contexts (4-8k) whose acceptance collapses at long context (e.g. 32k)
    value: 1024
    reason: Docs report a 512-1024 window restored a GLM-5.2 DSpark draft from ~1.0 to ~4.7-5.5 acceptance at 32k, with up
      to +381% end-to-end throughput.
  - scenario: Moderate long-context degradation, want a safer larger window
    value: 2048
    reason: 'Design doc example uses {"draft_window_size": 2048}; a larger window preserves more draft context while still
      bounding OOD attention.'
  - scenario: Draft natively trained with sliding-window attention (config carries sliding_window)
    value: 4096
    reason: Keep draft_window_size at or above the draft's native training window (e.g. 2048-native SWA) to avoid acceptance
      loss; 4096 is a safe upper typical value.
  - scenario: Draft already stable at long context, or method is mtp
    value: unset
    reason: Omit the key to disable; windowing a stable draft only removes useful information, and mtp force-disables it anyway.
  caveats:
  - Do not set draft_window_size below the draft's native training sliding_window; it reduces acceptance.
  - Not supported under VLLM_USE_V2_MODEL_RUNNER=1; use the default MRV1 runner.
  - 'Verify effect via the server log ''SpecDecoding metrics: Mean acceptance length'' before and after enabling.'
  - Ignored with a warning for mtp and for dspark+DeepSeek-V4 targets.
  quick_guide: 'Set additional_config={"draft_window_size": 1024} for eagle3/dflash/dspark drafts that lose acceptance at
    long context; omit for mtp.'
analysis_date: '2026-10-27'
