  context: Same break logic in balance-schedule patch
- file: vllm_ascend/worker/model_runner_v1.py:1725
  context: 'v1 worker: selects AscendAttentionState.ChunkedPrefill when enabled'
- file: vllm_ascend/worker/v2/attn_utils.py:616
  context: 'v2 worker: selects AscendAttentionState.ChunkedPrefill when enabled'
