name: --enable-chunked-prefill
type: cli
category: scheduling
scope: both
source_file:
- vllm/engine/arg_utils.py:1618
- vllm/engine/arg_utils.py:647
- vllm/config/scheduler.py:116
- vllm/config/scheduler.py:277
- vllm_ascend/worker/model_runner_v1.py:1725
- vllm_ascend/worker/v2/attn_utils.py:616
- vllm_ascend/attention/attention_v1.py:282
- vllm_ascend/attention/mla_v1.py:294
- vllm_ascend/utils.py:1460
- vllm_ascend/core/recompute_scheduler.py:670
- vllm_ascend/core/dyntra_lb_scheduler.py:872
- vllm_ascend/core/scheduler_profiling_chunk.py:874
- vllm_ascend/patch/platform/patch_balance_schedule.py:556
value_type: bool
default: true
valid_choices: true or false (boolean flag; CLI default is None which resolves to True in SchedulerConfig)
cli_example: --enable-chunked-prefill
deprecated: false
performance_impact: high
performance_scope:
- latency
- throughput
- memory
impact_detail: "Chunked prefill splits a long prompt into chunks bounded by the remaining\nmax_num_batched_tokens budget,\
  \ so prefill and decode work can be co-scheduled\nin the same step. On Ascend this parameter has several distinct effects:\n\
  \n1. Scheduler behavior (vllm_ascend/core/recompute_scheduler.py:670,\n   dyntra_lb_scheduler.py:872, scheduler_profiling_chunk.py:874,\n\
  \   patch_balance_schedule.py:556): when enable_chunked_prefill is False and a\n   request's num_new_tokens exceeds the\
  \ token budget, the scheduler `break`s\n   instead of splitting the request. This means a long prompt cannot be\n   partially\
  \ scheduled — it either fits entirely in the budget or waits,\n   which increases TTFT for long prompts and can leave the\
  \ batch under-filled\n   (lower throughput). When True, num_new_tokens is clamped to the budget and\n   the request is resumed\
  \ next step.\n\n2. Attention state selection (vllm_ascend/worker/model_runner_v1.py:1725 and\n   vllm_ascend/worker/v2/attn_utils.py:616):\
  \ when chunked prefill is enabled,\n   the model runner selects AscendAttentionState.ChunkedPrefill for mixed\n   prefill/decode\
  \ batches. This routes attention through the splitfuse/chunked\n   prefill kernel path on the NPU (different from PrefillCacheHit),\
  \ which\n   affects kernel selection and thus latency/throughput of the attention op.\n\n3. Attention metadata builders\
  \ (vllm_ascend/attention/attention_v1.py:282,\n   mla_v1.py:294) cache `chunked_prefill_enabled` and use it to decide how\n\
  \   attention metadata is built for the fused infer attention score kernel.\n\n4. Block size override (vllm_ascend/utils.py:1460):\
  \ if chunked prefill is\n   enabled and block_size != 128, vllm-ascend forces cache_config.block_size\n   to 128. This changes\
  \ KV cache memory layout and can affect memory usage and\n   kernel efficiency.\n\nNet effect: \"enabling chunked prefill\
  \ improves TTFT for long prompts and\"\nimproves batch utilization/throughput by allowing prefill+decode overlap, at\nthe\
  \ cost of the chunked-prefill attention kernel path and a forced block size\nof 128.\n"
