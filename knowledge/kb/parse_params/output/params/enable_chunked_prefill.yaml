related_parameters:
- name: --max-num-batched-tokens
  relation: Chunk size is bounded by the remaining max_num_batched_tokens budget; larger budget means fewer chunks
- name: --enable-prefix-caching
  relation: Both trigger the block_size=128 override in vllm_ascend/utils.py; both are disabled together for batch invariance
- name: --block-size
  relation: Forced to 128 when chunked prefill is enabled (vllm_ascend/utils.py:1460)
- name: --long-prefill-token-threshold
  relation: Caps num_new_tokens before the chunked-prefill budget check
- name: --pipeline-parallel-size
  relation: Dynamic chunk pipeline parallel feature requires --enable-chunked-prefill
- name: --async-scheduling
  relation: Commonly enabled together for throughput
constraints:
- Encoder-decoder models do not support chunked prefill; vLLM forces enable_chunked_prefill=False for them.
- Models without a KV cache (encoder-only) have chunked prefill disabled automatically at engine core init.
- Batch invariance mode does not support chunked prefill; you must explicitly pass --no-enable-chunked-prefill together with
  --block-size 128.
- The dynamic chunk pipeline parallel feature requires --enable-chunked-prefill to be enabled.
- Dynamic chunk pipeline parallel is incompatible with additional_config.scheduler_config.enable_balance_scheduling.
tuning_advice:
  summary: 'Keep chunked prefill enabled (the default) for most Ascend deployments to

    improve TTFT on long prompts and batch utilization; disable it only for

    batch-invariance requirements or encoder-decoder models.

    '
  suggested_values:
  - scenario: Long-context / multi-user serving (default)
    value: true
    reason: Splits long prompts so they don't monopolize the batch, reducing TTFT fluctuation and improving throughput via
      prefill/decode overlap.
  - scenario: Batch invariance required
    value: false
    reason: Batch invariance does not support chunked prefill; must be explicitly disabled together with --block-size 128.
  - scenario: Dynamic chunk pipeline parallel
    value: true
    reason: The dynamic chunk pipeline parallel feature requires --enable-chunked-prefill.
  - scenario: Encoder-decoder models
    value: false
    reason: vLLM forces chunked prefill off for encoder-decoder models; setting it has no effect.
  caveats:
  - Enabling chunked prefill forces KV cache block_size to 128 on Ascend (vllm_ascend/utils.py:1460), changing memory layout.
  - When enabled, mixed batches use AscendAttentionState.ChunkedPrefill, routing attention through the splitfuse/chunked-prefill
    kernel path.
  - Disabling it makes the scheduler break on oversized prefills, which can under-fill the batch and hurt throughput for long
    prompts.
  - For batch invariance you must also set --block-size 128; the features are not disabled automatically.
  - Dynamic chunk pipeline parallel cannot be combined with enable_balance_scheduling.
  quick_guide: Leave --enable-chunked-prefill on for long-context/throughput; turn it off (with --block-size 128) only for
    batch invariance.
analysis_date: '2026-10-27'
