impact_detail: 'VLLM_DEBUG_DUMP_PATH is a debug-only environment variable read in vllm/envs.py

  (getter returns os.environ.get("VLLM_DEBUG_DUMP_PATH", None)). When set, it is

  consumed in vllm/config/vllm.py:2066 during VllmConfig.__post_init__: the value is

  converted to an absolute expanded Path and assigned to

  compilation_config.debug_dump_path, overriding any config-specified

  debug_dump_path (with a warning logged). This path is used by the torch.compile /

  Inductor pipeline to dump FX graphs and related compilation artifacts to disk.

  The performance effect is indirect and only present when compilation/debug dumping

  is active: "writing graph artifacts adds filesystem I/O and disk usage during"

  compilation (cold-start latency), but it does not change the generated kernels or

  the steady-state inference throughput. It is explicitly listed in the

  compile_factors ignored_factors set (vllm/envs.py:2262), meaning it does NOT

  participate in the torch.compile cache key — so changing it will not invalidate

  or alter compiled artifacts. On Ascend, vllm-ascend does not define or override

  this variable; it only affects the upstream torch.compile debug path, which is

  largely bypassed when Ascend uses its own graph/compilation flow. Hence impact is

  low and limited to compile-time I/O.

  '
usage_locations:
