  relation: VLLM_DEBUG_DUMP_PATH overrides this config field when set
- name: VLLM_USE_STANDALONE_COMPILE
  relation: Related compilation toggle; debug dumping only matters when compilation runs
- name: VLLM_PATTERN_MATCH_DEBUG
  relation: Sibling debug env var for custom pass pattern matching
constraints:
- The value must be a valid filesystem path; it is converted via Path(...).absolute().expanduser(), so relative paths are
  resolved against the current working directory.
- When set, it unconditionally overrides any user-specified compilation_config.debug_dump_path (a warning is logged).
- It has no effect on the torch.compile cache key because it is in the ignored_factors set.
tuning_advice:
  summary: Leave unset in production; set only temporarily to a dedicated directory when debugging torch.compile graph generation.
  suggested_values:
  - scenario: Production / normal serving
    value: <unset>
    reason: Avoids compile-time disk I/O and artifact accumulation; no benefit to runtime performance.
  - scenario: Debugging compilation / graph issues
    value: /tmp/vllm_debug_dump
    reason: Points FX graph dumps to a scratch directory for inspection without polluting the working tree.
  caveats:
  - Only affects the upstream torch.compile debug path; on Ascend this path is largely bypassed, so expect limited usefulness.
  - Remember to unset it after debugging to prevent unbounded dump directory growth.
  quick_guide: Unset in production; set to a scratch dir only when debugging compilation.
