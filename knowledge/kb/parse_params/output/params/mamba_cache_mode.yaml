related_parameters:
- name: --enable-prefix-caching
  relation: When enabled, the engine derives 'align' as the default mode; 'none' is used when prefix caching is disabled
- name: --mamba-block-size
  relation: 'Derived from the mode: equals block_size in ''align'', LCM-aligned attention block size in ''all'', max_model_len
    otherwise'
- name: --block-size
  relation: Must divide mamba_block_size in align mode; block_size is raised to fit mamba page size
- name: --kv-transfer-config
  relation: AscendStoreConnector forces 'align' and rejects other modes for hybrid models
- name: --enable-mamba-fine-grained-prefix-cache
  relation: Only takes effect when mamba_cache_mode is 'align'
- name: --use-replayssm
  relation: Requires mamba_cache_mode 'none' or 'align'
- name: --disable-hybrid-kv-cache-manager
  relation: Hybrid KV cache manager must stay enabled for mamba cache modes to apply
constraints:
- When an AscendStoreConnector (or MultiConnector containing one) is used with a hybrid model, mamba_cache_mode must be 'align';
  any other value raises an assertion error.
- mamba cache mode 'all' is not supported by the V2 model runner and will be rejected there.
- In align mode with prefix caching disabled but KV transfer enabled, mamba_block_size must be a multiple of block_size.
- Align mode requires chunked MM input to remain enabled (disable_chunked_mm_input must be false).
- use_replayssm requires mamba_cache_mode to be 'none' or 'align'.
- enable_mamba_fine_grained_prefix_cache only takes effect when mamba_cache_mode is 'align'.
tuning_advice:
  summary: Use 'align' (the default with prefix caching) for hybrid models on Ascend; avoid 'all' (unsupported on v2, memory-heavy)
    and let AscendStoreConnector auto-select 'align' for PD disaggregation.
  suggested_values:
  - scenario: Hybrid model serving with prefix caching enabled (default deployment)
    value: align
    reason: Enables recurrent-state prefix-cache reuse and partial hash hits (patch_kv_cache_coordinator.py:211), improving
      throughput on shared prefixes; this is the engine-derived default.
  - scenario: PD disaggregation with AscendStoreConnector / MultiConnector
    value: align
    reason: Forced by patch_mamba_config.py:167-172; any other value raises an assertion. No manual flag needed per GLM5.3-Flash
      docs.
  - scenario: Prefix caching disabled, memory-constrained single-request workloads
    value: none
    reason: Skips mamba preprocess/postprocess entirely (model_runner_v1.py:1012), minimizing per-step overhead and recurrent-state
      memory.
  - scenario: V2 worker path
    value: align
    reason: '''all'' is listed as unsupported by the V2 model runner (vllm/config/vllm.py:2878); align is the only fully supported
      mode.'
  caveats:
  - Do not set 'all' on Ascend v2 — it is rejected as unsupported.
  - When using AscendStoreConnector, do not pass --mamba-cache-mode manually; the engine sets 'align' automatically.
  - Keep --enable-prefix-caching and chunked prefill enabled for align mode to be effective.
  - If mamba_block_size is set manually in align mode, ensure it is a multiple of block_size.
  quick_guide: Leave unset (defaults to align with prefix caching); never use 'all' on v2; AscendStoreConnector forces align
    automatically.
