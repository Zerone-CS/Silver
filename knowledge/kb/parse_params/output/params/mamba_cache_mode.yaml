name: --mamba-cache-mode
type: cli
category: kv_cache
scope: both
source_file:
- vllm/config/cache.py:178
- vllm/engine/arg_utils.py:1312
- vllm/engine/arg_utils.py:2115
- vllm_ascend/patch/platform/patch_mamba_config.py:167
- vllm_ascend/patch/platform/patch_mamba_config_310.py:68
- vllm_ascend/platform.py:418
- vllm_ascend/patch/platform/patch_kv_cache_coordinator.py:211
- vllm_ascend/worker/model_runner_v1.py:1012
- vllm_ascend/worker/v2/model_runner.py:1063
value_type: str
default: none
valid_choices:
- none
- all
- align
cli_example: --mamba-cache-mode align
deprecated: false
performance_impact: high
performance_scope:
- latency
- throughput
- memory
impact_detail: "This parameter selects the recurrent-state (Mamba/linear-attention) caching strategy for\nhybrid models (e.g.\
  \ GLM-5.3-Flash, Qwen3-Next style). It has a large effect on Ascend because\nvllm-ascend rewrites the mode and the derived\
  \ block sizes in several places:\n\n1. Upstream default is \"none\" (vllm/config/cache.py:178). When prefix caching is enabled\
  \ the\n   engine derives \"align\" (docstring: \"This is the default when prefix caching is enabled\").\n   \"all\" caches\
  \ the mamba state at every i*block_size position; \"align\" only caches the last\n   token of each scheduler step that lands\
  \ on a block boundary.\n\n2. vllm-ascend forces \"align\" whenever an AscendStoreConnector (or MultiConnector containing\n\
  \   one) is used with a hybrid model: patch_mamba_config.py:167-172 sets\n   mamba_cache_mode=\"align\" if it was \"none\"\
  , and asserts it must already be \"align\"\n   otherwise (\"mamba_cache_mode only support 'align' when kv_transfer enabled\
  \ now!\").\n   So with KV-store PD disaggregation the user cannot choose \"all\" or \"none\".\n\n3. The mode drives block-size\
  \ selection, which directly changes KV-cache memory footprint and\n   page padding. patch_mamba_config_310.py:68-85: in\
  \ \"all\" mode mamba_block_size is set to an\n   LCM-aligned attention block size; in \"align\" mode mamba_block_size =\
  \ block_size; otherwise\n   mamba_block_size = max_model_len. platform.py:418-426 additionally asserts\n   mamba_block_size\
  \ % block_size == 0 when prefix caching is off but KV transfer + hybrid is on.\n   Larger mamba_block_size means more recurrent-state\
  \ checkpoints per request -> more NPU HBM\n   consumed by the mamba cache group and fewer KV blocks available for attention.\n\
  \n4. Runtime dispatch differs by mode. v1 worker (model_runner_v1.py:1012, 2419): \"align\" uses\n   mamba_utils.preprocess_mamba\
  \ / postprocess_mamba_align_gpu with Ascend-specific state copy\n   funcs; \"all\" uses postprocess_mamba_all; \"none\"\
  \ skips mamba postprocessing entirely. The\n   \"align\" path also forces deferred state corrections to be applied before\
  \ preprocess, adding\n   CPU-side work per step. v2 worker (model_runner.py:1063) only special-cases \"align\" for PP\n\
  \   non-last ranks (gather_block_tables before postprocess_sampled).\n\n5. patch_kv_cache_coordinator.py:211 enables enable_partial_hash_hits\
  \ only when a MambaSpec has\n   mamba_cache_mode == \"align\" and block_size > hash_block_size, changing prefix-cache hit\n\
  \   granularity (more cache hits -> higher throughput on repeated prefixes).\n\n6. Upstream vllm/config/vllm.py:2878 marks\
  \ mamba cache mode \"all\" as unsupported by the V2\n   model runner, so on Ascend v2 \"all\" is effectively unavailable.\n\
  \nNet: \"\\\"align\\\" gives prefix-cache reuse of recurrent state (throughput win on shared prefixes)\"\nat the cost of\
  \ extra per-step state-copy work and larger mamba block bookkeeping; \"none\"\nminimizes memory and per-step overhead but\
  \ loses prefix-cache reuse; \"all\" maximizes reuse\ngranularity but costs the most memory and is unsupported on v2.\n"
