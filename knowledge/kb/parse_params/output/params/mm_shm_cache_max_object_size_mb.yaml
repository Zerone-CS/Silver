name: --mm-shm-cache-max-object-size-mb
type: cli
category: model
scope: vllm
source_file:
- vllm/config/multimodal.py:160
- vllm/config/multimodal.py:299
- vllm/engine/arg_utils.py:603
- vllm/engine/arg_utils.py:1391
- vllm/multimodal/cache.py:533
- vllm/multimodal/cache.py:790
value_type: int
default: 128
valid_choices: integer >= 0 (MiB); only meaningful when --mm-processor-cache-type is 'shm'
cli_example: --mm-shm-cache-max-object-size-mb 128
deprecated: false
performance_impact: low
performance_scope:
- memory
- latency
impact_detail: 'This parameter only takes effect when --mm-processor-cache-type is "shm", which selects the

  shared-memory FIFO object store path (ShmObjectStoreSenderCache / ShmObjectStoreReceiverCache

  in vllm/multimodal/cache.py). In that path, mm_shm_cache_max_object_size_mb is multiplied by

  MiB_bytes and passed as `max_object_size` to SingleWriterShmObjectStorage (cache.py:533 for the

  sender, cache.py:790 for the receiver). It bounds the size of a single serialized multi-modal

  object that can be placed into the shared-memory ring buffer whose total capacity is set by

  --mm-processor-cache-gb. It does not allocate memory itself; it is a per-object admission limit

  into an already-sized ring buffer. Consequently its runtime effect is indirect: if a processed

  multi-modal item exceeds this limit it cannot be cached in SHM and must be re-processed or

  transported uncached, adding CPU preprocessing latency and IPC overhead on repeated identical

  inputs; raising it lets larger items (e.g. high-resolution images / long videos) be cached,

  improving latency for repeated multimodal prompts. It has no effect on the default "lru" cache

  type, and no Ascend-specific override exists in vllm-ascend (the parameter is not referenced

  there), so behavior on NPU matches upstream vLLM. It does not touch NPU HBM or HCCL.

  '
usage_locations:
- file: vllm/config/multimodal.py:160
  context: Field definition with default 128 and ge=0; docstring states only effective when mm_processor_cache_type is 'shm'.
- file: vllm/config/multimodal.py:299
  context: _validate_multimodal_config raises ValueError if set to a non-default value while mm_processor_cache_type != 'shm'.
- file: vllm/engine/arg_utils.py:1391
  context: CLI argument registration in the MultiModalConfig argument group.
- file: vllm/multimodal/cache.py:533
  context: 'Sender side: max_object_size = mm_shm_cache_max_object_size_mb * MiB_bytes passed to SingleWriterShmObjectStorage.'
- file: vllm/multimodal/cache.py:790
  context: 'Receiver side: same max_object_size used when constructing the reader-side SHM object storage.'
related_parameters:
- name: --mm-processor-cache-type
  relation: Must be 'shm' for this parameter to have any effect; setting a non-default value with another cache type raises
    ValueError.
- name: --mm-processor-cache-gb
  relation: Sets the total SHM ring buffer capacity; the per-object limit must fit within this budget for objects to be stored.
- name: --mm-hasher-algorithm
  relation: Used together in the multimodal cache hashing/lookup path for SHM caching.
constraints:
- Setting --mm-shm-cache-max-object-size-mb to a non-default value while --mm-processor-cache-type is not 'shm' raises a ValueError.
- The value must be an integer greater than or equal to 0 (Field(ge=0)).
- The parameter has no effect unless --mm-processor-cache-type is set to 'shm'.
tuning_advice:
  summary: Leave at the default 128 MiB unless using the 'shm' cache with large images/videos that fail to cache; then raise
    it to fit the largest processed item within the --mm-processor-cache-gb budget.
  suggested_values:
  - scenario: Default / LRU cache type (mm_processor_cache_type='lru')
    value: 128
    reason: Parameter is inert for the default LRU cache; keep the default to avoid the validation error.
  - scenario: SHM cache with typical image inputs
    value: 128
    reason: Default 128 MiB comfortably fits most single-image processed tensors; no change needed.
  - scenario: SHM cache with high-resolution images or long videos that exceed the default limit
    value: 512
    reason: Raising the per-object limit allows larger processed items to be stored in SHM, avoiding repeated CPU preprocessing
      and IPC on repeated multimodal prompts; ensure --mm-processor-cache-gb is large enough to hold such objects.
  caveats:
  - Must set --mm-processor-cache-type shm first, otherwise a non-default value triggers a ValueError.
  - Keep the per-object limit below the total SHM buffer size set by --mm-processor-cache-gb.
  - This parameter does not affect NPU memory or compute; it only influences host-side multimodal caching behavior.
  quick_guide: Only tune when using --mm-processor-cache-type shm and large multimodal inputs fail to cache; otherwise leave
    at 128.
analysis_date: '2026-10-27'
