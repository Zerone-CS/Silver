name: --enable-moe-shared-loras
type: cli
category: model
scope: both
source_file:
- vllm/config/lora.py:81
- vllm/engine/arg_utils.py:640
- vllm/engine/arg_utils.py:1510
- vllm/lora/model_manager.py:137
- vllm/lora/model_manager.py:800
- vllm/lora/utils.py:378
- vllm/lora/layers/fused_moe.py:56
- vllm/lora/layers/fused_moe.py:147
- vllm/model_executor/layers/fused_moe/experts/lora_context.py:49
- vllm_ascend/lora/fused_moe.py:339
value_type: bool
default: false
valid_choices: true, false
cli_example: --enable-moe-shared-loras
deprecated: false
performance_impact: medium
performance_scope:
- memory
- throughput
impact_detail: 'This flag changes the memory layout of MoE expert LoRA adapters. When enabled,

  the gate/up (w1/w3) lora_A and down (w2) lora_B factors are stored once with

  expert-dim 1 instead of per-expert, and are broadcast to the expert count at

  kernel time via a stride-0 view (see lora_context.py:46-49 comment: "LoRAExpertsMixin

  expands them to local_num_experts via a stride-0 view before the kernel").


  Memory effect (upstream vllm): In vllm/lora/layers/fused_moe.py:153-160, the

  `_w13_a_num_experts` and `_w2_b_num_experts` properties return 1 instead of

  `local_num_experts` when the flag is set. This shrinks the w13 lora_A and w2

  lora_B stacked buffers by a factor of local_num_experts, which for large MoE

  models (e.g. 128-256 experts) is a substantial reduction in LoRA adapter memory

  footprint. The w13 lora_B and w2 lora_A remain per-expert (only the "outer"

  factors are shared).


  Throughput effect: "The kernel-time broadcast via stride-0 view avoids a physical"

  copy, so the LoRA GEMM reads the same shared factor for all experts. This can

  reduce memory bandwidth pressure on the LoRA path (fewer distinct weight loads

  from HBM), but the compute cost of the LoRA GEMM is unchanged. Net throughput

  gain is modest and workload-dependent.


  Ascend override (vllm-ascend): In vllm_ascend/lora/fused_moe.py:339, the

  AscendFusedMoEWithLoRA constructor hard-codes `self.enable_moe_shared_loras = False`,

  deliberately ignoring the upstream LoRAConfig value. The Ascend wrapper skips

  FusedMoEWithLoRA.__init__ (which is GPU/Triton-only) and does not implement the

  shared-outer layout. Therefore on Ascend NPU this flag has NO effect on the

  Ascend-native MoE LoRA path — the shared layout is not honored, and adapters

  are always loaded per-expert. The unit test tests/ut/lora/test_lora.py:55

  asserts this hard-coded False. The flag still flows through LoRAConfig and

  affects upstream model_manager packing logic (model_manager.py:800,

  utils.py:391-400) which may run before the Ascend wrapper is constructed, but

  the Ascend kernel path does not consume the shared layout.

  '
