related_parameters:
- name: --enable-lora
  relation: Must be enabled for this flag to have any effect; LoRA must be active
- name: --enable-mixed-moe-lora-format
  relation: Both affect MoE LoRA wrapper selection; mixed format forces 2D wrapper, shared loras changes packing layout
- name: --max-loras
  relation: Shared layout reduces per-adapter memory, allowing more adapters within max-loras budget
- name: --max-lora-rank
  relation: Memory savings from sharing scale with rank; larger rank benefits more
- name: --enable-expert-parallel
  relation: EP shards experts across ranks; shared layout interacts with local_num_experts used in buffer sizing
constraints:
- Only meaningful for MoE models whose adapters use the shared-outer layout; ignored for non-MoE models.
- Requires --enable-lora to be set, otherwise LoRA is not active and the flag has no effect.
- On Ascend NPU, vllm-ascend hard-codes enable_moe_shared_loras to False in AscendFusedMoEWithLoRA, so the shared layout is
  not honored by the Ascend MoE LoRA kernel path.
- The adapter checkpoint must actually use the shared-outer layout (w1/w3 lora_A and w2 lora_B stored once with expert-dim
  1); enabling this flag for per-expert adapters will cause incorrect loading.
tuning_advice:
  summary: Enable only on GPU deployments serving MoE adapters in shared-outer layout to cut LoRA adapter memory; on Ascend
    NPU this flag is a no-op due to vllm-ascend override.
  suggested_values:
  - scenario: GPU (upstream vllm) serving MoE LoRA adapters stored in shared-outer layout with many experts
    value: true
    reason: Reduces w13 lora_A and w2 lora_B buffer size by a factor of local_num_experts, freeing HBM for KV cache and allowing
      more concurrent adapters.
  - scenario: Ascend NPU (vllm-ascend) deployment
    value: false
    reason: vllm-ascend hard-codes enable_moe_shared_loras=False in AscendFusedMoEWithLoRA; setting the flag provides no benefit
      and may cause adapter-loading mismatches if the checkpoint uses per-expert layout.
  - scenario: MoE adapters stored per-expert (standard layout)
    value: false
    reason: The flag expects shared-outer layout; enabling it for per-expert adapters causes incorrect weight packing and
      load failures.
  caveats:
  - On Ascend NPU this flag is neutralized by vllm-ascend; verify adapter layout matches the actual kernel path before relying
    on memory savings.
  - 'Combine with --max-loras tuning: shared layout frees memory that can be reallocated to more resident adapters.'
  - Test adapter loading correctness after enabling — the packed mapping changes to experts.w1/w2/w3.
  quick_guide: GPU-only memory optimization for shared-outer MoE adapters; no effect on Ascend NPU (overridden to False).
analysis_date: '2026-10-27'
