related_parameters:
- name: multistream_overlap_shared_expert
  relation: Enabling enable_shared_expert_dp (or TP=1) allows the extra shared-expert overlap stream to take effect
- name: enable_expert_parallel
  relation: Typically used together in MoE DP deployments; tests combine it with expert parallel
- name: use_sequence_parallel_moe
  relation: Independent of upstream MoE sequence parallelism; either or both can be enabled
- name: data_parallel_size
  relation: Meaningful only when DP > 1; shared expert runs data-parallel across DP ranks
constraints:
- Only meaningful for MoE models that have shared experts; on models without shared experts the flag has no effect.
- Unknown keys in --additional-config are rejected (extra="forbid"), so the key must be spelled exactly enable_shared_expert_dp.
- Requires a multi-rank MoE deployment (e.g. data_parallel_size > 1 with expert parallel) to provide any benefit.
tuning_advice:
  summary: Enable for MoE models with shared experts in multi-DP deployments when NPU memory headroom allows, to trade memory
    for higher throughput.
  suggested_values:
  - scenario: MoE model with shared experts (e.g. DeepSeek/Kimi) deployed with DP>1 and expert parallel, ample NPU memory
    value: true
    reason: Replicates shared-expert weights across TP ranks and runs the shared expert data-parallel, removing TP synchronization
      on that branch and improving throughput; also unlocks the shared-expert multi-stream overlap path.
  - scenario: Memory-constrained deployment or model without shared experts
    value: false
    reason: Replication increases HBM usage and provides no benefit on models lacking shared experts; keep default to preserve
      KV cache capacity.
  caveats:
  - Monitor NPU memory after enabling; weight replication can push KV cache allocation down.
  - Pair with multistream_overlap_shared_expert to fully exploit the overlap stream when TP=1 or shared-expert DP is on.
  - Validate correctness with DP2/TP2 + allgather_reducescatter as in the e2e tests before production rollout.
  quick_guide: Set enable_shared_expert_dp=true in --additional-config for multi-DP MoE models with shared experts when memory
    allows.
analysis_date: '2026-10-27'
