name: additional_config.enable_shared_expert_dp
type: nested
category: parallelism
scope: vllm-ascend
source_file:
- vllm_ascend/ascend_config.py:639
- vllm_ascend/ascend_config.py:448
value_type: bool
default: false
valid_choices: true or false
cli_example: null
deprecated: false
performance_impact: medium
performance_scope:
- throughput
- memory
impact_detail: 'This is a vllm-ascend-only switch passed through --additional-config JSON and parsed into

  AscendConfig (pydantic dataclass, extra="forbid"). It is declared as a derived field

  (vllm_ascend/ascend_config.py:639) but the unit test

  test_user_input_derived_field_survives_factory (tests/ut/test_ascend_config.py:1802) confirms

  a user-supplied value survives the factory, so it is effectively user-settable.


  Mechanism (per docs, user_guide/configuration/additional_config.md:59): when enabled, the

  shared-expert weights of a MoE model are replicated across TP ranks and the shared expert is

  executed with data parallelism instead of being tensor-parallel sharded. This removes the

  TP all-reduce/all-gather synchronization on the shared-expert branch and lets each DP rank

  compute its own shared-expert activations, which improves throughput on MoE models (e.g.

  DeepSeek/Kimi style architectures with shared experts). The cost is memory: each TP rank

  holds a full copy of the shared-expert weights rather than a 1/TP shard, so NPU HBM usage

  increases.


  The docs explicitly state this option is independent of upstream MoE sequence parallelism

  (use_sequence_parallel_moe) — either or both can be enabled. It also interacts with

  multistream_overlap_shared_expert: "per tutorials/models/DeepSeek-V3.1.md:931, the extra"

  stream for shared-expert overlap is enabled when TP size is 1 OR when

  enable_shared_expert_dp is true, so enabling this flag can unlock the multi-stream overlap

  path for shared experts.


  E2E tests (tests/e2e/pull_request/four_card/test_sequence_parallel_linear.py,

  test_kimi_k3.py) exercise it with DP2/TP2 + expert parallel + allgather_reducescatter,

  confirming it is intended for multi-DP MoE deployments.

  '
usage_locations:
