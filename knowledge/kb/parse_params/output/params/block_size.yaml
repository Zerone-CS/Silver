related_parameters:
- name: --gpu-memory-utilization
  relation: Together with block_size determines how many KV blocks fit in the available NPU memory
- name: --kv-cache-memory-bytes
  relation: Alternative explicit KV memory budget; block_size determines block count from it
- name: --num-gpu-blocks-override
  relation: Overrides computed block count; interacts with block_size for total KV capacity
- name: --enable-prefix-caching
  relation: Prefix caching hashes at block granularity; block_size affects cache hit granularity
- name: --decode-context-parallel-size
  relation: Under DCP, virtual_block_size = block_size * dcp_world_size in slot mapping
- name: cp_kv_cache_interleave_size
  relation: Docs recommend setting it equal to block_size for KV transfer scenarios
- name: --no-enable-chunked-prefill
  relation: Batch invariance requires block_size=128 together with chunked prefill disabled
constraints:
- On 310P the attention backend only supports kernel block sizes 128 and 64 (get_supported_kernel_block_sizes returns [128,
  64]).
- On 310P the KV cache tensor shape requires the head-size dimension to be aligned to a multiple of 16, so block_size must
  be compatible with the NZ-aligned 5D layout.
- For batch invariance, block_size must be 128 and chunked prefill must be explicitly disabled.
- When using sparse KV offload, topk_buffer_size must be divisible by block_size.
- The logical block size and kernel block size passed to NPUInputBatch must be consistent.
tuning_advice:
  summary: Keep block_size at 128 on Ascend NPU (the default and the value recommended by xlite graph mode and batch-invariance
    docs); use 64 only when 310P memory fragmentation demands it.
  suggested_values:
  - scenario: Default / general Ascend NPU deployment (910B, 910C, xlite graph mode)
    value: 128
    reason: 128 is the default, the value recommended by xlite graph mode (ascend_config.py:1474 warns otherwise), and required
      for batch invariance.
  - scenario: 310P (Atlas 300I DUO) with tight KV memory or high fragmentation
    value: 64
    reason: 310P backend advertises supported kernel block sizes [128, 64]; 64 reduces internal fragmentation at the cost
      of more block-table overhead.
  - scenario: Batch invariance enabled
    value: 128
    reason: Docs require --block-size 128 together with --no-enable-chunked-prefill for batch invariance.
  - scenario: KV pooling / P/D disaggregation with context parallelism
    value: 128
    reason: Docs recommend setting cp_kv_cache_interleave_size to the KV-cache block_size (default 128) for KV transfer scenarios.
  caveats:
  - Do not use values other than 128 or 64 on 310P; the backend only supports those kernel block sizes.
  - Changing block_size changes KV-cache memory granularity; re-tune --gpu-memory-utilization or --kv-cache-memory-bytes accordingly.
  - Under DCP, block_size multiplies into virtual_block_size, so verify slot mapping correctness when changing it.
  quick_guide: Use --block-size 128 on Ascend NPU; only drop to 64 on 310P when fragmentation is a problem.
analysis_date: '2026-10-27'
