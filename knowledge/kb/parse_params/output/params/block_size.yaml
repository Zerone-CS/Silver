name: --block-size
type: cli
category: kv_cache
scope: both
source_file:
- vllm/engine/arg_utils.py:1268
- vllm_ascend/ascend_config.py:1474
- vllm_ascend/_310p/attention/attention_v1.py:58
- vllm_ascend/_310p/attention/attention_v1.py:81
- vllm_ascend/_310p/block_table.py:26
- vllm_ascend/_310p/block_table.py:42
- vllm_ascend/_310p/model_runner_310p.py:99
value_type: int
default: 128
valid_choices: Positive integer; on 310P the attention backend supports kernel block sizes [128, 64]; xlite graph mode recommends
  128
cli_example: --block-size 128
deprecated: false
performance_impact: high
performance_scope:
- memory
- throughput
- latency
impact_detail: "--block-size sets the number of tokens per contiguous KV-cache block (CacheConfig.block_size).\nIt directly\
  \ determines KV-cache memory granularity and the shape of the paged KV tensors, so it\naffects both memory footprint and\
  \ attention kernel efficiency.\n\nUpstream (vllm): the flag is registered from CacheConfig (vllm/engine/arg_utils.py:1268)\
  \ and\nflows into the attention backend's get_kv_cache_shape and the block table / slot-mapping logic.\nLarger blocks reduce\
  \ block-table size and per-block bookkeeping overhead but increase internal\nfragmentation (tokens wasted at the tail of\
  \ each request's last block); smaller blocks reduce\nfragmentation but increase metadata overhead and can hurt kernel efficiency.\n\
  \nAscend-specific behavior:\n- \"310P (Atlas 300I DUO): AscendAttentionBackend310.get_kv_cache_shape builds a 5D NZ-aligned\"\
  \n  tensor (2, num_blocks, (num_kv_heads*head_size)//16, block_size, 16) — block_size is a tensor\n  dimension, so it must\
  \ be compatible with the 16-alignment requirement. The backend explicitly\n  advertises get_supported_kernel_block_sizes()\
  \ == [128, 64], so only 128 or 64 are valid kernel\n  block sizes on 310P.\n- \"310P block_table.py uses block_size in slot-mapping\
  \ arithmetic (positions // block_size,\"\n  block_numbers * block_size + block_offsets); with DCP enabled it uses a virtual_block_size\
  \ =\n  block_size * dcp_world_size, so block_size interacts with decode context parallelism.\n- \"310P model_runner_310p.py\
  \ passes block_sizes=[self.block_size] and\"\n  kernel_block_sizes=[[self.cache_config.block_size]] into NPUInputBatch,\
  \ so the value must be\n  consistent between the logical block size and the kernel block size.\n- \"xlite graph mode (vllm_ascend/ascend_config.py:1474)\
  \ warns if block_size != 128, indicating 128\"\n  is the recommended/optimal value for that graph mode.\n- \"Batch invariance\
  \ docs require --block-size 128 together with --no-enable-chunked-prefill.\"\n- \"Context-parallel / KV-transfer docs recommend\
  \ setting cp_kv_cache_interleave_size to the\"\n  KV-cache block_size (default 128).\n- \"Sparse KV offload docs require\
  \ topk_buffer_size to be divisible by block_size.\"\n"
