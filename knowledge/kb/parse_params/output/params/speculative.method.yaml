name: speculative.method
type: nested
category: speculation
scope: both
source_file:
- vllm/config/speculative.py:387
- vllm/engine/arg_utils.py:1701
- vllm_ascend/spec_decode/__init__.py:41
- vllm_ascend/worker/model_runner_v1.py:756
- vllm_ascend/worker/v2/spec_decode/__init__.py:32
- vllm_ascend/worker/v2/pp_transport.py:94
- vllm_ascend/worker/v2/pcp_manager.py:244
- vllm_ascend/ascend_config.py:102
value_type: str
default: null
valid_choices:
- ngram
- ngram_gpu
- suffix
- medusa
- eagle
- eagle3
- mtp
- dspark
- dflash
- draft_model
- extract_hidden_states
cli_example: --spec-method <method>
deprecated: false
performance_impact: high
performance_scope:
- latency
- throughput
- memory
impact_detail: "speculative.method selects which speculative decoding proposer/speculator is\ninstantiated, and this choice\
  \ fundamentally determines the decode-time\nperformance profile on Ascend NPU.\n\nv1-ascend path: \"vllm_ascend/worker/model_runner_v1.py:772\
  \ calls\"\nget_spec_decode_method(self.speculative_config.method, ...), which dispatches\nin vllm_ascend/spec_decode/__init__.py:41\
  \ to a concrete Ascend proposer:\nngram -> AscendNgramProposer, ngram_gpu -> AscendNgramProposerNPU,\nsuffix -> AscendSuffixDecodingProposer,\
  \ medusa -> AscendMedusaProposer,\ndspark -> AscendDSparkProposer, mtp (gemma4) -> AscendGemma4Proposer,\neagle/eagle3/mtp\
  \ -> AscendEagleProposer (or AscendStep3p5MTPProposer /\nAscendMultiKVCacheGroupMTPProposer for special MTP variants),\n\
  dflash -> AscendDflashProposer/AscendDflash2Proposer,\ndraft_model -> AscendDraftModelProposer,\nextract_hidden_states ->\
  \ AscendExtractHiddenStatesProposer.\nEach proposer has a different compute cost per decode step (draft forward\npasses,\
  \ n-gram lookups, hidden-state extraction), so the method directly\nchanges per-token latency and achievable throughput.\
  \ The method also sets\nself.decode_token_per_req = 1 + num_speculative_tokens (model_runner_v1.py:753),\nwhich scales the\
  \ query length of every decode attention call — a direct\nlatency/throughput lever. For eagle3/extract_hidden_states/dspark\
  \ the method\nadditionally toggles use_aux_hidden_state_outputs (model_runner_v1.py:756-764),\nwhich changes the target\
  \ model's output tensors and thus memory traffic.\n\nv2-ascend path: \"vllm_ascend/worker/v2/spec_decode/__init__.py:32\
  \ dispatches\"\ninit_speculator by method: \"extract_hidden_states reuses the upstream\"\nExtractHiddenStatesSpeculator,\
  \ dspark -> AscendDSparkSpeculator,\ndflash -> AscendDFlashSpeculator/AscendDFlash2Speculator, mtp -> Ascend MTP\nspeculator.\
  \ The v2 path is stricter and supports fewer methods than v1.\n\nThe method also gates feature compatibility that affects\
  \ performance:\n- \"KVPP (vllm_ascend/ascend_config.py:102) only allows method in (\\\"mtp\\\",\\\"dspark\\\").\"\n- \"\
  xlite graph (ascend_config.py:1463) only supports mtp/draft_model/\"\n  extract_hidden_states with a sequential causal chain,\
  \ and rejects\n  eagle3/extract_hidden_states/dflash/dspark.\n- \"MRV2 PCP (pcp_manager.py:244) only supports mtp/eagle3/dspark.\"\
  \n- \"Spec+PP (pp_transport.py:94) looks up per-method capabilities.\"\n- \"dspark triggers special KV-cache layout handling\"\
  \n  (patch_kv_cache_utils.py:634), affecting memory layout and residency.\nChoosing a method that is incompatible with an\
  \ enabled optimization forces\nthat optimization off, indirectly hurting throughput.\n"
