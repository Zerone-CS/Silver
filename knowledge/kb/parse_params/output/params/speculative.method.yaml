- file: vllm/engine/arg_utils.py:1701
  context: upstream --spec-method CLI argument registration
related_parameters:
- name: speculative.model
  relation: If model is provided, method may be auto-detected; if model is absent, method must be provided explicitly
- name: speculative.num_speculative_tokens
  relation: Together with method determines decode_token_per_req = 1 + num_speculative_tokens; (num_speculative_tokens+1)
    must be <= 16 on Ascend
- name: speculative.draft_tensor_parallel_size
  relation: Only relevant for draft-model-based methods (eagle/eagle3/draft_model/dflash)
- name: speculative.enforce_eager
  relation: DFlash2 on v2 model runner requires enforce_eager=true for the draft
- name: compilation_config.cudagraph_mode
  relation: MRV2 PCP restricts cudagraph_mode depending on method; xlite graph requires specific methods
- name: kv_transfer_config.kv_connector
  relation: KVPP PD disaggregation only supports method mtp/dspark
constraints:
- If speculative.model is not provided, speculative.method must be provided explicitly.
- On Ascend NPU, (num_speculative_tokens + 1) must be <= 16 because npu_fused_infer_attention_score supports at most 16 tokens
  per decode round.
- KVPP PD disaggregation supports speculative decoding only with method='mtp' or method='dspark'.
- xlite graph mode only supports speculative methods with a sequential causal chain (mtp, draft_model, extract_hidden_states)
  and rejects eagle3, extract_hidden_states, dflash, dspark.
- Ascend MRV2 PCP supports speculative decoding only with MTP, Eagle3 and DSpark.
- An unknown method string raises ValueError('Unknown speculative decoding method') in the v1-ascend dispatcher.
- Watermarking with speculative decoding supports only dspark, eagle, eagle3, mtp methods.
tuning_advice:
  summary: Pick the speculative method that matches your draft assets and enabled optimizations; on Ascend prefer mtp/eagle3
    for model-based speedup and ngram for zero-draft-model low-risk gains.
  suggested_values:
  - scenario: DeepSeek-family model with built-in MTP head, no separate draft model
    value: mtp
    reason: MTP uses the model's own MTP layers, requires no extra draft checkpoint, and is compatible with KVPP, xlite graph,
      and MRV2 PCP.
  - scenario: Have a trained Eagle3 draft head and want high acceptance rate
    value: eagle3
    reason: AscendEagleProposer provides the strongest model-based speedup; compatible with MRV2 PCP.
  - scenario: No draft model available, want low-risk latency reduction
    value: ngram
    reason: AscendNgramProposer requires no draft weights and adds negligible memory; good for repetitive/prompt-copy workloads.
  - scenario: GLM MLA model with DSpark draft checkpoint and PD disaggregation
    value: dspark
    reason: DSpark is the only method (besides mtp) supported by KVPP PD disaggregation and has dedicated KV-cache layout
      handling.
  - scenario: Qwen DFlash2 draft on v2 model runner
    value: dflash
    reason: AscendDFlash2Speculator is selected for DFlash2DraftModel architectures; requires enforce_eager=true for the draft.
  caveats:
  - Ensure (num_speculative_tokens + 1) <= 16 on Ascend NPU.
  - Verify the chosen method is supported by the enabled optimization (KVPP/xlite/PCP) before deployment.
  - v2 model runner supports a narrower method set than v1; confirm method availability when using VLLM_USE_V2_MODEL_RUNNER=1.
  quick_guide: Use mtp for DeepSeek MTP models, eagle3 with a draft head, ngram when no draft model exists; keep num_speculative_tokens+1
    <= 16.
