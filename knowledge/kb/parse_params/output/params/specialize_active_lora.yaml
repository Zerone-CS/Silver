related_parameters:
- name: --enable-lora
  relation: LoRAConfig is only constructed (and this flag only read) when --enable-lora is set
- name: --max-loras
  relation: Determines the upper bound of the powers-of-2 capture ladder
- name: compilation_config.cudagraph_specialize_lora
  relation: This flag only takes effect when cudagraph_specialize_lora is True
- name: --cudagraph-mode
  relation: Cudagraph capture must be enabled for specialization to matter
constraints:
- Only takes effect when cudagraph_specialize_lora is True; otherwise it is ignored.
- Only meaningful when --enable-lora is set; without LoRA the LoRAConfig is None and the flag has no effect.
- The captured active-LoRA counts are powers of 2 up to --max-loras, so the benefit is bounded by max_loras.
tuning_advice:
  summary: Leave disabled on Ascend NPU; it has no effect there. On GPU LoRA serving with cudagraph_specialize_lora, enable
    only for variable active-LoRA workloads.
  suggested_values:
  - scenario: Ascend NPU deployment (v1 or v2 worker)
    value: false
    reason: vllm-ascend does not consume this flag and uses its own LoRA/graph path, so enabling it provides no benefit and
      only adds config noise.
  - scenario: GPU LoRA serving with cudagraph_specialize_lora=True and many adapters active concurrently
    value: true
    reason: Captures powers-of-2 active-LoRA cudagraph variants, reducing latency when the active adapter count fluctuates.
  - scenario: GPU LoRA serving with a single or fixed adapter set
    value: false
    reason: No variable active-LoRA count means extra captured graphs only cost startup time and memory.
  caveats:
  - Requires cudagraph_specialize_lora=True and --enable-lora; otherwise ignored.
  - On Ascend this parameter is inert — do not rely on it for NPU LoRA performance tuning.
  quick_guide: Keep false on Ascend; only enable on GPU with cudagraph_specialize_lora and variable LoRA counts.
analysis_date: '2026-10-27'
