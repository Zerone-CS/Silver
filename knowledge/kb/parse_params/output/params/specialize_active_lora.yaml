name: --specialize-active-lora
type: cli
category: model
scope: vllm
source_file:
- vllm/engine/arg_utils.py:1503
- vllm/engine/arg_utils.py:638
- vllm/engine/arg_utils.py:2467
- vllm/config/lora.py:68
- vllm/v1/cudagraph_dispatcher.py:65
- vllm/v1/worker/gpu/lora_utils.py:33
- vllm/lora/ops/triton_ops/lora_kernel_metadata.py:39
- vllm/lora/punica_wrapper/punica_gpu.py:55
value_type: bool
default: false
valid_choices: true or false (BooleanOptionalAction-style flag)
cli_example: --specialize-active-lora
deprecated: false
performance_impact: low
performance_scope:
- latency
- memory
impact_detail: 'This flag is defined in vLLM upstream (vllm/config/lora.py:68) and only takes effect

  when `cudagraph_specialize_lora` is True. Its effect is entirely on the CUDA-graph

  capture path: "in vllm/v1/worker/gpu/lora_utils.py:get_lora_capture_cases, when"

  cudagraph_specialize_lora is enabled, `specialize_active_lora` decides whether the

  captured num_active_loras set is the powers-of-2 ladder up to max_loras (plus

  max_loras+1) or just [0, max_loras+1]. The captured counts are then threaded into

  LoRAKernelMeta (vllm/lora/ops/triton_ops/lora_kernel_metadata.py:44) and used by

  PunicaWrapperGPU (punica_gpu.py:55,121) to round num_active_loras up to the nearest

  captured value so the LoRA shrink/expand kernels hit a matching cudagraph key.

  The mechanism is CUDA-graph + Triton punica-kernel specific. On Ascend NPU, vLLM''s

  Triton punica LoRA kernels and the CUDA-graph dispatcher are not the execution path

  used by vllm-ascend (which uses its own ACLNN/CANN LoRA ops and its own graph capture

  via ACLGraph). No vllm-ascend source references specialize_active_lora, so the flag

  is effectively inert on Ascend. Even on GPU its impact is limited to LoRA-serving

  workloads with cudagraph_specialize_lora enabled, trading extra graph captures

  (startup time + memory) for slightly better latency under variable active-LoRA counts.

  '
usage_locations:
