related_parameters:
- name: additional_config.xlite_graph_config.full_mode
  relation: Sibling flag; when true forces cudagraph_mode to NONE and enforce_eager, disabling graph capture.
- name: compilation_config.cudagraph_mode
  relation: Overwritten by xlite enablement in platform.py:1192.
- name: cache_config.block_size
  relation: Forced to 128 when xlite enabled and block_size > 128.
- name: speculative_config.method
  relation: Only MTP/draft_model/extract_hidden_states allowed; eagle3/dflash/dspark rejected.
- name: parallel_config.pipeline_parallel_size
  relation: Must be 1; xlite is incompatible with pipeline parallelism.
- name: additional_config.enable_sparse_sfa_c8
  relation: Turboquant SFA path rejects xlite; xlite logs error for Sparse SFA/LI C8.
constraints:
- xlite graph is not compatible with pipeline parallelism; pipeline_parallel_size must be 1 or a RuntimeError is raised.
- When speculative decoding is used, only methods with a sequential causal chain (mtp, draft_model, extract_hidden_states)
  are allowed; other methods raise RuntimeError.
- Speculative methods with intermediate hidden states (eagle3, extract_hidden_states, dflash, dspark) raise RuntimeError under
  xlite.
- The turboquant KV-cache dtype cannot be combined with xlite graph mode; a ValueError is raised.
- XliteModelRunner asserts that xlite_graph_config.enabled is true, so the worker cannot be used without enabling the flag.
- The XliteWorker is only selected when the hardware profile supports STANDARD_WORKER_PATCHES; otherwise the default worker
  is used.
tuning_advice:
  summary: Enable xlite graph mode for decode-heavy workloads to cut per-step launch overhead and improve decode latency/throughput
    on Ascend NPU, keeping full_mode=false and block_size=128.
  suggested_values:
  - scenario: Decode-heavy serving with MTP speculative decoding on supported hardware
    value: true
    reason: Graph replay via XliteWorker reduces per-step overhead; decode mode is preserved when spec decoding is active.
  - scenario: Default / conservative deployment
    value: false
    reason: Default is disabled; only enable after verifying hardware supports STANDARD_WORKER_PATCHES and constraints are
      met.
  - scenario: Full graph capture desired
    value: false
    reason: full_mode=true forces cudagraph_mode to NONE and enforce_eager, disabling graph capture; keep full_mode=false
      for graph replay.
  caveats:
  - Ensure pipeline_parallel_size=1 and block_size=128 before enabling.
  - Avoid combining with turboquant KV-cache dtype or Sparse SFA/LI C8.
  - Only MTP-style sequential speculative methods are supported.
  quick_guide: Set additional_config.xlite_graph_config.enabled=true with full_mode=false and block_size=128 for decode-latency
    gains on supported Ascend hardware.
analysis_date: '2026-10-27'
