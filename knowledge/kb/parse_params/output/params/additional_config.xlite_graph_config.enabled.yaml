name: additional_config.xlite_graph_config.enabled
type: nested
category: compilation
scope: vllm-ascend
source_file:
- vllm_ascend/ascend_config.py:1454
- vllm_ascend/ascend_config.py:1457
- vllm_ascend/platform.py:1192
- vllm_ascend/platform.py:1356
- vllm_ascend/utils.py:1469
- vllm_ascend/xlite/xlite_model_runner.py:42
value_type: bool
default: false
valid_choices: true or false
cli_example: null
deprecated: false
performance_impact: high
performance_scope:
- latency
- throughput
- memory
impact_detail: 'Enabling this flag switches the whole execution stack to the openEuler Xlite

  graph backend on Ascend NPU. In vllm_ascend/platform.py:1356, when

  xlite_graph_config.enabled is true and the hardware profile supports

  STANDARD_WORKER_PATCHES, the worker class is replaced with

  vllm_ascend.xlite.xlite_worker.XliteWorker (instead of the profile default

  worker). In platform.py:1192 the compilation_config.cudagraph_mode is

  rewritten: "with full_mode=false the mixed mode is kept and decode mode is"

  preserved when speculative decoding is active, otherwise the mode collapses

  to the mixed mode; with full_mode=true the mode is forced to CUDAGraphMode.NONE

  and enforce_eager is set, disabling graph capture entirely. This directly

  changes how decode steps are captured/replayed, which is the dominant factor

  for decode latency and throughput on Ascend. In vllm_ascend/utils.py:1469,

  enabling xlite forces cache_config.block_size down to 128 when it is larger,

  which changes KV-cache memory layout and per-token memory footprint. In

  vllm_ascend/worker/model_runner_v1.py:5000, xlite disables the

  strided-attention KV-cache layer detection path, altering how KV cache views

  are built. In vllm_ascend/xlite/xlite_model_runner.py:42 the XliteModelRunner

  asserts the flag is enabled and wraps the model in an XliteWrapper, routing

  forward passes through the xlite graph path (bypassed for profile/dummy runs).

  Net effect: "lower per-step launch overhead and better decode latency/throughput"

  via graph replay, at the cost of stricter compatibility constraints.

  '
usage_locations:
