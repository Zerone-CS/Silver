name: VLLM_GPU_NIC_PCIE_MAPPING
type: env
category: communication
scope: vllm
source_file:
- vllm/envs.py:2159
- vllm/envs.py:323
- vllm/v1/executor/vllm_net_devices.py:10
- vllm/v1/executor/vllm_net_devices.py:77
- vllm/v1/executor/multiproc_executor.py:885
- vllm/v1/executor/uniproc_executor.py:65
- vllm/platforms/interface.py:514
value_type: str
default: ''
valid_choices: Comma-separated list of GPU_BDF=NIC_BDF PCI address pairs (e.g. '0000:3f:00.0=0000:5e:00.0,0000:40:00.0=0000:5f:00.0')
cli_example: null
deprecated: false
performance_impact: low
performance_scope:
- throughput
- latency
impact_detail: 'This is an upstream vLLM (CUDA/GPU-oriented) environment variable used to build a

  GPU-to-RDMA-NIC PCIe topology map. It is consumed by

  vllm/v1/executor/vllm_net_devices.py:set_worker_net_device(), which is called from

  both UniProcExecutor._init_executor (vllm/v1/executor/uniproc_executor.py:65) and

  MultiprocExecutor worker startup (vllm/v1/executor/multiproc_executor.py:885).

  The mapping is parsed by parse_gpu_nic_mapping() into a dict keyed by normalized PCI

  BDF tuples, and combined with VLLM_NIC_SELECTION_VARS to set transport env vars

  (e.g. UCX_NET_DEVICES, NCCL_IB_HCA) per worker so each GPU binds to the correct

  RDMA NIC. Correct NIC selection affects cross-node RDMA bandwidth/latency for

  tensor/pipeline/expert-parallel communication, hence an indirect throughput/latency

  effect on GPU clusters.

  On Ascend NPU this parameter has NO effect: "the mapping requires"

  current_platform.get_all_gpu_pci_bus_ids(), whose base implementation in

  vllm/platforms/interface.py:511-521 raises NotImplementedError stating

  "VLLM_GPU_NIC_PCIE_MAPPING is not supported on the current platform". Ascend

  collective communication uses HCCL (HCCL_IF_IP / HCCL_SOCKET_IFNAME / HCCL_INTRA_*

  env vars) rather than UCX/NCCL RDMA device selection, and vllm-ascend does not

  reference this variable. Therefore on Ascend it is a no-op and does not change

  runtime performance.

  '
usage_locations:
- file: vllm/envs.py:2159
  context: Environment variable definition, default empty string
- file: vllm/v1/executor/vllm_net_devices.py:77
  context: parse_gpu_nic_mapping parses comma-separated gpu_bdf=nic_bdf pairs
- file: vllm/v1/executor/multiproc_executor.py:885
  context: set_worker_net_device called per worker when mapping is set (TP>1)
- file: vllm/v1/executor/uniproc_executor.py:65
  context: set_worker_net_device called for single-process executor (TP=1)
- file: vllm/platforms/interface.py:514
  context: get_all_gpu_pci_bus_ids base impl raises NotImplementedError for unsupported platforms
related_parameters:
- name: VLLM_NIC_SELECTION_VARS
  relation: Must be set together with VLLM_GPU_NIC_PCIE_MAPPING; defines which env vars (e.g. UCX_NET_DEVICES, NCCL_IB_HCA)
    are populated from the mapping
- name: HCCL_IF_IP
  relation: Ascend equivalent mechanism for selecting the network interface used by HCCL collectives
- name: HCCL_SOCKET_IFNAME
  relation: Ascend equivalent for choosing the host NIC used by HCCL communication
constraints:
- VLLM_GPU_NIC_PCIE_MAPPING must be set together with VLLM_NIC_SELECTION_VARS; setting only one has no effect.
- Each comma-separated segment must be of the form gpu_bdf=nic_bdf; a segment without '=' raises ValueError.
- Each PCI address must include a function suffix (e.g. '01:00.0'); a BDF missing the '.fn' part raises ValueError.
- The current platform must implement get_all_gpu_pci_bus_ids(); on platforms that do not (including Ascend NPU), using this
  mapping raises NotImplementedError.
tuning_advice:
  summary: Irrelevant on Ascend NPU; on GPU clusters set it together with VLLM_NIC_SELECTION_VARS to pin each GPU to its nearest
    RDMA NIC.
  suggested_values:
  - scenario: Ascend NPU deployment (any v1/v2 worker)
    value: unset
    reason: The parameter is unsupported on Ascend (get_all_gpu_pci_bus_ids raises NotImplementedError) and vllm-ascend does
      not consume it; use HCCL_IF_IP/HCCL_SOCKET_IFNAME instead.
  - scenario: Multi-node GPU cluster with RDMA NICs (upstream CUDA reference)
    value: 0000:3f:00.0=0000:5e:00.0,0000:40:00.0=0000:5f:00.0
    reason: Explicit GPU-to-NIC PCIe pairs let each worker bind the correct RDMA device, improving cross-node collective bandwidth.
  caveats:
  - Do not expect any effect on Ascend NPU; configure HCCL network interface env vars for Ascend inter-node communication.
  - Must be paired with VLLM_NIC_SELECTION_VARS or it is silently ignored.
  quick_guide: Skip on Ascend NPU; only meaningful for GPU RDMA NIC selection alongside VLLM_NIC_SELECTION_VARS.
analysis_date: '2026-10-27'
