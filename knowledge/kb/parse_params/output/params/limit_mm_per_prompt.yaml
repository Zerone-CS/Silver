related_parameters:
- name: --language-model-only
  relation: Alternative way to skip loading multimodal encoders entirely; mutually exclusive intent with enabling a modality
- name: --max-num-batched-tokens
  relation: Interacts with disable_chunked_mm_input; per-item token count must not exceed this when chunked MM input is disabled
- name: --disable-chunked-mm-input
  relation: When set, raises if max_tokens_per_mm_item > max_num_batched_tokens
- name: --mm-processor-cache-gb
  relation: Companion multimodal memory knob; docs set it to 0 for the image form
- name: --mm-encoder-tp-mode
  relation: Encoder parallelism mode; docs use 'data' for image/audio forms
- name: --skip-mm-profiling
  relation: Skips multimodal memory profiling; used together with modality limits in image form
- name: --max-num-seqs
  relation: Docs tune max-num-seqs per form (4 text/audio, 16 image) alongside modality limits
constraints:
- Each modality value must be a non-negative integer (or a nested dict of per-modality options); setting a modality to 0 disables
  that encoder.
- If --disable-chunked-mm-input is set, the maximum tokens per multimodal item must not exceed --max-num-batched-tokens, otherwise
  a ValueError is raised.
- When all non-text modalities are set to 0, the encoder cache is not initialized at all.
- The multimodal form (which modalities are enabled) cannot be switched dynamically within the same process; the service must
  be restarted when switching forms.
- In the benchmark RandomMultiModalDataset, every modality referenced in bucket_config must be present in limit_mm_per_prompt,
  otherwise a ValueError is raised.
tuning_advice:
  summary: Set each modality limit to the actual maximum items per request, and set unused modalities to 0 to skip loading
    their encoders and free NPU HBM.
  suggested_values:
  - scenario: Text-only deployment (no multimodal input)
    value: '''{"image": 0, "video": 0, "audio": 0}'''
    reason: Disables all encoders so the encoder cache is not initialized and encoder weights are not loaded, maximizing HBM
      available for KV cache.
  - scenario: Single-image VLM inference
    value: '''{"image": 1}'''
    reason: Matches the common single-image workload; caps per-request encoder work and prefill tokens, reducing TTFT and
      peak memory.
  - scenario: Multi-image vision tasks (e.g. MMMU, up to 7 images)
    value: '''{"image": 7, "video": 0, "audio": 0}'''
    reason: Dots3-Note docs recommend 7 for the image form; pair with --max-num-batched-tokens 1024 to chunk large-image prefill
      and avoid FusedMC2 peak OOM.
  - scenario: Audio tasks
    value: '''{"image": 0, "video": 0, "audio": 1}'''
    reason: Dots3-Note docs use audio=1 for the audio form, disabling image/video encoders to save memory.
  - scenario: Smoke test / token-only path that still initializes a vision tower
    value: '''{"image": 0, "video": 0}'''
    reason: vllm-ascend e2e tests use this to skip vision processing while the wrapper still initializes the tower.
  caveats:
  - Do not set a modality to a large value unless the workload truly needs it; it increases encoder compute and prefill memory.
  - When using --disable-chunked-mm-input, ensure the per-item token count stays below --max-num-batched-tokens or startup
    will fail.
  - The enabled modality set cannot be changed at runtime; restart the service to switch forms.
  - On Ascend, combine with --mm-processor-cache-gb 0 and --skip-mm-profiling for the image form as recommended in the Dots3
    docs to control peak memory.
  quick_guide: Set unused modalities to 0 and cap used modalities at the real per-request maximum (e.g. image:1 or image:7).
