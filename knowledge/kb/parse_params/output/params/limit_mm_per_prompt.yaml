deprecated: false
performance_impact: medium
performance_scope:
- memory
- throughput
- latency
impact_detail: "This parameter is defined upstream in vllm (MultiModalConfig.limit_per_prompt, surfaced as\nEngineArgs.limit_mm_per_prompt\
  \ and the --limit-mm-per-prompt CLI flag). vllm-ascend does not\nredefine it; it consumes it through the standard vLLM config\
  \ path (examples and e2e tests in\nvllm-ascend pass it directly to LLM/VllmRunner). Its performance effect is indirect but\
  \ real,\nand it is the primary lever for controlling multimodal memory on Ascend NPU:\n\n1. Encoder cache sizing (vllm/v1/core/encoder_cache_manager.py:315).\
  \ The per-modality limits\n   feed into the encoder cache budget computation. When all non-text modalities are set to 0,\n\
  \   the code logs \"All non-text modalities supported by the model have been explicitly disabled\n   via limit_mm_per_prompt.\
  \ Encoder cache will not be initialized.\" and returns (0, 0) — i.e.\n   no encoder cache is allocated at all. This directly\
  \ reduces NPU HBM consumption and removes\n   encoder-cache bookkeeping from the scheduler, which is the mechanism the vllm-ascend\
  \ Dots3\n   docs rely on: \"setting a modality to 0 means \\\"that encoder is not loaded\\\" (Dots3-Note.md §5.5.2),\"\n\
  \   saving the encoder weights (e.g. ~12.5 GB extra for the image form) and its activation memory.\n\n2. Chunked MM input\
  \ interaction. encoder_cache_manager raises if disable_chunked_mm_input is\n   set and max_tokens_per_mm_item > max_num_batched_tokens.\
  \ The per-item token count is derived\n   from the modality limits, so a large limit combined with a small --max-num-batched-tokens\
  \ can\n   force larger prefill batches and higher peak activation memory (relevant to the Dots3 image\n   form where --max-num-batched-tokens\
  \ is reduced to 1024 to avoid FusedMC2 peak OOM).\n\n3. Profiling / graph capture. The multimodal config participates in\
  \ the model config hash\n   (vllm/config/model.py:457) and in whether the MM code path is enabled, which affects the\n \
  \  language-model computation graph (comment at model.py:473-476). On Ascend this influences\n   which graphs are captured\
  \ (FULL_DECODE_ONLY capture sizes) and the memory profiling that\n   determines available KV cache.\n\n4. Throughput/latency.\
  \ A higher per-prompt limit allows more images/audio per request, which\n   increases encoder compute and prefill token\
  \ count per request (higher TTFT, more NPU compute),\n   while a lower limit caps per-request work and can improve batching\
  \ fairness. Setting a\n   modality to 0 avoids loading that encoder entirely, reducing startup time and memory.\n"
