name: --enable-trace-replay
type: cli
category: model
scope: vllm
source_file:
- vllm/config/model.py:274
- vllm/engine/arg_utils.py:565
- vllm/engine/arg_utils.py:921
- vllm/engine/arg_utils.py:1849
- vllm/config/vllm.py:1138
- vllm/v1/engine/input_processor.py:126
- vllm/v1/worker/gpu/model_runner.py:469
- vllm/v1/worker/gpu/sample/sampler.py:43
value_type: bool
default: false
valid_choices: true, false
cli_example: --enable-trace-replay
deprecated: false
performance_impact: low
performance_scope:
- memory
- latency
impact_detail: 'This flag only gates whether requests may set SamplingParams.trace_decode_token_ids.

  In vllm/config/model.py:274 it defaults to False. When enabled, the sampler

  (vllm/v1/worker/gpu/sample/sampler.py:58-60) allocates a TraceReplayState(req_states)

  per request slot, i.e. a per-request trace buffer reserved for the whole engine

  lifetime — a small but persistent memory cost proportional to max_num_reqs.

  At request time, vllm/v1/engine/input_processor.py:124-132 rejects requests that

  set trace_decode_token_ids unless this flag is on; when on, decoding is forced to

  follow the supplied token sequence (max_tokens overwritten with trace length), so

  the sampling path is bypassed for those requests — this changes latency/throughput

  only for trace-replay requests, not for normal traffic. vllm/config/vllm.py:1136-1141

  additionally requires Model Runner V2 (use_v2_model_runner) when the flag is set.

  No vllm-ascend source in the provided context references enable_trace_replay, so

  there is no Ascend-specific override; the effect on Ascend NPU is the same as

  upstream (a small per-request buffer allocation plus a validation branch). Because

  the flag is off by default and only affects debugging/RL trace-replay workflows,

  its steady-state performance impact on normal serving is negligible.

  '
usage_locations:
- file: vllm/config/model.py:274
  context: ModelConfig field definition and docstring; default False, reserves per-request trace buffer
- file: vllm/engine/arg_utils.py:921
