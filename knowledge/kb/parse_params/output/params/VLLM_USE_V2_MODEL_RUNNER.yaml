related_parameters:
- name: --additional-config enable_dsa_cp
  relation: DSA-CP is v1-only; requires VLLM_USE_V2_MODEL_RUNNER=0, raises config error under v2.
- name: --prefill-context-parallel-size
  relation: PCP requires VLLM_USE_V2_MODEL_RUNNER=1.
- name: --additional-config enable_kvpp
  relation: KVPP with PCP requires v2 runner; KVPP alone still requires eager execution.
- name: --async-scheduling
  relation: profiling_chunk_config with async scheduling requires v2 runner.
- name: attention_config.hisparse_config
  relation: HiSparse forces v2 runner upstream and errors if VLLM_USE_V2_MODEL_RUNNER=0.
- name: watermark_config
  relation: Watermarking forces v2 runner upstream, overriding VLLM_USE_V2_MODEL_RUNNER=0.
- name: attention_config.indexer_kv_dtype
  relation: DeepSeek V4 TurboQuant (v2-only) requires indexer_kv_dtype='int8'.
constraints:
- On Ascend the v2 model runner is enabled ONLY when VLLM_USE_V2_MODEL_RUNNER is explicitly set to 1; leaving it unset defaults
  to the v1 runner regardless of model architecture.
- DeepSeek V4.1 on Ascend A5 requires VLLM_USE_V2_MODEL_RUNNER=1 or startup raises a ValueError.
- DeepSeek V4 TurboQuant compressed KV cache requires VLLM_USE_V2_MODEL_RUNNER=1.
- profiling_chunk_config combined with async scheduling requires VLLM_USE_V2_MODEL_RUNNER=1.
- PCP (prefill context parallel) requires VLLM_USE_V2_MODEL_RUNNER=1.
- DSA-CP (enable_dsa_cp) is supported only with ModelRunner V1 and requires VLLM_USE_V2_MODEL_RUNNER=0; enabling it under
  v2 raises a configuration error.
- Upstream HiSparse requires the v2 runner and raises if VLLM_USE_V2_MODEL_RUNNER=0.
- Upstream ECCPUConnector requires the v2 runner and raises if VLLM_USE_V2_MODEL_RUNNER is not 1.
- Upstream LongcatFlashNgramForCausalLM and DFlash drafters with mixed sliding/full attention require the v2 runner.
tuning_advice:
  summary: 'Leave VLLM_USE_V2_MODEL_RUNNER unset (v1) for general models; explicitly set

    it to 1 only when you need v2-only Ascend features (PCP, KVPP+PCP, DeepSeek

    V4.1 packed cache, TurboQuant, async-scheduling+profiling_chunk, DSpark/DFlash)

    and have validated the model on the NPU v2 runner.

    '
  suggested_values:
  - scenario: General-purpose serving of standard models (Qwen, Llama, etc.) on Ascend
    value: unset
    reason: Ascend defaults to v1 when unset; v1 is the stable path and avoids v2 compatibility gaps.
  - scenario: DeepSeek V4.1 on Ascend A5
    value: '1'
    reason: platform.py raises ValueError unless v2 runner is enabled for DeepseekV41ForCausalLM/DeepseekV41DSparkModel on
      A5.
  - scenario: Enabling PCP (--prefill-context-parallel-size > 1) or KVPP with PCP
    value: '1'
    reason: PCP requires the v2 model runner per context_parallel.md and additional_config.md.
  - scenario: Using DSA-CP (enable_dsa_cp) on GLM-5.2
    value: '0'
    reason: DSA-CP is supported only with ModelRunner V1; v2 raises a configuration error.
  - scenario: DeepSeek V4 TurboQuant compressed KV cache
    value: '1'
    reason: turboquant/config.py raises unless use_v2_model_runner is true.
  - scenario: async scheduling combined with profiling_chunk_config
    value: '1'
    reason: platform.py requires v2 runner for profiling_chunk with async scheduling.
  caveats:
  - Setting the env var to 0 explicitly is different from leaving it unset only in that it also disables upstream HiSparse/watermark
    auto-enablement; on Ascend both resolve to v1.
  - Validate correctness (outputs) after switching runners — the v2 runner uses different input-batch/block-table and forward-context
    plumbing.
  - When migrating DSA-CP to PCP, set VLLM_USE_V2_MODEL_RUNNER=1, replace TP size N>1 with --tensor-parallel-size 1 --prefill-context-parallel-size
    N, and remove enable_dsa_cp.
  quick_guide: Unset = v1 (stable default on Ascend); set to 1 only for v2-only features (PCP, DeepSeek V4.1 A5, TurboQuant,
    async+profiling_chunk); set to 0 for DSA-CP.
