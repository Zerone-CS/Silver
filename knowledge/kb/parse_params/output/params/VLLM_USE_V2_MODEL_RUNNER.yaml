name: VLLM_USE_V2_MODEL_RUNNER
type: env
category: model
scope: both
source_file:
- vllm/envs.py:2037
- vllm/envs.py:300
- vllm/config/vllm.py:675
- vllm_ascend/patch/platform/patch_use_v2_model_runner.py:19
- vllm_ascend/patch/__init__.py:815
- vllm_ascend/patch/worker/__init__.py:52
- vllm_ascend/platform.py:951
- vllm_ascend/platform.py:1071
- vllm_ascend/ascend_forward_context.py:472
- vllm_ascend/quantization/methods/kv_cache/turboquant/config.py:64
value_type: bool
default: null
valid_choices:
- 'true'
- 'false'
- unset (None)
cli_example: null
deprecated: false
performance_impact: high
performance_scope:
- latency
- throughput
- memory
impact_detail: 'This env var selects between two entirely different model-runner execution

  paths on Ascend, which changes the hot loop of every decode/prefill step.


  Upstream (vllm/config/vllm.py:675): `VllmConfig.use_v2_model_runner` is a

  property that, when the env var is unset, falls back to per-model architecture

  whitelists, Triton availability checks and feature-support inspections. When

  the env var is explicitly set (True/False) it short-circuits and returns that

  value (except HiSparse/watermark configs which force True).


  vllm-ascend OVERRIDES this: `vllm_ascend/patch/platform/patch_use_v2_model_runner.py`

  monkey-patches `VllmConfig.use_v2_model_runner` to return ONLY

  `envs.VLLM_USE_V2_MODEL_RUNNER`, defaulting to False when unset. The patch is

  applied unconditionally in `vllm_ascend/patch/worker/__init__.py:56` so both

  EngineCore and worker processes share the same behavior. Consequence: on

  Ascend the v2 runner is NEVER auto-enabled by model architecture — it must be

  explicitly requested. This is a deliberate safety override because the NPU v2

  runner is not yet compatible with all upstream-defaulted models/features and

  enabling by architecture can crash.


  Performance mechanism: "the v2 runner uses a different input-batch/block-table"

  representation (`ascend_forward_context.py:472/481` routes extra forward-context

  attributes through `ctx.additional_kwargs` under v2 vs direct `setattr` under

  v1), different spec-decode dispatch (v2 `init_speculator` vs v1

  `get_spec_decode_method`), and enables features that are v2-only on Ascend:

  PCP (prefill context parallel), KVPP with PCP, async-scheduling +

  profiling_chunk, DeepSeek V4.1 packed cache, TurboQuant compressed KV cache,

  and DSpark/DFlash speculators. These features directly change throughput,

  latency and KV-cache memory footprint. Conversely, DSA-CP is v1-only and

  requires VLLM_USE_V2_MODEL_RUNNER=0.


  Because the choice gates whole feature families (context parallelism, packed

  KV cache, async scheduling), it has high impact on throughput, latency and

  memory — but the direction depends on the model and feature combination.

  '
