related_parameters:
- name: --kda-prefill-backend
  relation: Sibling parameter handled by the same Ascend stripping/warning logic; also only 'triton'/'auto' supported on Ascend
- name: --additional-config
  relation: The flag value is injected into additional_config['gdn_prefill_backend'] and read from there by the resolver
- name: --enforce-eager
  relation: GDN prefill path interacts with cudagraph capture; on Ascend the Triton/FLA path is used regardless of backend
    selection
constraints:
- On Ascend only the 'triton' (and 'auto') value is effective; 'flashinfer' and 'cutedsl' have no kernel and are ignored with
  a warning.
- The value is stripped from additional_config by vllm-ascend before pydantic validation, so it cannot be used to select a
  non-Triton kernel on Ascend.
- The flag only affects GDN linear-attention models (e.g. Qwen3.5 GDN); it has no effect on models without GDN layers.
tuning_advice:
  summary: On Ascend this flag is effectively a no-op — leave it unset (or set to triton) and tune GDN prefill via triton-ascend/FLA
    kernel settings instead.
  suggested_values:
  - scenario: Any Ascend NPU deployment of a GDN model (Qwen3.5 GDN, etc.)
    value: triton
    reason: Only the Triton/FLA path exists on Ascend (FLA kernels run via triton-ascend); this is the resolved backend regardless
      of the flag, so setting it explicitly just documents intent and avoids the unsupported-value warning.
  - scenario: Default / no explicit backend preference
    value: unset
    reason: Leaving it unset resolves to 'auto' which on Ascend maps to triton with no warning; simplest and equivalent in
      performance.
  caveats:
  - Do not expect flashinfer or cutedsl to accelerate GDN prefill on Ascend — those kernels are CUDA-only and are stripped
    by vllm-ascend.
  - If you see the 'Ascend does not support gdn_prefill_backend=...' warning, remove the flag; it has no performance benefit
    on NPU.
  quick_guide: On Ascend, set --gdn-prefill-backend triton or omit it; other values are ignored.
