name: --gdn-prefill-backend
type: cli
category: model
scope: both
source_file:
- vllm/engine/arg_utils.py:1776
- vllm/engine/arg_utils.py:789
- vllm/model_executor/layers/mamba/gdn/qwen_gdn_linear_attn.py:94
- vllm/v1/attention/backends/gdn_attn.py:99
- vllm_ascend/ascend_config.py:1804
- vllm_ascend/ascend_config.py:1855
value_type: str
default: null
valid_choices:
- flashinfer
- triton
- cutedsl
cli_example: --gdn-prefill-backend triton
deprecated: false
performance_impact: low
performance_scope:
- latency
- throughput
impact_detail: 'This flag selects the prefill kernel backend for GDN (Gated Delta Net) linear-attention

  layers (e.g. Qwen3.5 GDN models). Upstream, the value is injected into

  additional_config["gdn_prefill_backend"] and resolved by _resolve_gdn_prefill_backend()

  (vllm/model_executor/layers/mamba/gdn/qwen_gdn_linear_attn.py:94). The resolver first

  checks current_platform.is_cuda(); if NOT CUDA it returns (backend, "triton") immediately

  (line 119-120), i.e. on Ascend the active backend is always "triton" regardless of the

  requested value. ChunkGatedDeltaRule then binds self._forward_method = self.forward_native

  (the Triton/FLA path) and only emits a warning_once if a flashinfer/cutedsl value was

  requested but could not be honored (lines 248-253). GDNAttentionMetadataBuilder

  (vllm/v1/attention/backends/gdn_attn.py:99-103) also resolves the backend and only takes

  the cutedsl metadata-prep path when the resolved backend is "cutedsl", which never happens

  on Ascend.

  On Ascend, vllm-ascend''s init_ascend_config (vllm_ascend/ascend_config.py:1804-1813)

  explicitly strips gdn_prefill_backend from additional_config before pydantic validation

  (extra="forbid"), warning only when the requested value is not in ("auto", "triton").

  The comment states that on non-CUDA platforms only the triton path is available because

  the FLA Triton kernels run on Ascend via triton-ascend. Therefore on Ascend this parameter

  has NO effect on the actual kernel selection — the Triton/FLA prefill path is always used.

  Its only runtime effect is a one-time warning log when an unsupported value is passed.

  Because the parameter cannot change the executed kernel on Ascend, its performance impact

  is low (essentially none beyond log noise); the actual prefill performance is governed by

  the Triton/FLA kernels and triton-ascend compilation, not by this flag.

  '
