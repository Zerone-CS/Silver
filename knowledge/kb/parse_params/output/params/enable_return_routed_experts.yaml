related_parameters:
- name: --pipeline-parallel-size
  relation: 'Incompatible: PP > 1 raises ValueError when this flag is enabled'
- name: --decode-context-parallel-size
  relation: 'Incompatible: DCP > 1 raises ValueError when this flag is enabled'
- name: --prefill-context-parallel-size
  relation: 'Incompatible: PCP > 1 raises ValueError when this flag is enabled'
- name: --kv-transfer-config
  relation: Incompatible with any KV connector (PD disaggregation / KV offload / sharing)
- name: VLLM_USE_V2_MODEL_RUNNER
  relation: 'Required: on Ascend the flag is only supported by the V2 model runner'
- name: --max-num-batched-tokens
  relation: Sizes the routed-experts device buffer and per-step D2H copy volume
- name: --enable-expert-parallel
  relation: Commonly used together for MoE models in the R3 test
constraints:
- On Ascend, --enable-return-routed-experts is only supported by the V2 model runner; set VLLM_USE_V2_MODEL_RUNNER=1 or the
  engine raises a ValueError at startup.
- The flag is incompatible with pipeline parallelism; PP > 1 raises a ValueError.
- The flag is incompatible with context parallelism; DCP > 1 or PCP > 1 raises a ValueError.
- The flag is incompatible with any KV connector, including PD disaggregation (kv_producer/kv_consumer) and KV offload/sharing
  (kv_both).
- The flag only has an effect on MoE models; dense models have no routing decisions to capture.
tuning_advice:
  summary: Enable only when a trainer actually consumes and replays expert routing; otherwise leave off to avoid per-step
    D2H copies and extra memory.
  suggested_values:
  - scenario: RL training-inference loop where the trainer replays MoE routing decisions
    value: true
    reason: Required to return encoded expert routing decisions; must be paired with VLLM_USE_V2_MODEL_RUNNER=1 on Ascend.
  - scenario: Standard serving / inference without routing replay
    value: false
    reason: Default off incurs zero overhead; enabling adds scheduler bookkeeping, per-step D2H copy, and extra NPU/pinned
      memory.
  - scenario: RL replay with large max_num_batched_tokens
    value: true
    reason: If enabled, keep max_num_batched_tokens modest to bound the routed-experts device buffer and D2H copy volume.
  caveats:
  - Must set VLLM_USE_V2_MODEL_RUNNER=1 on Ascend or startup fails with a ValueError.
  - Do not combine with PP>1, DCP>1/PCP>1, or any KV connector (PD disaggregation / KV offload).
  - Budget extra NPU memory proportional to max_num_batched_tokens × num_layers × num_experts_per_tok.
  - Expect a small decode-step latency increase from the per-step D2H copy of routing data.
  quick_guide: Leave off unless doing MoE router replay; if on, use the V2 model runner and avoid PP/CP/KV connectors.
analysis_date: '2026-10-27'
