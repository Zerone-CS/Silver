  context: CLI flag registration mapping to model_kwargs['enable_return_routed_experts']
- file: vllm/config/vllm.py:1281
  context: 'VllmConfig validation: rejects PP>1, DCP>1/PCP>1, and KV connectors when enabled'
- file: vllm/v1/core/sched/scheduler.py:387
  context: Scheduler builds RoutedExpertsManager and asserts dcp/pcp world size == 1
- file: vllm/v1/core/sched/scheduler.py:1555
  context: Per-schedule-step block-ID snapshot for routed experts (hot path overhead)
- file: vllm/v1/worker/gpu_model_runner.py:7490
  context: init_routed_experts_capturer allocates device + pinned CPU buffers and binds capturer
- file: vllm_ascend/platform.py:1633
  context: 'Ascend validation: flag only supported on V2 model runner, else raises ValueError'
- file: vllm_ascend/worker/v2/model_runner.py:445
