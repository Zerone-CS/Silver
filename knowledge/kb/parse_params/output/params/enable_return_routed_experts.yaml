name: --enable-return-routed-experts
type: cli
category: model
scope: both
source_file:
- vllm/config/model.py:250
- vllm/engine/arg_utils.py:436
- vllm/engine/arg_utils.py:910
- vllm/config/vllm.py:1281
- vllm/v1/core/sched/scheduler.py:387
- vllm/v1/worker/gpu_model_runner.py:7490
- vllm_ascend/platform.py:1633
- vllm_ascend/worker/v2/model_runner.py:445
value_type: bool
default: false
valid_choices: true or false (boolean flag)
cli_example: --enable-return-routed-experts
deprecated: false
performance_impact: medium
performance_scope:
- latency
- memory
impact_detail: "This flag enables capture of MoE expert routing decisions (R3 / routed-experts replay)\nso they can be returned\
  \ to the client (e.g. for RL trainer replay). It is not a\nthroughput knob but it does add runtime overhead and memory cost.\n\
  \nUpstream vLLM path:\n- \"vllm/config/vllm.py:1281 validates compatibility (rejects PP>1, DCP>1/PCP>1, and any\"\n  KV\
  \ connector).\n- \"vllm/v1/core/sched/scheduler.py:387 constructs a RoutedExpertsManager and, on every\"\n  schedule step\
  \ (line 1555), snapshots block IDs for all scheduled requests\n  (`self._re_block_ids.update(...)`), adding per-step CPU\
  \ work in the scheduler hot path.\n- \"vllm/v1/worker/gpu_model_runner.py:7490 `init_routed_experts_capturer` allocates\
  \ a\"\n  device buffer sized by `max_num_batched_tokens` plus a pinned CPU buffer, and binds a\n  capturer into the model.\
  \ Each step then does a D2H copy of routing_data and\n  slot_mapping (`get_routed_experts` clones device buffers), which\
  \ adds a device-to-host\n  synchronization/copy per step and extra NPU memory proportional to\n  max_num_batched_tokens\
  \ × num_layers × num_experts_per_tok.\n\nAscend-specific behavior:\n- \"vllm_ascend/platform.py:1633 `_validate_routing_replay_config`\
  \ hard-rejects the flag\"\n  unless the V2 model runner is active (`VLLM_USE_V2_MODEL_RUNNER=1`); on the V1 runner\n  the\
  \ R3 data plane was removed, so the engine would otherwise start and silently return\n  no routed_experts. This is a hard\
  \ constraint, not a perf effect.\n- \"vllm_ascend/worker/v2/model_runner.py:445 only calls `init_routed_experts_capturer()`\"\
  \n  when the flag is set, so the device/pinned buffers and per-step capture overhead are\n  only incurred when enabled.\
  \ When disabled, there is zero overhead.\n\nNet effect: \"enabling adds per-step scheduler bookkeeping, a per-step D2H copy\
  \ of routing\"\ndata, and extra NPU + pinned host memory. It does not change model compute throughput\nmaterially, but it\
  \ can add measurable decode-step latency and memory pressure at large\nmax_num_batched_tokens.\n"
