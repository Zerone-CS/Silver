name: additional_config.scheduler_config.recompute_scheduler_enable
type: nested
category: scheduling
scope: vllm-ascend
source_file:
- vllm_ascend/ascend_config.py:1634
- vllm_ascend/ascend_config.py:1674
- vllm_ascend/platform.py:1109
- vllm_ascend/platform.py:1372
- vllm_ascend/ascend_forward_context.py:64
- vllm_ascend/utils.py:1242
- vllm_ascend/utils.py:1310
value_type: bool
default: false
valid_choices: true or false
cli_example: null
deprecated: false
performance_impact: high
performance_scope:
- latency
- throughput
- memory
impact_detail: 'This is a vllm-ascend-only flag (no upstream vLLM equivalent) that swaps the

  scheduler class on PD-disaggregated Decode nodes. In platform.py:1109-1138, when

  enabled and kv_role == "kv_consumer", the platform builds a RecomputeSchedulerConfig

  via RecomputeSchedulerConfig.initialize_from_config() and replaces

  vllm_config.scheduler_config with it, selecting the scheduler class through

  _get_recompute_scheduler_cls(async_scheduling, dyntra_lb_enabled). The RecomputeScheduler

  changes the decode-node execution model: "after KV recv it sets num_computed_tokens to"

  N-1 so the decode node recomputes the last prompt token before MTP decode

  (utils.py:1217-1242 docstring). This keeps decode-node steps decode-shaped, which is

  the precondition for fine-grained TP (ascend_config.py:826-830 asserts

  oproj_tensor_parallel_size / mlp_tensor_parallel_size require this flag). It also

  enables skipping the all-reduce across the DP group for MoE models on KV-consumer ranks

  (utils.py:1304-1340): when decode requires MC2 and recompute_scheduler_enable is True,

  each rank may hold a different token count, so MC2 uses a non-zero global_bs and no

  mc2_mask — removing a per-step DP all-reduce and its padding overhead. Additionally,

  ascend_forward_context.py:42-64 uses it to classify the node as decode-only, and

  attention metadata builders (mla_v1, attention_cp, sfa_cp) use it to reclassify

  recomputed prompt tokens as decodes rather than prefills, avoiding prefill-shaped

  metadata/kernels on D nodes. Net effect: lower decode-step latency and higher decode

  throughput on D nodes, at the cost of recomputing one prompt token per request and

  extra KV/offload bookkeeping. It also gates scheduler-class selection: when enabled,

  the DyntraLB-only scheduler is NOT installed (platform.py:1372) because the combined

  DyntraLB recompute scheduler is chosen instead.

  '
