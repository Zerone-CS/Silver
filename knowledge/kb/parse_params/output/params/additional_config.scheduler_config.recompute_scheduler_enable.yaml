related_parameters:
- name: kv_transfer_config.kv_role
  relation: Must be kv_consumer (PD-disaggregated D node); ignored on kv_producer, error on kv_both/None.
- name: additional_config.finegrained_tp_config.oproj_tensor_parallel_size
  relation: Requires recompute_scheduler_enable=true (assertion in ascend_config.py:826).
- name: additional_config.finegrained_tp_config.mlp_tensor_parallel_size
  relation: Requires recompute_scheduler_enable=true (assertion in ascend_config.py:826).
- name: additional_config.scheduler_config.dyntra_lb_config.enabled
  relation: Independent sibling; when both true, the combined DyntraLB recompute scheduler is selected.
- name: scheduler_config.async_scheduling
  relation: Selects the async vs sync recompute scheduler class via _get_recompute_scheduler_cls.
- name: additional_config.scheduler_config.profiling_chunk_config.enabled
  relation: Mutually exclusive with DyntraLB; profiling chunk scheduler selection is separate.
constraints:
- recompute_scheduler_enable can only be enabled on PD-disaggregated Decode nodes where kv_role is kv_consumer; enabling it
  with no kv_transfer_config, kv_role kv_both, or PD-mixed mode raises a ValueError at startup.
- On PD-disaggregated P nodes (kv_role kv_producer) the flag is ignored with a warning and forcibly written back to false
  in additional_config.
- Enabling fine-grained TP via oproj_tensor_parallel_size or mlp_tensor_parallel_size without recompute_scheduler_enable=true
  raises an AssertionError.
- The nested scheduler_config value takes precedence over the deprecated top-level additional_config.recompute_scheduler_enable
  key.
tuning_advice:
  summary: Enable only on PD-disaggregated Decode (kv_consumer) nodes to keep decode steps decode-shaped, unlock fine-grained
    TP, and skip DP all-reduce for MoE.
  suggested_values:
  - scenario: PD-disaggregated Decode node (kv_role=kv_consumer) running MoE models with DP > 1
    value: true
    reason: Allows skipping the DP all-reduce for MoE on KV-consumer ranks and keeps decode steps decode-shaped, reducing
      decode latency.
  - scenario: PD-disaggregated Decode node using fine-grained TP (oproj/mlp_tensor_parallel_size > 0)
    value: true
    reason: Required by assertion in ascend_config.py:826; fine-grained TP cannot start without it.
  - scenario: PD-disaggregated Prefill node (kv_role=kv_producer) or PD-mixed / single-node deployment
    value: false
    reason: Ignored on P nodes and rejected with an error on non-consumer nodes; leave disabled.
  caveats:
  - Do not set this on P nodes; it is silently disabled there and will be deprecated for P nodes in a future release.
  - If you also enable dyntra_lb_config.enabled, the combined DyntraLB recompute scheduler is selected automatically — do
    not expect the plain DyntraLB scheduler.
  - DP all-reduce skipping is suppressed under mc2_comm_alg=hierarchy or MegaMoe, so the throughput benefit may be smaller
    in those configurations.
  quick_guide: Set additional_config.scheduler_config.recompute_scheduler_enable=true only on PD-disaggregated Decode (kv_consumer)
    nodes.
analysis_date: '2026-10-27'
