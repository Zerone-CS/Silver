  context: EngineArgs field defaulting to LoRAConfig.enable_mixed_moe_lora_format
- file: vllm/engine/arg_utils.py:1506
  context: CLI argument registration in the LoRAConfig argument group
- file: vllm/lora/model_manager.py:124
  context: Computes _enable_mixed_moe_lora_format and forces _is_3d_moe_model to False
- file: vllm/lora/model_manager.py:841
  context: Converts 3D-format adapters to 2D before set_lora when mixed mode is on
- file: vllm/lora/utils.py:389
  context: process_packed_modules_mapping uses force_2d_moe to build 2D expert mapping
- file: vllm/lora/request.py:36
