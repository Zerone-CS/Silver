related_parameters:
- name: --enable-lora
  relation: Must be enabled for this flag to have any effect; LoRA path is inactive otherwise
- name: --enable-moe-shared-loras
  relation: Mutually exclusive layout choice in process_packed_modules_mapping; shared-loras branch takes precedence over
    the force_2d_moe branch
- name: --max-lora-rank
  relation: Determines the size of the stacked 2D LoRA buffers allocated per expert
- name: --max-loras
  relation: Number of adapter slots; affects total LoRA buffer memory footprint
- name: --fully-sharded-loras
  relation: Alternative LoRA memory/layout strategy that interacts with MoE wrapper selection
constraints:
- Only meaningful for MoE models; for non-MoE models the flag is ignored.
- Requires --enable-lora to be set, otherwise the LoRA model manager is never constructed.
- When --enable-moe-shared-loras is also set, the shared-loras mapping branch takes precedence and the force-2d mapping is
  not applied.
- Adapters served in mixed mode must correctly declare is_3d_lora_weight on the LoRARequest; otherwise 3D-format adapters
  will be treated as 2D and fail to load.
tuning_advice:
  summary: Leave disabled unless you must serve both 2D- and 3D-format MoE LoRA adapters in one deployment; enable only then
    and accept the small per-token and load-time overhead.
  suggested_values:
  - scenario: Single-format MoE LoRA deployment (all adapters same on-disk layout as base model)
    value: false
    reason: Keeps the native model-driven wrapper (FusedMoE3DWithLoRA for 3D models), preserving the fused 3D LoRA kernel
      and avoiding conversion overhead.
  - scenario: Mixed deployment serving both 2D and 3D MoE LoRA adapters simultaneously
    value: true
    reason: Forces the universal FusedMoEWithLoRA 2D wrapper so both adapter formats can be loaded and served in the same
      engine.
  - scenario: Non-MoE model with LoRA
    value: false
    reason: Flag is ignored for non-MoE models; enabling it has no effect and only changes the config hash.
  caveats:
  - Benchmark per-token latency after enabling on Ascend NPU; the 2D path may not be as optimized as the native 3D fused path.
  - Ensure each LoRARequest sets is_3d_lora_weight correctly when mixed mode is on, or adapters will be mis-parsed.
  - Account for extra memory from per-expert 2D stacked buffers when sizing --max-loras and --max-lora-rank.
  quick_guide: Enable only when mixing 2D and 3D MoE LoRA adapters; otherwise keep default false for best performance.
analysis_date: '2026-10-27'
