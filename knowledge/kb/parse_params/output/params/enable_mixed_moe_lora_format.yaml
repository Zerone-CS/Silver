name: --enable-mixed-moe-lora-format
type: cli
category: model
scope: vllm
source_file:
- vllm/config/lora.py:75
- vllm/engine/arg_utils.py:639
- vllm/engine/arg_utils.py:1506
- vllm/lora/model_manager.py:124
- vllm/lora/model_manager.py:841
- vllm/lora/utils.py:389
- vllm/lora/request.py:36
- vllm/lora/lora_model.py:78
value_type: bool
default: false
valid_choices:
- true
- false
cli_example: --enable-mixed-moe-lora-format
deprecated: false
performance_impact: low
performance_scope:
- memory
- latency
impact_detail: 'This flag only affects the LoRA adapter loading/wrapping path for MoE models; it does not

  change the base model''s forward compute. When enabled, LoRAModelManager sets

  `_enable_mixed_moe_lora_format = is_moe and lora_config.enable_mixed_moe_lora_format`

  (vllm/lora/model_manager.py:124-134) and forces `_is_3d_moe_model` to False, so the model

  is wrapped with the universal 2D wrapper `FusedMoEWithLoRA` instead of `FusedMoE3DWithLoRA`.

  This changes `process_packed_modules_mapping(..., force_2d_moe=True)` (vllm/lora/utils.py:389-409),

  which expands the packed mapping into per-expert 2D entries (gate_proj/up_proj/down_proj per

  expert) rather than the fused 3D gate_up_proj/down_proj layout. At adapter-load time

  (model_manager.py:841-846), 3D-format adapters are converted to 2D via `_convert_3d_to_2d_moe_lora`

  before `set_lora` copies them into stacked buffers, adding a one-time CPU-side split cost per

  adapter load. The runtime MoE LoRA kernel then operates on the 2D per-expert layout, which can

  be slightly less efficient than the native 3D fused path on models that natively use 3D MoE

  weights, and the 2D stacked buffers may use marginally more memory than the fused 3D tensors.

  The flag is also part of LoRAConfig.compute_hash (lora.py:106), so toggling it changes the

  config hash and invalidates any cached compilation/graph artifacts. No vllm-ascend override of

  this parameter was found in the provided context; the effect is inherited from upstream vLLM.

  '
usage_locations:
- file: vllm/config/lora.py:75
  context: LoRAConfig field definition and docstring describing the 2D-wrapper forcing behavior
