related_parameters:
- name: --model
  relation: The remote repo ID that requires authentication when private/gated
- name: --revision
  relation: Revision of the model repo fetched with the same credential
- name: --tokenizer
  relation: Tokenizer repo may also require the same HF token
- name: --download-dir
  relation: Where authenticated downloads are cached; reused on subsequent loads
- name: HF_TOKEN
  relation: Environment variable fallback read by huggingface_hub when --hf-token is not set
- name: HF_HUB_OFFLINE
  relation: When offline mode is on, model IDs are rewritten to local paths and no token is used
constraints:
- The value must be either a boolean or a string; passing True means 'use the token stored by `hf auth login` in ~/.cache/huggingface/token'.
- If True is passed but no token exists at ~/.cache/huggingface/token, authentication will fail when accessing gated/private
  repos.
- The token is only used for remote Hugging Face Hub access; it has no effect when the model is a local path or when HF_HUB_OFFLINE
  is enabled.
tuning_advice:
  summary: Set a valid HF token (preferably via HF_TOKEN env var) to avoid gated-repo auth retries during model download;
    it has no steady-state inference impact on Ascend.
  suggested_values:
  - scenario: Private or gated model repo (e.g. Llama, gated weights) on Ascend NPU
    value: <your_hf_token>
    reason: Authenticates the download so model loading does not fail or retry with 401/403, keeping cold-start time minimal.
  - scenario: Token already stored via `hf auth login`
    value: 'True'
    reason: Reuses the cached token at ~/.cache/huggingface/token without embedding the secret in the command line.
  - scenario: Public model or fully local model path / HF_HUB_OFFLINE enabled
    value: unset
    reason: No authentication is needed; leaving it unset avoids leaking credentials unnecessarily.
  caveats:
  - Prefer exporting HF_TOKEN over --hf-token to keep the secret out of shell history and process listings.
  - Do not expect any throughput or latency change at inference time; this only affects the download/load phase.
  - If you enable HF_HUB_OFFLINE, model IDs are rewritten to local paths and the token is never consulted.
  quick_guide: Use HF_TOKEN env var (or --hf-token) only for gated/private repos; it affects download time, not NPU inference
    performance.
analysis_date: '2026-10-27'
