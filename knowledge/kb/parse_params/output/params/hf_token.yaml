name: --hf-token
type: cli
category: model
scope: vllm
source_file:
- vllm/config/model.py:316
- vllm/engine/arg_utils.py:570
- vllm/engine/arg_utils.py:939
- vllm/engine/arg_utils.py:1835
- vllm/entrypoints/llm.py:208
value_type: str
default: null
valid_choices: bool | str | None (True = use token from `hf auth login`; str = explicit bearer token; None = no auth)
cli_example: --hf-token <your_hf_token>
deprecated: false
performance_impact: low
performance_scope:
- latency
impact_detail: '--hf-token is a Hugging Face Hub authentication credential used only during the

  model/config/tokenizer download phase (ModelConfig.hf_token, passed through

  EngineArgs -> ModelConfig at vllm/engine/arg_utils.py:1835). It is consumed by

  huggingface_hub when fetching remote files (config.json, tokenizer files,

  safetensors weights) and is not read on any inference hot path.


  On Ascend NPU there is no vllm-ascend override of this parameter: vllm-ascend

  does not redefine hf_token, does not patch ModelConfig for it, and does not

  reference it in any runtime dispatch path. The only Ascend-side occurrence in

  the provided context is an unrelated test helper name (test_hf_tokenizer_call_is_thread_safe),

  which is about tokenizer thread-safety, not this flag.


  Performance relevance is therefore limited to startup/load time: providing a

  valid token avoids 401/403 retries and rate-limit throttling from the HF Hub,

  which can add seconds-to-minutes to cold-start model loading. It has zero

  effect on steady-state token throughput, decode latency, or NPU memory usage.

  Note that hf_token is explicitly listed in ModelConfig''s ignored_factors set

  (vllm/config/model.py:451), so it does not participate in config hashing /

  compilation cache keys — changing it will not invalidate compiled graphs.

  '
usage_locations:
