name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
type: env
category: other
scope: vllm
source_file:
- vllm/envs.py:1117
- vllm/envs.py:109
- vllm/entrypoints/launchers/api_server/entry.py:151
- vllm/entrypoints/launchers/render/entry.py:54
- vllm/v1/utils.py:400
value_type: int
default: 5
valid_choices: any non-negative integer (seconds); 0 disables keep-alive (force close)
cli_example: null
deprecated: false
performance_impact: low
performance_scope:
- latency
impact_detail: 'This env var only controls the uvicorn HTTP keep-alive idle timeout

  (timeout_keep_alive) for the OpenAI-compatible API server. It is read in

  vllm/envs.py:1117 and passed to serve_http() in

  vllm/entrypoints/launchers/api_server/entry.py:151 and

  vllm/entrypoints/launchers/render/entry.py:54. It also gets forwarded to the

  Rust frontend via args_dict["http_timeout_keep_alive"] in vllm/v1/utils.py:400.

  It has NO effect on the model execution path, NPU kernels, HCCL communication,

  KV-cache, or scheduling. Its only performance relevance is at the HTTP

  transport layer: "a too-short keep-alive causes clients to reuse a socket the"

  server has already closed, producing ServerDisconnectedError and retried

  requests (extra latency, wasted work); a too-long keep-alive holds idle

  connections open (minor resource retention). This is identical on Ascend NPU

  and GPU — vllm-ascend does not override or reference this parameter, so the

  upstream behavior applies unchanged.

  '
usage_locations:
- file: vllm/envs.py:1117
  context: 'Definition: reads VLLM_HTTP_TIMEOUT_KEEP_ALIVE as int, default 5 seconds'
- file: vllm/entrypoints/launchers/api_server/entry.py:151
  context: Passed as timeout_keep_alive to serve_http() for the API server
- file: vllm/entrypoints/launchers/render/entry.py:54
  context: Passed as timeout_keep_alive to serve_http() for the render server
