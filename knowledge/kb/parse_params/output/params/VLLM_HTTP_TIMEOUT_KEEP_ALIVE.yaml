related_parameters:
- name: VLLM_ENGINE_READY_TIMEOUT_S
  relation: Forwarded together to the Rust frontend in vllm/v1/utils.py; both are env-driven runtime args
- name: VLLM_KEEP_ALIVE_ON_ENGINE_DEATH
  relation: Related server-liveness env var; controls whether the API server stays alive after engine death
constraints:
- The value must be a valid integer number of seconds; a non-integer string will raise a ValueError when the env var is parsed.
- A value of 0 disables keep-alive (connections are force-closed after each request), which is valid but increases per-request
  connection setup overhead.
tuning_advice:
  summary: Leave at default 5s for most deployments; increase only if clients hold long-lived idle connections, and keep client-side
    pool timeouts below this value.
  suggested_values:
  - scenario: Standard OpenAI-compatible serving behind a load balancer
    value: 5
    reason: Default matches typical client keep-alive behavior and avoids holding idle sockets.
  - scenario: Clients/proxies with long idle gaps between requests (e.g. disaggregated encoder proxy)
    value: 30
    reason: Reduces ServerDisconnectedError from clients reusing sockets the server closed; ensure client pool keepalive_timeout
      is set below this value.
  - scenario: High request-rate, connection-churn-sensitive workloads
    value: 65
    reason: Longer keep-alive amortizes TCP/TLS handshake cost across bursts of requests, lowering per-request latency.
  caveats: []
  quick_guide: Keep default 5s unless clients pool connections longer; then raise it and set client pool timeouts below it.
analysis_date: '2026-10-27'
