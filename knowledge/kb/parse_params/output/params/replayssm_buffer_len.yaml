  context: Read into the Mamba attention backend; used to size ReplaySSM scratch and ring buffers.
- file: vllm/model_executor/layers/mamba/mamba_mixer2.py:524
  context: Read only when use_replayssm is True; passed as logical_window to the FlashInfer ReplaySSM kernel.
- file: vllm/model_executor/models/nemotron_h.py:808
  context: Used as logical_window when appending ReplaySSM ring to Mamba state shape.
related_parameters:
- name: --use-replayssm
  relation: Master switch; replayssm_buffer_len is ignored (set to None) unless use_replayssm is enabled.
- name: --mamba-cache-mode
  relation: ReplaySSM requires mamba_cache_mode 'none' or 'align'; in align mode flushes are most efficient when mamba_block_size
    is a multiple of replayssm_buffer_len.
- name: --mamba-block-size
  relation: In align mode, choosing mamba_block_size as a multiple of replayssm_buffer_len improves flush efficiency.
- name: --mamba-backend
  relation: Triton backend uses B physical rows; FlashInfer backend uses B+1 rows. Only Triton/FlashInfer backends support
    ReplaySSM.
constraints:
- replayssm_buffer_len must be greater than 0 (Field(gt=0)).
- The parameter has no effect unless --use-replayssm is enabled.
- ReplaySSM requires the Triton or FlashInfer mamba backend and standard (non-speculative) decode only.
- ReplaySSM requires mamba_cache_mode to be 'none' or 'align'.
- Kimi-K3 speculative decode does not use this buffer length.
tuning_advice:
  summary: 'Leave at the default 16 unless running a Mamba2 model with --use-replayssm enabled; then

    tune B to balance decode-latency amortization against ReplaySSM ring state memory.

    '
  suggested_values:
  - scenario: Default / ReplaySSM disabled or non-Mamba2 model
    value: 16
    reason: Parameter is ignored when use_replayssm is off; default is safe and has no effect.
  - scenario: Mamba2 decode with --use-replayssm, memory-constrained
    value: 8
    reason: Smaller B reduces ReplaySSM ring state memory footprint at the cost of more frequent flushes.
  - scenario: Mamba2 decode with --use-replayssm, latency-focused and ample memory
    value: 32
    reason: Larger B amortizes the per-step full-state store over more decode steps, reducing flush frequency and decode latency.
  - scenario: Align mode with prefix caching
    value: 16
    reason: Choose B so that mamba_block_size is a multiple of replayssm_buffer_len for most efficient flushes.
  caveats:
  - Only meaningful with --use-replayssm; otherwise the value is discarded.
  - Verify ReplaySSM kernel support on Ascend NPU before relying on this parameter; no Ascend-specific guidance exists.
  quick_guide: Only tune with --use-replayssm on Mamba2; default 16 balances memory and flush frequency.
analysis_date: '2026-10-27'
