name: --replayssm-buffer-len
type: cli
category: kv_cache
scope: vllm
source_file:
- vllm/config/cache.py:193
- vllm/engine/arg_utils.py:1319
- vllm/engine/arg_utils.py:744
- vllm/engine/arg_utils.py:2119
- vllm/v1/attention/backends/mamba_attn.py:113
- vllm/model_executor/layers/mamba/mamba_mixer2.py:524
- vllm/model_executor/models/nemotron_h.py:808
value_type: int
default: 16
valid_choices: integer > 0 (Field(gt=0))
cli_example: --replayssm-buffer-len 16
deprecated: false
performance_impact: low
performance_scope:
- memory
- latency
impact_detail: 'This parameter only takes effect when --use-replayssm is enabled (vllm/config/cache.py:197-203).

  In mamba_mixer2.py:524-528, replayssm_buffer_len is read from cache_config only if

  cache_config.use_replayssm is True; otherwise it is set to None and the ReplaySSM decode

  kernel path is never taken. When active, it defines the logical history length B of the

  ReplaySSM Mamba2 decode kernel: "the Triton backend allocates B physical ring rows while the"

  FlashInfer backend allocates B+1 (cache.py:194-196). The value therefore directly sizes the

  per-layer ReplaySSM ring buffers appended to (conv_state, ssm_state) via

  MambaStateShapeCalculator.append_replayssm_ring (nemotron_h.py:803-810), affecting KV/state

  cache memory footprint. It also feeds the FlashInfer selective_state_update_replayssm_flashinfer

  call as logical_window (mamba_mixer2.py:1109) and the Triton per-row ring cursor/flush logic

  (mamba_attn.py:79-84). Larger B amortizes the per-step full-state store over more decode steps

  (fewer flushes), which can reduce decode latency, at the cost of more state memory. This is a

  Mamba2-specific, opt-in feature; it has no effect on standard attention models and no effect

  unless --use-replayssm is set. No vllm-ascend override of this parameter was found in the

  provided context, and no Ascend documentation references it.

  '
usage_locations:
- file: vllm/config/cache.py:193
  context: Field definition with default 16 and gt=0 constraint; docstring describes Triton B rows vs FlashInfer B+1.
