- file: vllm/lora/ops/triton_ops/lora_shrink_op.py:230
  context: Enables PDL (use_gdc) in Triton LoRA shrink kernel when flag set.
- file: vllm/lora/ops/triton_ops/lora_expand_op.py:247
  context: Enables PDL (use_gdc) in Triton LoRA expand kernel when flag set.
