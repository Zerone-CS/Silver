name: VLLM_LORA_ENABLE_DUAL_STREAM
type: env
category: model
scope: both
source_file:
- vllm/envs.py:2151
- vllm/envs.py:322
- vllm/config/lora.py:125
- vllm/lora/layers/base_linear.py:31
- vllm/lora/layers/base_linear.py:78
- vllm/lora/layers/fused_moe.py:51
- vllm/lora/layers/utils.py:19
- vllm/lora/ops/triton_ops/lora_expand_op.py:247
- vllm/lora/ops/triton_ops/lora_shrink_op.py:230
- vllm_ascend/lora/fused_moe.py:334
value_type: bool
default: false
valid_choices: 0 or 1 (parsed via bool(int(...)))
cli_example: null
deprecated: false
performance_impact: low
performance_scope:
- latency
- throughput
impact_detail: 'Upstream vLLM uses this flag to run the LoRA adapter branch on a secondary CUDA

  stream so the base-layer GEMM and the LoRA fast path overlap (see

  vllm/lora/layers/base_linear.py:31-102 and fused_moe.py:51, which set

  self._enable_aux_cuda_stream and register a lora_linear_async custom op). It also

  gates PDL (programmatic dependent launch) in the Triton LoRA shrink/expand kernels

  (lora_shrink_op.py:230, lora_expand_op.py:247: use_gdc = supports_pdl(...) and

  VLLM_LORA_ENABLE_DUAL_STREAM).

  On Ascend, the mechanism is fundamentally different: vllm_ascend/lora/fused_moe.py:334

  reads envs.VLLM_LORA_ENABLE_DUAL_STREAM into self._enable_aux_cuda_stream, but the

  Ascend FusedMoEWithLoRA constructor deliberately skips the upstream GPU-only

  _init_lora_stream_context / _inject_lora_into_fused_moe path (comment at lines

  320-336: "\"it immediately asserts Triton internals and calls"

  _inject_lora_into_fused_moe which is GPU-only"). Ascend sets self._lora_stream = None

  and self._events = None, so no auxiliary stream is actually created on NPU. The

  Ascend MoE LoRA path applies delta natively inside unquant_apply_mlp

  (moe_lora_apply_w13 / moe_lora_apply_w2) rather than via a dual-stream overlap.

  Additionally, upstream LoRAConfig._validate_lora_config (config/lora.py:125) raises

  ValueError if the flag is set on a non-CUDA-alike platform, so on Ascend the flag

  cannot even be enabled through the normal config validation path. Net effect on

  Ascend NPU runtime performance is negligible: "the flag is effectively inert for"

  the Ascend MoE LoRA path and blocked by validation for the dense path.

  '
usage_locations:
- file: vllm/envs.py:2151
