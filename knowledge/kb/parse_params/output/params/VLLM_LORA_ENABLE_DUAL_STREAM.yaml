related_parameters:
- name: enable_lora
  relation: Parent feature; this flag only matters when LoRA is enabled.
- name: fully_sharded_loras
  relation: Mutually exclusive; upstream validation disables dual stream when fully_sharded_loras is set.
- name: max_loras
  relation: LoRA concurrency setting; dual stream overlap benefit scales with LoRA workload.
- name: VLLM_LORA_DISABLE_PDL
  relation: Related PDL control for LoRA kernels; PDL in Triton LoRA ops is gated by dual stream.
constraints:
- Enabling VLLM_LORA_ENABLE_DUAL_STREAM on a non-CUDA-alike platform (including Ascend NPU) raises ValueError in LoRAConfig
  validation.
- The flag is automatically forced to False when fully_sharded_loras is enabled.
- The value must be 0 or 1; it is parsed as bool(int(...)).
tuning_advice:
  summary: Leave disabled on Ascend NPU; the dual-stream LoRA overlap is a CUDA-only optimization that vllm-ascend does not
    implement.
  suggested_values:
  - scenario: Any LoRA deployment on Ascend NPU (v1 or v2 worker)
    value: 0
    reason: Ascend skips the GPU-only aux stream init and config validation rejects the flag on non-CUDA platforms, so enabling
      it provides no benefit and may raise an error.
  - scenario: CUDA GPU deployment with LoRA and no fully_sharded_loras
    value: 1
    reason: Upstream overlaps base-layer compute with the LoRA fast path and enables PDL in Triton LoRA kernels, reducing
      latency.
  caveats:
  - Do not set this on Ascend expecting a speedup; the Ascend MoE LoRA path applies deltas natively without a secondary stream.
  - If you also use fully_sharded_loras, upstream will silently reset the flag to False.
  quick_guide: Keep VLLM_LORA_ENABLE_DUAL_STREAM=0 on Ascend NPU; it is a CUDA-only LoRA overlap optimization.
analysis_date: '2026-10-27'
