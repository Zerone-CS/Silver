related_parameters:
- name: --mm-processor-device
  relation: Convenience flag folded into mm_processor_kwargs['device']; explicit device in kwargs wins
- name: --mm-tensor-ipc
  relation: Must be torch_shm for 'auto' device to resolve to the accelerator on EPD encoder instances
- name: --limit-mm-per-prompt
  relation: Caps number of images/videos per prompt; together with max_pixels bounds total vision tokens
- name: --media-io-kwargs
  relation: Separate kwargs for media decoding (e.g. num_frames); complements processor kwargs
- name: --mm-processor-cache-gb
  relation: Caches processed MM inputs; larger token counts increase cache pressure
constraints:
- The dict keys must be accepted by the model's HF AutoProcessor; unknown keys cause the processor to raise an error at startup.
- An explicit 'device' key in --mm-processor-kwargs always wins over --mm-processor-device and is validated by _validate_mm_processor_device.
- The 'device' override only takes effect for HF 'fast' (torchvision-backed) processors; other processors ignore it and stay
  on CPU.
- On EPD encoder-only instances, 'auto' device resolves to the accelerator only when --mm-tensor-ipc=torch_shm; otherwise
  the processor stays on CPU.
tuning_advice:
  summary: Use mm_processor_kwargs to bound image/video token count (min_pixels/max_pixels/fps) to balance VLM prefill latency
    and memory against accuracy on Ascend NPUs.
  suggested_values:
  - scenario: Qwen-VL / Qwen3-VL image workloads on Ascend (default e2e test config)
    value: '{"min_pixels": 784, "max_pixels": 1003520, "fps": 1}'
    reason: Matches vllm-ascend e2e tests (28*28 min, 1280*28*28 max); bounds vision tokens to keep prefill latency and KV
      memory predictable.
  - scenario: Latency-sensitive / memory-constrained deployment
    value: '{"min_pixels": 784, "max_pixels": 250880}'
    reason: Lower max_pixels reduces vision tokens, cutting encoder forward time and KV cache usage at the cost of image detail.
  - scenario: High-detail OCR or document understanding
    value: '{"min_pixels": 784, "max_pixels": 2007040}'
    reason: Higher max_pixels preserves detail for text-heavy images; verify max_model_len and gpu_memory_utilization can
      absorb the extra tokens.
  - scenario: Video models
    value: '{"fps": 1}'
    reason: Low fps limits sampled frames, directly reducing encoder work and token count for video inputs.
  caveats:
  - Always cross-check max_pixels against --max-model-len and --gpu-memory-utilization; oversized images can cause OOM or
    prefill stalls on NPU.
  - Do not set 'device' in kwargs unless running an EPD encoder-only instance with --mm-tensor-ipc=torch_shm; otherwise it
    is ignored or validated away.
  - Changing these kwargs changes the config hash and invalidates compiled graphs / prefix cache across restarts.
  quick_guide: Set min_pixels/max_pixels (and fps for video) to cap vision tokens; start from the Ascend e2e defaults and
    lower max_pixels if prefill latency or memory is too high.
