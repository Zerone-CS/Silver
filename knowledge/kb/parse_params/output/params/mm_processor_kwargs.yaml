name: --mm-processor-kwargs
type: cli
category: model
scope: both
source_file:
- vllm/config/multimodal.py:128
- vllm/engine/arg_utils.py:1379
- vllm/engine/arg_utils.py:595
- vllm/config/model.py:399
- vllm/config/vllm.py:2739
- vllm/config/multimodal.py:343
value_type: dict
default: null
valid_choices: Model-specific dict of processor overrides (e.g. min_pixels, max_pixels, fps, num_crops, device); keys depend
  on the HF AutoProcessor of the model
cli_example: '--mm-processor-kwargs ''{"min_pixels": 784, "max_pixels": 1003520}'''
deprecated: false
performance_impact: medium
performance_scope:
- latency
- throughput
- memory
impact_detail: "This parameter is forwarded to the HF multi-modal processor (AutoProcessor) and\noverrides its defaults. It\
  \ does not touch the NPU compute path directly, but it\ncontrols how many pixels/frames the image/video processor emits,\
  \ which in turn\ndetermines the number of vision tokens fed to the ViT encoder and the language\nmodel. On Ascend this has\
  \ a real runtime effect:\n- \"`min_pixels`/`max_pixels` (Qwen-VL family) set the resize bounds of the image\"\n  processor.\
  \ Larger `max_pixels` -> more vision tokens -> larger encoder forward\n  and longer prefill sequences -> higher prefill\
  \ latency and more KV cache /\n  activation memory. Smaller values reduce tokens and speed up prefill but lose\n  image\
  \ detail.\n- \"`fps` (video models) controls frame sampling; higher fps -> more frames ->\"\n  proportionally more encoder\
  \ work and tokens.\n- \"`num_crops` (e.g. Phi-3-Vision) multiplies the number of image crops processed,\"\n  directly scaling\
  \ encoder cost.\n- \"The `device` key (folded from `--mm-processor-device` via\"\n  `MultiModalConfig.fold_mm_processor_device`\
  \ and resolved in\n  `VllmConfig._resolve_mm_processor_device`) can move the image transform onto\n  the accelerator for\
  \ encode-only (EPD) instances when `--mm-tensor-ipc=torch_shm`;\n  otherwise the transform stays on CPU. On Ascend, `current_platform.device_type`\n\
  \  is `npu`, so `auto` only resolves to the NPU in that narrow EPD+torch_shm case.\n- \"The kwargs are part of the model\
  \ config hash factors (vllm/config/model.py:459),\"\n  so changing them changes the config fingerprint (affects caching/compilation\n\
  \  reuse, not steady-state throughput).\nvllm-ascend does not override this parameter; it is passed through unchanged to\n\
  the HF processor. Ascend e2e tests (tests/e2e/conftest.py, test_vlm.py,\ntest_qwen3_vl_30b_a3b_instruct.py, etc.) use it\
  \ to bound image size for VLM\nworkloads, confirming it is the standard knob for controlling vision token count\non Ascend.\n"
