name: VLLM_KIMI_K3_SHARD_SP_SHARED_EXPERT
type: env
category: parallelism
scope: vllm
source_file:
- vllm/envs.py:1589
- vllm/envs.py:211
- vllm/models/kimi_k3/nvidia/model.py:146
- vllm/models/kimi_k3/nvidia/model.py:222
value_type: bool
default: false
valid_choices: 0 or 1 (parsed via int(), any non-zero int is truthy)
cli_example: null
deprecated: false
performance_impact: low
performance_scope:
- latency
- memory
impact_detail: 'This flag is read only in vllm/models/kimi_k3/nvidia/model.py (shard_sequence_parallel_mlp and

  KimiMLP). It is a Kimi-K3-only, NVIDIA-path (SM100/NVLink) optimization: when enabled and the

  MLP is under sequence parallelism, the dense/shared-expert MLP weights are TP-sharded instead of

  replicated. The forward then all-gathers the full token set, computes a partial, and

  reduce-scatters. This trades weight bandwidth and resident memory for two extra collectives per

  layer, and per the envs.py comment it "only wins at low token counts" and is "intended for decode

  instances in a P/D disaggregated deployment, not for prefill or unified serving."

  There is NO reference to this env var anywhere in vllm-ascend, and the only implementation lives

  in the nvidia model path (vllm/models/kimi_k3/nvidia/model.py). On Ascend NPU the Kimi-K3 model

  would use a different (ascend) model implementation, so this flag has no effect on Ascend runtime

  performance. It is included here for completeness because it is a real upstream env var, but it

  does not influence Ascend NPU latency, throughput, or memory.

  '
usage_locations:
- file: vllm/envs.py:1589
  context: Environment variable definition, default 0 (disabled).
- file: vllm/envs.py:211
  context: 'Type annotation VLLM_KIMI_K3_SHARD_SP_SHARED_EXPERT: bool = False.'
