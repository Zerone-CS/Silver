name: --fully-sharded-loras
type: cli
category: model
scope: both
source_file:
- vllm/config/lora.py:39
- vllm/engine/arg_utils.py:1496
- vllm/engine/arg_utils.py:2463
- vllm/lora/layers/base_linear.py:118
- vllm/lora/layers/base_linear.py:127
- vllm/lora/layers/column_parallel_linear.py:26
- vllm/lora/layers/column_parallel_linear.py:221
- vllm/lora/layers/fused_moe.py:239
- vllm_ascend/lora/punica_npu.py:62
value_type: bool
default: false
valid_choices: 'true or false (BooleanOptionalAction: --fully-sharded-loras / --no-fully-sharded-loras)'
cli_example: --fully-sharded-loras
deprecated: false
performance_impact: medium
performance_scope:
- latency
- throughput
- memory
impact_detail: 'Controls how LoRA computation is partitioned across tensor-parallel ranks.

  Upstream (vllm/lora/layers/base_linear.py:115-129 and column_parallel_linear.py:219-223):

  when False, ColumnParallelLinear keeps the full lora_A output dim (max_lora_rank) on every

  TP rank and RowParallelLinear keeps the full lora_B output dim (output_size) per rank, so

  only half of the LoRA matmul is sharded. When True, lora_A output dim becomes

  divide(max_lora_rank, tp_size) and lora_B output dim becomes divide(output_size, tp_size),

  fully sharding both factors. This shrinks per-rank LoRA weight buffers (memory) and reduces

  per-rank matmul FLOPs, but requires an all-gather/all-reduce of the shrunk intermediate

  (see _mcp_apply in column_parallel_linear.py:26-63, which allocates a [n_slices, tokens,

  local_lora_rank] buffer and calls punica_wrapper.add_shrink then communicates). At high

  sequence length, high max_lora_rank, or large TP size the reduced compute outweighs the

  added communication, hence "likely faster".

  Ascend-specific: "vllm_ascend/lora/punica_npu.py:58-63 gates the single-LoRA fast path"

  (_single_lora_slot) on `not self.lora_config.fully_sharded_loras`. On A2/A3 devices with

  max_loras == 1, enabling --fully-sharded-loras DISABLES the optimized single-slot kernel

  path and its preallocated mask buffer, falling back to the general multi-slot path. So on

  Ascend the flag trades the fast single-adapter path for full sharding; the net win depends

  on TP size and sequence length. The flag also participates in LoRAConfig.compute_hash

  (lora.py:103), so toggling it changes the compilation cache key and forces recompilation.

  '
