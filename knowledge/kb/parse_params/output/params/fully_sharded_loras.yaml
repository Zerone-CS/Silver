related_parameters:
- name: --enable-lora
  relation: Must be enabled for this flag to take effect; LoRAConfig is only built when enable_lora is True.
- name: --tensor-parallel-size
  relation: Larger TP size increases the benefit of full sharding (more compute reduction) but also more communication.
- name: --max-lora-rank
  relation: Higher rank increases per-rank LoRA matmul cost, making full sharding more beneficial.
- name: --max-loras
  relation: On Ascend A2/A3, max_loras == 1 enables the single-slot fast path which this flag disables.
- name: --enable-expert-parallel
  relation: Mutually exclusive with fully sharded LoRA for Fused MoE layers; enabling both raises an assertion error.
constraints:
- Fused MoE LoRA does not support --enable-expert-parallel together with --fully-sharded-loras; enabling both raises an assertion
  error.
- The flag only has effect when --enable-lora is set; otherwise no LoRAConfig is created.
- When fully sharded, max_lora_rank must be divisible by tensor-parallel size (divide() is used on the rank dim).
- When fully sharded, the RowParallelLinear output size must be divisible by tensor-parallel size.
tuning_advice:
  summary: Enable --fully-sharded-loras when using LoRA with large tensor-parallel size, high max-lora-rank, or long sequences;
    keep it off for single-adapter (max-loras 1) Ascend A2/A3 workloads where the fast path matters.
  suggested_values:
  - scenario: LoRA with TP >= 4, high max-lora-rank (32/64), long sequences
    value: true
    reason: Full sharding divides LoRA matmul work across ranks, reducing per-rank FLOPs and weight memory; the compute savings
      outweigh added communication at large TP/rank.
  - scenario: Single adapter (--max-loras 1) on Ascend A2/A3
    value: false
    reason: Enabling it disables the optimized single-LoRA-slot fast path in punica_npu.py, likely losing more than the sharding
      gains.
  - scenario: Small TP size (1-2) with short sequences
    value: false
    reason: Communication overhead of full sharding dominates when there is little compute to shard.
  - scenario: MoE model with --enable-expert-parallel
    value: false
    reason: Fused MoE LoRA asserts against combining expert parallelism with fully sharded LoRA.
  caveats:
  - Benchmark both settings on your actual TP size and sequence length; the win is workload-dependent.
  - Verify max_lora_rank and output sizes are divisible by TP size before enabling.
  - Expect a recompilation when toggling the flag due to hash change.
  quick_guide: Turn on --fully-sharded-loras for large-TP, high-rank, long-sequence LoRA; leave off for single-adapter Ascend
    A2/A3 or small TP.
analysis_date: '2026-10-27'
