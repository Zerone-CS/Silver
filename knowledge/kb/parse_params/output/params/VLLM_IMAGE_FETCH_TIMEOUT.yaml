related_parameters:
- name: VLLM_VIDEO_FETCH_TIMEOUT
  relation: Sibling timeout for video fetching (default 30s); same media-loading mechanism
- name: VLLM_AUDIO_FETCH_TIMEOUT
  relation: Sibling timeout for audio fetching (default 10s)
- name: VLLM_MEDIA_FETCH_MAX_RETRIES
  relation: Retry count for media fetches; each retry quadruples the timeout, so effective worst-case wait is timeout * (1
    + 4 + 16 + ...)
- name: VLLM_MEDIA_CACHE
  relation: When media caching is enabled, repeated URLs avoid re-fetching and thus avoid the timeout wait
- name: VLLM_MEDIA_CONNECTOR
  relation: Selects the media connector (default http); timeout applies to the http connector's URL loading
constraints:
- The value must be a positive integer number of seconds; a non-integer string will raise a ValueError when the env var is
  parsed.
- This timeout only applies to images fetched from remote URLs; base64 data URLs are decoded locally and are not subject to
  it.
tuning_advice:
  summary: Leave at the 5s default for typical deployments; raise it only when serving multimodal models with slow remote
    image hosts, and lower it if stalled image fetches are inflating request latency.
  suggested_values:
  - scenario: Standard multimodal serving with fast/reliable image CDN or local object storage
    value: 5
    reason: Default is adequate; keeps worst-case blocking on a bad URL short.
  - scenario: Slow or high-latency remote image sources (cross-region object storage, congested networks)
    value: 15
    reason: Reduces spurious fetch failures/timeouts on slow links while still bounding the wait.
  - scenario: Latency-sensitive online serving where a hung image URL must not stall the batch
    value: 2
    reason: Fails fast on unreachable images, limiting head-of-line blocking of multimodal preprocessing.
  caveats:
  - Effective worst-case wait is compounded by VLLM_MEDIA_FETCH_MAX_RETRIES (default 3), since each retry quadruples the timeout
    per the envs.py comment — a large timeout can multiply into very long stalls.
  - This parameter has no effect on the NPU compute path; it only affects multimodal URL fetching and public-asset downloads,
    so it will not change tokens/sec on Ascend hardware.
  - No vllm-ascend override exists; behavior is identical to upstream vLLM on Ascend NPU.
  - Changing this value does not invalidate torch.compile caches (it is in compile_factors ignored_factors).
  quick_guide: Keep 5s unless remote image hosts are slow; raise to ~15s for slow networks, lower to ~2s for latency-critical
    serving.
analysis_date: '2026-10-27'
