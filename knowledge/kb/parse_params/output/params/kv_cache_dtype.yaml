related_parameters:
- name: --gpu-memory-utilization
  relation: Together they determine the number of KV blocks; a smaller KV dtype multiplies the blocks available at the same
    memory fraction.
- name: --kv-cache-memory-bytes
  relation: Alternative explicit KV memory budget; the dtype determines how many tokens that budget holds.
- name: --attention-config.indexer_kv_dtype
  relation: Separate dtype for the sparse-attention indexer cache; enable_sparse_li_c8/c4 are derived from it, and it is mutually
    exclusive between fp8/int8 and mxfp4.
- name: --kv-cache-dtype-skip-layers
  relation: Excludes specific layers from KV quantization; skipped layers keep higher precision and pad to the quantized page
    size.
- name: --block-size
  relation: KV dtype changes per-token byte size and thus the page size; hybrid models align attention and Mamba page sizes
    based on it.
- name: --quantization
  relation: Weight/activation quantization is independent of KV cache dtype; C8 KV cache is controlled only by --kv-cache-dtype.
- name: --speculative-config.kv_cache_dtype
  relation: Draft model inherits the target's --kv-cache-dtype when unset.
constraints:
- Upstream CacheDType Literal rejects int8/mxfp8/turboquant values unless the vllm-ascend patch_kv_cache_dtype platform patch
  is active (it is loaded via adapt_patch in pre_register_and_update).
- The chosen dtype must be listed in the selected attention backend's supported_kv_cache_dtypes, otherwise backend selection
  will not accept it.
- enable_sparse_li_c8 and enable_sparse_li_c4 are mutually exclusive and raise ValueError if both are derived true.
- enable_kv_nz requires an MLA model and a PD-disaggregated KV consumer (decode) node, otherwise RuntimeError/NotImplementedError
  is raised.
- For DeepSeekV3.2-like models that default to fp8 KV cache, bfloat16 is only a valid override for those models; it is an
  invalid option for models that do not default to fp8.
- The SFA C8 packed KV cache path (enable_sparse_sfa_c8) is only activated when the model uses SFA sparse attention or a kpool
  indexer.
tuning_advice:
  summary: Use fp8 (or int8 on DeepSeek V4 MLA) KV cache to roughly double KV capacity and cut HBM traffic on Ascend, falling
    back to bfloat16 only when accuracy requires it.
  suggested_values:
  - scenario: DeepSeek-V4-Flash/Pro on 950PR/950DT with C8 sparse attention
    value: fp8
    reason: Default C8 scheme on these products; enables enable_sparse_sfa_c8 and the C8 reshape optimization, giving the
      fastest attention path with acceptable accuracy.
  - scenario: DeepSeek V4 MLA on Ascend where int8 KV cache is supported
    value: int8
    reason: Ascend-specific int8 MLA KV cache (enabled by patch_kv_cache_dtype) also triggers enable_sparse_sfa_c8 and halves
      KV footprint versus bf16.
  - scenario: GLM5.2 / DSA sparse-attention prefill nodes
    value: int8
    reason: Docs pair --kv-cache-dtype int8 with --attention_config.indexer_kv_dtype int8 for SFA/LI sparse attention and
      C8 reshape optimization on prefill nodes.
  - scenario: Accuracy-sensitive workloads or models without fp8 KV support
    value: bfloat16
    reason: Keeps full-precision KV cache; use when fp8/int8 causes accuracy regression, at the cost of ~2x KV memory.
  - scenario: Default / unknown model
    value: auto
    reason: Uses the model dtype; safe baseline before benchmarking quantized KV cache.
  caveats:
  - Always benchmark accuracy after switching to fp8/int8; the C8 path is chosen implicitly and cannot be toggled separately.
  - int8 and turboquant dtypes require the vllm-ascend platform patch; they are not valid on stock vLLM.
  - 'Combine with --gpu-memory-utilization tuning: after halving KV bytes, raise utilization or batch size to realize the
    throughput gain.'
  quick_guide: Set --kv-cache-dtype fp8 (or int8 for DeepSeek V4 MLA) to double KV capacity and unlock Ascend C8 kernels;
    use bfloat16 only if accuracy regresses.
analysis_date: '2026-10-27'
