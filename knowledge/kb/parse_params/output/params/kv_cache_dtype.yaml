name: --kv-cache-dtype
type: cli
category: kv_cache
scope: both
source_file:
- vllm/config/cache.py:111
- vllm/engine/arg_utils.py:1275
- vllm/engine/arg_utils.py:459
- vllm/v1/attention/backend.py:63
- vllm_ascend/patch/platform/patch_kv_cache_dtype.py:48
- vllm_ascend/ascend_config.py:918
- vllm_ascend/ascend_config.py:920
- vllm_ascend/patch/platform/patch_mamba_config.py:35
- vllm_ascend/patch/platform/patch_mamba_config.py:80
- vllm_ascend/patch/platform/patch_kv_cache_utils.py:292
value_type: str
default: auto
valid_choices: 'upstream: auto, float16, bfloat16, fp8, fp8_e4m3, fp8_e5m2, fp8_inc, fp8_ds_mla, nvfp4_4over6 (plus model-specific);
  vllm-ascend widens the Literal to additionally accept int8, mxfp8, turboquant_k8v4, turboquant_4bit_nc, turboquant_k3v4_nc,
  turboquant_3bit_nc, int4_per_token_head, int8_per_token_head'
cli_example: --kv-cache-dtype fp8
deprecated: false
performance_impact: high
performance_scope:
- memory
- throughput
- latency
impact_detail: '--kv-cache-dtype selects the storage dtype of the paged KV cache, which directly

  determines how many KV blocks fit in NPU HBM and how much memory bandwidth each

  attention step consumes. On Ascend this parameter is not merely a storage hint:

  vllm-ascend derives several execution paths from it.

  (1) Memory capacity: switching from bfloat16 to fp8/int8 halves the per-token KV

  footprint, roughly doubling the number of KV blocks (and thus max concurrency /

  batch size) for a fixed --gpu-memory-utilization. This is the dominant lever for

  decode throughput on memory-bandwidth-bound Ascend NPUs.

  (2) Ascend sparse-attention dispatch: vllm_ascend/ascend_config.py:918-922 reads

  cache_config.cache_dtype and sets enable_sparse_sfa_c8 when cache_dtype is in

  ["fp8","int8"] and the model uses SFA sparse attention (or a kpool indexer), and

  enable_sparse_sfa_turboquant when cache_dtype == "turboquant_4bit_nc". These flags

  gate the C8 packed-KV-cache kernels and the reshape optimization

  (_c8_reshape_optim_enabled, ascend_config.py:933), i.e. a different, faster

  attention kernel path is selected purely by this flag.

  (3) Hybrid/Mamba page-size alignment: patch_mamba_config.py:80-83 resolves

  cache_dtype to a torch dtype to compute the attention token page size so it can be

  aligned with the Mamba state page size; a different dtype changes the page size and

  therefore the block layout and padding overhead.

  (4) KV cache group construction: patch_kv_cache_utils.py:292 checks

  cache_dtype_str == TURBOQUANT_CACHE_DTYPE to route to the TurboQuant group-spec

  builder, changing how layer tuples are grouped and padded.

  (5) vllm-ascend widens the accepted Literal (patch_kv_cache_dtype.py:48-67) to add

  int8 (DeepSeek V4 Ascend MLA KV cache), mxfp8 (C8-MXFP on the QFA path) and the

  turboquant/int4/int8_per_token_head variants, and widens the argparse choices in

  platform.py::pre_register_and_update. Without this patch, --kv-cache-dtype int8

  fails pydantic literal validation before reaching the kernel.

  (6) Upstream attention backends declare supported_kv_cache_dtypes

  (vllm/v1/attention/backend.py:63); a dtype not supported by the selected backend

  causes backend selection to reject it, so the effective kernel may change.

  Net effect: "fp8/int8 KV cache typically raises throughput and lowers per-token"

  latency via larger batches and reduced HBM traffic, at some accuracy cost; the

  Ascend C8 sparse paths additionally unlock dedicated kernels.

  '
