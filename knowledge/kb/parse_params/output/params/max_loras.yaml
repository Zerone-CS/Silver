value_type: int
default: 1
valid_choices: integer >= 1
cli_example: --max-loras <int>
deprecated: false
performance_impact: medium
performance_scope:
- throughput
- memory
- latency
impact_detail: "--max-loras bounds how many distinct LoRA adapters may be active in a single\nbatch. It is consumed in two\
  \ distinct places:\n\n1. Scheduler admission (vllm/v1/core/sched/scheduler.py:852,897 and the\n   vllm-ascend scheduler\
  \ variants: \"vllm_ascend/core/dyntra_lb_scheduler.py:660,706,\"\n   vllm_ascend/core/recompute_scheduler.py:462,509,\n\
  \   vllm_ascend/core/scheduler_profiling_chunk.py:618,662,\n   vllm_ascend/patch/platform/patch_balance_schedule.py:388,424).\
  \ The scheduler\n   tracks the set of lora_int_id values among running requests and, when the\n   count reaches max_loras,\
  \ defers any waiting request that would introduce a\n   new adapter (pop_request + prepend to skipped_waiting). So max_loras\
  \ directly\n   caps the number of distinct adapters that can be co-scheduled; setting it too\n   low serializes multi-adapter\
  \ workloads and reduces effective batch size /\n   throughput, while setting it higher than needed wastes device memory.\n\
  \n2. CUDA/NPU graph capture and dispatch (vllm/v1/cudagraph_dispatcher.py:124,295).\n   When cudagraph_specialize_lora is\
  \ off, graphs are captured only for\n   max_loras + 1 active LoRAs and dispatch always uses max_loras + 1; when\n   specialize_active_lora\
  \ is on, separate graphs are captured for powers of 2 up\n   to max_loras. A larger max_loras therefore increases the number\
  \ of captured\n   graph variants (more capture time and memory) and, in the non-specialized\n   path, forces every LoRA\
  \ batch to be padded to max_loras + 1 slots.\n\nOn Ascend, vllm_ascend/worker/model_runner_v1.py:4189 explicitly overrides\
  \ the\nnum_active_loras passed to maybe_dummy_run_with_lora with\nself.lora_config.max_loras (a temporary workaround for\
  \ a llama32_lora accuracy\nissue). This means the Ascend v1 worker always dummy-runs with the full\nmax_loras active, so\
  \ a large max_loras inflates dummy-run/capture cost and\nmemory reservation on NPU regardless of the actual runtime adapter\
  \ count.\nThe vllm-ascend docs (lora.md) note that --max-loras 1 keeps a single device\nslot and is the setting used by\
  \ the fast path.\n"
