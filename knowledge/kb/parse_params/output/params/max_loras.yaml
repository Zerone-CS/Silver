related_parameters:
- name: --enable-lora
  relation: max_loras only takes effect when LoRA is enabled
- name: --max-cpu-loras
  relation: Must be >= max_loras; controls CPU-side adapter cache size
- name: --max-lora-rank
  relation: Together with max_loras determines LoRA kernel/graph memory footprint
- name: --specialize-active-lora
  relation: When enabled, captures graphs per active-LoRA count (powers of 2 up to max_loras) instead of a single max_loras+1
    graph
- name: --fully-sharded-loras
  relation: Sharding strategy interacts with per-adapter memory cost
constraints:
- --max-loras must be an integer greater than or equal to 1.
- --max-cpu-loras, if set, must be greater than or equal to --max-loras.
- The number of distinct LoRA adapters active in a single batch can never exceed --max-loras; requests introducing additional
  adapters are deferred to a later scheduling step.
tuning_advice:
  summary: Set --max-loras to the peak number of distinct adapters you expect concurrently in one batch; keep it at 1 for
    single-adapter fast path, raise only when multi-adapter concurrency is required.
  suggested_values:
  - scenario: Single adapter serving (one LoRA, or base model only)
    value: 1
    reason: Keeps a single device slot and uses the fast path; minimizes graph capture variants and dummy-run cost on Ascend.
  - scenario: Multi-tenant serving with a small set of hot adapters
    value: 4
    reason: Allows up to 4 distinct adapters co-scheduled per batch while keeping graph capture and memory overhead modest.
  - scenario: Many adapters with high concurrency, memory available
    value: 8
    reason: Increases co-scheduling of distinct adapters; pair with --specialize-active-lora to avoid padding every batch
      to max_loras+1.
  caveats:
  - On Ascend v1 worker the dummy run always uses max_loras active adapters, so avoid over-provisioning --max-loras beyond
    real concurrency needs.
  - Ensure --max-cpu-loras >= --max-loras to avoid adapter eviction thrash.
  - Consider enabling --specialize-active-lora when max_loras > 1 to capture per-count graphs and reduce padding overhead.
  quick_guide: Use --max-loras 1 for single-adapter fast path; raise to your peak concurrent adapter count only when multi-adapter
    batching is needed.
analysis_date: '2026-10-27'
