name: --max-loras
type: cli
category: model
scope: both
source_file:
- vllm/config/lora.py:37
- vllm/engine/arg_utils.py:1484
- vllm/engine/arg_utils.py:2461
- vllm/v1/core/sched/scheduler.py:852
