  context: Upstream v1 appends _dp{dp_rank} to engine_id when data_parallel_size > 1 to keep DP engines unique.
- file: vllm/v1/engine/utils.py:396
  context: Upstream v1 _apply_dp_identity_suffix appends _dp{dp_rank} to engine_id for sibling DP engines.
