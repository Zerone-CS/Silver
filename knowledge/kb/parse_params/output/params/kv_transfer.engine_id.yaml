name: kv_transfer.engine_id
type: nested
category: kv_cache
scope: both
source_file:
- vllm_ascend/platform.py:821
- vllm_ascend/distributed/kv_transfer/kv_p2p/mooncake/connector.py:80
- vllm_ascend/distributed/kv_transfer/kv_p2p/mooncake_connector.py:1618
- vllm_ascend/distributed/kv_transfer/kv_p2p/mooncake_d2rh_connector.py:2571
- vllm_ascend/distributed/kv_transfer/kv_p2p/mooncake_hybrid_connector.py:1212
- vllm_ascend/distributed/kv_transfer/kv_p2p/mooncake_layerwise_connector.py:728
- vllm/v1/engine/core.py:1310
- vllm/v1/engine/utils.py:396
- vllm/distributed/kv_transfer/kv_connector/factory.py:65
value_type: str
default: None
valid_choices: any non-empty string; must be unique per engine instance (per DP rank / per P or D node)
cli_example: null
deprecated: false
performance_impact: medium
performance_scope:
- latency
- throughput
impact_detail: 'engine_id is the identity key used by KV-transfer connectors (Mooncake, NIXL, etc.) to

  register and address a given engine instance in the disaggregated prefill/decode (P/D)

  topology. It is not a compute knob, but it directly gates whether KV cache reuse across

  P/D nodes works at all, which is the whole point of the P/D disaggregation path.


  Upstream vLLM (v1): in vllm/v1/engine/core.py:1310 and vllm/v1/engine/utils.py:396, when

  data_parallel_size > 1 the engine_id is suffixed with `_dp{dp_rank}` so that sibling DP

  engines get unique connector identities. The comment explicitly states this is required

  "to ensure that the kv_transfer_config is unique for each DP rank" and that "KV-connector

  engine_ids must be unique across sibling DP engines or registration collides." A collision

  means two engines register under the same id, so remote peers pull KV from the wrong

  engine — causing failed/incorrect transfers, retries, and effectively disabling cross-node

  KV reuse (latency up, prefill compute wasted, throughput down).


  vllm-ascend override: "vllm_ascend/platform.py:817-822 patches the engine_id during platform"

  config validation by appending a random UUID hex suffix:

  `engine_id = f"{engine_id}-{uuid4().hex}"`, guarded by a `_engine_id_patched` flag for

  idempotency. The comment states the intent: "make engine_id unique so P/D nodes or restarts

  never collide." This means on Ascend the user-supplied engine_id is NOT used verbatim — it

  is always made unique per process. This is a behavioral divergence from upstream: any

  external orchestration that hard-codes engine_id to match a peer (e.g. a proxy that routes

  by engine_id, or a P node that must know the D node''s engine_id) must account for the

  suffix, or rely on the connector''s own discovery/handshake rather than the literal id.


  All Ascend Mooncake connectors (mooncake/connector.py:80, mooncake_connector.py:1618,

  mooncake_d2rh_connector.py:2571, mooncake_hybrid_connector.py:1212) read

  `vllm_config.kv_transfer_config.engine_id` and pass `str(self.engine_id)` into the

  scheduler/worker. The metadata layer (mooncake/metadata.py:167, mooncake_connector.py:1593,

  mooncake_hybrid_connector.py:1191, mooncake_layerwise_connector.py:728) keys incoming

  requests by `remote_engine_id` from kv_transfer_params, so the id is the routing key for

  which remote engine to pull from. Correctness of this key is a prerequisite for the

  KV-transfer fast path; when it is wrong the transfer fails and the request falls back to

  local recompute (higher TTFT, lower effective throughput).

  '
