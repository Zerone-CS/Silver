related_parameters:
- name: kv_transfer_config.kv_connector
  relation: engine_id is only meaningful when a KV connector (MooncakeConnectorV1/V2, NixlConnector, etc.) is configured.
- name: kv_transfer_config.kv_role
  relation: P nodes use kv_producer, D nodes use kv_consumer; engine_id must be unique per role group and per instance.
- name: kv_transfer_config.kv_port
  relation: Must be unique per instance alongside engine_id; docs pair them (e.g. kv_port 30100 / engine_id 1 for Prefill).
- name: kv_transfer_config.kv_connector_extra_config
  relation: Child connectors in a multi-connector setup inherit the outer engine_id unless overridden per child.
- name: data_parallel_size
  relation: When > 1, upstream appends _dp{dp_rank} to engine_id; Ascend additionally appends a uuid suffix.
constraints:
- engine_id must not be None when a KV connector is instantiated; Mooncake/NIXL connectors assert it is not None.
- Each engine instance (each DP rank, each P or D node) must have a unique engine_id, otherwise connector registration collides
  and KV transfers route to the wrong peer.
- On Ascend, the user-supplied engine_id is always suffixed with a random uuid4 hex by vllm_ascend/platform.py, so the literal
  configured value is not the runtime id.
- When data_parallel_size > 1, upstream vLLM appends _dp{dp_rank} to engine_id, so the effective id differs from the configured
  value.
tuning_advice:
  summary: Assign a unique, stable engine_id per engine instance (per DP rank / per P or D node) and rely on connector discovery
    rather than the literal id, since Ascend appends a uuid suffix at runtime.
  suggested_values:
  - scenario: Single P/D pair, MooncakeConnectorV1, no DP
    value: '0'
    reason: Docs use engine_id 0 for the prefill engine; uniqueness is trivially satisfied with one instance per role.
  - scenario: Multiple P instances (e.g. 4 P nodes)
    value: 0,1,2,3 (increment per P instance)
    reason: 'DeepSeek-V4-Flash doc: engine_id should start from 0 and increment sequentially per P instance, paired with a
      unique kv_port.'
  - scenario: Prefill vs Decode role groups (GLM5.2)
    value: 0 for prefill, 2 for decode
    reason: 'Doc specifies fixed engine_id per role group: 0 for prefill (shared by PP ranks), 2 for decode engines.'
  - scenario: DP-launched engines (GLM5.3-Flash)
    value: $4 (DP rank from launch_online_dp.py)
    reason: 'Doc: each engine must have a unique engine_id and lookup_rpc_port; child connectors inherit the outer engine_id.'
  caveats:
  - On Ascend the configured engine_id is suffixed with a uuid4 hex at platform init; do not hard-code the literal id in external
    routing logic.
  - Ensure engine_id and kv_port are both unique per instance; docs pair them (e.g. kv_port 30100 / engine_id 1).
  - With data_parallel_size > 1, upstream appends _dp{dp_rank}; combined with the Ascend uuid suffix the runtime id is fully
    unique but not human-predictable.
  quick_guide: Give every engine instance a unique engine_id (increment per P/D node or use DP rank); on Ascend it is auto-suffixed
    with a uuid, so route via connector discovery, not the literal id.
