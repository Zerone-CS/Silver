related_parameters:
- name: multistream_engram_overlap
  relation: Sibling multi-stream overlap switch; defaults to True only on A5 (FP8_OPTIMIZED) hardware, whereas multistream_dsv4_dsa_overlap
    defaults to True unconditionally
- name: multistream_overlap_shared_expert
  relation: Another multi-stream overlap switch (shared expert overlap), default False
- name: enable_dsa_cp
  relation: DSA context-parallel switch for DeepSeek V3.2/V4; both relate to DSA execution but control different optimizations
constraints:
- Only meaningful for DeepSeek V4 (and same-architecture DSA) models; it has no effect on models that do not use DSA.
- Unknown keys in --additional-config are rejected (extra=forbid), so the key name must be spelled exactly as multistream_dsv4_dsa_overlap.
tuning_advice:
  summary: Keep enabled (default) for DeepSeek V4 to overlap DSA work across streams; disable only if you hit stability/precision
    issues.
  suggested_values:
  - scenario: DeepSeek V4 inference on Ascend NPU, default deployment
    value: true
    reason: Default True enables DSA multi-stream overlap, hiding DSA op latency behind main-stream compute for lower latency
      and higher throughput.
  - scenario: Debugging precision issues or stream-sync instability with DeepSeek V4
    value: false
    reason: Disabling serializes DSA work onto the main stream, simplifying execution and ruling out overlap-related races
      at the cost of some performance.
  - scenario: Non-DSA models (e.g. standard dense or non-DeepSeek-V4 MoE)
    value: true
    reason: The switch is inert for models without DSA, so leaving the default has no effect.
  caveats:
  - Only applies to DeepSeek V4 / DSA architectures; no benefit for other models.
  - Enabled by default regardless of hardware family, unlike multistream_engram_overlap which is A5-gated.
  quick_guide: Leave at default true for DeepSeek V4; set false only to debug overlap-related instability.
