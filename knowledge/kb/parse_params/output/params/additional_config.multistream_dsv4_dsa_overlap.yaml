- throughput
impact_detail: 'This is a vllm-ascend-only switch defined in AscendConfig (vllm_ascend/ascend_config.py:569)

  as a plain bool field with default True. It is passed to vllm-ascend via

  --additional-config ''{"multistream_dsv4_dsa_overlap": true}''. Per the docs

  (user_guide/configuration/additional_config.md:81) it controls whether "dsa multi-stream

  overlap" is enabled for DeepSeek V4 (DSA = DeepSeek Sparse Attention). The mechanism is

  multi-stream execution: "DSA-related work (e.g. sparse attention indexer/top-k selection and"

  associated compute/communication) is dispatched onto an auxiliary NPU stream so it can overlap

  with the main compute stream, hiding latency behind other work. Enabling it can reduce

  end-to-end latency and improve throughput for DeepSeek V4 models by overlapping DSA ops with

  the rest of the forward pass. Disabling it serializes that work onto the main stream, which is

  simpler/safer but loses the overlap benefit. The parameter only has an effect for DeepSeek V4

  (and same-architecture) models that use DSA; for other models it is inert. No usage sites were

  found in the provided extraction, so the exact dispatch path is not visible here, but the

  field is a user-input switch consumed by the Ascend config factory and read by the model

  runner / attention backend for DSA models.

  '
usage_locations:
