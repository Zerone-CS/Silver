name: --data-parallel-rank
type: cli
category: parallelism
scope: both
source_file:
- vllm/engine/arg_utils.py:1130
- vllm/engine/arg_utils.py:497
- vllm/config/parallel.py:136
- vllm_ascend/worker/model_runner_v1.py:420
- vllm_ascend/worker/model_runner_v1.py:3407
- vllm_ascend/worker/worker.py:402
- vllm_ascend/distributed/kv_transfer/kv_p2p/mooncake/base_scheduler.py:82
- vllm_ascend/distributed/kv_transfer/kv_p2p/mooncake/base_worker.py:95
value_type: int
default: null
valid_choices: non-negative integer in [0, data_parallel_size)
cli_example: --data-parallel-rank 0
deprecated: false
performance_impact: medium
performance_scope:
- throughput
- latency
impact_detail: "--data-parallel-rank (-dpn) is the global DP rank of this vLLM instance. Setting it\nexplicitly enables \"\
  external load balancer\" (external LB) mode for MoE data-parallel\ndeployments (vllm/engine/arg_utils.py:2220-2222: data_parallel_external_lb\
  \ becomes True\nwhen data_parallel_rank is not None). In external LB mode each DP rank runs as an\nindependent vLLM instance\
  \ with its own API server, and an external proxy routes requests\nto ranks — this is the \"one-pod-per-rank\" wide-EP topology\
  \ used on Ascend for large MoE\nmodels (e.g. Kimi-K2.5, DeepSeek) where DP+EP is the dominant scaling strategy.\n\nPerformance\
  \ mechanism on Ascend:\n1. DP rank identity drives the DP metadata synchronization path. In\n   vllm_ascend/worker/model_runner_v1.py:3399-3416,\
  \ when data_parallel_size > 1 the\n   runner calls _sync_metadata_across_dp() and then indexes num_tokens_across_dp by\n\
  \   self.parallel_config.data_parallel_rank to pick the padded token count for this rank,\n   re-dispatching the CUDA/NPU\
  \ graph with the agreed batch size. A wrong rank here means\n   the rank reads another rank's token count, causing graph\
  \ re-dispatch mismatch, extra\n   padding, or an assertion failure — directly affecting per-step latency and throughput.\n\
  2. DP rank determines NPU device binding. vllm_ascend/worker/worker.py:402-406 shifts\n   local_rank by dp_local_rank *\
  \ tp_pp_world_size so each DP group binds to a distinct set\n   of NPUs; incorrect rank assignment leads to device collisions\
  \ or idle NPUs.\n3. DP rank is used to derive side-channel/handshake ports in the Mooncake KV-transfer\n   connectors (base_scheduler.py:82,\
  \ base_worker.py:107-112, mooncake_connector.py:1764,\n   mooncake_hybrid_connector.py:1341, mooncake_d2rh_connector.py:345).\
  \ Each DP rank gets a\n   disjoint port range of size tp*pp*pcp; a duplicate rank causes port collisions and\n   connection\
  \ failures in PD-disaggregated deployments.\n4. In external LB mode, data_parallel_size_local is forced to 1 and hybrid\
  \ LB is disabled\n   (arg_utils.py:2249-2258), so each instance serves exactly one DP rank — the load\n   balancer, not\
  \ vLLM, decides request distribution. Throughput therefore depends on the\n   external proxy's routing quality; a skewed\
  \ proxy starves some ranks and inflates tail\n   latency.\nThe parameter itself does not change kernel selection or memory\
  \ footprint, but it gates\nthe entire DP/EP execution topology, so its impact is medium (indirect but structural).\n"
usage_locations:
- file: vllm/engine/arg_utils.py:1130
  context: CLI definition of --data-parallel-rank / -dpn; help states it enables external LB mode for MoE DP deployments and
    is unsupported for non-MoE models.
- file: vllm/engine/arg_utils.py:2220
  context: data_parallel_external_lb is set True when data_parallel_rank is not None; also required for fault tolerance and
    validated against non-MoE models.
- file: vllm/config/parallel.py:136
  context: ParallelConfig.data_parallel_rank field (default 0, ge=0), bounded by data_parallel_size in __post_init__.
- file: vllm/config/parallel.py:645
  context: DP rank 0 binds and publishes the DP master port in stateless DP group init; other ranks read it.
- file: vllm_ascend/worker/model_runner_v1.py:420
  context: Model runner stores dp_rank from parallel_config for DP metadata handling.
- file: vllm_ascend/worker/model_runner_v1.py:3407
  context: Indexes num_tokens_across_dp by data_parallel_rank to select padded token count and re-dispatch NPU graph.
- file: vllm_ascend/worker/worker.py:402
  context: Uses data_parallel_rank_local/data_parallel_index to shift local_rank so each DP group binds distinct NPUs.
- file: vllm_ascend/distributed/kv_transfer/kv_p2p/mooncake/base_scheduler.py:82
  context: Side-channel port = kv_port + max_device_id + data_parallel_rank for Mooncake scheduler.
- file: vllm_ascend/distributed/kv_transfer/kv_p2p/mooncake/base_worker.py:95
  context: Mooncake worker derives dp_rank/dp_size and handshake port from DP rank; raises if local DP rank is None.
related_parameters:
- name: --data-parallel-size
  relation: Global DP rank must be in [0, data_parallel_size); external LB mode requires data_parallel_size > 1.
- name: --data-parallel-external-lb
  relation: Setting --data-parallel-rank implicitly enables external LB mode; the two are semantically linked.
- name: --data-parallel-size-local
  relation: In external LB mode must be 1 or omitted; otherwise a ValueError is raised.
- name: --data-parallel-start-rank
  relation: Alternative way to set the starting DP rank for secondary nodes; used to infer hybrid LB mode.
- name: --data-parallel-address
  relation: DP master address used together with the rank for DP group init and ZMQ/RPC.
- name: --data-parallel-rpc-port
  relation: Fixed RPC port shared by all DP ranks; must be identical across the group.
- name: --enable-expert-parallel
  relation: DP rank is primarily meaningful for MoE + EP deployments; non-MoE models reject external DP mode.
- name: --nnodes / --node-rank
  relation: When nnodes > 1, DP rank can be inferred from node_rank; explicit rank overrides inference.
constraints:
- The data parallel rank must be a non-negative integer less than --data-parallel-size.
- External data parallel mode (enabled by --data-parallel-rank) is only supported for MoE models; non-MoE models raise a ValueError
  and must launch independent vLLM instances instead.
- When --data-parallel-rank is set, --data-parallel-size-local must be 1 or omitted, otherwise a ValueError is raised.
- Fault tolerance (--enable-fault-tolerance) requires external LB mode, i.e. --data-parallel-external-lb or --data-parallel-rank
  must be set.
- The assigned DP rank range across nodes must cover [0, data_parallel_size) without overlap.
- When --nnodes > 1, --data-parallel-backend must be mp (ray is rejected).
- Mooncake KV-transfer worker requires a local DP rank (data_parallel_rank_local) to be set, otherwise it raises a ValueError.
tuning_advice:
  summary: Set --data-parallel-rank to a unique, contiguous rank per instance when running external-LB MoE DP/EP deployments
    on Ascend; leave it unset for single-instance or internal-LB runs.
  suggested_values:
  - scenario: Single-node, single-instance MoE DP with internal LB (v1-ascend)
    value: omit
    reason: Internal LB handles rank assignment automatically; setting --data-parallel-rank forces external LB mode and disables
      hybrid LB, which is unnecessary for a single instance.
  - scenario: Multi-node wide-EP MoE deployment with one instance per DP rank (v1-ascend, e.g. Kimi-K2.5 / DeepSeek)
    value: 0..data_parallel_size-1, unique per instance
    reason: External LB mode requires each instance to have a distinct rank in [0, dp-size); the launcher (launch_online_dp.py)
      assigns dp-rank-start + i per node.
  - scenario: PD-disaggregated Mooncake deployment (v1-ascend)
    value: unique rank per instance, matching the launcher's dp-rank-start + i
    reason: Mooncake derives side-channel and handshake ports from the DP rank; duplicate ranks cause port collisions and
      connection failures.
  - scenario: Fault-tolerant deployment
    value: set explicitly (or via --data-parallel-external-lb)
    reason: Fault tolerance requires external LB mode, which is enabled by providing --data-parallel-rank.
  caveats:
  - Ensure the external proxy routes requests evenly across all DP ranks; uneven routing negates the throughput benefit of
    DP.
  - Verify each instance's rank is unique and within [0, data_parallel_size) — duplicates break Mooncake port allocation and
    DP metadata sync.
  - For non-MoE models, do not use --data-parallel-rank; launch independent vLLM instances instead.
  - When using --nnodes > 1, keep --data-parallel-backend mp and let the rank be inferred from --node-rank if possible.
  quick_guide: Use --data-parallel-rank <i> (unique per instance, 0 <= i < dp-size) for external-LB MoE DP/EP on Ascend; omit
    it for single-instance or internal-LB runs.
analysis_date: '2026-10-27'
