related_parameters:
- name: --chat-template-content-format
  relation: Must be set to 'string' for this flag to have any effect; otherwise interleave_strings is forced false.
- name: --limit-mm-per-prompt
  relation: Interleaved parsing still respects per-prompt multimodal item limits.
- name: --enable-mm-embeds
  relation: Alternative multimodal input path; unrelated to string interleaving but part of the same MultiModalConfig group.
constraints:
- The flag only takes effect when --chat-template-content-format is set to 'string'; with any other content format it is silently
  ignored.
- Requires a multimodal model (multimodal_config must be non-None); on a text-only model the flag has no effect.
tuning_advice:
  summary: 'Enable only when you need fully interleaved multimodal prompts with a

    string-format chat template; it is a correctness/formatting switch, not a

    performance knob, and has no Ascend-specific tuning.

    '
  suggested_values:
  - scenario: Multimodal model served with --chat-template-content-format=string and prompts that interleave text and images/video/audio
    value: true
    reason: Enables interleaved string parsing so placeholders stay inline with surrounding text, matching the model's expected
      prompt layout.
  - scenario: Default deployments, JSON/OpenAI content-format chat templates, or text-only models
    value: false
    reason: No benefit; the flag is ignored unless content format is 'string' and a multimodal config exists.
  caveats:
  - This is a frontend prompt-parsing switch; it does not change NPU kernels, KV cache, or HCCL behavior, so do not expect
    throughput gains from toggling it.
  - Changing the prompt layout can change prompt token counts and thus prefill latency indirectly; measure end-to-end if prompt
    length shifts significantly.
  - No vllm-ascend override was found; behavior on Ascend matches upstream vLLM.
  quick_guide: Set true only with --chat-template-content-format=string on multimodal models; otherwise leave default false.
analysis_date: '2026-10-27'
