name: --interleave-mm-strings
type: cli
category: model
scope: vllm
source_file:
- vllm/config/multimodal.py:205
- vllm/engine/arg_utils.py:1421
- vllm/engine/arg_utils.py:591
- vllm/engine/arg_utils.py:1858
- vllm/config/model.py:411
- vllm/config/model.py:464
- vllm/entrypoints/chat_utils.py:2183
- vllm/entrypoints/chat_utils.py:2222
value_type: bool
default: false
valid_choices: true | false (BooleanOptionalAction-style flag)
cli_example: --interleave-mm-strings
deprecated: false
performance_impact: low
performance_scope:
- latency
impact_detail: 'This flag only changes how multimodal chat messages are parsed into the

  conversation prompt on the frontend (API server / entrypoints), not the

  model execution path on the NPU. In vllm/entrypoints/chat_utils.py:2180-2184

  and 2219-2223, `interleave_strings` is computed as

  `content_format == "string" and multimodal_config is not None and

  multimodal_config.interleave_mm_strings`. When true, `_parse_chat_message_content`

  emits placeholder strings interleaved with the surrounding text instead of

  splitting the message into separate text/image parts. This affects only the

  tokenized prompt layout produced by the chat template and the ordering of

  multimodal items in the request. It does not alter attention kernels, KV cache

  allocation, HCCL communication, or any Ascend-specific compute path. The only

  indirect runtime effect is that a different prompt layout can change the number

  of placeholder tokens and thus the prompt length, which marginally affects

  prefill cost — but this is a consequence of the prompt content, not of the flag

  itself. No vllm-ascend override of this parameter was found in the provided

  context; vllm-ascend does not patch MultiModalConfig.interleave_mm_strings.

  '
usage_locations:
- file: vllm/config/multimodal.py:205
  context: 'Field definition `interleave_mm_strings: bool = False` with docstring tying it to --chat-template-content-format=string.'
- file: vllm/engine/arg_utils.py:1421
  context: CLI argument registration under the MultiModalConfig argument group.
