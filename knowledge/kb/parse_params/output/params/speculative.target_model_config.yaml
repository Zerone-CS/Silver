related_parameters:
- name: speculative_config.draft_model_config
  relation: Companion field; target_model_config is the verifier model config while draft_model_config is the proposer model
    config
- name: speculative_config.model
  relation: The draft model string that triggers construction of SpeculativeConfig and population of target_model_config
- name: engram_config
  relation: Engram validation uses target_model_config when the draft model is being validated
- name: cache_config.block_size
  relation: Block-size refresh logic consults target/draft model configs to decide whether to reset shared cache block size
constraints:
- This field is derived automatically from the target model when speculative decoding is enabled and cannot be set directly
  via CLI.
- When the draft model is separate from the target, Engram validation runs against target_model_config, so the target model's
  architecture and engram_layer_ids determine whether DBO/microbatching is rejected.
- DeepSeek V4.1 Engram with a target model that has engram_layer_ids cannot be combined with DBO or microbatching; the validation
  raises ValueError.
tuning_advice:
  summary: No direct tuning is needed; ensure speculative decoding is configured correctly so target_model_config resolves
    to the intended verifier model.
  suggested_values:
  - scenario: Standard speculative decoding on Ascend with a separate draft model
    value: <auto-resolved from --model>
    reason: The field is populated from the target model config automatically; users should not override it.
  - scenario: DeepSeek V4.1 Engram target model with speculative decoding
    value: <auto-resolved; disable --enable-dbo and set --ubatch-size 0>
    reason: Engram validation against target_model_config rejects DBO/microbatching, so these must be disabled to avoid ValueError.
  caveats:
  - Do not attempt to set this field via CLI or config JSON; it is derived during SpeculativeConfig construction.
  - If you see Engram-related ValueError with speculative decoding, check whether the target model has engram_layer_ids and
    disable DBO/microbatching.
  - For MiniMax M3 on Ascend, verify block_size remains 128 when using a separate draft model; incorrect target/draft resolution
    could alter KV cache memory.
  quick_guide: Leave speculative.target_model_config at its auto-resolved value; it is a derived config field, not a performance
    knob.
analysis_date: '2026-10-27'
