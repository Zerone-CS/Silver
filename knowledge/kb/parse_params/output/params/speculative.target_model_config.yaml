impact_detail: 'speculative.target_model_config is not a user-facing tunable; it is a derived field on

  SpeculativeConfig that holds the ModelConfig of the target (verifier) model. It is populated

  during SpeculativeConfig construction from the main model_config and is read by downstream

  logic that needs the target model''s properties when the draft model differs.


  In upstream vLLM (vllm/config/vllm.py:1228-1232), _resolve_and_verify_engram_config checks

  whether model_config is the draft_model_config; if so it substitutes

  speculative_config.target_model_config so that Engram validation runs against the target

  model''s architecture and hf_text_config (e.g. engram_layer_ids). This is a correctness

  guard, not a performance knob: it can raise ValueError if DeepSeek V4.1 Engram is combined

  with DBO/microbatching, but it does not itself change throughput or memory.


  In vllm-ascend, the field is only referenced in unit tests

  (tests/ut/patch/platform/test_patch_engram_config.py:78 constructs a SimpleNamespace with

  target_model_config to exercise _validate_engram_config; tests/ut/test_minimax_m3_kv_block_size.py:116

  uses it to verify that a separate draft model does not reset the shared KV cache block size).

  The MiniMax M3 test shows the field participates in block-size refresh logic: "when the draft"

  model is separate from the target, refresh_block_size must not reset the shared cache block

  size (128 for MiniMaxM3SparseForCausalLM). This indirectly affects KV cache memory layout and

  thus memory footprint, but the value is derived, not set by the user.


  Net effect on Ascend NPU runtime: "low. The field is a configuration-resolution artifact that"

  feeds validation and block-size decisions; it does not directly control scheduling, HCCL

  communication, or kernel selection. Its indirect influence is through correct block-size and

  Engram validation, which if mis-resolved could cause errors or suboptimal KV cache sizing.

  '
usage_locations:
- file: vllm/config/vllm.py:1232
  context: Substitutes target_model_config for model_config when validating Engram settings for a draft model
- file: tests/ut/patch/platform/test_patch_engram_config.py:78
  context: Ascend unit test builds a SimpleNamespace with target_model_config to exercise _validate_engram_config
- file: tests/ut/test_minimax_m3_kv_block_size.py:116
