name: additional_config.eplb_config.dynamic_eplb
type: nested
category: parallelism
scope: vllm-ascend
source_file:
- vllm_ascend/ascend_config.py:288
- vllm_ascend/ascend_config.py:324
- vllm_ascend/ascend_config.py:698
- vllm_ascend/worker/model_runner_v1.py:577
- vllm_ascend/distributed/parallel_state.py:167
- vllm_ascend/eplb/core/eplb_utils.py:83
- vllm_ascend/patch/platform/patch_fused_moe.py:139
- vllm_ascend/ops/fused_moe/routed_experts.py:66
value_type: bool
default: false
valid_choices: true or false
cli_example: null
deprecated: false
performance_impact: high
performance_scope:
- throughput
- latency
- memory
impact_detail: 'dynamic_eplb enables legacy (Model Runner V1) dynamic Expert Parallelism Load

  Balancing on Ascend. When true, model_runner_v1.py:577-596 sets up a full EPLB

  runtime: "a multiprocessing Manager shared dict, an EplbProcess launched as a"

  separate process, a D2DExpertWeightLoader, and an EplbUpdator. This background

  process periodically collects per-expert heat (every expert_heat_collection_interval

  forward iterations) and computes a new expert placement, which is then applied by

  D2D (device-to-device) weight movement. The mechanism directly improves MoE

  throughput by rebalancing skewed expert load across EP ranks, reducing the

  straggler effect where hot experts bottleneck the all-to-all/GMM path.

  parallel_state.py:167 additionally creates a dedicated "dynamic_eplb" HCCL

  process group used for the rebalancing communication. patch_fused_moe.py:139-147

  forces enable_eplb=True and propagates num_redundant_experts into the upstream

  FusedMoE factory so redundant expert weight slots are allocated at load time,

  increasing per-rank weight memory proportional to num_redundant_experts.

  eplb_utils.py:83-114 uses dynamic_eplb to decide whether to build a redundant

  global placement (generate_global_placement) instead of a static linear expert

  map. The rebalancing itself adds CPU/communication overhead (algorithm_execution_interval

  bounds the worker''s CPU task window) and D2D weight copies that can transiently

  stall MoE layers, so it trades some steady-state overhead for better load balance.

  Note: "routed_experts.py:66 explicitly disables dynamic_eplb under Model Runner V2"

  (self.dynamic_eplb = False if use_v2_model_runner), and docs state MRv2 rejects

  legacy dynamic_eplb entirely — so this parameter only has effect on MRv1.

  '
