constraints:
- Unknown keys in additional_config are rejected (extra="forbid"), so the key must be spelled exactly enable_sparse_li_c4.
- The value must be a boolean; lax bool coercion accepts strings like "false" but non-boolean values are rejected by pydantic
  validation.
- This is a derived field whose effective value is computed during config derivation; setting it manually may be overridden
  by the derivation logic based on model quantization type.
tuning_advice:
  summary: Leave at default (false) unless the model and hardware explicitly support the C4 sparse li path; it is a derived
    switch, not a general tuning knob.
  suggested_values:
  - scenario: Default deployment with standard quantized models
    value: false
    reason: The field defaults to False and is derived automatically; forcing it on without a compatible model/quant config
      has no benefit and risks accuracy loss.
  - scenario: Memory-constrained deployment where the model supports 4-bit sparse li quantization
    value: true
    reason: C4 reduces per-layer weight/activation memory versus C8, which can allow larger batches or longer context on memory-limited
      NPUs.
  caveats:
  - Confirm the model's quantization type supports the C4 sparse li path before enabling; otherwise the switch may be silently
    overridden by derivation.
  - Benchmark accuracy after enabling C4, as lower bit-width can degrade output quality.
  - This switch is vllm-ascend-specific and has no upstream vLLM equivalent.
  quick_guide: Keep enable_sparse_li_c4=false unless you have a C4-compatible sparse li model and need the memory savings.
