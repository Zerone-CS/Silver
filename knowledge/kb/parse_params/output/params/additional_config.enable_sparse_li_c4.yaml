impact_detail: 'enable_sparse_li_c4 is a vllm-ascend-only switch declared in AscendConfig

  (vllm_ascend/ascend_config.py:644) as a derived field with a sentinel default

  of False. It is paired with private derived state _sparse_li_c4_layer_ids and

  _sparse_li_c4_layer_names (lines 654-655), which are populated during config

  derivation and consumed by the sparse "li" (linear-attention / lightning-indexer

  style) path to select which layers use a C4 (4-bit) sparse quantization variant.

  The sibling switches enable_sparse_li_c8 and enable_sparse_sfa_c8 follow the

  same pattern for 8-bit variants. Because the field is a derived field (the

  docstring notes derived fields are computed automatically and not user-settable

  in the same sense as pure switches), its effective value is determined by the

  model''s quantization type and layer configuration rather than being a primary

  tuning knob. When active, it changes the per-layer quantization width for the

  sparse li path, which affects NPU memory footprint (4-bit weights/activations

  reduce memory vs C8) and can affect throughput via different matmul kernels.

  No direct usage sites were found in the provided context, so the exact runtime

  dispatch path is not visible here; impact is therefore assessed as low.

  '
