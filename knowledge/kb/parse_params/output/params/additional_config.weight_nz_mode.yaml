related_parameters:
- name: rl_config.enabled
  relation: When enabled, forcibly overrides weight_nz_mode to 0 regardless of user setting.
- name: enforce_eager
  relation: CPU weight offload with NZ buffers requires enforce_eager=True or weight_nz_mode=0.
- name: enable_kv_nz
  relation: Separate switch for KV cache NZ layout (MLA models); independent of weight NZ.
- name: offload_backend
  relation: Prefetch offload backend is incompatible with NZ static buffers under ACL graph capture.
constraints:
- weight_nz_mode must be one of 0, 1, or 2; any other value raises a ValueError at config initialization.
- FP32 weights and meta tensors are never converted to NZ regardless of weight_nz_mode.
- On 310P hardware, supported weights are always converted to FRACTAL_NZ and weight_nz_mode is effectively ignored.
- When rl_config.enabled is true, weight_nz_mode is forced to 0 and any user-provided non-zero value is overridden with a
  warning.
- CPU weight offload (prefetch backend) with NZ static buffers cannot be combined with ACL graph capture; the engine aborts
  unless enforce_eager=True or weight_nz_mode=0.
tuning_advice:
  summary: Keep the default mode 1 for quantized inference; use mode 2 only for BF16/FP16 models that benefit from NZ kernels
    and have memory headroom; use mode 0 for RL, CPU offload with graph capture, or debugging.
  suggested_values:
  - scenario: Quantized (W8A8/INT8/FP8) inference on A2/A3, default deployment
    value: 1
    reason: Converts quantized weights to NZ so matmul/MoE ops avoid runtime ND->NZ casts, improving throughput without extra
      BF16/FP16 memory cost.
  - scenario: BF16/FP16 model with memory headroom and NZ-friendly kernels
    value: 2
    reason: Also converts BF16/FP16 weights to NZ, which can unlock faster cube kernels at the cost of extra padded device
      memory and load-time conversion.
  - scenario: RL training-inference consistency or CPU weight offload with ACL graph capture
    value: 0
    reason: RL mode forces 0 anyway, and prefetch offload with NZ buffers aborts under graph capture unless NZ is disabled
      or enforce_eager is set.
  - scenario: Debugging precision issues or comparing against ND reference
    value: 0
    reason: Disabling NZ keeps weights in ND layout, isolating layout-conversion effects from other precision issues.
  caveats:
  - Setting mode 2 on memory-constrained deployments may cause OOM due to NZ padding overhead.
  - On 310P hardware the setting is effectively ignored because NZ is always applied for supported weights.
  - The legacy VLLM_ASCEND_ENABLE_NZ env var no longer works; migrate to additional_config.weight_nz_mode.
  quick_guide: Use weight_nz_mode=1 (default) for quantized models, 2 for BF16/FP16 with memory headroom, 0 for RL/offload/debug.
analysis_date: '2026-10-27'
