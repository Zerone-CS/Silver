value_type: int
default: 1
valid_choices:
- 0
- 1
- 2
cli_example: null
deprecated: false
performance_impact: medium
performance_scope:
- latency
- throughput
- memory
impact_detail: 'weight_nz_mode controls whether model weights are converted to the Ascend FRACTAL_NZ

  (fractal) memory layout via torch_npu.npu_format_cast(..., ACL_FORMAT_FRACTAL_NZ) in

  vllm_ascend/utils.py (maybe_trans_nz / _should_trans_nz). The conversion policy is:

  mode 0 disables NZ entirely; mode 1 (default) converts only quantized/other supported

  dtypes; mode 2 additionally converts BF16/FP16 weights when supported. FP32 and meta

  tensors are never converted, and on 310P hardware NZ conversion is always applied for

  supported weights regardless of the mode (see the NZ conversion policy comment at

  vllm_ascend/utils.py:389-392).

  Mechanism: "NZ is the native cube-friendly layout for Da Vinci NPU matrix units. Running"

  quantized matmul/MoE weights in NZ avoids per-op ND->NZ format casts at execution time,

  reducing latency and improving throughput for quantized models. For BF16/FP16 weights,

  mode 2 can unlock faster kernels but costs extra device memory (NZ layout is padded) and

  conversion time at load. Mode 0 keeps weights in ND, which is required for some

  compatibility paths (e.g. CPU weight offload with ACL graph capture, RL training-inference

  consistency) but may be slower for quantized inference.

  Interaction with CPU weight offload: "prefetch.py raises a RuntimeError when NZ static"

  buffers would meet ACL graph capture, because the ND->NZ conversion is aclop-only on

  current CANN/torch_npu and aclop ops cannot run during NPU graph capture. In that case

  the user must either set enforce_eager=True or set weight_nz_mode=0.

  Interaction with RL: "rl_config.apply() forcibly overrides weight_nz_mode to 0 when"

  rl_config.enabled is true, logging a warning if the user set a non-zero value.

  '
usage_locations:
