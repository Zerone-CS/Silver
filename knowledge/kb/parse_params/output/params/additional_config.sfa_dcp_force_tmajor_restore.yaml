related_parameters:
- name: enable_dsa_cp
  relation: DCP/context-parallel attention path; the SFA DCP layout handling this flag toggles is only relevant when context
    parallelism is enabled.
- name: enable_sparse_sfa_c8
  relation: Sparse SFA attention enablement; the T-major restore applies to the SFA attention path.
- name: enable_sparse_sfa_turboquant
  relation: Another SFA sparse-attention derived switch; shares the same SFA kernel path.
constraints:
- The key must be a boolean; unknown keys in additional_config are rejected because AscendConfig uses extra='forbid'.
- The value is only meaningful when the SFA sparse-attention path is active with DCP/context parallelism enabled; otherwise
  it has no effect.
tuning_advice:
  summary: Keep this at the default false; only enable it to work around a specific SFA+DCP layout/precision issue, accepting
    a minor per-layer restore overhead.
  suggested_values:
  - scenario: Default deployment without SFA sparse attention or without DCP/context parallelism
    value: false
    reason: The flag has no effect outside the SFA+DCP path and adds no benefit; the default false avoids any extra layout-restore
      work.
  - scenario: SFA sparse attention with DCP enabled and observed layout/precision anomalies
    value: true
    reason: Forcing the T-major restore is intended to correct the tensor layout in this specific path; enable only when the
      anomaly is reproduced.
  caveats:
  - Enabling this adds a per-layer layout restore in the SFA/DCP attention path, which can slightly increase latency.
  - No usage site was found in the provided context; verify against your vllm-ascend version before relying on it.
  quick_guide: Leave false by default; set true only for SFA+DCP layout/precision workarounds.
