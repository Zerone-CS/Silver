impact_detail: 'This is a vllm-ascend-only switch declared as a typed pydantic field on the

  AscendConfig dataclass (vllm_ascend/ascend_config.py:582), passed through the

  --additional-config JSON blob. It is a boolean toggle whose name indicates it

  forces a "T-major restore" for the SFA (sparse flash attention) path when DCP

  (decode context parallelism) is active. No usage sites were found in the

  provided context beyond the field declaration and the documented default in

  the AscendConfig docstring example (line 433), so the exact runtime code path

  it gates is not visible here. By naming and placement it controls a layout

  conversion (restoring a T-major tensor layout) in the SFA/DCP attention

  kernel path, which would affect per-step kernel latency and thus throughput

  for sparse-attention models running with DCP enabled. Because it is a

  correctness/layout guard rather than a scheduling or memory knob, its

  performance effect is at most a small per-layer transpose/restore overhead

  and is not expected to change memory footprint or overall throughput

  materially. It has no effect on non-SFA or non-DCP configurations.

  '
