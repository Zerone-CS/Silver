related_parameters:
- name: enable_prefill_mc2
  relation: When enabled, MC2 token capacity is derived from max_num_batched_tokens and bounded by MC2 per-rank limits that
    depend on HCCL_BUFFSIZE-sized comm buffers.
- name: enable_fused_mc2
  relation: Fused MC2 (MegaMoe / dispatch-ffn-combine) uses per-rank token limits; MegaMoe uses a separate symm buffer rather
    than HCCL_BUFFSIZE.
- name: HCCL_OP_EXPANSION_MODE
  relation: Frequently set together (e.g. AIV) in vllm-ascend test envs to select the AIV communication path.
- name: PYTORCH_NPU_ALLOC_CONF
  relation: Co-set with expandable_segments:True to reduce fragmentation alongside the comm buffer allocation.
- name: gpu_memory_utilization
  relation: Larger HCCL_BUFFSIZE reserves more HBM, reducing KV cache available under a fixed gpu_memory_utilization.
constraints:
- HCCL_BUFFSIZE must be a positive integer (buffer size in MB); invalid or zero values cause HCCL initialization failure.
- For MC2 communication groups, pg_options must not be supplied because MC2 operators partition communication space solely
  from HCCL_BUFFSIZE; doing so causes memory misalignment.
- The value must be set before the process starts (it is read by the HCCL runtime at process-group creation), so it cannot
  be changed at runtime.
tuning_advice:
  summary: Size HCCL_BUFFSIZE to balance collective bandwidth against HBM reserved for KV cache, using role-specific values
    in PD deployments.
  suggested_values:
  - scenario: PD-disaggregated prefill node (large-scale EP, Mooncake)
    value: 256
    reason: Docs recommend HCCL_BUFFSIZE=256 on prefill to leave HBM for KV cache; prefill is compute-bound and needs less
      comm buffer.
  - scenario: PD-disaggregated decode node (large-scale EP)
    value: 1024
    reason: Docs recommend 1024 on decode where communication dominates; DeepSeek-V4.1-Flash tutorial uses 1800 for decode.
  - scenario: General single-node TP/EP serving (Kimi-K2-Thinking, KV-pool tests)
    value: 1024
    reason: Validated baseline in vllm-ascend docs and e2e tests; balances comm bandwidth and memory.
  - scenario: Context-parallel / DSA-CP accuracy and full-graph tests
    value: 768
    reason: Used in vllm-ascend four-card context-parallel tests to fit memory while supporting CP collectives.
  - scenario: DeepSeek-V4 MRv2 with MTP/DSpark, high comm volume
    value: 2048
    reason: Used in vllm-ascend MRv2 DeepSeek-V4 tests (2560 in another) to sustain large speculative/EP collectives.
  caveats:
  - Set HCCL_BUFFSIZE before launching the process; it is read at HCCL init and cannot be changed at runtime.
  - Do not pass pg_options to mc2 groups; MC2 relies solely on HCCL_BUFFSIZE for comm space partitioning.
  - Validate any non-default value with throughput, TTFT, TPOT, and HCCL stability checks; oversized values shrink KV cache.
  - MegaMoe uses a separate symmetric buffer, so HCCL_BUFFSIZE tuning has limited effect on that path.
  quick_guide: Start at 1024 for mixed serving; use 256 (prefill) / 1024-1800 (decode) in PD setups, and raise toward 2048-2560
    only if comm-bound and HBM allows.
