value_type: int
default: <computed>
valid_choices: positive integer (MB); commonly 256, 768, 1024, 1800, 2048, 2560 in vllm-ascend tests/docs
cli_example: null
deprecated: false
performance_impact: high
performance_scope:
- throughput
- latency
- memory
impact_detail: 'HCCL_BUFFSIZE is a CANN/HCCL environment variable (not a vLLM or vllm-ascend config field) that

  sets the size of the HCCL communication buffer used to share data between NPUs. It is read by the

  HCCL runtime at process-group creation time, so it directly governs how much data can be in flight

  per collective (AllReduce/AllGather/ReduceScatter/AlltoAll) and how much device memory is reserved

  for communication buffers.


  In vllm-ascend, the parameter is tightly coupled to MC2 (fused communication-compute) operators.

  vllm_ascend/utils.py:1186 documents that "Current mc2 operators only perform communication space

  partitioning based on HCCL_BUFFSIZE configuration" — meaning the MC2 fused kernels size their

  communication workspace from HCCL_BUFFSIZE, and passing pg_options to the mc2 group would cause

  memory misalignment. This is why get_hccl_config_for_pg_options() returns None for any group whose

  name contains "mc2" (vllm_ascend/utils.py:1188-1189), while other groups (dp, dynamic_eplb,

  sleep-lifecycle-anchor) get explicit hccl_buffer_size values.


  vllm_ascend/ascend_forward_context.py:252 further ties the MC2 token capacity to the HCCL comm

  buffer: "regular MC2 (gated by enable_prefill_mc2) uses the HCCL comm buffer sized by HCCL_BUFFSIZE,"

  whereas MegaMoe uses a separate symmetric buffer (torch alloc, not HCCL_BUFFSIZE). set_mc2_tokens_capacity()

  caps num_tokens_per_tp_rank by _MC2_TOKENS_PER_RANK_LIMIT / _DISPATCH_FFN_COMBINE_TOKENS_PER_RANK_LIMIT /

  _MEGA_MOE_TOKENS_PER_RANK_LIMIT, so an undersized HCCL_BUFFSIZE can force a smaller MC2 token

  capacity and reduce effective batch throughput, while an oversized value wastes HBM that would

  otherwise go to KV cache.


  Net effect on Ascend: "too small → communication bottleneck / MC2 capacity cap / potential HCCL"

  errors under large messages; too large → HBM consumed by comm buffers, shrinking KV cache and

  lowering max concurrency. It is a genuine throughput/latency/memory tradeoff knob.

  '
