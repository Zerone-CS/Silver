related_parameters:
- name: --mamba-ssm-cache-dtype
  relation: Overrides the SSM-state dtype only; conv state still follows --mamba-cache-dtype. When 'auto', SSM dtype is derived
    from --mamba-cache-dtype.
- name: --kv-cache-dtype
  relation: Analogous dtype control for attention KV cache; independent but both affect total cache memory.
- name: --mamba-cache-mode
  relation: Determines whether Mamba state is cached per block; interacts with how much state memory the dtype applies to.
- name: --enable-prefix-caching
  relation: Mamba state caching (and thus the memory footprint affected by this dtype) is only active with prefix caching
    / mamba cache mode.
constraints:
- The value must be a valid MambaDType; 'auto' infers the dtype from the model config.
- When --mamba-ssm-cache-dtype is 'auto', the SSM state dtype is determined by --mamba-cache-dtype.
- The conv state dtype is always controlled by --mamba-cache-dtype regardless of --mamba-ssm-cache-dtype.
tuning_advice:
  summary: Keep 'auto' for correctness; consider fp8 only for memory-constrained Mamba/hybrid deployments after validating
    accuracy and kernel support on Ascend.
  suggested_values:
  - scenario: Default / accuracy-sensitive Mamba or hybrid models on Ascend
    value: auto
    reason: Infers state dtype from model config (bf16/fp16), matching kernel expectations and avoiding casts; safest baseline.
  - scenario: Memory-constrained deployment of large Mamba/hybrid models where state cache dominates NPU memory
    value: fp8
    reason: Halves state cache footprint and reduces state read/write bandwidth; verify Ascend state-update kernels handle
      fp8 without extra casts and that accuracy is acceptable.
  - scenario: Debugging numerical issues in Mamba state updates
    value: float32
    reason: Full-precision state eliminates quantization error at the cost of doubled memory and bandwidth; useful for isolating
      accuracy regressions.
  caveats:
  - Only relevant for Mamba/hybrid linear-attention models (e.g. GLM5Next KDA); no effect on pure transformer models.
  - fp8 state may require dtype casts in AscendC state-update kernels, potentially offsetting memory savings with added latency.
  - Always validate accuracy when lowering state precision; state quantization error accumulates across decode steps.
  quick_guide: Leave --mamba-cache-dtype auto unless NPU memory is tight; then try fp8 and validate accuracy.
analysis_date: '2026-10-27'
