name: --mamba-cache-dtype
type: cli
category: kv_cache
scope: both
source_file:
- vllm/config/cache.py:170
- vllm/engine/arg_utils.py:1300
- vllm/engine/arg_utils.py:2111
- vllm/model_executor/layers/mamba/mamba_utils.py:58
- vllm_ascend/models/glm5next/kda.py:118
- vllm_ascend/models/glm5next/model.py:880
value_type: str
default: auto
valid_choices:
- auto
- float32
- float16
- bfloat16
- fp8
- fp8_e4m3
- fp8_e5m2
cli_example: --mamba-cache-dtype auto
deprecated: false
performance_impact: medium
performance_scope:
- memory
- latency
- throughput
impact_detail: 'This parameter controls the torch dtype of the Mamba/linear-attention state

  cache (conv state and SSM state). It is consumed by

  MambaStateDtypeCalculator (vllm/model_executor/layers/mamba/mamba_utils.py:58)

  via get_kv_cache_torch_dtype(mamba_cache_dtype, model_dtype): when set to

  "auto" the state dtype is inferred from the model dtype (typically bf16/fp16);

  an explicit dtype (e.g. fp8) shrinks the per-token state footprint and can

  reduce memory bandwidth for state reads/writes during decode.

  On Ascend, the same CacheConfig.mamba_cache_dtype field is read directly by

  vllm-ascend model code: Glm5NextLinearAttention.get_state_dtype

  (vllm_ascend/models/glm5next/kda.py:118) and

  Glm5NextForCausalLM.get_mamba_state_dtype_from_config

  (vllm_ascend/models/glm5next/model.py:880) both call

  MambaStateDtypeCalculator.kda_state_dtype(model_dtype, mamba_cache_dtype).

  So the dtype chosen here determines the actual NPU tensor dtype allocated for

  the KDA/linear-attention state cache, which affects NPU memory usage and the

  cost of state update kernels (AscendC causal-conv / SSM update). Lower

  precision state reduces memory and bandwidth but may require dtype casts in

  the state-update kernels, which can add latency if the kernel is not natively

  fp8-aware. There is no vllm-ascend override of the default value; the

  upstream "auto" default is preserved.

  '
usage_locations:
- file: vllm/config/cache.py:170
  context: CacheConfig field definition and docstring; default 'auto' infers dtype from model config.
- file: vllm/engine/arg_utils.py:1300
  context: CLI flag registration --mamba-cache-dtype in CacheConfig argument group.
- file: vllm/engine/arg_utils.py:2111
  context: Passed into CacheConfig construction from EngineArgs.
- file: vllm/model_executor/layers/mamba/mamba_utils.py:58
  context: MambaStateDtypeCalculator resolves mamba_cache_dtype to a torch dtype via get_kv_cache_torch_dtype.
- file: vllm_ascend/models/glm5next/kda.py:118
