related_parameters:
- name: VLLM_MEDIA_CACHE
  relation: Connector setup may probe the media cache; the connector implementation determines whether/how the cache is used.
- name: VLLM_MEDIA_CACHE_MAX_SIZE_MB
  relation: Cache sizing applies to connectors that use the media cache.
- name: VLLM_MEDIA_CACHE_TTL_HOURS
  relation: Cache TTL applies to connectors that use the media cache.
- name: VLLM_IMAGE_FETCH_TIMEOUT
  relation: Fetch timeout bounds the connector's network operations for images.
- name: VLLM_VIDEO_FETCH_TIMEOUT
  relation: Fetch timeout bounds the connector's network operations for video.
- name: VLLM_AUDIO_FETCH_TIMEOUT
  relation: Fetch timeout bounds the connector's network operations for audio.
- name: VLLM_MEDIA_FETCH_MAX_RETRIES
  relation: Retry policy applied by the connector on fetch failures.
constraints:
- The value must name a connector registered in MEDIA_CONNECTOR_REGISTRY; using a non-existing backend raises an AssertionError.
- Custom connectors must be registered via @MEDIA_CONNECTOR_REGISTRY.register("my_custom_media_connector") and imported at
  runtime before the value is used.
- The connector is only instantiated when a request actually contains media; text-only requests never load it.
tuning_advice:
  summary: Leave at the default 'http' unless you need a custom media transport; this is a frontend fetch knob with no NPU-side
    effect.
  suggested_values:
  - scenario: Standard multimodal serving over HTTP(S) URLs (default)
    value: http
    reason: Built-in connector supports fetching media via HTTP and is the only built-in implementation; no reason to change
      for typical deployments.
  - scenario: Media served from object storage or a custom transport with local caching
    value: my_custom_media_connector
    reason: Register a custom connector via MEDIA_CONNECTOR_REGISTRY.register and import it at runtime to reduce fetch latency
      or integrate with internal storage.
  caveats:
  - This parameter only affects the frontend media-fetch path; it does not change NPU compute, HCCL communication, or KV cache
    behavior on Ascend.
  - It is in compile_factors' ignored_factors set, so changing it will not invalidate torch.compile caches — safe to change
    without recompilation cost.
  - Connector setup may probe VLLM_MEDIA_CACHE; a slow or misconfigured connector can add per-request latency for multimodal
    inputs.
  - An unregistered connector name causes an AssertionError at first media request, not at startup.
  quick_guide: Keep 'http' unless you have a registered custom media connector; it only affects multimodal fetch latency,
    not NPU performance.
analysis_date: '2026-10-27'
