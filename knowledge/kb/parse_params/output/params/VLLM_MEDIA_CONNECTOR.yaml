performance_impact: low
performance_scope:
- latency
impact_detail: 'VLLM_MEDIA_CONNECTOR selects the MediaConnector implementation used by the

  OpenAI chat entrypoint to fetch remote media (images/video/audio) referenced

  by URL in multimodal requests. It is read lazily via a cached_property in

  MultiModalContentParser._connector (vllm/entrypoints/chat_utils.py:1047) and

  AsyncMultiModalContentParser._connector (chat_utils.py:1228), so text-only

  requests never instantiate the connector. The connector is loaded through

  MEDIA_CONNECTOR_REGISTRY.load(envs.VLLM_MEDIA_CONNECTOR, ...) and its

  implementation determines how media bytes are fetched (HTTP vs. custom

  transport such as object storage / local cache). This affects only the

  frontend media-fetch path, not the NPU model execution path: it does not

  touch HCCL, CANN, KV cache, scheduling, or graph compilation. On Ascend NPU

  the parameter has no Ascend-specific override in vllm-ascend; it is a pure

  upstream vLLM frontend knob. Its performance effect is limited to request

  latency for multimodal inputs (fetch time before tokenization/prefill), and

  it is explicitly listed in compile_factors'' ignored_factors set

  (vllm/envs.py:2324), so changing it does not invalidate torch.compile caches.

  '
