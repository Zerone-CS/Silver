name: --io-processor-plugin
type: cli
category: model
scope: vllm
source_file:
- vllm/engine/arg_utils.py:966
- vllm/engine/arg_utils.py:619
- vllm/engine/arg_utils.py:1888
- vllm/config/model.py:373
- vllm/plugins/io_processors/__init__.py:26
- vllm/plugins/io_processors/__init__.py:49
- vllm/entrypoints/pooling/factories.py:75
- vllm/entrypoints/pooling/pooling/io_processor.py:57
value_type: str
default: null
valid_choices: Any registered IOProcessor plugin name under the 'vllm.io_processor_plugins' entry-point group, or null to
  fall back to the model's hf_config 'io_processor_plugin' field
cli_example: --io-processor-plugin <plugin-name>
deprecated: false
performance_impact: low
performance_scope:
- latency
- throughput
impact_detail: 'This parameter selects an IOProcessor plugin that performs pre-/post-processing of

  model input and output for pooling models. It is consumed only on the API-server

  (process0) side: vllm/entrypoints/pooling/factories.py:75 calls has_io_processor()

  with model_config.io_processor_plugin, and if a plugin is present it registers

  PluginWithIOProcessorPlugins (vllm/entrypoints/pooling/pooling/io_processor.py:57),

  which calls get_io_processor() to load the plugin class from the

  ''vllm.io_processor_plugins'' entry-point group (vllm/plugins/io_processors/__init__.py:49).

  The plugin''s parse_data/pre_process/post_process hooks run per request in the

  front-end process, so they can add CPU-side latency to request handling and, if the

  plugin does heavy work, reduce end-to-end throughput. It does NOT touch the model

  forward pass, KV cache, HCCL communication, or NPU memory allocation, so it has no

  direct effect on Ascend NPU compute. There is no vllm-ascend override of this

  parameter in the provided context; it is a pure upstream vLLM front-end feature.

  The plugin is loaded only in process0 (IO_PROCESSOR_PLUGINS_GROUP comment in

  vllm/plugins/__init__.py:19-20), so it does not affect worker processes.

  '
