related_parameters:
- name: --runner
  relation: IOProcessor plugins are only meaningful for pooling/embedding runners, not generation
- name: --task
  relation: PluginWithIOProcessorPlugins is registered for the 'plugin' pooling task; the plugin must match the pooling task
- name: --renderer-num-workers
  relation: Both affect the async renderer/front-end path; renderer workers parallelize tokenization while the plugin adds
    per-request CPU work
constraints:
- The plugin name must correspond to an entry point registered under the 'vllm.io_processor_plugins' group, otherwise get_io_processor()
  logs a warning and the plugin is not loaded.
- If --io-processor-plugin is not set, vLLM falls back to the model's hf_config 'io_processor_plugin' field; if neither is
  set, no plugin is loaded.
- IOProcessor plugins are only used by pooling models; they have no effect on generation models.
tuning_advice:
  summary: Only set this when using a pooling model that requires a custom IOProcessor; otherwise leave it unset to avoid
    front-end overhead.
  suggested_values:
  - scenario: Standard generation or pooling workload without custom pre/post-processing
    value: unset
    reason: Leaving it unset avoids loading a plugin and any per-request CPU overhead in the front-end.
  - scenario: Pooling model that ships an IOProcessor plugin via hf_config
    value: unset
    reason: The plugin is auto-detected from hf_config 'io_processor_plugin', so no CLI flag is needed.
  - scenario: Custom pooling pipeline requiring explicit plugin selection
    value: <plugin-name>
    reason: Set the registered entry-point name to activate PluginWithIOProcessorPlugins for the pooling task.
  caveats:
  - Keep plugin pre/post-processing lightweight; it runs serially in the front-end and can limit throughput under high concurrency.
  - This setting has no impact on Ascend NPU compute, memory, or HCCL; do not expect NPU-side performance changes.
  quick_guide: Leave unset unless a pooling model needs a custom IOProcessor plugin; it only affects front-end CPU processing.
analysis_date: '2026-10-27'
