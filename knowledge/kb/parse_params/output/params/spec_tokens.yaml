related_parameters:
- name: --spec-method
  relation: Selects the speculative decoding method (mtp/eagle/ngram); --spec-tokens only takes effect when a spec method
    is configured
- name: --spec-model
  relation: Draft model whose config may supply a default num_speculative_tokens
- name: --speculative-config
  relation: Mutually exclusive on the num_speculative_tokens key; setting both raises ValueError
- name: --max-num-batched-tokens
  relation: Decode deployments often size this around max_num_seqs * (1 + num_spec_tokens)
- name: --max-num-seqs
  relation: Combined with spec tokens determines decode batch token budget and buffer sizes
- name: --async-scheduling
  relation: When enabled with spec tokens, allocates extra pinned CPU buffer in model_runner_v1
constraints:
- --spec-tokens and --speculative-config['num_speculative_tokens'] are mutually exclusive; setting both raises ValueError.
- If neither --spec-tokens nor the draft model config provides num_speculative_tokens, the value is required for speculative
  decoding to be configured.
- On 310P ngram path, the decode graph is captured with uniform_decode_query_len=1 regardless of num_spec_tokens, so the runner's
  default 1 + num_spec_tokens must be temporarily overridden to stay consistent with the dispatcher.
- For Bailing linear attention, speculative decoding requires query length <= 1 + num_spec_tokens.
tuning_advice:
  summary: Tune --spec-tokens to the draft model's acceptance rate; start at 1-3 for MTP/eagle on Ascend and increase only
    if acceptance stays high, while sizing max_num_batched_tokens around max_num_seqs*(1+num_spec_tokens).
  suggested_values:
  - scenario: MTP/eagle on 910B with high acceptance rate (>0.7)
    value: 3
    reason: Higher spec depth amortizes per-step overhead and lowers inter-token latency when most draft tokens are accepted.
  - scenario: Conservative default / low acceptance rate
    value: 1
    reason: Minimizes wasted compute and buffer growth; keeps decode graph query length small (1+1=2).
  - scenario: 310P ngram path
    value: 1
    reason: 310P ngram captures decode graph with uniform_decode_query_len=1; larger spec tokens add overhead without graph
      benefit.
  - scenario: Decode-heavy deployment with async scheduling
    value: 2
    reason: Balances acceptance gains against the extra pinned buffer and D2H sync cost introduced when async scheduling +
      spec tokens are both enabled.
  caveats:
  - Always benchmark acceptance rate before raising --spec-tokens; beyond the acceptance knee, throughput degrades due to
    wasted verification compute.
  - Remember to scale --max-num-batched-tokens with max_num_seqs*(1+num_spec_tokens) for decode nodes, otherwise spec tokens
    get truncated by the scheduler budget.
  - Changing --spec-tokens invalidates ACL graph capture shapes; expect longer warmup and higher memory for larger values.
  - Do not set both --spec-tokens and --speculative-config['num_speculative_tokens'].
  quick_guide: Set --spec-tokens to 1-3 based on measured acceptance rate; keep max_num_batched_tokens >= max_num_seqs*(1+num_spec_tokens).
analysis_date: '2026-10-27'
