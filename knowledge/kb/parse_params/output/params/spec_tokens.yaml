name: --spec-tokens
type: cli
category: speculation
scope: both
source_file:
- vllm/engine/arg_utils.py:1704
- vllm/engine/arg_utils.py:668
- vllm/engine/arg_utils.py:1936
- vllm/config/speculative.py:1965
- vllm_ascend/patch/platform/patch_balance_schedule.py:352
- vllm_ascend/patch/platform/patch_balance_schedule.py:794
- vllm_ascend/worker/model_runner_v1.py:494
- vllm_ascend/worker/model_runner_v1.py:1032
- vllm_ascend/worker/dcp_utils.py:367
- vllm_ascend/attention/indexer.py:612
- vllm_ascend/_310p/model_runner_310p.py:136
value_type: int
default: null
valid_choices: positive integer; typically 1-5 for MTP/eagle; must be >= 1 when set
cli_example: --spec-tokens 3
deprecated: false
performance_impact: high
performance_scope:
- latency
- throughput
- memory
impact_detail: "--spec-tokens sets SpeculativeConfig.num_speculative_tokens, which is the number of\ndraft tokens proposed\
  \ per decode step. It is a first-order knob for speculative\ndecoding (MTP/eagle/ngram) on Ascend and directly changes the\
  \ decode query length.\n\nUpstream wiring: \"arg_utils.py:1704 registers the flag; create_speculative_config\"\n(arg_utils.py:1936)\
  \ merges it into speculative_config[\"num_speculative_tokens\"] and\nraises if it collides with --speculative-config['num_speculative_tokens'].\n\
  \nAscend runtime effects:\n- \"Scheduler (vllm_ascend/patch/platform/patch_balance_schedule.py:352): when a request\"\n\
  \  has spec_token_ids, the number of scheduled spec tokens is bounded by\n  num_new_tokens + num_computed_tokens - num_tokens\
  \ - num_output_placeholders, so a\n  larger --spec-tokens increases per-step token budget consumption and can reduce the\n\
  \  number of concurrently scheduled requests (throughput tradeoff).\n- \"patch_balance_schedule.py:794: num_spec_tokens_to_schedule\
  \ = self.num_spec_tokens\"\n  (or dynamic_sd_lookup when dynamic speculative decoding is enabled) is passed into\n  SchedulerOutput,\
  \ so it directly sizes the decode batch.\n- \"model_runner_v1.py:494: when use_async_scheduling and num_spec_tokens are\
  \ set, an\"\n  extra pinned CPU buffer valid_sampled_token_count_cpu of size max_num_reqs is\n  allocated (memory + D2H\
  \ sync cost).\n- \"model_runner_v1.py:1032: num_spec_tokens is passed to mamba postprocess for\"\n  mamba_cache_mode ==\
  \ \"all\", affecting state bookkeeping per step.\n- \"dcp_utils.py:367/469: num_spec_tokens drives DCP async spec-decode\
  \ rebuild and\"\n  generate_dcp_mtp_input, i.e. the amount of MTP input reconstruction work per step.\n- \"attention/indexer.py:612:\
  \ for DSA context-parallel, dsa_cp_seq_capacity is sized as\"\n  max_num_reqs * (spec_tokens + 1) + 1, so larger --spec-tokens\
  \ increases indexer\n  metadata memory.\n- \"_310p/model_runner_310p.py:136/224: on 310P the default uniform_decode_query_len\
  \ is\"\n  1 + num_spec_tokens; the ngram path overrides it to 1 for graph capture, and\n  _pad_query_start_loc_for_fia must\
  \ stay consistent with the dispatcher.\n\nNet effect: \"higher --spec-tokens raises potential tokens accepted per step (lower\"\
  \ninter-token latency when acceptance rate is high) but increases per-step compute,\nKV/state buffer sizes, and reduces\
  \ effective batch capacity. On Ascend the benefit\nis bounded by draft-model acceptance rate and by the fixed decode query\
  \ length used\nfor ACL graph capture (1 + num_spec_tokens).\n"
