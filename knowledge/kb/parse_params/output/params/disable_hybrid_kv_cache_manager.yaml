related_parameters:
- name: --kv-transfer-config
  relation: If a KV connector does not support HMA, HMA is auto-disabled or an error is raised; Ascend connectors branch on
    this flag for hybrid transfer paths.
- name: --enable-prefix-caching
  relation: Ascend platform.py:415-421 adjusts mamba_block_size only when prefix caching is off and hybrid KV transfer is
    active.
- name: --speculative-config
  relation: Upstream auto-disables HMA when chunked local attention is combined with eagle speculation.
- name: --max-model-len
  relation: Disabling HMA inflates per-layer KV cache size, reducing the max_model_len that fits in HBM.
- name: --block-size
  relation: Hybrid mode allows per-group block sizes; disabling HMA forces a single uniform block size.
- name: VLLM_ALLOW_CHUNKED_LOCAL_ATTN_WITH_HYBRID_KV_CACHE
  relation: Env var that, when set, prevents auto-disabling HMA for chunked local attention.
constraints:
- If HMA is enabled (flag False/None) and the configured KV connector does not support HMA, vLLM raises a ValueError instructing
  you to set --disable-hybrid-kv-cache-manager.
- On Ascend, AscendMultiConnector asserts that either --disable-hybrid-kv-cache-manager is set or all sub-connectors support
  HMA.
- GLM-Next models require the hybrid KV cache manager; setting --disable-hybrid-kv-cache-manager raises a ValueError for these
  models.
- When the flag is None, vLLM auto-disables HMA on platforms that do not support hybrid KV cache, so an explicit False may
  be overridden.
- When chunked local attention is used with eagle speculative decoding, HMA is auto-disabled regardless of an explicit False
  unless VLLM_ALLOW_CHUNKED_LOCAL_ATTN_WITH_HYBRID_KV_CACHE is set.
tuning_advice:
  summary: Leave at default (None) to let vLLM auto-select HMA; keep HMA enabled for hybrid models to save NPU HBM, and only
    disable it when a connector or model requires uniform KV cache.
  suggested_values:
  - scenario: Hybrid attention model (full + sliding window, or attention + Mamba/GDN) on Ascend with default connectors
    value: False (or leave default None)
    reason: HMA groups layers by spec so sliding-window layers reserve only window-sized KV cache, freeing HBM for more concurrent
      sequences and higher throughput.
  - scenario: KV connector that does not support HMA
    value: 'True'
    reason: vLLM raises ValueError if HMA is enabled with a non-HMA connector; disabling HMA is the documented fix.
  - scenario: GLM-Next model on Ascend
    value: False (or leave default None)
    reason: GLM-Next's paired MLA/indexer layout requires the hybrid KV cache manager; disabling it raises a ValueError.
  - scenario: Pure full-attention model (no hybrid layers)
    value: None
    reason: HMA has no effect when all layers share the same spec; leave default to avoid unnecessary configuration.
  caveats:
  - Disabling HMA on hybrid models inflates KV cache memory and can significantly reduce max_model_len or batch capacity on
    NPU HBM.
  - Enabling HMA with Ascend Mooncake/AscendStore connectors activates hybrid transfer paths with per-group block sizes; verify
    connector compatibility.
  - Explicit False may still be auto-overridden for chunked local attention + eagle unless VLLM_ALLOW_CHUNKED_LOCAL_ATTN_WITH_HYBRID_KV_CACHE
    is set.
  quick_guide: Keep HMA enabled (default) for hybrid models to save NPU memory; set --disable-hybrid-kv-cache-manager only
    when a connector or model requires uniform KV cache.
analysis_date: '2026-10-27'
