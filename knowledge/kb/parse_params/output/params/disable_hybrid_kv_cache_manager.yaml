- vllm_ascend/distributed/kv_transfer/kv_pool/ascend_store/metadata.py:286
- vllm_ascend/models/glm5next/cache_config.py:352
value_type: bool
default: None
valid_choices: True, False, None (None = auto-determined based on platform support, model attention type, speculative config,
  and KV connector HMA support)
cli_example: --disable-hybrid-kv-cache-manager
deprecated: false
performance_impact: high
performance_scope:
- memory
- throughput
- latency
impact_detail: "This flag controls whether the Hybrid KV Cache Manager (HMA) is used for models\nwith heterogeneous attention\
  \ layers (e.g. full attention + sliding window attention,\nor attention + Mamba/GDN layers).\n\nUpstream vLLM behavior (vllm/v1/core/kv_cache_utils.py:2266):\
  \ when\ndisable_hybrid_kv_cache_manager is True, get_kv_cache_groups() calls\nunify_hybrid_kv_cache_specs(kv_cache_spec),\
  \ forcing every attention layer to use\nthe same (largest) KV cache spec. This means sliding-window layers are allocated\n\
  as if they were full-attention layers, wasting NPU HBM. When False (HMA enabled),\nlayers are grouped by their actual spec\
  \ (SlidingWindowSpec, FullAttentionSpec,\nMambaSpec) and each group gets its own block table, so sliding-window layers only\n\
  reserve window-sized KV cache — a large memory saving that translates into more\nconcurrent sequences (higher throughput)\
  \ or longer max_model_len.\n\nAuto-resolution (vllm/config/vllm.py:1984-2020): if the flag is None, vLLM\nauto-disables\
  \ HMA when the platform does not support hybrid KV cache, when\nchunked local attention is combined with eagle speculation,\
  \ or when the configured\nKV connector does not support HMA. On Ascend, vllm-ascend reads this flag in\nmultiple places\
  \ to decide whether hybrid paths are active:\n- \"vllm_ascend/platform.py:411 and patch_mamba_config.py:69 gate hybrid block-size\"\
  \n  alignment and mamba cache-mode handling on `not disable_hybrid_kv_cache_manager`.\n- \"vllm_ascend/distributed/kv_transfer/...\
  \ (mooncake_connector.py:2175,\"\n  mooncake_hybrid_connector.py:1358/1689, ascend_store/metadata.py:286) compute\n  `use_hybrid`\
  \ / `_is_hma_required` from this flag; when HMA is enabled the\n  connectors take the per-group (hybrid) transfer path with\
  \ per-group block sizes\n  and sliding-window block accounting, which is more complex and can add transfer\n  overhead but\
  \ is required for correct multi-group KV transfer.\n- \"vllm_ascend/distributed/kv_transfer/ascend_multi_connector.py:38\
  \ asserts that\"\n  either HMA is disabled or all sub-connectors support HMA.\n- \"vllm_ascend/models/glm5next/cache_config.py:352\
  \ raises if HMA is disabled for\"\n  GLM-Next models, whose paired MLA/indexer layout requires the hybrid manager.\n\nNet\
  \ effect on Ascend: \"enabling HMA (leaving the flag False/None) reduces KV cache\"\nmemory for hybrid models and increases\
  \ batch capacity, at the cost of more complex\nper-group scheduling and KV-transfer bookkeeping. Disabling it simplifies\
  \ the\nmemory layout (uniform allocation) but wastes HBM on sliding-window layers and\ncan break models/connectors that\
  \ require HMA.\n"
