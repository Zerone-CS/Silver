name: --disable-hybrid-kv-cache-manager
type: cli
category: kv_cache
scope: both
source_file:
- vllm/config/scheduler.py:164
- vllm/engine/arg_utils.py:1640
- vllm/config/vllm.py:1984
- vllm/v1/core/kv_cache_utils.py:2266
- vllm/distributed/kv_transfer/kv_connector/factory.py:55
- vllm_ascend/patch/platform/patch_mamba_config.py:69
- vllm_ascend/platform.py:411
- vllm_ascend/distributed/kv_transfer/ascend_multi_connector.py:38
- vllm_ascend/distributed/kv_transfer/kv_p2p/mooncake_connector.py:2175
