name: VLLM_DEEPEP_HIGH_THROUGHPUT_FORCE_INTRA_NODE
type: env
category: communication
scope: vllm
source_file:
- vllm/envs.py:1941
- vllm/envs.py:281
- vllm/distributed/device_communicators/all2all.py:226
value_type: bool
default: false
valid_choices: 0 or 1 (parsed via int() then bool())
cli_example: null
deprecated: false
performance_impact: low
performance_scope:
- throughput
- memory
impact_detail: 'This env var only affects the DeepEP High-Throughput (HT) all2all manager

  (DeepEPHTAll2AllManager in vllm/distributed/device_communicators/all2all.py).

  In _make_all2all_kwargs, when the group is internode AND this flag is NOT set,

  num_rdma_bytes is set to VLLM_DEEPEP_BUFFER_SIZE_MB * 1024 * 1024 and

  num_qps_per_rank = num_sms // 2. When the flag IS set (or the group is intranode),

  num_rdma_bytes = 0 and num_qps_per_rank = 1. So enabling it forces the intranode

  kernel path for inter-node communication, eliminating RDMA buffer allocation

  (memory saving) and reducing QP count, which can raise prefill throughput on

  systems with multi-node NVLink (e.g. GB200). On Ascend NPU, DeepEP is a CUDA/NVLink

  oriented library; vllm-ascend does not use DeepEP for its all2all path (it uses

  HCCL-based communication), and no reference to this env var exists in vllm-ascend.

  Therefore on Ascend this parameter has effectively no runtime effect unless a

  DeepEP-based all2all backend is somehow selected, which is not the Ascend path.

  '
usage_locations:
