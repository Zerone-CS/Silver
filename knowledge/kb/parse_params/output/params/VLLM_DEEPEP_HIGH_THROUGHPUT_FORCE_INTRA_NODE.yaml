related_parameters:
- name: VLLM_DEEPEP_BUFFER_SIZE_MB
  relation: Sets num_nvl_bytes and (when this flag is off and internode) num_rdma_bytes; enabling this flag zeroes the RDMA
    buffer derived from it.
- name: VLLM_DEEPEP_LOW_LATENCY_USE_MNNVL
  relation: Sibling DeepEP tuning flag for the low-latency kernel; this flag applies to the high-throughput kernel.
- name: VLLM_ALL2ALL_BACKEND
  relation: DeepEP HT manager is only instantiated when the all2all backend selects deepep; on Ascend the HCCL backend is
    used instead.
constraints:
- The value must be parseable as an integer (0 or 1); other values raise a ValueError during env parsing.
- This flag only has an effect when the DeepEP high-throughput all2all backend is active; it is ignored for other all2all
  backends.
tuning_advice:
  summary: Leave at default (0) on Ascend NPU; this is a CUDA/NVLink DeepEP tuning knob with no effect on the HCCL-based Ascend
    communication path.
  suggested_values:
  - scenario: Ascend NPU deployment (v1 or v2 worker)
    value: 0
    reason: vllm-ascend uses HCCL for all2all and does not consume this env var; DeepEP HT manager is not on the Ascend path,
      so changing it has no benefit.
  - scenario: GPU (CUDA) system with multi-node NVLink such as GB200, using DeepEP high-throughput backend
    value: 1
    reason: Forces the intranode kernel for inter-node communication, raising prefill throughput and eliminating RDMA buffer
      allocation per the upstream comment.
  caveats:
  - Do not expect any throughput or memory change on Ascend NPU from this flag.
  - On GPU systems without multi-node NVLink, enabling it may hurt inter-node communication performance.
  quick_guide: Keep 0 on Ascend; only set 1 on multi-node-NVLink GPU systems using DeepEP HT.
analysis_date: '2026-10-27'
