value_type: dict
default: {}
valid_choices: 'A JSON object whose allowed keys depend on --load-format: default/auto -> {enable_multithread_load, num_threads,
  enable_weights_track}; runai_streamer -> {distributed, concurrency, memory_limit}; sharded_state -> {pattern}; tensorizer
  -> TensorizerConfig fields; netloader -> netloader config fields (e.g. CONFIG_FILE, SOURCE, LISTEN_PORT); rfork -> RForkConfig
  fields (MODEL_URL, MODEL_DEPLOY_STRATEGY_NAME, rfork_scheduler_url, SEED_TIMEOUT_SEC, REQUEST_TIMEOUT_SEC, SEED_BIND_HOST,
  SEED_ADVERTISE_HOST)'
cli_example: '--model-loader-extra-config ''{"enable_multithread_load": true, "num_threads": 128}'''
deprecated: false
performance_impact: medium
performance_scope:
- latency
- memory
impact_detail: "This parameter is a pass-through dict consumed by whichever model loader is selected via\n--load-format. It\
  \ does not affect steady-state inference throughput, but it directly\ncontrols the model-loading phase (startup latency)\
  \ and, for some loaders, peak host/NPU\nmemory during load.\n\nUpstream vLLM (vllm/model_executor/model_loader/default_loader.py:78-98):\
  \ the DefaultModelLoader\nreads model_loader_extra_config and accepts only enable_multithread_load, num_threads, and\nenable_weights_track.\
  \ When enable_multithread_load is true, weights are iterated with a\nmulti-threaded loader using num_threads worker threads,\
  \ which parallelizes checkpoint reads\nand speeds up model initialization (especially on network filesystems). This is the\
  \ primary\nperformance-relevant use on Ascend and is explicitly recommended in the vllm-ascend docs\n(MiniMax-M2.md:587,\
  \ DeepSeek-V4-Pro.md:569) as a way to reduce model loading time.\n\nOther loaders interpret the dict differently: \"runai_streamer_loader.py:31-60\
  \ maps\"\nconcurrency/memory_limit to RUNAI_STREAMER_* env vars (streaming read concurrency and memory\ncap); sharded_state_loader.py:45\
  \ reads a pattern for per-rank shard files (fast TP load path);\ntensorizer.py:420 uses it to build a TensorizerConfig for\
  \ deserialization.\n\nvllm-ascend overrides/additions:\n- \"NetLoader (vllm_ascend/model_loader/netloader/netloader.py:130):\
  \ reads the dict as a JSON\"\n  object, optionally loads a CONFIG_FILE, and configures elastic/network model loading\n \
  \ (SOURCE, LISTEN_PORT, int8 cache, output prefix). This is an Ascend-specific distributed\n  weight-loading path that can\
  \ dramatically reduce per-node load time by streaming weights\n  from a source node instead of each rank reading the full\
  \ checkpoint.\n- \"NetLoader disk fallback (netloader.py:756): when falling back to DefaultModelLoader, it\"\n  strips netloader-only\
  \ keys via disk_fallback_loader_extra_config() but preserves\n  multithread-load settings so seed/fallback disk loads stay\
  \ parallel.\n- \"RFork (vllm_ascend/model_loader/rfork/rfork_loader.py:475): RForkConfig.from_extra_config()\"\n  parses\
  \ MODEL_URL, MODEL_DEPLOY_STRATEGY_NAME, rfork_scheduler_url, timeouts, and bind/advertise\n  hosts. RFork is an Ascend\
  \ weight-forking mechanism that lets a new worker pull weights from an\n  already-loaded seed worker over the network, avoiding\
  \ a full checkpoint reload. The fallback\n  path (rfork_loader.py:198) resets model_loader_extra_config to {} before delegating\
  \ to\n  DefaultModelLoader.\n\nNet effect: \"medium impact — it does not change per-token latency or decode throughput,\
  \ but it\"\ncan substantially cut cold-start / scale-out model-loading time and affects host memory usage\nduring load.\
  \ Misconfiguration (wrong keys for the chosen loader) raises ValueError at loader\nconstruction, failing startup.\n"
