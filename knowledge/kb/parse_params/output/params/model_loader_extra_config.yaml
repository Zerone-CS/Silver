related_parameters:
- name: --load-format
  relation: Selects which loader interprets the extra config; allowed keys are loader-specific.
- name: --safetensors-load-strategy
  relation: Mutually exclusive with enable_multithread_load=true; default loader rejects prefetch/eager/torchao when multithread
    load is enabled.
- name: --tensorizer-uri
  relation: Tensorizer-specific options are folded into model_loader_extra_config when load_format=tensorizer.
- name: RFORK_SCHEDULER_URL
  relation: Env var fallback for rfork_scheduler_url when not set in extra config.
- name: MODEL_URL
  relation: Env var fallback for RFork model_url when not set in extra config.
- name: MODEL_DEPLOY_STRATEGY_NAME
  relation: Env var fallback for RFork model_deploy_strategy_name when not set in extra config.
constraints:
- The value must be a JSON object (dict); non-dict values raise ValueError in DefaultModelLoader and RuntimeError in NetLoader.
- For load_format=default/auto, only enable_multithread_load, num_threads, and enable_weights_track are accepted; any other
  key raises ValueError.
- For load_format=runai_streamer, only distributed, concurrency, and memory_limit are accepted; concurrency must be a positive
  integer and distributed must be a bool.
- For load_format=sharded_state, only the 'pattern' key is accepted; any other key raises ValueError.
- For load_format=dummy, any non-empty extra config raises ValueError.
- enable_multithread_load must be a JSON boolean and num_threads must be a positive integer.
- When enable_multithread_load is true, --safetensors-load-strategy must not be prefetch, eager, or torchao (the default loader
  rejects this combination).
- For load_format=rfork, model_url and model_deploy_strategy_name must be non-empty and rfork_scheduler_url must be set (via
  extra config or RFORK_SCHEDULER_URL), otherwise RFork raises RuntimeError/ValueError.
tuning_advice:
  summary: Use --model-loader-extra-config to accelerate the model-loading phase on Ascend, primarily via enable_multithread_load/num_threads
    for default loading, or via NetLoader/RFork for distributed weight loading.
  suggested_values:
  - scenario: Standard safetensors checkpoint on local or network storage, default/auto load format
    value: '{"enable_multithread_load": true, "num_threads": 128}'
    reason: Enables the multi-threaded weight iterator to parallelize checkpoint reads, reducing model loading time (recommended
      in vllm-ascend docs for DeepSeek-V4-Pro and MiniMax-M2).
  - scenario: CPU-constrained host where 128 threads oversubscribe
    value: '{"enable_multithread_load": true, "num_threads": 32}'
    reason: Lower thread count avoids CPU oversubscription and host memory spikes while still parallelizing reads.
  - scenario: Large multi-node deployment using Ascend NetLoader
    value: '{"CONFIG_FILE": "/path/to/netloader_config.json"}'
    reason: NetLoader streams weights from a source node instead of each rank reading the full checkpoint, cutting per-node
      load time; config can be supplied via a JSON file.
  - scenario: Scale-out where a seed worker already holds weights (Ascend RFork)
    value: '{"MODEL_URL": "<url>", "MODEL_DEPLOY_STRATEGY_NAME": "<name>", "rfork_scheduler_url": "<url>"}'
    reason: RFork pulls weights from an already-loaded seed worker over the network, avoiding a full checkpoint reload on
      new workers.
  caveats:
  - Keys are loader-specific and strictly validated; verify the key set matches --load-format before deploying.
  - Do not combine enable_multithread_load=true with --safetensors-load-strategy prefetch/eager/torchao.
  - NetLoader/RFork keys are Ascend-only and will be rejected by upstream loaders.
  - This parameter does not affect steady-state inference throughput; measure startup/scale-out time to validate benefit.
  quick_guide: 'For faster startup on Ascend, set --model-loader-extra-config ''{"enable_multithread_load": true, "num_threads":
    128}'' with default load format; use NetLoader/RFork configs for distributed weight loading.'
