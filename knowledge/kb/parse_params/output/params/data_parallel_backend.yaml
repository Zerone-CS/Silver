  context: 'Validation: nnodes > 1 requires data_parallel_backend == ''mp'''
- file: vllm/v1/engine/utils.py:1155
  context: Selects Ray CoreEngineActorManager launch path when backend == 'ray'
- file: vllm/v1/engine/core_client.py:1710
