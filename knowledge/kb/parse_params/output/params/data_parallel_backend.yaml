related_parameters:
- name: --data-parallel-size
  relation: Backend only matters when DP size > 1; DP replicas are launched per this backend
- name: --data-parallel-size-local
  relation: Local DP replica count; combined with backend to determine device binding
- name: --nnodes
  relation: nnodes > 1 forces backend to 'mp' (ray rejected)
- name: --distributed-executor-backend
  relation: Interacts with backend in Ascend device-binding conditionals (ray/external_launcher bypass the DP shift)
- name: --enable-elastic-ep
  relation: Elastic EP scaling requires data_parallel_backend == 'ray'
- name: --device-ids
  relation: When device-ids pre-shards NPUs, the Ascend DP local_rank shift is skipped regardless of backend
constraints:
- The value must be either 'mp' or 'ray'.
- When --nnodes is greater than 1, --data-parallel-backend must be 'mp'; using 'ray' raises a ValueError.
- Elastic EP scaling (prepare_elastic_ep) requires --data-parallel-backend ray; otherwise an assertion fails.
- On Ascend, the DP local_rank device-binding shift is only applied when the backend is not 'ray' and nnodes_within_dp ==
  1; with 'ray' the shift is skipped.
tuning_advice:
  summary: 'Use ''mp'' (default) for single-node Ascend DP deployments to get correct

    NPU device binding and lowest launch overhead; use ''ray'' only when you need

    multi-actor orchestration or elastic EP scaling, and never with --nnodes > 1.

    '
  suggested_values:
  - scenario: Single-node multi-NPU data-parallel deployment (v1-ascend and v2-ascend)
    value: mp
    reason: Default backend; triggers the Ascend DP local_rank shift so each DP replica binds to a distinct NPU set, and avoids
      Ray actor overhead.
  - scenario: Elastic EP scaling / dynamic DP resizing
    value: ray
    reason: Elastic EP scaling asserts data_parallel_backend == 'ray'; only the ray backend supports dynamic DP resizing.
  - scenario: Multi-node deployment (--nnodes > 1)
    value: mp
    reason: nnodes > 1 requires the mp backend; ray raises a ValueError.
  - scenario: Pre-sharded NPUs via --device-ids
    value: mp
    reason: With device-ids the DP shift is skipped anyway; mp keeps launch simple and avoids Ray overhead.
  caveats:
  - Do not combine --data-parallel-backend ray with --nnodes > 1; it raises a ValueError.
  - On Ascend, verify DP replicas land on distinct NPUs when using ray, since the automatic local_rank shift is skipped.
  - Ray backend increases startup latency and inter-process RPC overhead; prefer mp for single-node throughput-focused serving.
  quick_guide: Keep the default 'mp' for single-node Ascend DP; switch to 'ray' only for elastic EP scaling.
analysis_date: '2026-10-27'
