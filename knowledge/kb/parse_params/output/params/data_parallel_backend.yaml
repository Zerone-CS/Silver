name: --data-parallel-backend
type: cli
category: parallelism
scope: both
source_file:
- vllm/engine/arg_utils.py:1164
- vllm/config/parallel.py:149
- vllm/engine/arg_utils.py:2173
- vllm/v1/engine/utils.py:1155
- vllm/v1/engine/core_client.py:1710
- vllm_ascend/worker/worker.py:392
- vllm_ascend/worker/worker.py:472
- vllm_ascend/_310p/worker_310p.py:193
value_type: str
default: mp
valid_choices:
- mp
- ray
cli_example: --data-parallel-backend ray
deprecated: false
performance_impact: medium
performance_scope:
- throughput
- latency
impact_detail: 'This parameter selects how data-parallel (DP) replicas are launched and

  coordinated. It does not change per-token compute, but it changes the process

  topology, device binding, and the DP coordination path, all of which affect

  throughput and startup latency on Ascend NPU.


  Upstream vLLM (vllm/engine/arg_utils.py:1164) defines the flag with default

  "mp" and choices "mp"/"ray". In vllm/v1/engine/utils.py:1155, when

  data_parallel_backend == "ray", the engine launches a CoreEngineActorManager

  (Ray actors) instead of local CoreEngine processes; this adds Ray actor

  scheduling overhead and inter-actor RPC but enables multi-node / elastic

  scaling. In vllm/v1/engine/core_client.py:1710, elastic EP scaling asserts

  data_parallel_backend == "ray" — so only the ray backend supports dynamic

  DP resizing.


  On Ascend, vllm-ascend reads this value in the worker device-binding logic.

  In vllm_ascend/worker/worker.py:392 (_init_device) and worker.py:472

  (init_device), the DP local-rank shift

  (local_rank += dp_local_rank * tp_pp_world_size) is applied ONLY when

  distributed_executor_backend is not ray/external_launcher AND

  data_parallel_backend != "ray" AND nnodes_within_dp == 1. So with the "mp"

  backend, each DP worker shifts its local_rank to bind to a distinct NPU set;

  with "ray", the shift is skipped because Ray already assigns devices per

  actor. The same conditional appears in the 310P worker

  (vllm_ascend/_310p/worker_310p.py:193). This means the backend choice

  directly determines NPU device assignment correctness and thus whether DP

  replicas actually spread across distinct NPUs (a wrong choice can cause

  device contention or assertion failures, degrading throughput).


  Additionally, vllm/config/parallel.py:834 excludes data_parallel_backend

  from compute_hash, so it does not affect graph structure / compilation

  caching — its impact is purely launch-topology and coordination overhead.

  '
usage_locations:
- file: vllm/engine/arg_utils.py:1164
