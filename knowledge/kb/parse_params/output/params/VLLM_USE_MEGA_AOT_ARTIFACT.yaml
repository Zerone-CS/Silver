name: VLLM_USE_MEGA_AOT_ARTIFACT
type: env
category: compilation
scope: vllm
source_file:
- vllm/envs.py:386
- vllm/envs.py:786
- vllm/envs.py:121
- vllm/compilation/backends.py:97
- vllm/compilation/backends.py:888
- vllm/compilation/caching.py:327
- vllm/compilation/caching.py:586
- vllm/compilation/compiler_interface.py:165
- vllm/compilation/compiler_interface.py:305
value_type: bool
default: <computed>
valid_choices:
- '0'
- '1'
cli_example: null
deprecated: false
performance_impact: low
performance_scope:
- latency
impact_detail: "This flag only affects the upstream vLLM torch.compile / AOT-compile artifact pipeline\n(vllm/compilation/*).\
  \ It is read in several places:\n- \"vllm/compilation/backends.py:888 — collect_standalone_compile_artifacts() returns\"\
  \n  (None, None, None) immediately when the flag is off, so no standalone compile artifacts\n  are collected.\n- \"vllm/compilation/caching.py:327\
  \ — when on, deserialize_compile_artifacts() reconstructs\"\n  the serializable function from a \"mega\" standalone-compile\
  \ artifact via\n  reconstruct_serializable_fn_from_mega_artifact() instead of re-splitting graph modules,\n  reducing model-loading\
  \ overhead.\n- \"vllm/compilation/caching.py:586 — when on, get_inductor_factors() are added to the\"\n  AOT compile hash\
  \ factors, changing cache keys.\n- \"vllm/compilation/compiler_interface.py:165 — when off, bundled_autograd_cache is forced\"\
  \n  to False; when on, the bundled autograd cache is left enabled.\n- \"vllm/compilation/compiler_interface.py:305 — when\
  \ on and PyTorch >= 2.10.0, the 'aot'\"\n  parameter is passed to torch._inductor.standalone_compile, so aot_autograd does\
  \ not run\n  on subgraphs (see tests/compile/h100/test_startup.py:80-88).\nThe default is computed: \"\\\"1\\\" only if\
  \ torch >= 2.12.0.dev AND VLLM_USE_AOT_COMPILE is\"\nenabled, otherwise \"0\". The net runtime effect is on compile/startup\
  \ latency and cache\nreuse, not on steady-state token throughput. On Ascend, vLLM's torch.compile path is\nlargely bypassed\
  \ (vllm-ascend uses its own graph mode / ACL graph handling and does not\nrely on the Inductor standalone-compile artifact\
  \ pipeline), and no vllm-ascend source\nreferences this env var. Therefore the impact on Ascend NPU runtime performance\
  \ is low.\n"
usage_locations:
- file: vllm/envs.py:386
  context: use_mega_aot_artifact() computes default from torch version and VLLM_USE_AOT_COMPILE
- file: vllm/compilation/backends.py:97
  context: asserts VLLM_USE_STANDALONE_COMPILE=1 when this flag is enabled
- file: vllm/compilation/backends.py:888
  context: collect_standalone_compile_artifacts returns None early when disabled
- file: vllm/compilation/caching.py:327
  context: reconstruct serializable fn from mega artifact on deserialize
- file: vllm/compilation/caching.py:586
  context: adds inductor factors to AOT compile hash when enabled
- file: vllm/compilation/compiler_interface.py:165
  context: toggles bundled_autograd_cache in functorch config
- file: vllm/compilation/compiler_interface.py:305
  context: passes 'aot' to standalone_compile when PyTorch >= 2.10.0
related_parameters:
- name: VLLM_USE_AOT_COMPILE
  relation: Required for the computed default to be '1'; when disabled the default is '0'
- name: VLLM_USE_STANDALONE_COMPILE
  relation: Must be enabled (assert in backends.py:97) when VLLM_USE_MEGA_AOT_ARTIFACT=1
- name: VLLM_FORCE_AOT_LOAD
  relation: Related AOT-loading flag; ignored when VLLM_USE_AOT_COMPILE is disabled
constraints:
- VLLM_USE_MEGA_AOT_ARTIFACT=1 requires VLLM_USE_STANDALONE_COMPILE=1, otherwise an assertion error is raised in make_compiler.
- The 'aot' standalone_compile path requires PyTorch 2.10.0 or newer; on older PyTorch the flag logs a critical error and
  falls back to non-AOT mode.
- The default only becomes '1' when PyTorch is 2.12.0.dev or newer AND VLLM_USE_AOT_COMPILE is enabled.
tuning_advice:
  summary: 'Leave this at its computed default on Ascend; it only affects the upstream Inductor

    AOT-compile artifact pipeline, which vllm-ascend does not use for its runtime path.

    '
  suggested_values:
  - scenario: Ascend NPU deployment (default behavior)
    value: '0'
    reason: vllm-ascend does not reference this env var and does not rely on the Inductor standalone-compile mega-artifact
      pipeline, so enabling it yields no Ascend runtime benefit.
  - scenario: Upstream GPU with PyTorch >= 2.12.0.dev and AOT compile enabled
    value: '1'
    reason: Reduces model-loading overhead by reconstructing from mega artifacts and skips aot_autograd on subgraphs, lowering
      startup latency.
  caveats:
  - Enabling without VLLM_USE_STANDALONE_COMPILE=1 triggers an assertion failure at startup.
  - On PyTorch older than 2.10.0 the flag logs a critical error and silently falls back to non-AOT mode.
  - Enabling changes the AOT compile hash factors (adds inductor factors), invalidating existing compile caches.
  - No vllm-ascend source references this variable, so it has no Ascend-specific tuning effect.
  quick_guide: Keep default on Ascend; only set to 1 on upstream GPU with AOT+standalone compile and PyTorch >= 2.10.
analysis_date: '2026-10-27'
