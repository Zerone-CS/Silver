impact_detail: 'This is a vllm-ascend-only switch (defined in vllm_ascend/ascend_config.py as

  SparseKVOffloadConfig.enabled, default False) that enables a Sparse KV cache offload

  data plane for sparse-attention (SFA) models. When enabled, the decode path keeps no

  NPU-resident main K/V paged cache (only the indexer K cache stays on device); the

  current token''s K/V is produced compute-only and committed D2H directly, and top-k

  misses are loaded H2D into a small resident topk buffer before a single resident SFA

  attention runs (see vllm_ascend/attention/sfa_kv_offload.py docstring). This trades

  NPU HBM for host DRAM: "worker.py:518 (_apply_kv_offload_decode_memory_constraints)"

  calls plan_sparse_kv_offload_memory to compute a block budget bounded by

  dram_size_per_dp_GB, NPU limit and workload limit, so the effective KV cache capacity

  is no longer limited by device memory — enabling much longer sequences / larger batch

  sizes on the D node. The cost is per-step H2D/D2H DMA traffic and host-memory

  bandwidth pressure, which can raise decode latency and reduce throughput if the

  offload path is slower than pure device-resident attention. When

  keep_device_kv_cache=True the device cache is still allocated and the memory benefit

  is lost (debug-only). In v2, attn_utils.py:264 sets store_on_host on the

  AscendMLAAttentionSpec when enabled, and model_runner.py:347 passes

  sparse_offload_enabled into apply_dspark_resident_kv_specs; the v2 speculator

  (speculator.py:124) builds a SparseKVOffloadMetadata sized by num_speculative_steps.

  In v1, model_runner_v1.py:685 caches the flag and allocates per-request offload

  buffers (_offload_req_ids_tensor, _offload_token_to_req) and, with fused_copy_sfa,

  pool-slot buffers; metadata is updated every step in

  _prepare_attn_metadata (model_runner_v1.py:3488).

  '
