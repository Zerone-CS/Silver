related_parameters:
- name: additional_config.sparse_kv_offload_config.topk_buffer_size
  relation: must be >= model index_topk; sizes the resident onload buffer
- name: additional_config.sparse_kv_offload_config.dram_size_per_dp_GB
  relation: caps host DRAM budget per DP rank used by the memory planner
- name: additional_config.sparse_kv_offload_config.keep_device_kv_cache
  relation: when true, device KV cache is still allocated (debug only), negating memory savings
- name: additional_config.sparse_kv_offload_config.use_fused_overlap
  relation: optional fused_overlap decode path; mutually exclusive with fused_op_type=fused_copy_sfa
- name: additional_config.sparse_kv_offload_config.fused_op_type
  relation: selects fused_copy_sfa path; must be none or fused_copy_sfa
- name: kv_transfer_config
  relation: must be a PD-disaggregate KV consumer (D node) unless keep_device_kv_cache is set
- name: additional_config.enable_sparse_sfa_c8
  relation: packed SFA main caches (C8/TQ4) are incompatible with sparse KV offload
constraints:
- Sparse KV offload only supports sparse-attention models that expose index_topk in the HF text config.
- Sparse KV offload does not support models with compress_ratios (compression).
- Sparse KV offload does not support context parallel (prefill_context_parallel_size × decode_context_parallel_size must be
  1).
- Sparse KV offload does not support pipeline parallel (pipeline_parallel_size must be 1).
- Unless keep_device_kv_cache is enabled, sparse KV offload requires a PD-disaggregate KV consumer (D node) configuration.
- Sparse KV offload does not support packed SFA main caches (C8 or TQ4); sparse LI C8 is allowed.
- topk_buffer_size must be greater than or equal to the model's index_topk.
- Sparse KV offload with DSpark speculative decoding requires the V2 model runner for remote prompt-context initialization.
- additional_config.sparse_kv_offload_config must be a dict; unknown keys are rejected (extra=forbid).
tuning_advice:
  summary: 'Enable only on PD-disaggregate D nodes serving sparse-attention (SFA) models when

    NPU HBM is the bottleneck for KV cache; it moves main K/V to host DRAM to allow

    longer sequences / larger batches at the cost of H2D/D2H DMA traffic.

    '
  suggested_values:
  - scenario: PD-disaggregate D node, sparse-attention model, KV cache capacity limited by NPU HBM
    value: true
    reason: Offloads main K/V to host DRAM, letting the memory planner (worker.py:518) size the KV block budget from dram_size_per_dp_GB
      instead of device memory, enabling longer context or larger batch.
  - scenario: Default / non-PD deployment, dense models, or when device KV cache fits comfortably
    value: false
    reason: Preconditions reject non-sparse models and non-D-node setups (unless keep_device_kv_cache), and the offload path
      adds DMA overhead with no benefit when HBM is not the bottleneck.
  - scenario: Debugging the offload path in PD colocate scenario
    value: true
    reason: Set enabled=true together with keep_device_kv_cache=true to exercise the path while still allocating device KV
      cache; note this forfeits the memory savings.
  caveats:
  - Enabling this disables the NPU-resident main K/V paged cache in decode; every step incurs H2D onload of top-k misses and
    D2H commits, which can raise decode latency and lower throughput versus fully device-resident attention.
  - keep_device_kv_cache=true keeps the device KV cache allocated, so sequence length / batch size cannot be improved — use
    only for debugging in PD colocate.
  - Host DRAM bandwidth and dram_size_per_dp_GB become the new capacity/latency bottleneck; size dram_size_per_dp_GB to match
    available host memory per DP rank.
  - Incompatible with packed SFA main caches (C8/TQ4); sparse LI C8 is fine because the indexer cache stays device-resident.
  - DSpark speculative decoding with this feature requires the V2 model runner (v2 speculator builds SparseKVOffloadMetadata
    per speculative step).
  - topk_buffer_size must be at least the model's index_topk or validation raises an error.
  quick_guide: Enable on PD-disaggregate D nodes with sparse-attention models to trade NPU HBM for host DRAM KV capacity;
    keep false otherwise.
