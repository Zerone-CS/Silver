related_parameters:
- name: --enable-mm-embeds
  relation: Related embedding-input path; multimodal embeds also populate req_prompt_embeds and share the scatter loop.
- name: --skip-tokenizer-init
  relation: Often used together when clients supply pre-tokenized/embedded inputs directly.
- name: --max-num-batched-tokens
  relation: Determines the size of the persistent inputs_embeds buffer allocated when this flag is on.
- name: --decode-context-parallel-size
  relation: When >1 with async spec-decode, enabling prompt embeds disables the on-device rebuild fast path.
constraints:
- --enable-prompt-embeds is not supported with encoder-decoder models and raises a ValueError at config validation.
- The engine may crash if prompt embeddings are passed with an incorrect shape; only enable this flag for trusted users.
- The flag is rejected for model states that do not declare support for prompt embeds (raises ValueError).
tuning_advice:
  summary: Leave disabled unless you genuinely need embedding inputs; when enabled, keep batches modest and avoid combining
    with DCP async spec-decode.
  suggested_values:
  - scenario: Standard text-only serving (default)
    value: false
    reason: Avoids the extra is_token_ids index_select, the per-request scatter loop, and the persistent inputs_embeds buffer
      allocation.
  - scenario: Serving requests that supply pre-computed prompt embeddings
    value: true
    reason: Required to accept the prompt_embeds key; only enable for trusted clients that guarantee correct embedding shapes.
  - scenario: DCP + async spec-decode workloads
    value: false
    reason: Enabling it disables the on-device async spec-decode rebuild path in dcp_utils.py, forcing a slower host-side
      rebuild.
  caveats:
  - Validate embedding shape on the client side; a wrong shape can crash the engine.
  - Monitor NPU HBM headroom since the inputs_embeds buffer scales with max_num_batched_tokens.
  - For large batches, the Python scatter loop can dominate host overhead; consider smaller max_num_seqs.
  quick_guide: Keep --enable-prompt-embeds off unless you need embedding inputs; if on, watch HBM and avoid DCP async spec-decode.
analysis_date: '2026-10-27'
