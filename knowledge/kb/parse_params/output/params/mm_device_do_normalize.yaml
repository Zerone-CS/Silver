related_parameters:
- name: --mm-processor-device
  relation: Both control where multimodal preprocessing runs; --mm-processor-device selects the device for the HF fast processor
    transform, while this flag moves only the normalize step to the device
- name: --mm-processor-kwargs
  relation: Preprocessing kwargs forwarded to the HF processor; interacts with where normalization is performed
- name: --mm-tensor-ipc
  relation: Transport for moving processed tensors; affects whether device-side preprocessing results can be carried without
    host copies
- name: --mm-encoder-tp-mode
  relation: Also part of MultiModalConfig.compute_hash; both influence multimodal encoder execution
constraints:
- Only takes effect for models that declare supports_mm_device_do_normalize = True; for other models the flag is ignored.
- The CLI default is None (unset), which resolves to the MultiModalConfig default of True.
- Changing this value alters MultiModalConfig.compute_hash(), which can invalidate compilation/prefix caches.
tuning_advice:
  summary: Leave at the default (enabled) for supported multimodal models to offload normalization to the NPU and save CPU
    preprocessing time.
  suggested_values:
  - scenario: Qwen2-VL / Qwen2.5-VL or other models declaring supports_mm_device_do_normalize on Ascend NPU
    value: true
    reason: Moves the do_normalize step to the device, reducing CPU preprocessing latency and host-device copies for image/video
      inputs.
  - scenario: Models that do not support device-side normalize
    value: false
    reason: The flag is inert for unsupported models; leaving it unset (default) is equivalent and avoids confusion.
  caveats:
  - Only affects multimodal preprocessing latency, not LLM token throughput.
  - Changing the value changes the config hash and may invalidate caches.
  quick_guide: Keep default (enabled) for supported VLMs; it only trims multimodal preprocessing CPU cost.
analysis_date: '2026-10-27'
