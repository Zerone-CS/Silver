- vllm/model_executor/models/qwen2_vl.py:1205
value_type: bool
default: true
valid_choices: true or false (BooleanOptionalAction; CLI default is None, config default is True)
cli_example: --mm-device-do-normalize
deprecated: false
performance_impact: low
performance_scope:
- latency
impact_detail: 'This flag moves the `do_normalize` step of multimodal preprocessing (the

  per-pixel mean/std normalization of image/video tensors) out of the CPU-side

  HF processor and into the device (accelerator) side, executed just before the

  ViT encoder. In vllm/config/multimodal.py:137 the field defaults to True with

  the docstring "Move the do_normalize computation in the mm preprocessing to

  before the ViT, and let the device do it, so that CPU computation can be

  saved." The CLI registration at vllm/engine/arg_utils.py:1466 overrides the

  argparse default to None so that "unset" is distinguishable from an explicit

  value; the effective default remains True via MultiModalConfig.

  The performance effect is confined to the multimodal preprocessing path: it

  shifts a small elementwise normalization from CPU to the NPU, reducing CPU

  preprocessing latency and host->device data movement for image/video inputs.

  It does NOT affect the language-model decode path, KV cache, scheduling, or

  HCCL communication, so its impact on steady-state token throughput is

  negligible. It only takes effect for models that declare

  `supports_mm_device_do_normalize = True` (e.g. Qwen2-VL at

  vllm/model_executor/models/qwen2_vl.py:1205 and Qwen2.5-VL at

  vllm/model_executor/models/qwen2_5_vl.py:1258); for all other models the

  flag is inert. The value is also folded into MultiModalConfig.compute_hash()

  (vllm/config/multimodal.py:473), so toggling it changes the config hash and

  can invalidate compilation/prefix caches. No vllm-ascend override of this

  parameter was found in the provided context; it is an upstream-only knob.

  '
