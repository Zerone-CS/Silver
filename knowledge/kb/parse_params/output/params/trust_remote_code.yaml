name: --trust-remote-code
type: cli
category: model
scope: both
source_file:
- vllm/config/model.py:167
- vllm/engine/arg_utils.py:447
- vllm/engine/arg_utils.py:883
- vllm/engine/arg_utils.py:1828
- vllm/config/model.py:630
- vllm/config/speculative.py:1278
- vllm/v1/spec_decode/draft_model.py:43
value_type: bool
default: false
valid_choices: 'boolean flag: pass --trust-remote-code to enable, omit to disable'
cli_example: --trust-remote-code
deprecated: false
performance_impact: low
performance_scope:
- latency
- memory
impact_detail: "--trust-remote-code is a model-loading/security flag, not a runtime kernel or\nscheduling knob. In vLLM it\
  \ is stored on ModelConfig (vllm/config/model.py:167)\nand forwarded to get_config() (vllm/config/model.py:630), which passes\
  \ it to\nHuggingFace transformers' AutoConfig/AutoTokenizer/AutoModel loading. When\nenabled, transformers executes Python\
  \ code shipped inside the model repository\n(custom configuration_*.py / modeling_*.py / tokenization_*.py) instead of the\n\
  built-in implementations. The only performance-relevant effects are indirect\nand one-time at startup:\n(1) Startup latency\
  \ — importing and executing remote Python modules adds a small\n    amount of Python import/execution time during engine\
  \ initialization; this is\n    a one-off cost, not per-token.\n(2) Memory — remote custom modeling code may instantiate\
  \ additional Python\n    objects or a different tokenizer implementation, marginally changing host\n    (CPU) memory footprint;\
  \ NPU HBM usage is determined by weight loading and\n    KV-cache config, not by this flag.\n(3) Speculative decoding —\
  \ the flag is propagated to the draft ModelConfig\n    (vllm/config/speculative.py:1278) and to tokenizer construction for\n\
  \    heterogeneous-vocab spec decode (vllm/v1/spec_decode/draft_model.py:43), so\n    a draft model that ships custom code\
  \ also requires it; failure to set it\n    causes a load-time error rather than a slowdown.\nvllm-ascend does not override\
  \ or reinterpret this flag: \"it is consumed entirely\"\nby upstream vLLM's model/tokenizer loading path, and vllm-ascend\
  \ only references\nit in examples (examples/offline_*.py, examples/offline_DSD_k_tuner/\ngenerate_config.py) and in documentation\
  \ where certain models (e.g.\nCohere-Transcribe, FP8 checkpoints such as Qwen3.8-27B-FP8) require it to load\nat all. There\
  \ is no Ascend-specific code path (HCCL, CANN graph capture,\ntorch_npu kernels) gated on this flag, so steady-state throughput\
  \ and per-token\nlatency on Ascend NPU are unaffected.\n"
