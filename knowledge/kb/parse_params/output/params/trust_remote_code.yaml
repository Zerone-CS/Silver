related_parameters:
- name: --model
  relation: Determines which repository's remote code is trusted and executed
- name: --tokenizer
  relation: Remote tokenizer code is also executed when trust_remote_code is enabled
- name: --revision / --code-revision
  relation: Select which revision of the remote code is downloaded and executed
- name: --config-format
  relation: Affects how the HF config is loaded alongside trust_remote_code
- name: --speculative-config
  relation: Draft model inherits trust_remote_code from the target model config
- name: --hf-token
  relation: Needed for gated repos whose remote code must be downloaded
constraints:
- Models whose repository ships custom modeling/tokenizer code (e.g. Cohere-Transcribe) fail to load unless --trust-remote-code
  is passed.
- Enabling --trust-remote-code executes arbitrary Python from the model repository, so it must only be used with trusted model
  sources.
- For speculative decoding, the draft model inherits trust_remote_code from the target model config, so a draft model with
  custom code requires the flag on the target as well.
tuning_advice:
  summary: Enable only when the model repository ships custom code; it is a correctness/security switch with negligible runtime
    performance cost on Ascend NPU.
  suggested_values:
  - scenario: Model repository ships custom modeling/tokenizer code (e.g. Cohere-Transcribe, some FP8 checkpoints)
    value: true
    reason: Without it the model cannot be loaded at all; the docs explicitly state --trust-remote-code is required for such
      models.
  - scenario: Standard models fully supported by transformers/vLLM built-in implementations (Qwen, DeepSeek, Llama, etc.)
    value: false
    reason: Avoids executing arbitrary remote Python and keeps startup minimal; no performance benefit is gained by enabling
      it.
  - scenario: Speculative decoding with a draft model that ships custom code
    value: true
    reason: The draft ModelConfig inherits trust_remote_code from the target config, so the flag must be set for the draft
      model to load.
  caveats:
  - Do not expect throughput or latency gains from this flag; it only affects model/tokenizer loading.
  - Only enable for trusted model sources since it executes arbitrary Python from the repository.
  - When running offline on Ascend, pre-download the model directory including custom code files before setting HF_HUB_OFFLINE.
  quick_guide: Pass --trust-remote-code only if the model repo ships custom code; otherwise leave it off — it does not affect
    NPU runtime performance.
analysis_date: '2026-10-27'
