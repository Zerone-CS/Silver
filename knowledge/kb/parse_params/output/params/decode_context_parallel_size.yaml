- vllm_ascend/worker/v2/attn_utils.py:195
- vllm_ascend/worker/v2/attn_utils.py:413
value_type: int
default: 1
valid_choices: 'Integer >= 1. Without PCP: must divide tensor_parallel_size. With PCP: must be 1, pcp, or tp*pcp. For GQA/MQA
  (non-MLA): must be <= tp_size // total_num_kv_heads.'
cli_example: --decode-context-parallel-size 2
deprecated: false
performance_impact: high
performance_scope:
- latency
- throughput
- memory
impact_detail: "DCP shards the decode-phase KV cache across ranks without expanding the process\nworld size (vllm/config/parallel.py:353).\
  \ It reuses TP ranks when PCP is disabled,\nor spans the PCP axis / full TP x PCP block when PCP is enabled. On Ascend this\n\
  has several concrete runtime effects:\n\n1. KV cache memory: each rank stores only 1/DCP of the decode KV cache, so\n  \
  \ per-rank KV memory drops roughly by a factor of DCP, allowing larger\n   max_num_seqs / longer sequences. This is the\
  \ primary memory benefit.\n\n2. Attention compute: decode attention is split across DCP ranks, reducing\n   per-rank attention\
  \ work for long-context decode, but requires cross-rank\n   communication (AllGather/ReduceScatter or All-to-All) to combine\
  \ partial\n   outputs and LSE. vllm-ascend implements this via the SFA DCP Q-gather and\n   result-merge path (context_parallel.md:75)\
  \ and reduces KV all-gather traffic\n   by selecting required blocks before communication (release_notes.md:398).\n\n3.\
  \ Attention metadata: vllm/v1/attention/backend.py:646 forces\n   reorder_batch_threshold=1 when DCP>1 and the backend does\
  \ not support\n   varlen DCP, which can reduce batching efficiency. vllm/v1/attention/backends/fa_utils.py:264\n   disables\
  \ the FA4 hd256 fast path when DCP>1 (CUDA-specific; Ascend uses its\n   own attention path).\n\n4. Ascend v2 worker: vllm_ascend/worker/v2/attn_utils.py:195\
  \ and :413 compute\n   DCP-local sequence lengths and replicated indexer sizes, adding per-batch\n   CPU-side metadata work\
  \ (get_dcp_local_seq_lens) but avoiding device-to-host\n   sync.\n\n5. Ascend block-size alignment: vllm_ascend/patch/platform/patch_kv_cache_utils.py:99\n\
  \   computes scheduler_block_size = lcm(group_block_sizes) * dcp for hybrid KV\n   cache groups, which can increase the\
  \ effective block size and thus memory\n   granularity when DCP>1.\n\nNet effect: \"DCP trades extra HCCL communication\
  \ for reduced per-rank KV memory\"\nand attention compute, which is beneficial for long-context decode on Ascend\nbut can\
  \ hurt short-sequence throughput due to communication overhead.\n"
