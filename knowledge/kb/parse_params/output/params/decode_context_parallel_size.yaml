name: --decode-context-parallel-size
type: cli
category: parallelism
scope: both
source_file:
- vllm/config/parallel.py:353
- vllm/engine/arg_utils.py:1098
- vllm/config/parallel.py:560
- vllm/config/model.py:1445
- vllm/config/vllm.py:1289
- vllm/config/vllm.py:1332
- vllm/v1/attention/backend.py:646
- vllm/v1/attention/backends/fa_utils.py:264
- vllm_ascend/ascend_config.py:83
- vllm_ascend/ascend_config.py:1738
- vllm_ascend/patch/platform/patch_kv_cache_utils.py:99
- vllm_ascend/patch/platform/patch_speculative_config.py:182
- vllm_ascend/patch/platform/patch_speculative_config.py:255
