related_parameters:
- name: --tensor-parallel-size
  relation: DCP reuses TP ranks; tp must be divisible by dcp (no PCP) or dcp must be 1/pcp/tp*pcp (with PCP).
- name: --prefill-context-parallel-size
  relation: PCP changes valid DCP values; DCP spans PCP axis or full TP x PCP block.
- name: --cp-kv-cache-interleave-size
  relation: Must equal block_size for SFA DCP; vllm-ascend overrides it otherwise.
- name: --dcp-comm-backend
  relation: Selects ag_rs vs a2a communication strategy for DCP.
- name: --dcp-q-replicate
  relation: Controls Q replication behavior under DCP.
- name: --enable-return-routed-experts
  relation: Incompatible with DCP>1.
- name: additional_config.enable_kvpp
  relation: KVPP and DCP cannot be enabled at the same time.
- name: additional_config.sparse_kv_offload_config
  relation: Sparse KV offload rejects PCP*DCP > 1.
constraints:
- Without PCP, tensor_parallel_size must be divisible by decode_context_parallel_size.
- With PCP enabled, decode_context_parallel_size must be 1, equal to prefill_context_parallel_size, or equal to tensor_parallel_size
  * prefill_context_parallel_size.
- For GQA/MQA models (non-MLA), tensor_parallel_size must be greater than the model's total number of KV heads when DCP>1.
- For GQA/MQA models, decode_context_parallel_size must not exceed tensor_parallel_size divided by total_num_kv_heads.
- DCP>1 is incompatible with --enable-return-routed-experts.
- With NixlConnector, decode_context_parallel_size must be 1 or equal to the NIXL transfer parallel size, and DCP>1 requires
  an MLA model.
- KVPP (additional_config.enable_kvpp) and DCP cannot be enabled at the same time.
- Sparse KV offload does not support context parallelism (PCP*DCP must be 1).
- Ascend Engram requires TP=1/2/4/8 with PP=DCP=1.
- For SFA sparse models with DCP enabled, cp_kv_cache_interleave_size must equal block_size in P/D disaggregate + kv pool
  scenarios.
tuning_advice:
  summary: Enable DCP for long-context decode on MLA models to shard KV cache and reduce per-rank attention compute, keeping
    DCP small to limit HCCL overhead.
  suggested_values:
  - scenario: Long-context decode with MLA model (e.g. DeepSeek), TP=8, no PCP
    value: 2
    reason: Halves per-rank decode KV cache and attention compute while keeping HCCL communication modest; tp=8 divisible
      by dcp=2.
  - scenario: Very long context decode, MLA model, TP=8, communication bandwidth sufficient
    value: 4
    reason: Further reduces per-rank KV memory and attention work; tp=8 divisible by dcp=4.
  - scenario: Short-sequence / latency-sensitive decode
    value: 1
    reason: Disables DCP to avoid per-layer cross-rank communication overhead that dominates for short sequences.
  - scenario: SFA sparse model decode-only (PCP=1)
    value: <equal to tensor_parallel_size>
    reason: SFA DCP mode requires decode_context_parallel_size == tensor_parallel_size (context_parallel.md:75).
  caveats:
  - Ensure cp_kv_cache_interleave_size equals block_size for SFA DCP; vllm-ascend will override it otherwise.
  - Do not combine DCP with KVPP or sparse KV offload; both are rejected.
  - For GQA/MQA models, DCP requires tp > total_num_kv_heads and dcp <= tp // kv_heads.
  - DCP>1 disables --enable-return-routed-experts and the FA4 hd256 fast path (CUDA).
  quick_guide: Set --decode-context-parallel-size to 2 or 4 for long-context MLA decode on Ascend; keep at 1 for short sequences.
analysis_date: '2026-10-27'
