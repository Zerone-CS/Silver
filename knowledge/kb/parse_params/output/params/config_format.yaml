name: --config-format
type: cli
category: model
scope: vllm
source_file:
- vllm/config/model.py:309
- vllm/engine/arg_utils.py:938
- vllm/engine/arg_utils.py:457
- vllm/engine/arg_utils.py:1861
- vllm/transformers_utils/config.py:434
- vllm/transformers_utils/config.py:441
- vllm/tokenizers/registry.py:242
- vllm/config/speculative.py:1292
value_type: str
default: auto
valid_choices:
- auto
- hf
- mistral
cli_example: --config-format hf
deprecated: false
performance_impact: low
performance_scope:
- latency
impact_detail: '--config-format only controls which config parser is used to load the model

  configuration at engine startup (vllm/transformers_utils/config.py:434

  get_config_parser dispatches to a registered ConfigParserBase based on the

  format string). It does not affect the runtime inference loop, kernel

  selection, memory allocation, or scheduling on Ascend NPU. The only

  performance-relevant effect is startup latency: "\"auto\" tries the mistral"

  format first and falls back to hf, which may incur an extra config

  resolution attempt (and possibly extra file reads / network fetches for

  remote repos) compared to pinning "hf" or "mistral" explicitly. Once the

  config is parsed, the resulting PretrainedConfig is identical regardless of

  which parser produced it, so steady-state throughput and memory are

  unaffected. vllm-ascend does not override or patch this parameter; it is

  consumed purely by upstream vLLM config loading. Note that

  vllm/tokenizers/registry.py:242 internally forces config_format="hf" for

  HF-backed tokenizers regardless of the user setting, and

  vllm/config/speculative.py:1292 propagates the target model''s config_format

  to the draft model config for speculative decoding.

  '
usage_locations:
- file: vllm/engine/arg_utils.py:938
  context: Registers the --config-format CLI argument from ModelConfig.config_format.
