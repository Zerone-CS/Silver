related_parameters:
- name: --model
  relation: The model repo determines which config files (config.json vs params.json) exist and thus which format is applicable.
- name: --hf-config-path
  relation: Alternative config source; interacts with config_format when resolving the config to load.
- name: --trust-remote-code
  relation: Passed through to the config parser; custom configs may require it.
- name: --speculative-config
  relation: Draft model config inherits the target model's config_format (vllm/config/speculative.py:1292).
constraints:
- The value must be a registered config format; an unknown format raises ValueError('Unknown config format') in get_config_parser.
- Only 'auto', 'hf', and 'mistral' are built-in formats; additional formats require registering a custom parser via register_config_parser.
- HF-backed tokenizers always load their config with format 'hf' regardless of the --config-format value.
tuning_advice:
  summary: Leave at 'auto' unless you have a specific Mistral-format repo; pin 'hf' to skip the mistral-first probe and marginally
    reduce startup latency.
  suggested_values:
  - scenario: Standard HuggingFace-format models (most Ascend deployments)
    value: hf
    reason: Skips the mistral-format probe performed by 'auto', slightly reducing config-loading startup time; behavior is
      otherwise identical.
  - scenario: Mistral-format repositories (params.json present)
    value: mistral
    reason: Explicitly selects the mistral config parser, avoiding ambiguity in dual-format repos.
  - scenario: Unknown or mixed-format repos / default usage
    value: auto
    reason: Default that tries mistral then falls back to hf, maximizing compatibility.
  caveats:
  - Do not expect any steady-state throughput or memory benefit on Ascend NPU; this is a startup-only concern.
  - If a custom config format is needed, register a parser with register_config_parser before launching the engine.
  quick_guide: Use 'auto' by default; pin 'hf' for pure HF models to shave a bit of startup time.
analysis_date: '2026-10-27'
